<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文法自檢卡 — 寫完最後 2 分鐘掃這 5 條</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Noto Sans TC", sans-serif; background: #f7f7f5; color: #37352f; font-size: 15px; line-height: 1.7; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 40px 24px 100px; }
  h1 { font-size: 26px; font-weight: 700; margin-bottom: 6px; }
  .sub { color: #787774; margin-bottom: 20px; }
  .sub b { color:#37352f; }

  .bar { display:flex; align-items:center; gap:12px; background:#fff; border:1px solid #e9e9e7; border-radius:10px; padding:12px 16px; margin-bottom:20px; position:sticky; top:12px; z-index:10; }
  .prog { font-size:15px; font-weight:700; }
  .prog b { color:#1f7a45; }
  .track { flex:1; height:8px; background:#eee; border-radius:5px; overflow:hidden; }
  .fill { height:100%; width:0; background:#1f7a45; transition:width .2s; }
  .btn { border:1px solid #d0d0cc; background:#fff; border-radius:6px; padding:6px 13px; font-size:13px; cursor:pointer; }
  .btn:hover { background:#f0f0ee; }

  .card { background:#fff; border:1px solid #e9e9e7; border-radius:12px; padding:16px 18px; margin-bottom:13px; border-left:5px solid #7a3fb0; display:flex; gap:14px; align-items:flex-start; cursor:pointer; transition:.15s; }
  .card:hover { background:#fcfbff; }
  .card.done { border-left-color:#1f7a45; background:#f4fbf6; }
  .chk { flex-shrink:0; width:26px; height:26px; border:2px solid #cdbde8; border-radius:7px; display:flex; align-items:center; justify-content:center; font-size:16px; color:#fff; margin-top:2px; }
  .card.done .chk { background:#1f7a45; border-color:#1f7a45; }
  .body { flex:1; }
  .q { font-size:16px; font-weight:700; margin-bottom:8px; }
  .q .no { color:#7a3fb0; margin-right:7px; }
  .card.done .q .no { color:#1f7a45; }
  .eg { font-size:14px; margin:5px 0; }
  .eg s { color:#c0392b; opacity:.8; text-decoration-thickness:1px; }
  .eg b { color:#1f7a45; background:#e7f6ec; padding:0 5px; border-radius:4px; }
  .tip { font-size:13px; color:#666; margin-top:7px; background:#faf9f7; border-radius:7px; padding:8px 11px; }
  .tip b { color:#37352f; }
  .en { font-family:"SF Mono",Menlo,Consolas,monospace; font-size:12.5px; background:#eef0f2; padding:1px 5px; border-radius:4px; color:#2b4a6b; }

  .spell { background:#fff; border:1px solid #e9e9e7; border-radius:12px; padding:16px 18px; margin-top:22px; border-left:5px solid #b03050; }
  .spell h3 { font-size:15px; margin-bottom:10px; }
  .spell h3 .em { color:#b03050; }
  .words { display:flex; flex-wrap:wrap; gap:8px; }
  .w { font-family:"SF Mono",Menlo,Consolas,monospace; font-size:13px; background:#fbe9ee; color:#b03050; border-radius:6px; padding:4px 10px; }
  .done-msg { text-align:center; color:#1f7a45; font-weight:700; padding:14px; display:none; }
  .done-msg.show { display:block; }
  .foot { color:#9b9a97; font-size:12.5px; margin-top:24px; text-align:center; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🩺 文法自檢卡</h1>
  <p class="sub">寫完 WE / SWT，<b>留最後 2 分鐘只做一件事</b>：不重讀內容，照這 5 條逐項掃。這 5 條就是<b>你反覆漏的洞</b>。點卡片打勾。</p>

  <div class="bar">
    <span class="prog"><b id="n">0</b>/5</span>
    <div class="track"><div class="fill" id="fill"></div></div>
    <button class="btn" id="reset">↺ 重置</button>
  </div>

  <div id="cards"></div>
  <div class="done-msg" id="doneMsg">✅ 5 條都掃過了 — 交卷！</div>

  <div class="spell">
    <h3>🔴 順手清 <span class="em">拼字黑名單</span>（這些你拼錯過，會被判進 mechanics）</h3>
    <div class="words" id="words"></div>
  </div>

  <div class="foot">正確 &gt; 複雜。沒把握的長句，拆成兩句短的。</div>
</div>

<script>
const RULES = [
  { q:"主詞 → 動詞，單複數對嗎？",
    egW:"children <s>is</s>", egR:"children <b>are</b>",
    tip:`主詞複數→動詞複數。尤其 people / children / parents 這種<b>沒 s 但是複數</b>的字最容易漏。` },
  { q:"每個可數名詞 → 有沒有 s 或 a / the？",
    egW:"<s>a</s> good <s>manner</s> ・ works at <s>world</s>-renowned firm",
    egR:"good <b>manners</b> ・ at <b>a</b> world-renowned firm",
    tip:`單數可數名詞前一定要有 <span class="en">a/an/the</span> 或所有格；該複數的要加 <span class="en">s</span>。manners（禮貌）固定用複數。` },
  { q:"被動語態 → 有沒有 be？",
    egW:"parents should <s>held</s> responsible",
    egR:"parents should <b>be held</b> responsible",
    tip:`「被…」= <span class="en">be + 過去分詞</span>。少了 be 就不是被動。be held / be given / be considered。` },
  { q:"介系詞後面的動詞 → 有沒有變 ing？",
    egW:"leading to <s>become</s>",
    egR:"leading to <b>becoming</b>",
    tip:`介系詞（to / in / of / by / for）後接動詞一律 <span class="en">-ing</span>。注意 <span class="en">to</span> 有時是介系詞不是不定詞：look forward to doing、lead to doing。` },
  { q:"兩個完整句 → 是不是被逗號黏住了？",
    egW:"…over the years<s>,</s> it has caused…",
    egR:"…over the years<b>.</b> It has caused…",
    tip:`兩句能各自獨立 = 不能只用逗號（comma splice）。改用<b>句號</b>、分號，或加 <span class="en">and / but / because / which</span>。` },
];
const BLACKLIST = ["responsible","responsibility","children","become","controversy","believe","conclusion","interact","cooperate","successful","mentor","behaviour","individuals","themselves"];

const cardsEl = document.getElementById('cards');
cardsEl.innerHTML = RULES.map((r,i)=>`
  <div class="card" data-i="${i}">
    <div class="chk">✓</div>
    <div class="body">
      <div class="q"><span class="no">${i+1}</span>${r.q}</div>
      <div class="eg">❌ ${r.egW}</div>
      <div class="eg">✅ ${r.egR}</div>
      <div class="tip">💡 ${r.tip}</div>
    </div>
  </div>`).join('');

document.getElementById('words').innerHTML = BLACKLIST.map(w=>`<span class="w">${w}</span>`).join('');

const nEl = document.getElementById('n'), fillEl = document.getElementById('fill'), doneMsg = document.getElementById('doneMsg');
function refresh(){
  const done = document.querySelectorAll('.card.done').length;
  nEl.textContent = done;
  fillEl.style.width = (done/RULES.length*100)+'%';
  doneMsg.classList.toggle('show', done===RULES.length);
}
cardsEl.addEventListener('click', e=>{
  const c = e.target.closest('.card'); if(!c) return;
  c.classList.toggle('done'); refresh();
});
document.getElementById('reset').addEventListener('click', ()=>{
  document.querySelectorAll('.card.done').forEach(c=>c.classList.remove('done')); refresh();
});
refresh();
</script>
</body>
</html>

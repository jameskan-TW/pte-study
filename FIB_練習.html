ng the trip two and a half months later when she landed back at the Oakland Airport on May 28. Over a million school half months later when she landed back at the Oakland Airport on May 28. Over a million school children and others were able to follow the flight ", "daily", " through an interactive website as part of a free multimedia ", "educational", " program called “You Can Soar,” provided by the project's sponsor. multimedia educational program called “You Can Soar,” provided by the project's sponsor. journey flight aircraft trip attempt contempt tempt contemn daily nightly yearly hourly"], "blanks": [{"a": "tribute", "o": ["attribution", "contribution", "attribute", "tribute"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>「as a tribute to」固定片語，指向某人致敬</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>recreated her idol&#x27;s flight as a ___ to the pioneer&#x27;s spirit，指向先驅致敬</div><div class=\"why\">✗ attribution 歸因、contribution 貢獻、attribute 屬性，皆無 as a ___ to 致敬之意</div>"}, {"a": "aircraft", "o": ["journey", "flight", "aircraft", "trip"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>「the same make and model aircraft」固定講法，指同款飛機</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>a restored Lockheed Electra 10E, the same make and model ___，指機型</div><div class=\"why\">✗ journey/flight/trip 為旅程，與 make and model（廠牌型號）搭配不合，唯飛機有型號</div>"}, {"a": "attempt", "o": ["attempt", "contempt", "tempt", "contemn"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>「attempt + 名詞」指嘗試做某事，此處 attempt Earhart&#x27;s journey</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>not the first to ___ Earhart&#x27;s journey，指嘗試重現該旅程</div><div class=\"why\">✗ contempt 蔑視、tempt 引誘、contemn 鄙視，皆與嘗試旅程語意不合</div>"}, {"a": "daily", "o": ["daily", "nightly", "yearly", "hourly"], "why": "<div class=\"reason\"><span class=\"tag t-sem\">語意</span>follow the flight ___ through a website，指每日追蹤航程</div><div class=\"reason\"><span class=\"tag t-pos\">詞性</span>副詞修飾 follow，daily 表每日</div><div class=\"why\">✗ nightly 每夜、yearly 每年、hourly 每小時，皆與每日追蹤頻率不合</div>"}, {"a": "educational", "o": ["instructional", "didactic", "educational", "scholarly"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>「educational program」固定搭配，指教育課程／節目</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>a free multimedia ___ program called You Can Soar，供學童使用的教育計畫</div><div class=\"why\">✗ instructional/didactic/scholarly 雖近義但 educational program 為最自然慣用搭配</div>"}], "pg": 79, "day": 14, "done": false}, {"id": "080173", "t": "Spanish language (西班牙語)", "k": "d", "parts": ["If after years of Spanish classes, some people still find it impossible to understand some native speakers, they should not worry. This does not ", "necessarily", " mean the lessons were wasted. Millions of Spanish speakers use neither standard Latin American Spanish nor Castilian, which predominate in US schools. The confusion is partly political-the Spanish-speaking world is very diverse. Spanish is the language of 19 separate countries and Puerto Rico. This means that there is no one standard dialect. The most common Spanish dialect taught in the US is standard Latin American. It is sometimes called \"Highland\" Spanish since it is generally spoken in the ", "mountainous", " areas of Latin America. While each country retains its own ", "accents", " and has some unique vocabulary, residents of countries such as Mexico, Colombia, Peru, and Bolivia generally speak Latin American Spanish, especially in urban centers. This dialect is noted for its ", "pronunciation", " of each letter and its strong \"r\" sounds. This Spanish was spoken in Spain in the sixteenth and seventeenth centuries and was brought to the Americas by the early colonists. However, the Spanish of Madrid and of northern Spain, called Castilian, developed ", "characteristics", " that never reached the New World. These include the pronunciation of \"ci\" and \"ce\" as \"th.\" In Madrid, \"gracias\" (thank you) becomes \"gratheas\" (as opposed to \"gras-see-as\" in Latin America). Another difference is the use of the word \"vosotros\" (you all, or you guys) as the informal form of \"ustedes\" in Spain. Castilian sounds to Latin Americans much like British English sounds to US announcement elucidation pronunciation presentation characteristics idiocrasy normality peculiarity"], "blanks": [{"a": "necessarily", "o": ["necessarily", "merely", "especially", "particularly"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>「not necessarily」固定搭配，指「未必、不一定」</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>does not ___ mean the lessons were wasted，指未必表示課程白費</div><div class=\"why\">✗ merely 僅僅、especially/particularly 特別地，皆不搭 not ___ mean 表「未必」</div>"}, {"a": "mountainous", "o": ["aqueous", "hidden", "mountainous", "coastal"], "why": "<div class=\"reason\"><span class=\"tag t-sem\">語意</span>呼應 called Highland Spanish，指通行於拉美山區</div><div class=\"reason\"><span class=\"tag t-coll\">搭配</span>「mountainous areas」固定搭配，指山區</div><div class=\"why\">✗ aqueous 水的、hidden 隱藏、coastal 沿海，皆與 Highland（高地）不符</div>"}, {"a": "accents", "o": ["thoughts", "voices", "accents", "customs"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>「retains its own accents」固定搭配，指各國保有自己的口音</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>與 unique vocabulary 並列，指各國的口音與詞彙</div><div class=\"why\">✗ thoughts 想法、voices 嗓音、customs 習俗，皆不如 accents 搭語言差異</div>"}, {"a": "pronunciation", "o": ["announcement", "elucidation", "pronunciation", "presentation"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>「pronunciation of each letter」固定講法，指每個字母的發音</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>noted for its ___ of each letter and strong r sounds，描述發音特徵</div><div class=\"why\">✗ announcement 公告、elucidation 闡明、presentation 呈現，皆與 each letter/r sounds 不合</div>"}, {"a": "characteristics", "o": ["characteristics", "idiocrasy", "normality", "peculiarity"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>「developed characteristics」固定搭配，指發展出某些特徵</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>Castilian developed ___ that never reached the New World，指發展出特性</div><div class=\"why\">✗ idiocrasy 為非標準字、normality 常態、peculiarity 偏怪癖，皆不如 characteristics 自然</div>"}], "pg": 81, "day": 14, "done": false}, {"id": "110073", "t": "Ikebana(日本插花)", "k": "dd", "parts": ["More than simply putting flowers in a ", "container", ", ikebana is a disciplined art form in which nature and ", "humanity", " are brought together. Contrary to the idea of a particolored or multicolored arrangement of blossoms, ikebana often emphasizes other areas of the ", "plant", ", such as its stems and leaves, and puts emphasis on shape, line, and form. Though ikebana is an ", "expression", " of creativity, certain rules govern its form. The artist's intention behind each arrangement is shown through a piece's color ", "combinations", ", natural shapes, graceful lines, and the implied meaning of the arrangement."], "opts": ["vessel", "container", "humanity", "demonstration", "root", "plant", "vegetable", "combinations", "expression", "complications"], "pg": 29, "day": 14, "done": false}, {"id": "110080", "t": "Sharkbite (鲨魚咬)", "k": "dd", "parts": ["Shark killed four people and bit 58 others around the world in 2006, a comparatively dull year for dangerous encounters between the two species, scientists said in their annual shark attack census on Tuesday. Sharkbite numbers ", "grew", " steadily over the last century as humans reproduced exponentially and ", "spent", " more time at the seashore. But the numbers have been ", "stabilized", " over the past five years as overfishing ", "thinned", " the shark population near shore and swimmers got smarter about the risks of wading into certain areas, Burgess said."], "opts": ["grew", "spent", "stabilized", "thinned", "learned", "swam", "horrified", "died"], "pg": 31, "day": 14, "done": false}, {"id": "080174", "t": "Anesthesia (麻醉)", "k": "d", "parts": ["Before effective anaesthetics, surgery was very crude and very painful. Before 1800, alcohol and opium had ", "little", " success in easing pain during operations. Laughing gas was used in 1844 in dentistry in the USA, but failed to ease all pain and patients ", "remained", " conscious. Ether (used from 1846) made patients totally unconscious and lasted a long time. However, it could make patients cough during operations and sick afterwards. It was highly flammable and was ", "transported", " in heavy glass bottles. Chloroform (used from 1847) was very effective with few side effects. However, it was difficult to get the dose right and could kill some people because of the effect on their heart. An inhaler helped to regulate the because_of other_than rather_than apart_from 4 because_of other_than rather_than apart_from"], "blanks": [{"a": "little", "o": ["little", "much", "less", "no"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>「little success」固定搭配，指幾乎沒有成效（不可數負面）</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>alcohol and opium had ___ success in easing pain，指效果有限，呼應前句 crude and painful</div><div class=\"why\">✗ much 表很多語意相反、less 為比較級無比較對象、no 過於絕對語氣突兀</div>"}, {"a": "remained", "o": ["migrated", "remained", "retained", "maintained"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>「remained conscious」固定搭配，指仍保持清醒</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>failed to ease all pain and patients ___ conscious，指病人仍清醒</div><div class=\"why\">✗ migrated 遷移、retained/maintained 為及物需受詞，皆不搭 ___ conscious 此繫動詞用法</div>"}, {"a": "transported", "o": ["transported", "transmitted", "transparent", "transformed"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>「transported in bottles」固定搭配，指以瓶子運送</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>was highly flammable and was ___ in heavy glass bottles，指被運送</div><div class=\"why\">✗ transmitted 傳輸訊號、transparent 透明（形容詞）、transformed 轉變，皆與運送不合</div>"}], "pg": 81, "day": 15, "done": false}, {"id": "080176", "t": "Tomkins (湯姆金斯)", "k": "d", "parts": ["Much of our understanding of mind-reading comes from two remarkable scientists, a teacher and his pupil: Silvan Tomkins and Paul Ekman. Tomkins was the teacher. He was born in Philadelphia, at the pupil: Silvan Tomkins and Paul Ekman. Tomkins was the teacher. He was born in Philadelphia, at the turn of the last ", "century", " , the son of a dentist from Russia. He was short, and thick around the middle, with a wild mane of white hair and huge black plastic-rimmed glasses. He taught psychology at with a wild mane of white hair and huge black plastic-rimmed glasses. He taught psychology at Princeton and Rutgers, and was the author of “Affect, Imagery, Consciousness, “a four-volume work so ", "dense", " that its readers were evenly divided between those who understood it and thought it was so dense that its readers were evenly divided between those who understood it and thought it was brilliant and those who did not understand it and thought it was brilliant. He was a ", "legendary", " talker. At the end of a cocktail party, a crowd of people would sit, rapt, at Tomkins’s feet, and someone would the end of a cocktail party, a crowd of people would sit, rapt, at Tomkins’s feet, and someone would say, “One more question! “ and they would all sit there for another hour and a half, as Tomkins held forth on, say, comic books, a television sitcom, the biology of emotion, his problem with Kant, and his forth on, say, comic books, a television sitcom, the biology of emotion, his problem with Kant, and his enthusiasm for the latest fad diets, all enfolded into one ", "extended", " riff."], "blanks": [{"a": "century", "o": ["decade", "millennium", "epoch", "century"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>「the turn of the last century」固定講法，指上世紀之交</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>born at the turn of the last ___，指世紀交替之際出生</div><div class=\"why\">✗ decade 十年、millennium 千年、epoch 紀元，皆不搭 the turn of the last ___ 此慣用語</div>"}, {"a": "dense", "o": ["laborious", "dense", "readily", "deliberate"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>「so dense that」搭配，形容文字艱澀濃密</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>a four-volume work so ___ that readers were divided，指著作艱深難懂</div><div class=\"why\">✗ laborious 費力、readily 為副詞詞性錯誤、deliberate 刻意，皆不如 dense 形容艱深</div>"}, {"a": "legendary", "o": ["legendary", "irascible", "uninspiring", "garrulous"], "why": "<div class=\"reason\"><span class=\"tag t-pos\">詞性</span>a ___ talker 需形容詞修飾 talker</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>「a legendary talker」指傳奇般的健談者，呼應後文眾人圍坐聆聽</div><div class=\"why\">✗ irascible 易怒、uninspiring 乏味（語意相反）、garrulous 雖指多話但帶貶意，不如 legendary 正面突出</div>"}, {"a": "extended", "o": ["amplified", "illusive", "extended", "unhappy"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>「one extended riff」固定搭配，指一段延展的即興發揮</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>all enfolded into one ___ riff，指各話題交織成冗長連貫的長篇</div><div class=\"why\">✗ amplified 放大、illusive 虛幻、unhappy 不快，皆不如 extended 形容話題延展</div>"}], "pg": 82, "day": 15, "done": false}, {"id": "080177", "t": "Three degrees (叁度)", "k": "d", "parts": ["Three degrees does not sound like much but it ", "represents", " a rise in temperature compatible with the Three degrees does not sound like much but it represents a rise in temperature compatible with the global heating that occurred between the last ice age, some 15,000 years ago, and the warmth of the eighteenth century. When Earth was cold, giant glaciers sometimes extended from the polar-regions as eighteenth century. When Earth was cold, giant glaciers sometimes extended from the polar-regions as far south as St Louis in the US and the Alps in Europe. Later this century when it is three degree, hotter glaciers everywhere will be melting in a climate of often ", "unbearable", " heat and drought punctuated with glaciers everywhere will be melting in a climate of often unbearable heat and drought punctuated with storms and floods. The ", "consequences", " for humanity could be truly horrific, if we fail to act swiftly, the full impact of global heating could cull us along with vast populations of the plant and animals with full impact of global heating could cull us along with vast populations of the plant and animals with whom we share Earth. In a worst case scenario, there might-in the 22nd century-be only a remnant of humanity eking out a ", "diminished", " existence in the polar-regions and the few remaining oases left on a humanity eking out a diminished existence in the polar-regions and the few remaining oases left on a hot and arid Earth."], "blanks": [{"a": "represents", "o": ["displays", "represents", "declares", "discloses"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>「represents a rise」固定搭配，指代表一種上升</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>it ___ a rise in temperature compatible with...，指三度代表某種升溫</div><div class=\"why\">✗ displays 展示、declares 宣布、discloses 揭露，皆不搭 a rise 表「代表」</div>"}, {"a": "unbearable", "o": ["insurable", "endurable", "unbearable", "admissible"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>「unbearable heat」固定搭配，指難以忍受的高溫</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>a climate of often ___ heat and drought，指酷熱難耐</div><div class=\"why\">✗ insurable 可保的、endurable 可忍受（語意相反）、admissible 可接受，皆不合酷熱情境</div>"}, {"a": "consequences", "o": ["preclusions", "achievements", "consequences", "obstructions"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>「the consequences for humanity」固定搭配，指對人類的後果</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>The ___ for humanity could be truly horrific，指可怕的後果</div><div class=\"why\">✗ preclusions 排除、achievements 成就（語意相反）、obstructions 阻礙，皆不如 consequences 表後果</div>"}, {"a": "diminished", "o": ["magnified", "ampliefied", "depreciated", "diminished"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>「diminished existence」固定搭配，指衰減的存在／生活</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>remnant of humanity eking out a ___ existence，指殘存人類過著萎縮的生活</div><div class=\"why\">✗ magnified/ampliefied 放大（且後者拼錯）、depreciated 貶值，皆與 remnant/eking out 不合</div>"}], "pg": 82, "day": 15, "done": false}, {"id": "080179", "t": "David Lynch (大衛·林奇)", "k": "d", "parts": ["David Lynch is professor and head of education at Charles Darwin University. ", "Prior", " to this he was sub dean in the Faculty of Education and Creative Arts at Central Queensland University and foundation head of the University’s Noosa ", "campus", " . David’s career in education began as a primary school teacher in Queensland in the early 1980’s and ", "progressed", " to four principal positions before ", "entering", " higher education. David’s research interests predominate in teacher education with particular interest in building teacher capability to meet a changed world. involving entering locating achieving"], "blanks": [{"a": "Prior", "o": ["Prior", "Early", "Before", "Post"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>固定搭配 Prior to this（在此之前），後面接 to this 只有 Prior 對</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>語意上承接前句、講「之前」的經歷</div><div class=\"why\">✗ Before 後不接 to；Early/Post 與 to this 不搭也語意不合</div>"}, {"a": "campus", "o": ["campus", "college", "district", "site"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>Noosa campus（諾薩校區）為固定用法，搭配大學分部</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>foundation head of the University&#x27;s ___ 指大學的「校區」</div><div class=\"why\">✗ college/district/site 與 University&#x27;s 校區語意不貼切</div>"}, {"a": "progressed", "o": ["regressed", "progressed", "processed", "retarded"], "why": "<div class=\"reason\"><span class=\"tag t-sem\">語意</span>career began...and ___ to higher education，職涯由教師「進展」到高教，正向</div><div class=\"reason\"><span class=\"tag t-coll\">搭配</span>progress to 為固定搭配（進展到下一階段）</div><div class=\"why\">✗ regressed/retarded 為退步、負向；processed 不搭 to 也語意不合</div>"}, {"a": "entering", "o": ["involving", "entering", "locating", "achieving"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>before entering higher education（進入高教之前）固定搭配 enter + 領域</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>與前文 progressed...before ___ 對應，指「進入」高教</div><div class=\"why\">✗ involving/locating/achieving 與 higher education 語意不合</div>"}], "pg": 83, "day": 15, "done": false}, {"id": "110083", "t": "Kashmiri (克什米爾)", "k": "dd", "parts": ["Two decades ago, Kashmiri houseboat-owners rubbed their hands every spring at the ", "prospect", " of the annual influx of tourists. From May to October, the hyacinth-choked waters of Dal Lake saw flotillas of vividly painted Shikaras carrying Indian families, boho westerners, young travellers and wide-eyed Japanese. Carpet-sellers ", "honed", " their skills, as did purveyors of anything remotely embroidered while the house boats initiated by the British Raj provided unusual accommodation. Then, in 1989, separatists and Islamist militancy ", "attacked", " and everything changed. Hindus and countless Kashmiri business people bolted, at least 35,000 people were killed in a decade, the lake stagnated, and the houseboats rotted. Any foreigners venturing there risked their ", "lives", ", proved in 1995 when five young Europeans were kidnapped and murdered."], "opts": ["lives", "projection", "honed", "perspective", "updated", "situation", "prospect", "attacked"], "pg": 31, "day": 15, "done": false}, {"id": "110086", "t": "Material culture studies (物質文化研究)", "k": "dd", "parts": ["The study of objects constitutes a relatively new field of academic enquiry, commonly referred to as material culture studies. Students of material culture seek to understand societies, both past and present, through careful study and ", "observation", " of the physical or material objects generated by those societies. The source material for study is exceptionally wide, ", "including", " not just human- made artefacts but also natural objects and even preserved body parts (as you saw in the film 'Encountering a body’). Some specialists in the field of material culture have made bold claims for its pre-eminence. In certain disciplines, it reigns ", "supreme", ". It plays a critical role in archaeology, for example, especially in circumstances where written evidence is either patchy or non-existent. ", "In such cases", ", objects are all scholars have to rely on in forming an understanding of ancient peoples. Even where written documents survive the physical remains of literate cultures often help to provide new and interesting insights into how people once lived and thought, ", "as in", " the case of medieval and post-medieval archaeology. In analyzing the physical remains of societies, both past and present, historians, archaeologists, anthropologists and others have been careful to remind us that objects mean different things to different people."], "opts": ["In conclusion", "observation", "as in", "top", "inferior", "supreme", "In such cases", "comprised", "including"], "pg": 32, "day": 15, "done": false}, {"id": "080180", "t": "EE & AVG V1 (EE&平均值V1)", "k": "d", "parts": ["Currently, there is concern about the increasing amount of time children spend ", "engaged", " in sedentary Currently, there is concern about the increasing amount of time children spend engaged in sedentary activities, the number of children who fail to achieve ", "minimum", " daily physical activity guidelines (i.e. 60 min of moderate-to-vigorous intensity activities every day), and the apparent increase in obesity min of moderate-t mals changed very little. Woodcuts in instructional manuals and herbals were often repeatedly copied over the centuries, resulting in a loss of definition and accuracy so that they became little more than stylized decoration. With the growing ", "popularity", " of copperplate engravings, the traditional use of woodcuts declined and the representation of plants and animals became more accurate. Then, with the ", "emergence", " of artists such as albrecht durer and Leonardo Da Vinci, naturalists such as Otto Brunfels, Leonhard Fuchs in botany and Conrad Gesner and Ulisse Aldrovandi in zoology, nature began to be depicted in a more realistic style. Individual living plants or animals ", "were observed", " directly and their likeness rendered onto paper or vellum."], "opts": ["catalog", "popularity", "kind", "were observed", "emergence", "begin", "prevalence", "occurrence"], "pg": 33, "day": 17, "done": false}, {"id": "110093", "t": "Predictions of weather (天氣預報)", "k": "dd", "parts": ["All kinds of predictions may be about ", "to", " get even more difficult ", "thanks", " to climate change. Though no one is sure ", "exactly", " what its effects will be, it seems that extreme weather conditions such ", "as", " storms and hurricanes are ", "likely", " to become more common. Such events have far- reaching effects on distant weather systems, making general forecasting much harder."], "opts": ["thanks", "helping", "to", "as", "possible", "likely", "exactly", "because", "according", "probably"], "pg": 34, "day": 17, "done": false}, {"id": "080196", "t": "Natural Capital (自然資本)", "k": "d", "parts": ["Capital has often been thought of narrowly as physical capital – the machines, tools, and equipment used in the production of other goods, but our wealth and wellbeing also ", "relies on", " natural capital. If used in the production of other goods, but our wealth and wellbeing also relies on natural capital. If we forget this, we risk degrading the services that natural ecosystems provide, which ", "support", " our economies and sustain our lives. These services include purifying our water, ", "regulating", " our climate, economies and sustain our lives. These services include purifying our water, regulating our climate, reducing flood risk, and pollinating our crops. The Natural Capital Project一 a partnership ", "among", " WWF,The Nature Conservancy,University of Minnesota and Stanford University- works to provide WWF,The Nature Conservancy,University of Minnesota and Stanford University- works to provide decision makers with ", "reliable", " ways to assess the true value of the services that ecosystems provide. An essential element of the Natural Capital Project is developing tools that help decision makers protect essential element of the Natural Capital Project is developing tools that help decision makers protect biodiversity and ecosystem services. 1 relies_on contributes_to subject_to attracts_to"], "blanks": [{"a": "relies on", "o": ["relies on", "contributes to", "subject to", "attracts to"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>固定片語 rely on（依賴），與前文「relies on natural capital」重複呼應。</div><div class=\"reason\"><span class=\"tag t-tense\">時態</span>主詞 wealth and wellbeing 視為整體單數概念，relies on 第三人稱單數正確。</div><div class=\"why\">✗ contributes to 是「貢獻於」方向相反、subject to 與 attracts to 皆非「依賴」搭配。</div>"}, {"a": "support", "o": ["supporting", "support", "supported", "supports"], "why": "<div class=\"reason\"><span class=\"tag t-num\">單複數</span>關係子句先行詞 the services（複數），which support 動詞用原形複數 support。</div><div class=\"reason\"><span class=\"tag t-tense\">時態</span>與並列動詞 sustain 同為原形，主動現在式一致。</div><div class=\"why\">✗ supports 為單數動詞與複數先行詞不合、supporting/supported 非限定動詞無法當子句主要動詞。</div>"}, {"a": "regulating", "o": ["guilding", "regulating", "denying", "diminishing"], "why": "<div class=\"reason\"><span class=\"tag t-sem\">語意</span>「regulating our climate」指調節氣候，與並列的 purifying water、reducing flood risk 同屬生態服務功能。</div><div class= il War (南北戰爭)", "k": "d", "parts": ["A Civil War reenactment is in part a memorial service. It is partly, too, a leisure activity. Furthermore, A Civil War reenactment is in part a memorial service. It is partly, too, a leisure activity. Furthermore, most reenactors assert an educational import to the performance, and to develop their roles, many pursue archival research with a rare dedication. On the other hand, Civil War reenactments are pursue archival research with a rare dedication. On the other hand, Civil War reenactments are increasingly commercial ", "spectacles", " , with as many as fifty thousand Americans routinely gathering at (or near) historical Civil War battlefields in order to stage performances that purport to recreate the (or near) historical Civil War battlefields in order to stage performances that purport to recreate the conflict, while hundreds of thousands more spectate (Hadden 1996:5). I will show how theoretical issues of ", "authenticity", " arise as practical problems in the Civil War reenactment community by presenting my own observations from the 2006 Gettysburg reenactment and by ", "relying", " on a number presenting my own observations from the 2006 Gettysburg reenactment and by relying on a number of texts produced by participant-observers. In particular I will refer to Robert Lee Hodge, who was made famous by Tony Horwitz's 1996 book, Confederates in the Attic, and who served as a kind of made famous by Tony Horwitz's 1996 book, Confederates in the Attic, and who served as a kind of Virgil to the author on his journey through a Confederate Valhalla. From these sources I will ", "argue", " that 'Living History' performances require an interpretive apparatus that takes genuine history as its 'Living History' performances require an interpretive apparatus that takes genuine history as its authority, while remaining external to both participants and tourists, who may well be unaware of how closely their own involvement approximates genuine historical events. closely their own involvement approximates genuine historical events. possibility purity authenticity reliability relying undertaking witnessing reviewing question suppose indicate argue"], "blanks": [{"a": "spectacles", "o": ["transactions", "spectacles", "exhibitions", "contributions"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>commercial spectacles 商業性盛大場面，與後文數萬人聚集表演呼應</div><div class=\"reason\"><span class=\"tag t-num\">單複數</span>前面 are 為複數動詞，須複數名詞，spectacles 複數</div><div class=\"why\">✗ transactions(交易)、exhibitions(展覽)、contributions(貢獻)語意不如「奇觀表演」貼切</div>"}, {"a": "authenticity", "o": ["possibility", "purity", "authenticity", "reliability"], "why": "<div class=\"reason\"><span class=\"tag t-sem\">語意</span>全文主題是 authenticity(真實性)，後文 genuine history 反覆呼應</div><div class=\"reason\"><span class=\"tag t-pos\">詞性</span>issues of ___ 須名詞，authenticity 為名詞</div><div class=\"why\">✗ possibility、purity、reliability 雖皆名詞，但與重演「真實性」主題不符</div>"}, {"a": "relying", "o": ["relying", "undertaking", "witnessing", "reviewing"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>rely on 固定搭配，後接 on a number of texts</div><div class=\"reason\"><span class=\"tag t-tense\">時態</span>by + V-ing 結構，與前面 by presenting 並列</div><div class=\"why\">✗ undertaking/witnessing/reviewing 都不接 on，破壞 rely on 搭配</div>"}, {"a": "argue", "o": ["question", "suppose", "indicate", "argue"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>I will argue that... 提出論點的固定句型</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>後接整段作者論證主張，argue 最合宜</div><div class=\"why\">✗ question/suppose/indicate 與「我將論證」的學術論述語氣不如 argue 精準</div>"}], "pg": 91, "day": 18, "done": false}, {"id": "110100", "t": "Psychoanalytic and Behaviorist (精神分析和行爲學家)", "k": "dd", "parts": ["Elements of both the psychoanalytic and behaviorist theories appear in modern approaches to personality. Advances in neuroscience have begun to ", "bridge", " the gap between biochemistry and behavior, but there is still a great deal that needs to be explained. Without a consistent understanding of personality, how can we begin to ", "categorize", " risk-takers? If we cannot, we will be unable to ", "compare", " their genes with those of others."], "opts": ["bridge", "reinforce", "integrate", "categorize", "compare", "combine"], "pg": 36, "day": 18, "done": false}, {"id": "110103", "t": "Civil society and the marke (民間社會與市場)", "k": "dd", "parts": ["For too long we have held preconceived notions of ‘the’ market and ‘the’ state that were seemingly independent of local societies and cultures. The debate about civil society ultimately is about how culture, market and state ", "relate to", " each other. Concern about civil society, however, is not only relevant to Central and Eastern Europe and the developing world. It is very much of ", "interest to", " the European Union as well. The Civil Dialogue Initiated by the Commission in the 1990s was a first attempt by the EU to give the institutions of society - and not only governments and businesses-a voice at the policy-making tables in Brussels. The EU, like other international institutions, has a long way to go in trying to ", "accommodate", " the frequently divergent interests of non-governmental organizations and citizen groups. There is increasing ", "recognition", " that international and national governments have to open up to civil society institutions."], "opts": ["accommodate", "correlate", "interest in", "appreciation", "interest to", "relate to", "attach", "recognition"], "pg": 36, "day": 18, "done": false}, {"id": "080204", "t": "Distance learning (遠程學習)", "k": "d", "parts": ["Distance learning can be highly beneficial to a large variety of people from young students wanting to expand their horizons to adults looking for more job security. with programs that allow learners of all expand their horizons to adults looking for more job security. with programs that allow learners of all ages to take courses for fun, personal advancement and degrees, distance learning can meet the ", "needs", " of a diverse population. Perhaps one of the most notable and often talked about ", "advantages", " of of a diverse population. Perhaps one of the most notable and often talked about advantages of distance learning is the flexibility the majority of programs allow students to learn when and where it's convenient for them. For ", "those", " who are struggling to balance their distance learning goals with convenient for them. For those who are struggling to balance their distance learning goals with working a fulltime job and taking care of a family this kind of flexibility can allow many people to pursue education who would not otherwise be able to do so. ", "Since", " there are no on-campus courses to pursue education who would not otherwise be able to do so. Since there are no on-campus courses to attend, students can learn from their own homes, at work on their lunch breaks and from virtually anywhere with internet access. For some it can even be a big source of savings on the fuel costs and anywhere with internet access. For some it can even be a big source of savings on the fuel costs and time required to commute to classes."], "blanks": [{"a": "needs", "o": ["eagerness", "desire", "needs", "expectations"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>meet the needs of 滿足…的需求，固定搭配</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>後文 diverse population，呼應滿足多元族群需求</div><div class=\"why\">✗ eagerness/desire/expectations 與 meet 搭配不如 meet the needs 自然道地</div>"}, {"a": "advantages", "o": ["strengths", "advantages", "enhancements", "developments"], "why": "<div class=\"reason\"><span class=\"tag t-num\">單複數</span>前 one of the most ... 須複數名詞，advantages 複數</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>often talked about advantages 常被談論的優點，後文 flexibility 即一例</div><div class=\"why\">✗ strengths/enhancements/developments 雖近義，advantages 才是 distance learning 常用搭配</div>"}, {"a": "those", "o": ["individual", "person", "these", "those"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>those who 那些…的人，固定關係代名詞用法</div><div class=\"reason\"><span class=\"tag t-num\">單複數</span>後接 who are struggling 複數子句，須用 those</div><div class=\"why\">✗ individual/person 為單數不接 who are；these 不慣用於 these who 結構</div>"}, {"a": "Since", "o": ["Despite", "Since", "Nevertheless", "Thus"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>Since + 主詞 + 動詞，引導原因子句</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>因為沒有實體課程，所以能在家學習，符合因果</div><div class=\"why\">✗ Despite 後不接子句且為轉折；Nevertheless/Thus 為副詞，語意也不合因果</div>"}], "pg": 92, "day": 19, "done": false}, {"id": "080206", "t": "A Bad Title (一個錯誤的標題)", "k": "d", "parts": ["A good story may be given a bad title by its author, and so started toward failure. Novices are peculiarly ", "liable", " to this fault, usually through ", "allowing", " themselves to be too easily satisfied. They go to peculiarly liable to this fault, usually through allowing themselves to be too easily satisfied. They go to ", "infinite", " pains to make the story itself fresh and individual, and then cap it with a ", "commonplace", " phrase that is worse than no title at all. A good title is apt, specific, attractive, new, and short. A title is apt if it that is worse than no title at all. A good title is apt, specific, attractive, new, and short. A title is apt if it is an outgrowth of the plot—a text, as I have said. It stands definitely for that particular story, and gives a suggestion of what is to come—but only a suggestion, lest it should anticipate the denouement and a suggestion of what is to come—but only a suggestion, lest it should anticipate the denouement and so ", "satisfy", " the curiosity of the reader too soon."], "blanks": [{"a": "liable", "o": ["apt", "liable", "keen", "responsible"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>be liable to (this fault) 易犯…的固定搭配，指容易有此毛病</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>Novices(新手)容易犯這毛病，liable to 表傾向</div><div class=\"why\">✗ apt 須接 to+原形(apt to do)非 to this fault；keen/responsible 與 to this fault 語意不合</div>"}, {"a": "allowing", "o": ["allowing", "allowed", "allowance", "allow"], "why": "<div class=\"reason\"><span class=\"tag t-tense\">時態</span>through + V-ing 介系詞後接動名詞，用 allowing</div><div class=\"reason\"><span class=\"tag t-coll\">搭配</span>allow themselves to be satisfied 反身結構，allowing 接 themselves</div><div class=\"why\">✗ allowed/allow/allowance 不符 through 後須動名詞的文法</div>"}, {"a": "infinite", "o": ["infinite", "pleasant", "limited", "enclosed"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>go to infinite pains 費盡無數心力，固定搭配</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>與後文「讓故事新鮮獨特」呼應，下無數工夫</div><div class=\"why\">✗ pleasant/limited/enclosed 與 take pains 的「費盡心力」語意相反或不搭</div>"}, {"a": "commonplace", "o": ["precious", "distinguished", "commonplace", "eminent"], "why": "<div class=\"reason\"><span class=\"tag t-sem\">語意</span>commonplace phrase 平庸俗套詞句，與前面 fresh and individual 對比</div><div class=\"reason\"><span class=\"tag t-pos\">詞性</span>修飾 phrase 須形容詞，commonplace 為形容詞</div><div class=\"why\">✗ precious/distinguished/eminent 皆正面詞，與「比沒標題更糟」的貶義對比不合</div>"}, {"a": "satisfy", "o": ["meet", "satisfy", "improve", "compromise"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>satisfy the curiosity 滿足好奇心，固定搭配</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>anticipate the denouement and so satisfy... 提前洩底滿足讀者好奇</div><div class=\"why\">✗ meet 較少搭 curiosity；improve/compromise 與「滿足好奇心」語意不合</div>"}], "pg": 93, "day": 19, "done": false}, {"id": "080207", "t": "History Books (曆史書籍)", "k": "d", "parts": ["History is selective. What history books tell us about the past is not everything that happened, but History is selective. What history books tell us about the past is not everything that happened, but what historians ", "have selected", " . They cannot put in everything: choices have to be made. Choices must similarly be made about which aspects of the past should be formally taught to the next generation in similarly be made about which aspects of the past should be formally taught to the next generation in the shape of school history lessons. So, ", "for example", " , when a national school curriculum for England and Wales was first discussed at the end of the 1980s, the history curriculum was the subject of and Wales was first discussed at the end of the 1980s, the history curriculum was the subject of considerable public and media ", "interest", " . Politicians argued about it; people wrote letters to the press about it; the Prime Minister of the time, Margaret Thatcher, ", "intervened", " in the debate. Let us think first about it; the Prime Minister of the time, Margaret Thatcher, intervened in the debate. Let us think first about the question of content. There were two main camps on this issue – those who thought the history of Britain should take pride of ", "place", " , and those who favored what was referred to as 'world history of Britain should take pride of place , and those who favored what was referred to as 'world 1 have_selected have_been_selected be_selected select 2 as_a_result for_example in_brief subjectively 4 was_intervened was_intervening intervened had_intervened"], "blanks": [{"a": "have selected", "o": ["have selected", "have been selected", "be selected", "select"], "why": "<div class=\"reason\"><span class=\"tag t-tense\">時態</span>主詞 historians + 現在完成式 have selected，表「歷史學家所挑選的」主動完成。</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>對比前文 not everything that happened，強調人為「主動挑選」，須用主動式。</div><div class=\"why\">✗ have been selected 為被動、be selected/select 時態或語態不合主詞 historians 的主動完成語意。</div>"}, {"a": "for example", "o": ["as a result", "for example", "in brief", "subjectively"], "why e surface of the Earth that we cannot get to it. Despite so much of the water being out of reach, we still have a million Earth that we cannot get to it. Despite so much of the water being out of reach, we still have a million cubic miles of it that we ", "can", " use. That's about 4,300,000 cubic kilometers of fresh water to share out between most of the plants, animals and people on the planet. between most of the plants, animals and people on the planet."], "blanks": [{"a": "Without", "o": ["Although", "Without", "Within", "As"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>Without + 名詞 開頭表「若無…」</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>Without water 沒有水…無法生存，符合條件語意</div><div class=\"why\">✗ Although 後須接子句；Within(在內)、As(當/作為)語意不合「沒有水就不能活」</div>"}, {"a": "fit", "o": ["unwell", "better", "fit", "up"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>stay fit and healthy 保持健康強健，固定搭配</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>須正面詞與 healthy 並列</div><div class=\"why\">✗ unwell(不適)為負面與 healthy 矛盾；better/up 與 stay...and healthy 搭配不成立</div>"}, {"a": "deep", "o": ["deep", "steep", "wide", "strong"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>deep under the surface 深埋地表之下，固定搭配</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>與 cannot get to it 呼應，因太深而取不到</div><div class=\"why\">✗ steep(陡)、wide(寬)、strong(強)無法搭 under the surface 表「深」</div>"}, {"a": "can", "o": ["cannot", "can"], "why": "<div class=\"reason\"><span class=\"tag t-sem\">語意</span>前 Despite(儘管取不到)轉折，仍有 a million cubic miles 可用，故用 can</div><div class=\"reason\"><span class=\"tag t-coll\">搭配</span>still have ... that we can use 仍有可用的水</div><div class=\"why\">✗ cannot 與前文 Despite 轉折及「仍有可用的水」語意矛盾</div>"}], "pg": 93, "day": 19, "done": false}, {"id": "110104", "t": "Can dogs tell our emotions? (狗能說出我們的情緒嗎？)", "k": "dd", "parts": ["Can dogs tell when we are happy, sad or angry? As a dog owner, I feel ", "confident", " not only that I can tell what kind of ", "emotional", " state my pets are in, but also that they respond to my emotions. Yet as a hard-headed scientist, I try to take a more ", "rational", " and pragmatic view. These ", "personal", " observations seem more likely to result from my desire for a good relationship with my dogs."], "opts": ["rational", "confidential", "personal", "psychological", "confident", "emotional", "communal"], "pg": 37, "day": 19, "done": false}, {"id": "110105", "t": "Roman Army and Britain (羅馬軍隊與英國)", "k": "dd", "parts": ["The transitions which occurred in Britain around 100BC, and after 43 AD, when the Roman Army ", "invaded", " Britain, represent the key points of socio-economic trend in Britain's past. During the first century BC, the traditional communal form of life ", "shifted", " rapidly to a world where certain individuals ", "became", " more important. During the first century AD, Britain became fully a part of the Roman Empire."], "opts": ["shifted", "became", "invaded", "had", "exchanged"], "pg": 37, "day": 19, "done": false}, {"id": "080211", "t": "Computational thinking (計算思維)", "k": "d", "parts": ["Developing computational thinking helps students to better understand the world around them. Many of us happily drive a car without ", "understanding", " what goes on under the bonnet. So is it necessary for children to ", "learn", " how to program computers? After all, some experts say coding is one of the human skills that will become ", "obsolete", " as artificial intelligence grows. Nevertheless, governments believe coding is an essential skill. Since 2014, the principles of computer programming have ", "featured", " on England's curriculum for children from the age of five or six, when they start primary school. While not all children will become programmers, Mark Martin, a computing teacher at Sydenham High School, London, argues that they should learn to understand what ", "makes", " computers work and try to solve pro ers will either have to reduce prices or put less on the demand--due, say, to trade depression--sellers will either have to reduce prices or put less on the ", "market", " ; they will not be able to sell the same ", "amount", " at the same price."], "blanks": [{"a": "raised", "o": ["raised", "deepen", "adjusted", "tighten"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>if the price is raised（若價格被提高）raise the price 固定搭配，被動 is raised</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>對比 lowered，需「提高」</div><div class=\"why\">✗ deepen/tighten 不搭 price；adjusted 中性「調整」未表明升降，與對比 lowered 不合</div>"}, {"a": "reduce", "o": ["reduce", "raise", "sharpen", "amend"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>must reduce its price（必須降價）reduce the price 固定搭配</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>要誘使買家多買就得降價</div><div class=\"why\">✗ raise 提高與「誘使多買」矛盾；sharpen 使尖銳、amend 修訂皆不搭 price</div>"}, {"a": "market", "o": ["supply", "market", "demand", "way"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>put less on the market（減少市場供應量）put on the market 固定片語</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>需求下降，賣家降價或減少上市量</div><div class=\"why\">✗ supply/demand/way 皆不搭 put less on the __ 這個「投放市場」固定片語</div>"}, {"a": "amount", "o": ["amount", "value", "quality", "cost"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>sell the same amount at the same price（以同價賣出同量）the same amount 搭配</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>指賣出的「數量」</div><div class=\"why\">✗ value 價值、quality 品質、cost 成本皆不合「賣出同樣的數量」</div>"}], "pg": 102, "day": 22, "done": false}, {"id": "080232", "t": "Impressionism (印象主義)", "k": "d", "parts": ["Impressionism was a nineteenth century art movement that began as a loose association of Paris- based artists who started publicly exhibiting their art in the 1860s. Characteristics of Impressionist painting include visible brush strokes, light colours, open composition, ", "emphasis", " on light in its changing qualities (often accentuating the effects of the passage of time), ordinary subject matter, and unusual visual angles. The name of the movement is ", "derived", " from Claude Monet's Impression, Sunrise (Impression, soleil levant). Critic Louis Leroy inadvertently coined the term in a satiric review published in Le Charivari. Radicals in their time, early Impressionists broke the rules of academic painting. They began by giving colours, freely brushed, primacy over line, drawing ", "inspiration", " from the work of painters such as Eugene Delacroix. They also took the ", "act", " of painting out of the studio and into the world. Previously, not only still-lives and portraits, but also landscapes had been painted indoors, but the Impressionists found that they could ", "capture", " the momentary and transient effects of sunlight by painting air in plain air. consequence emphasis reliance dependence"], "blanks": [{"a": "emphasis", "o": ["consequence", "emphasis", "reliance", "dependence"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>emphasis on light（對光線的強調）emphasis on 固定搭配</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>列舉印象派特徵，指「強調」光的變化</div><div class=\"why\">✗ consequence 結果、reliance/dependence on 是「依賴」，與描述繪畫特徵的「強調」不合</div>"}, {"a": "derived", "o": ["derived", "sourced", "attributed", "related"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>is derived from（源自）固定被動搭配</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>運動名稱源自 Monet 的畫作</div><div class=\"why\">✗ sourced/attributed/related 雖可接 from/to，但 name __ from 慣用 derived 表「衍生自」</div>"}, {"a": "inspiration", "o": ["inspire", "inspired", "inspiration", "inspiring"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>drawing inspiration from（從…汲取靈感）固定搭配 draw inspiration from</div><div class=\"reason\"><span class=\"tag t-pos\">詞性</span>draw 後需名詞作受詞，故用名詞 inspiration . Migration researchers do not designate movements 'migrations' unless they are somewhat permanent. Thus demographers do not consider tourists and travellers to be migrating. While demographers who study migration typically do so through census data on place of ", "residence", " , indirect sources of data study migration typically do so through census data on place of residence , indirect sources of data including tax forms, and labour force surveys are also important. Demography is today widely taught in many universities across the world, ", "attracting", " students with initial training in social sciences, in many universities across the world, attracting students with initial training in social sciences, statistics or health studies."], "blanks": [{"a": "involves", "o": ["concludes", "involves", "consists", "introduces"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>Fertility involves the number of children（生育率涉及孩子數量）involve 表「牽涉」</div><div class=\"reason\"><span class=\"tag t-num\">單複數</span>主詞 Fertility 單數，用 involves</div><div class=\"why\">✗ concludes 總結、introduces 引入語意不合；consists 須接 of 不能直接帶受詞</div>"}, {"a": "device", "o": ["device", "theory", "summary", "data"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>a statistical device（統計工具）the Life Table 同位語</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>生命表是提供死亡率資訊的統計裝置</div><div class=\"why\">✗ theory 理論、summary 摘要、data 資料皆不如 device 表「方法工具」貼合 statistical __</div>"}, {"a": "unless", "o": ["because", "unless", "however", "despite"], "why": "<div class=\"reason\"><span class=\"tag t-pos\">詞性</span>do not designate movements &#x27;migrations&#x27; __ they are permanent，需連接詞 unless（除非）</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>除非是永久性移動，否則不算遷徙</div><div class=\"why\">✗ because 表原因、however 副詞不引導從句、despite 介詞接名詞，皆不合此條件子句</div>"}, {"a": "residence", "o": ["life", "home", "residence", "family"], "why": "<div class=\"reason\"><span class=\"tag t-co r", " away their bodies are from legs compared to body size. The desert floor is also very hot, so the further away their bodies are from the surface, the better,” said co-author Matthias Wittlinger. The ants have also evolved to function at body temperatures of 50C in a desert where temperatures can soar to 70C. “They’re basically just body temperatures of 50C in a desert where temperatures can soar to 70C. “They’re basically just trying to get out of the heat,” he added. 1 is_abandoned be_abandoned been_abandoned will_abandon"], "blanks": [{"a": "is abandoned", "o": ["is abandoned", "be abandoned", "been abandoned", "will abandon"], "why": "<div class=\"reason\"><span class=\"tag t-tense\">時態</span>「the forward tripod walking style is abandoned」陳述普遍事實用現在式被動，走法被放棄。</div><div class=\"reason\"><span class=\"tag t-num\">單複數</span>主詞 style（單數）配 is。</div><div class=\"why\">✗ be abandoned/been abandoned 缺助動詞無法獨立、will abandon 為主動未來與被動語意不合。</div>"}, {"a": "have seen", "o": ["have been", "saw", "have seen", "see"], "why": "<div class=\"reason\"><span class=\"tag t-tense\">時態</span>「the first time we have seen this」，the first time + 現在完成式為固定搭配。</div><div class=\"why\">✗ have been 語意不完整、saw 過去式不合 first time 句型、see 原形時態不合。</div>"}, {"a": "compared", "o": ["associated", "compared", "related", "comparing"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>片語 compared to（與⋯相比），long legs compared to body size。</div><div class=\"reason\"><span class=\"tag t-tense\">時態</span>過去分詞 compared 引導比較片語，被動分詞用法。</div><div class=\"why\">✗ associated（聯想）搭配 with、related（相關）搭配 to 但語意是「相關」非「相比」、comparing 為主動分詞不合此被動比較。</div>"}, {"a": "further", "o": ["further", "worst", "hotter", "colder"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>「the further away... the better」為 the + 比較級, the + 比較級句型，further（更遠）表距離。</div><div class=\"why\">✗ worst 為最高級不合、hotter/colder（更熱/更冷）與「身體離地面距離」語意不符。</div>"}], "pg": 108, "day": 24, "done": false}, {"id": "080251", "t": "The narrative of law (法律的敘述)", "k": "d", "parts": ["The narrative of law and order is located fundamentally at the level of individual guilt and responsibility. Criminal acts are seen as individual issues of personal responsibility and ", "culpability", " , to responsibility. Criminal acts are seen as individual issues of personal responsibility and culpability , to which the state responds by way of policing, ", "prosecution", " , adjudication and punishment. This is but one level at which crime and criminal justice can be analysed. The problem is that so often analysis one level at which crime and criminal justice can be analysed. The problem is that so often analysis ends there, at the level of individual action, ", "characterised", " in terms of responsibility, guilt, evil. In few other areas of social life does individualism have this hold. To take but one ", "instance", " , it would be other areas of social life does individualism have this hold. To take but one instance , it would be absurd to restrict analysis of obesity, to individual greed. It should similarly be widely seen as absurd to restrict analysis of criminal justice issues to the culpability of individuals. restrict analysis of criminal justice issues to the culpability of individuals. arrest prosecution custody sentence characterised concentrated spotlighted pondered circumstance thought instance stand"], "blanks": [{"a": "culpability", "o": ["fault", "negligence", "culpability", "inaccuracy"], "why": "<div class=\"reason\"><span class=\"tag t-sem\">語意</span>與 responsibility 並列，指個人「罪責/可歸責性」，responsibility and culpability。</div><div class=\"why\">✗ fault 過失、negligence 疏忽、inaccuracy 不準確皆不及 culpability 對應法律上的「罪責」。</div>"}, {"a": "prosecution", "o": ["arrest", "prosecution", "custody", "sentence"], "why": "<div class=\"reason\"><span class=\"tag t-sem\">語意</span>與 policing、adjudication、punishment 並列司法回應程序，prosecution（起訴）。</div><div class=\"why\">✗ arrest 逮捕、custody 羈押、sentence 判刑皆為單一環節，prosecution 才對應「起訴」這一階段。 ncluded a loans scheme to help students finance their Education Contribution Scheme (HECS) which included a loans scheme to help students finance their contributions. This enabled university to remain accessible to students by delaying their payments until they could afford to pay off their loans. In 2002, the Australian Government introduced a scheme they could afford to pay off their loans. In 2002, the Australian Government introduced a scheme similar to HECS for postgraduate students-the Postgraduate Education Loan Scheme (PELS). Funding for higher education comes from various sources. This article examines the three main sources- for higher education comes from various sources. This article examines the three main sources- Australian Government funding, student fees and charges, and HECS. While the proportion of total ", "revenue", " raised through HECS is relatively small, HECS payments are a significant component of revenue raised through HECS is relatively small, HECS payments are a significant component of students' university costs, with many students carrying a HECS debt for several years after leaving university. This article also focuses on characteristics of university students based on their HECS liability university. This article also focuses on characteristics of university students based on their HECS liability status, and the level of accumulated HECS debt."], "blanks": [{"a": "assumed", "o": ["assumed", "accounted", "shirked", "paid"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>assume responsibility for（承擔…的責任）固定搭配。</div><div class=\"reason\"><span class=\"tag t-tense\">時態</span>1974 年事件用過去式 assumed。</div><div class=\"why\">✗ accounted 接 for 但語意是解釋；shirked 是逃避（相反）；paid 不與 responsibility 構成承擔之意。</div>"}, {"a": "accessible", "o": ["accomplishable", "dependable", "welcome", "accessible"], "why": "<div class=\"reason\"><span class=\"tag t-sem\">語意</span>使大學對所有人「可及/普及」，making university accessible to all。</div><div class=\"reaso  state's relation with its neighbours, at least in the formative years, are greatly ", "influenced", " by its frontier policy, especially when there are no settled borders. Empire builders in the past sought to extend imperial frontiers for a variety of reasons; settled borders. Empire builders in the past sought to extend imperial frontiers for a variety of reasons; subjugation of kings and princes to gain their ", "allegiance", " (as well as handsome tributes or the coffers of the state), and, security of the 'core' of the empire from external attacks by establishing a string of the state), and, security of the 'core' of the empire from external attacks by establishing a string of buffer states in areas adjoining the frontiers. The history of British empire in India was no different. It is important to note in this connection that the concept of international boundaries (between two important to note in this connection that the concept of international boundaries (between two sovereign states), demarcated and ", "delineated", " , was yet to emerge in India under Mughal rule."], "blanks": [{"a": "element", "o": ["element", "example", "paradox", "feature"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>an element of truth（幾分真實/一點真理）固定片語。</div><div class=\"why\">✗ example/paradox/feature 都不與 an ___ of truth 構成此慣用語。</div>"}, {"a": "influenced", "o": ["affluent", "emphasized", "influenced", "affiliated"], "why": "<div class=\"reason\"><span class=\"tag t-tense\">時態</span>be greatly ___ by 被動結構，需過去分詞 influenced。</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>與鄰國關係深受邊界政策「影響」。</div><div class=\"why\">✗ affluent 是富裕（形容詞語意不符）；emphasized 強調、affiliated 隸屬皆不符「受…影響」之意。</div>"}, {"a": "allegiance", "o": ["alleviation", "allegiance", "allocation", "allegation"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>gain allegiance（取得效忠）自然搭配。</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>征服諸王以取得其「效忠」。</div><div class=\"why\">✗ alleviation 緩解、allocation 分配、allegation 指控形近義異，皆不符「效忠」。</div>"}, {"a": "delineated", "o": ["disabled", "defused", "delivered", "delineated"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>與 demarcated 並列，邊界被「劃定/界定」，demarcated and delineated。</div><div class=\"reason\"><span class=\"tag t-tense\">時態</span>被動分詞修飾 boundaries，過去分詞 delineated。</div><div class=\"why\">✗ disabled 使失能、defused 拆解、delivered 遞送皆與「劃界」語意不符。</div>"}], "pg": 113, "day": 25, "done": false}, {"id": "080265", "t": "Film (電影)", "k": "d", "parts": ["Film is where art meets commerce. ", "As", " Orson Welles said “A painter just needs a brush and the writer Film is where art meets commerce. As Orson Welles said “A painter just needs a brush and the writer just needs a pen, but the producer needs an army.” And an army needs money; a producer is just like an entrepreneur. We ", "raise", " money to make films. First we need to find an original idea or a book or a an entrepreneur. We raise money to make films. First we need to find an original idea or a book or a play and purchase the rights, then we need money to develop that idea, often a reasonably small sum. ", "Besides", " , to commission a writer for the screenplay isn't something you would want to gamble your Besides , to commission a writer for the screenplay isn't something you would want to gamble your own money on, so you find a partner. We are lucky here in the UK, ", "as", " we have Film4, BBC Films and the UK Film Council, all of which are good places to develop an idea. Producing in Britain is very different UK Film Council, all of which are good places to develop an idea. Producing in Britain is very different to producing in America or ", "even", " Europe because the economic dynamic is different."], "blanks": [{"a": "As", "o": ["As", "IfIf", "Unlike"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>As + 人 said（正如某人所說）引導引述，As Orson Welles said。</div><div class=\"why\">✗ IfIf 為錯誤選項；Unlike 是「不像」介系詞，不引導 said 子句。</div>"}, {"a": "raise", "o": ["raise", "rise", "arise", "arouse"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>raise money（籌錢）固定及物搭配，raise money to make films。</div><div class=\"why\">✗ rise/arise 是不及物（升起/出現）不能接 money；arouse 是喚起情緒，語意不符。</div>"}, {"a": "Besides", "o": ["Besides", "Nevertheless", "Therefore", "Although"], "why": "<div class=\"reason\"><span class=\"tag t-sem\">語意</span>承接上文再補充一點（此外），Besides 引導追加說明。</div><div class=\"why\">✗ Nevertheless/Although 表轉折、Therefore 表因果，皆與此處「補充」語氣不符。</div>"}, {"a": "as", "o": ["as", "so", "therefore"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>isn&#x27;t something you&#x27;d want to…，此處 just like an entrepreneur 之外句構需 as；此格依上下文取 as 引導方式狀語。</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>語意連接「正如…一樣」，as 最自然。</div><div class=\"why\">✗ so/therefore 表結果或推論，不符此處連接語意。</div>"}, {"a": "even", "o": ["also", "even", "either", "not"], "why": "<div class=\"reason\"><span class=\"tag t-sem\">語意</span>even 表強調遞進，different to producing in America or even Europe（甚至歐洲）。</div><div class=\"why\">✗ also 是「也」、either 用於否定、not 否定詞，皆不符「甚至」的遞進強調。</div>"}], "pg": 115, "day": 25, "done": false}, {"id": "110155", "t": "Surface Water (地表水)", "k": "dd", "parts": ["Chemicals used to control weeds in crops such as corn and soybeans may sometimes run off farmland and enter surface water bodies such as lakes and streams. If a surface water body that is used as a ", "drinking", " water supply receives excess amounts of these herbicides, then the municipal water treatment plant must ", "filter", " them out in order for the water to be safe to drink. This added filtration process can be expensive. Farmers can help control excess herbicides in runoff by choosing chemicals that bind with ", "soil", " more readily, are less toxic, or degrade more quickly. Additionally, selecting the best tillage practice can help minimize herbicide ", "pollution", "."], "opts": ["soil", "dig", "mud", "drinking", "filter", "pollution"], "pg": 47, "day": 25, "done": false}, {"id": "110157", "t": "Neuroscientists (神經科學家)", "k": "dd", "parts": ["We now know through the work of neuroscientists that the human brain is wired to mimic other people, and this mimicry involves actual involuntary physiological ", "experiences", " in the observer. Human beings tend to ", "imitate", " actions that they see. Physiologically, our brains include mirror neurons, which ", "react", " to actions that are seen as if we are doing the action ourselves. It is largely an unconscious and automatic experience. When we hear people speak, observe their vocal ", "nuances", ", watch their posture, gestures, and facial expressions, etc, neural networks in our brains are stimulated by the”shared representations” generating feelings within us that ", "reflect", " the experience of those we are observing."], "opts": ["experiences", "impact", "relate", "imitate", "react", "nuances", "differences", "nonsense", "reflect"], "pg": 48, "day": 25, "done": false}, {"id": "080269", "t": "Video-Conferencing Technology (視頻會議技術)", "k": "d", "parts": ["Never has the carbon footprint of multi-national corporations been under such intense scrutiny. Inter- city train journeys and long-haul flights to ", "conduct", " face-to-face business meetings contribute city train journeys and long-haul flights to conduct face-to-face business meetings contribute significantly to greenhouse gases and the resulting ", "strain", " on the environment. The Anglo-US company Teliris has introduced a new video-conferencing technology and partnered with the Carbon Neutral Teliris has introduced a new video-conferencing technology and partnered with the Carbon Neutral Company, enabling corporate outfits to become more environmentally responsible. The innovation allows simulated face-to-face meetings to be held across continents without the time ", "pressure", " or allows simulated face-to-face meetings to be held across continents without the time pressure or environmental burden of international travel. Previous designs have enabled video-conferencing on a point-to-point, dual-location basis. The firm's VirtuaLive technology, however, can bring people point-to-point, dual-location basis. The firm's VirtuaLive technology, however, can bring people together from up to five ", "separate", " locations anywhere in the world-with ", "unrivalled", " transmission quality."], "blanks": [{"a": "conduct", "o": ["lay", "spawn", "establish", "conduct"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>固定搭配 conduct business meetings（進行商務會議）</div><div class=\"why\">✗ lay/spawn/establish 都不與 meetings 搭配；conduct meetings 才慣用</div>"}, {"a": "strain", "o": ["strategy", "surveillance", "strain", "affect"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>固定搭配 strain on the environment（對環境的壓力/負擔）</div><div class=\"reason\"><span class=\"tag t-pos\">詞性</span>the resulting ___ on... 需名詞，strain 為名詞</div><div class=\"why\">✗ affect 為動詞不合詞性；strategy/surveillance 語意不搭 on the environment</div>"}, {"a": "pressure", "o": ["anxiety", "limit", "pressure", "trauma"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>固定搭配 time pressure（時間壓力）</div><div class=\"why\">✗ anxiety/trauma 偏心理創傷不搭 time；limit 與 time 搭配語意不同</div>"}, {"a": "separate", "o": ["separate", "each", "respectively", "single"], "why": "<div class=\"reason\"><span class=\"tag t-pos\">詞性</span>five ___ locations 數詞後接形容詞修飾複數名詞，separate 為形容詞</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>語意指『五個各自分開的地點』</div><div class=\"why\">✗ each 需配單數；respectively 為副詞不可作前位修飾；single 與 five 矛盾</div>"}, {"a": "unrivalled", "o": ["unreliable", "unrivalled", "impracticable", "uncooperative"], "why": "<div class=\"reason\"><span class=\"tag t-sem\">語意</span>宣傳語境強調『無與倫比的』傳輸品質，正面詞</div><div class=\"why\">✗ unreliable/impracticable/uncooperative 皆為負面，與行銷宣傳語境相反</div>"}], "pg": 116, "day": 26, "done": false}, {"id": "080275", "t": "Teaching of language (語言教學)", "k": "d", "parts": ["The teaching of languages could be revolutionised following ground-breaking research by Victoria University, New Zealand, PhD graduate Paul Sulzberger. Dr Sulzberger has found that the best way to learn a language is through frequent exposure to its sound patterns--even if you haven't a ", "clue", " what it all means. \"However crazy it might sound, just listening to the language, even though you don't understand it, is critical. A lot of language teachers may not accept that,\" he says. \"Our ability to learn new words is directly related to how often we have been exposed to the particular combinations of the new words is directly related to how often we have been exposed to the particular combinations of the sounds which make up the words. If you want to learn Spanish, for example, frequently listening to a Spanish language radio station on the internet will dramatically ", "boost", " your ability to pick up the Spanish language radio station on the internet will dramatically boost your ability to pick up the language and learn new words.\" Dr Sulzberger's research challenges existing language learning theory. His main hypothesis is that simply listening to a new language sets up the structures in the brain His main hypothesis is that simply listening to a new language sets up the structures in the brain ", "required", " to learn the words."], "blanks": [{"a": "clue", "o": ["clue", "idea", "concept", "consideration"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>固定搭配 haven&#x27;t a clue（毫無頭緒/完全不懂）</div><div class=\"why\">✗ idea 需 have no idea 句型；concept/consideration 不與 haven&#x27;t a ___ 構成『毫無頭緒』慣用語</div>"}, {"a": "boost", "o": ["boost", "prolong", "retain", "dent"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>固定搭配 boost your ability（大幅提升你的能力），前有 dramatically</div><div class=\"why\">✗ prolong 為『延長』；retain 為『保留』；dent 為『削弱』，與 dramatically + ability 的正面提升不合</div>"}, {"a": "r

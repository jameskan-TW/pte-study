 ["New favorable traits evolve when genetic mutations arise that offer a survival edge. As the survivors of each generation pass on those beneficial mutations, the mutations and ", "their", " adaptive traits become each generation pass on those beneficial mutations, the mutations and their adaptive traits become more common in the general population. Though it may take millions of years for complex traits to evolve , say allowing humans to walk on two legs, evolution itself happens with each generation as evolve , say allowing humans to walk on two legs, evolution itself happens with each generation as adaptive mutations become more frequent in the population. The genomic revolution has allowed biologists to see the natural selection process in action by making the genetic blueprint of hundreds of biologists to see the natural selection process in action by making the genetic blueprint of hundreds of thousands of people available for comparison. By tracking the relative rise and fall of specific mutations across generations of people, researchers can infer which traits are spreading or dwindling. mutations across generations of people, researchers can infer which traits are spreading or dwindling. to_evolve ", "evolving", " updating to_update in_activity inactive in_action ", "action", " over along throughout ", "across", ""], "blanks": [{"a": "their", "o": ["their", "our", "its", "his"], "why": "<div class=\"reason\"><span class=\"tag t-pos\">詞性</span>the mutations and ___ adaptive traits 須用所有格代名詞，their 指代複數 mutations</div><div class=\"reason\"><span class=\"tag t-num\">單複數</span>先行詞 the mutations 為複數，所有格用 their 數一致</div><div class=\"why\">✗ our/his 為人稱不合語境、its 為單數無法指代複數 mutations</div>"}, {"a": "evolving", "o": ["evolving", "updating"], "why": "<div class=\"reason\"><span class=\"tag t-pos\">詞性</span>for complex traits to ___ 須用原形動詞構成不定詞，evolving/updating 中取 evolve 系（此題只給 -ing 形，依語意選 evolving）</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>全文主題為演化，c ueensland bust, and the species stays off the list. This has repercussions because northern koalas are different to southern ones. species stays off the list. This has repercussions because northern koalas are different to southern ones. They are smaller, for example, and they contain a genetic ", "variation", " not represented in the South. ", "For this reason", " , a split listing has been devised koalas from New South Wales, the ACT and Queensland this reason , a split listing has been devised koalas from New South Wales, the ACT and Queensland are now officially 'Vulnerable'; those from Victoria and South Australia are not considered threatened. 2 are_damaged are_broken_down are_afflicted are_isolated 3 are_increasing are_falling are_stable are_low 4 must_have_decreased has_increased could_have_declined must_have_grown However For_this_reason In_other_words In_spite_of 6 However For_this_reason In_other_words In_spite_of"], "blanks": [{"a": "While", "o": ["Because", "While", "But", "However"], "why": "<div class=\"reason\"><span class=\"tag t-sem\">語意</span>雖然某些地區無尾熊有麻煩，其他地區卻過多，While 引導讓步對比</div><div class=\"reason\"><span class=\"tag t-pos\">詞性</span>句首連接詞引導對比子句，While 表「雖然/儘管」</div><div class=\"why\">✗ Because 表原因；However 為連接副詞不可直接引導從屬子句；But 為對等連接詞不宜置句首引導從句。</div>"}, {"a": "are afflicted", "o": ["are damaged", "are broken down", "are afflicted", "are isolated"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>be afflicted by disease 固定搭配，指「受…疾病所苦」</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>高比例無尾熊受疾病侵襲，are afflicted by disease 合語境</div><div class=\"why\">✗ are damaged 多指物品損壞；are broken down 表故障分解；are isolated 表被隔離，皆不合「受疾病侵害」。</div>"}, {"a": "are falling", "o": ["are increasing", "are falling", "are stable", "are low"], "why": "<div class=\"reason\"><span class=\"tag t-sem\">語意</span>與 but that they have grown 對比，此處說問題不是族群「在下降」，are falling 表數量減少</div><div class=\"reason\"><span class=\"tag t-num\">單複數</span>主詞 populations 複數，a ard", "staple", "demonstration", "essential", "acknowledge", "manifestation"], "pg": 92, "day": 48, "done": false}, {"id": "080462", "t": "Active Brain(活躍的大腦)", "k": "d", "parts": ["Keeping the brain active and engaged appears to combat the cognitive decline associated with getting older. Now a study has found a new, but related, factor in maintaining a sharp mind—the space in older. Now a study has found a new, but related, factor in maintaining a sharp mind—the space in which we live. Researchers recruited almost 1,300 senior citizens, none of whom showed any signs of clinical dementia at the start of the study. The participants had their cognitive function tested annually clinical dementia at the start of the study. The participants had their cognitive function tested annually for up to eight years. And they also described their living space. For example, maybe they mostly hung around their bedroom. Perhaps they spent time in the yard. Or frequently traveled. By the end of the around their bedroom. Perhaps they spent time in the yard. Or frequently traveled. By the end of the study, 180 people had Alzheimers. And those whose ", "life-space", " narrowed in on their immediate home were almost twice as likely to develop the ", "condition", " as those who ventured out. The homebound folks were almost twice as likely to develop the condition as those who ventured out. The homebound folks also had an ", "increased", " risk of other cognitive impairments and a faster rate of cognitive decline. The research was published in the American Journal of Geriatric Psychiatry. The study's lead investigator, research was published in the American Journal of Geriatric Psychiatry. The study's lead investigator, Bryan James of the Rush University Medical Center in Chicago, ", "suggests", " that, \"Perhaps life space is an indicator of how much we are ", "actively", " engaging and challenging our cognitive ", "abilities", " .\" indicator of how much we are actively engaging and chall evelopers be able to use it to get electricity out ", "as well as", " heat? The efficiency falls — and will the developers be able to use it to get electricity out as well as heat? The efficiency falls dramatically when the sand is used to just return power to the electricity grid. 1 charges_up_with charging_up_with has_been_charging_up_ is_charged_up_with of_which which in_which of_thos 2 of_which which in_which of_thos as_long_as ifif while unless Until_now Eventually Rarely Right_now 5 instead_of apart_from as_well_as with"], "blanks": [{"a": "is charged up with", "o": ["charges up with", "charging up with", "has been charging up with", "is charged up with"], "why": "<div class=\"reason\"><span class=\"tag t-tense\">時態</span>the device 為被動承受充能，is charged up with heat 表「以熱來充能」被動式</div><div class=\"reason\"><span class=\"tag t-coll\">搭配</span>be charged up with 固定被動搭配，指被充入能量</div><div class=\"why\">✗ charges up with/charging up with 為主動形式不合裝置「被充能」；has been charging up 為主動完成進行，與被動語意不符。</div>"}, {"a": "which", "o": ["of which", "which", "in which", "of thos"], "why": "<div class=\"reason\"><span class=\"tag t-pos\">詞性</span>非限定關係子句主詞，先行詞 heat，which can then warm homes，which 作子句主詞</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>指代前面的 heat，which 引導補充說明</div><div class=\"why\">✗ of which/in which 為介系詞+關代須有對應介系詞結構；of thos 為拼字錯誤非有效選項。</div>"}, {"a": "while", "o": ["as long as", "if", "while", "unless"], "why": "<div class=\"reason\"><span class=\"tag t-sem\">語意</span>對比：太陽能風機可快速加入，「但」也帶來挑戰，while 表對比讓步</div><div class=\"reason\"><span class=\"tag t-pos\">詞性</span>句首 But while 引導對比子句，while 表「雖然/然而」</div><div class=\"why\">✗ as long as/if/unless 表條件，與此處單純對比（可加入 vs 帶來挑戰）的語意不符。</div>"}, {"a": "Right now", "o": ["Until now", "Eventually", "Rarely", "Right now"], "why": "<div class=\"reason\"><span class=\"tag t-sem\">語意</span>「現在」大多數電池用鋰且昂貴，Right now 表當下現況，配現在式 are made</div><div class=\"reason\"><span class=\"tag t-tense\">時態</span>搭配現在式描述目前狀態，Right now 表此刻</div> e infants by a recorded voice — one with two identical syllables, for example neenee, and the other without repeated syllables, such — one with two identical syllables, for example neenee, and the other without repeated syllables, such as bolay. The infants were then tested for their recognition of ", "each", " made-up word. Recordings of their eye movements showed they looked more reliably at the object labeled with repeated syllables, than eye movements showed they looked more reliably at the object labeled with repeated syllables, than the other object. Researchers validated their results with a control test, in which the infants responded to pictures of familiar objects — such as a dog or an apple. to pictures of familiar objects — such as a dog or an apple."], "blanks": [{"a": "why", "o": ["why", "that", "whether", "however"], "why": "<div class=\"reason\"><span class=\"tag t-sem\">語意</span>explain why...「解釋為何」，後句說明某些詞演變成疊字版的原因</div><div class=\"reason\"><span class=\"tag t-pos\">詞性</span>explain + why 引導名詞子句解釋原因</div><div class=\"why\">✗ that 不帶原因語意、whether 表是否、however 為副詞，皆不符 explain 後說明「原因」</div>"}, {"a": "with", "o": ["with", "as", "for", "in"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>give rise to versions with repeated syllables「帶有疊音節的版本」，with 表附帶特徵</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>versions with X「具有 X 的版本」</div><div class=\"why\">✗ as/for/in 皆無法表「具有疊音節特徵的版本」之附帶屬性</div>"}, {"a": "using", "o": ["using", "having", "applying", "doing"], "why": "<div class=\"reason\"><span class=\"tag t-tense\">時態</span>分詞片語 using pictures「使用圖片」修飾 tests，現在分詞表方式</div><div class=\"reason\"><span class=\"tag t-coll\">搭配</span>tests using pictures on a screen「以螢幕圖片進行的測試」</div><div class=\"why\">✗ having/applying/doing 在此皆不如 using 自然搭配「使用圖片進行測試」</div>"}, {"a": "communicated", "o": ["communicated", "expressed", "accommodated", "accelerated"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>communicated to the infants by a recorded voice「透過錄音傳達給嬰兒」，communicate to sb by 慣用</div><div class=\"reason\"><span class=\"tag t-tense\">時態</span>were ___ 被動，過去分詞 communicated</div><div class=\"why\">✗ expressed/accommodated/accelerated 與 to the infants by a voice 的「傳達」語意不合</div>"}, {"a": "each", "o": ["each", "another", "one", "dual"], "why": "<div class=\"reason\"><span class=\"tag t-sem\">語意</span>tested for recognition of each made-up word「每個自創詞」，逐一測試辨識</div><div class=\"reason\"><span class=\"tag t-num\">單複數</span>each + 單數名詞 word</div><div class=\"why\">✗ another 另一、one 一個、dual 雙重，皆不符「對每一個詞」逐一測試之意</div>"}], "pg": 209, "day": 56, "done": false}, {"id": "080534", "t": "Housing(住房)", "k": "d", "parts": ["Housing is a key component of individual and family. In addition to being a place where family and friends can gather, housing is important for a sense of security and ", "privacy", ". privacy . One ", "significant", " aspect of security is the wealth in the homes of owner occupiers. The wealth of households ", "increases", " as the wealth (or equity) in the homes of owner occupiers increases through paying off outstanding housing loans, or as property values rise. In 2003-04, the primary residence was, on average, the most valuable asset of owner-occupier households, with the net value of owned homes accounting for an average of 55% of the net worth of those households. accounting_for resulting_in depending_on belonging_to 4 accounting_for resulting_in depending_on belonging_to"], "blanks": [{"a": "privacy", "o": ["paucity", "prowess", "privacy", "poverty"], "why": "<div class=\"reason\"><span class=\"tag t-sem\">語意</span>a sense of security and privacy，與 security 並列指「隱私」，且後句重複 privacy</div><div class=\"reason\"><span class=\"tag t-coll\">搭配</span>security and privacy 固定並列搭配</div><div class=\"why\">✗ paucity 匱乏、prowess 本領、poverty 貧窮，皆與 security 並列語意不合（音近干擾項）</div>"}, {"a": "significant", "o": ["considerate", "temporal", "significant", "consistent"], "why": "<div class=\"reason\"><span class=\"tag t-pos\">詞性</span>One ___ aspect，修飾名詞 aspect 的形容詞</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>「一個重要面向」引出 wealth in homes 的重點</div><div class=\"why\">✗ considerate 體貼、temporal 時間的、consistent 一致的，皆不符「重要面向」之意</div>"}, {"a": "increases", "o": ["stablizes", "falls", "appears", "increases"], "why": "<div class=\"reason\"><span class=\"tag t-tense\">時態</span>The wealth of households ___，主詞單數用 increases；後句 as...increases 重述</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>隨房貸還清或房價上漲，家戶財富「增加」</div><div class=\"why\">✗ stablizes 穩定、falls 下跌、appears 出現，皆與「財富增加」語境矛盾</div>"}], "pg": 210, "day": 56, "done": false}, {"id": "080535", "t": "Pop Art(波普藝術)", "k": "d", "parts": ["Pop art was a cultural ", "movement", " that began in the mid-20th century, ", "turning", " to everyday life as a source of inspiration. American artists often used ", "familiar", " subjects from their surroundings, such as beer bottles, clothing, comic strips, and advertisements, to create bold and striking artworks. In the United Kingdom, however, pop art drew heavily from ", "imagery", " found in magazines, as well as archives and mass media culture. Together, these approaches made pop art one of the most accessible and influential movements in modern art. for_example unless as_well_as ", "therefore", ""], "blanks": [{"a": "movement", "o": ["invention", "judgement", "measurement", "movement"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>cultural movement「文化運動」固定搭配，標題即 Pop Art movement</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>波普藝術是一場文化運動</div><div class=\"why\">✗ invention 發明、judgement 判斷、measurement 測量，皆不搭 cultural ___</div>"}, {"a": "turning", "o": ["turned", "turning", "turn"], "why": "<div class=\"reason\"><span class=\"tag t-tense\">時態</span>分詞片語 turning to...「轉向」修飾前面主句，現在分詞表伴隨</div><div class=\"reason\"><span class=\"tag t-coll\">搭配</span>turn to ... as a source of inspiration「轉向...作為靈感來源」</div><div class=\"why\">✗ turned 過去式/分詞、turn 原形，皆無法在 began..., ___ to 處作分詞狀語</div>"}, {"a": "familiar", "o": ["similar", "popular", "familiar", "regular"], "why": "<div class=\"reason\"><span class=\"tag t-sem\">語意</span>familiar subjects from their surroundings「來自周遭的熟悉題材」，呼應 everyday life</div><div class=\"reason\"><span class=\"tag t-pos\">詞性</span>修飾 subjects 的形容詞</div><div class=\"why\">✗ similar 類似、popular 流行、regular 規律，皆不如 familiar 呼應「日常周遭」</div>"}, {"a": "imagery", "o": ["comments", "imagery", "articles", "titles"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>drew heavily from imagery found in magazines「取材自雜誌中的影像」，imagery 與視覺藝術搭配</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>與 mass media、archives 並列指圖像素材</div><div class=\"why\">✗ comments 評論、articles 文章、titles 標題，皆不符波普藝術取材「視覺影像」之意</div>"}, {"a": "therefore", "o": ["unless", "therefore"], "why": "<div class=\"reason\"><span class=\"tag t-sem\">語意</span>前文 Together, these approaches made pop art... 帶結論語氣，需表結果的副詞 therefore</div><div class=\"reason\"><span class=\"tag t-pos\">詞性</span>選項僅 unless（除非條件）與 therefore（因此），語境為總結因果</div><div class=\"why\">✗ unless 引導條件假設，與此處綜述兩種取向所致結果的語意不合</div>"}], "pg": 210, "day": 57, "done": false}, {"id": "080536", "t": "Choice of Subjects(主題選擇)", "k": "d", "parts": ["The lack of interest among adolescents in school science courses is a complex issue, but two ", "factors", " are particularly critical. Contemporary students live in a culture that increasingly emphasizes self- reflection and autonomy, and the range of subjects they are ", "confronted", " with is far broader than in the past. Adolescence is a key period for the formation of identity, and ample evidence shows that the way subject choices contribute to one's sense of self-particularly in how they reflect personal ", "values", " ——is crucial for young people. Specifically, science curricula need to more clearly demonstrate the career pathways that science can offer——both within scientific fields and in science-related professions——and articulate ", "why", " these careers are valuable, meaningful, and rewarding."], "blanks": [{"a": "factors", "o": ["factors", "standards", "objects", "items"], "why": "<div class=\"reason\"><span class=\"tag t-num\">單複數</span>two ___ are particularly critical，two 後接複數，且 are 對應複數主詞</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>後文逐一說明兩個「因素」，factors 呼應</div><div class=\"why\">✗ standards 標準、objects 物件、items 項目，皆不符「兩個關鍵因素」之意</div>"}, {"a": "confronted", "o": ["attached", "confronted", "included", "compromised"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>be confronted with「面對、被擺在面前」固定被動搭配，後接 with</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>學生「面對」的科目範圍遠比過去廣</div><div class=\"why\">✗ attached/included/compromised 雖部分可搭 with，但 confronted with 才表「面對眾多科目」</div>"}, {"a": "values", "o": ["values", "resume", "morale", "status"], "why": "<div class=\"reason\"><span class=\"tag t-sem\">語意</span>後句 how they reflect personal values 重複 values，指科目選擇反映「個人價值觀」</div><div class=\"reason\"><span class=\"tag t-coll\">搭配</span>personal values「個人價值觀」固定搭配</div><div class=\"why\">✗ resume 履歷、morale 士氣、status 地位，皆不符「反映個人價值觀」之語境（且後文明寫 values）</div>"}, {"a": "why", "o": ["what", "however", "where", "why"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>articulate why these careers are valuable「闡明為何...」，why 引導名詞子句說明原因</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>與前文 demonstrate pathways 並列，進一步說明「為何」這些職涯有價值</div><div class=\"why\">✗ what 問內容、however 為副詞、where 問地點，皆不符「闡明原因」之意</div>"}], "pg": 210, "day": 57, "done": false}, {"id": "080537", "t": "The Literary Paradox(文學悖論)", "k": "d", "parts": ["The normal novel is dying. People nowadays prefer to engage in other forms of entertainment, such as music, rather ", "than", " reading books during their leisure time. However, ", "ironically", ", ironically , a survey conducted by a certain organisation or website reveals that the number of potential online writers, particularly in the genre of novels, is continuously increasing. This contradiction highlights the fact that despite the decline in reading books, global literacy rates are at an all-time high. This signals a shift in how people consume and engage with literature. While novels may be ", "losing", " popularity as a medium, the rise of online writers and the overall improvement in literacy rates underscore the enduring importance and value of written communication. It also challenges the notion that literature is dying and suggests that it is merely evolving to adapt to the preferences and habits of modern readers. In conclusion, the novel, like any other art form, may transform in response to changing times but is far from fading ", "away", " for as than to ironically thoroughly radically respectively"], "blanks": [{"a": "than", "o": ["for", "as", "than", "to"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>prefer to do X rather than do Y / prefer X ... than Y，此處 prefer... rather than reading，比較結構用 than</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>偏好其他娛樂「而非」閱讀，表對比</div><div class=\"why\">✗ for/as/to 無法構成 rather...than 的比較對比結構（句中 rather 已出現）</div>"}, {"a": "ironically", "o": ["ironically", "thoroughly", "radically", "respectively"], "why": "<div class=\"reason\"><span class=\"tag t-sem\">語意</span>後句重複 ironically，且小說沒落卻有更多人想當網路作家，構成「諷刺」對比</div><div class=\"reason\"><span class=\"tag t-pos\">詞性</span>句首評注性副詞修飾全句</div><div class=\"why\">✗ thoroughly 徹底、radically 激進、respectively 各自地，皆不符此「諷刺對比」語境</div>"}, {"a": "losing", "o": ["losing", "maintaining", "loosing", "regaining"], "why": "<div class=\"reason\"><span class=\"tag t-tense\">時態</span>may be ___ popularity，be 後接現在分詞 losing 構成進行式「正在失去」</div><div class=\"reason\"><span class=\"tag t-coll\">搭配</span>lose popularity「失去人氣」固定搭配</div><div class=\"why\">✗ loosing 是常見拼字錯誤(鬆開)；maintaining/regaining 與前文小說沒落的語意矛盾</div>"}, {"a": "away", "o": ["upon", "on", "up", "away"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>far from fading away「遠未消逝」，phrasal verb fade away「逐漸消失」</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>結論：小說會轉變但遠未消亡</div><div class=\"why\">✗ fade upon/on/up 皆非慣用片語，唯 fade away 表「消逝」</div>"}], "pg": 211, "day": 57, "done": false}, {"id": "080538", "t": "Skill of Presentation(演講技巧)", "k": "d", "parts": ["Being able to give a good and clear presentation to a public audience is a skill that you and your future employer will value ", "greatly", ". . Prospective employers invariably ask for your experience in using these key employer will value greatly Prospective employers invariably ask for your experience in using these key skills during interviews. You need to be able to articulate what makes a good and poor presentation and offer evidence for your knowledge. So, when you are asked to give a talk or produce a poster as and offer evidence for your knowledge. So, when you are asked to give a talk or produce a poster as part of your studies, recognize the importance of developing the skills of delivery ", "as well as", " conveying the content. Posters and oral presentations are forms of presentation that enable you to develop your the content. Posters and oral presentations are forms of presentation that enable you to develop your confidence in different ways. Posters check your ability to present information succinctly, and present it in an attractive and message-focused way, ", "while", " oral presentations allow for more information and a in an attractive and message-focused way, while oral presentations allow for more information and a more in-depth delivery. In both modes you will probably find yourself taking questions and ", "explaining", " randomly greatly consistently excessively except as_well_as as_long_as rather_than 2 except as_well_as as_long_as rather_than while nevertheless moreover however"], "blanks": [{"a": "greatly", "o": ["randomly", "greatly", "consistently", "excessively"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>「value greatly」搭配（高度重視）。</div><div class=\"reason\"><span class=\"tag t-pos\">詞性</span>副詞修飾動詞 value，greatly 表程度高。</div><div class=\"why\">✗ randomly/excessively 語意不合（隨機/過度）；consistently（一貫地）不符「重視程度」語意。</div>"}, {"a": "as well as", "o": ["except", "as well as", "as long as", "rather than"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>「delivery as well as conveying the content」表「以及、不僅…還…」並列。</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>既要發表技巧，也要傳達內容，用 as well as 並列兩者。</div><div class=\"why\">✗ except/rather than 表排除或取代，語意相反；as long as 表條件，不合。</div>"}, {"a": "while", "o": ["while", "nevertheless", "moreover", "however"], "why": "<div class=\"reason\"><span class=\"tag t-sem\">語意</span>比較海報 vs 口頭報告兩種模式，while 表「然而、相較之下」對比。</div><div class=\"reason\"><span class=\"tag t-pos\">詞性</span>連接兩個對比子句，while 引導從屬子句。</div><div class=\"why\">✗ nevertheless/moreover/however 為副詞，無法在此直接連接兩子句作對比連接詞。</div>"}, {"a": "explaining", "o": ["understanding", "disguising", "concealing", "explaining"], "why": "<div class=\"reason\"><span class=\"tag t-sem\">語意</span>回答問題並「解釋」內容，explaining 最合理。</div><div class=\"reason\"><span class=\"tag t-pos\">詞性</span>與 taking questions 並列，動名詞 explaining。</div><div class=\"why\">✗ disguising/concealing（偽裝/隱瞞）語意相反；understanding 不符「回答提問後的動作」。</div>"}], "pg": 211, "day": 57, "done": false}, {"id": "080539", "t": "Design(設計)", "k": "d", "parts": ["Of course, for as long as there have been objects they have been designed. Yet design only ", "emerged", " as a dedicated discipline in the 19th century and its literature and theory are still very much in its as a dedicated discipline in the 19th century and its literature and theory are still very much in its infancy. It is curious that ", "despite", " the increasingly prominent role that self-consciously designed commodities play in our everyday lives and in the way we define ourselves, the literature around the commodities play in our everyday lives and in the way we define ourselves, the literature around the subject is hugely disappointing. In fact, beyond bland coffee-table books, it is barely there at all. Nikolaus Pevsner's Pioneers of Modern Design, a classic Hegelian text treating modernism as the Nikolaus Pevsner's Pioneers of Modern Design, a classic Hegelian text treating modernism as the inevitable ", "outcome", " of a historical process, is, despite being first published in 1936 and hopelessly dated, still the key text. There have been ", "other", " books, from quirky Bruno Munari (Design as Art) to deadpan Norman Potter (What is a Designer: Things, Places, Messages), and Deyan Sudjic's 2008 The deadpan Norman Potter (What is a Designer: Things, Places, Messages), and Deyan Sudjic's 2008 The Language of Things, ", "which", " attempted a broader examination. Nevertheless there is surprisingly little critique, an almost complete absence of theory and little genuinely popular, compelling writing on the critique, an almost complete absence of theory and little genuinely popular, compelling writing on the"], "blanks": [{"a": "emerged", "o": ["vanished", "expanded", "introduced", "emerged"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>emerge as a discipline「作為一門學科興起」，emerge as 固定搭配</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>設計直到19世紀才「興起」為專門學科</div><div class=\"why\">✗ vanished 消失、expanded 擴張、introduced 須被動，皆不搭 emerged as a discipline 之「興起」</div>"}, {"a": "despite", "o": ["despite", "nevertheless", "however"], "why": "<div class=\"reason\"><span class=\"tag t-pos\">詞性</span>despite + 名詞片語 (the increasingly prominent role)，介系詞引導讓步</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>「儘管設計商品角色日益重要，文獻卻令人失望」讓步轉折</div><div class=\"why\">✗ nevertheless/however 為副詞，不能直接帶名詞片語作讓步介系詞</div>"}, {"a": "outcome", "o": ["evidence", "outcome", "onus", "clause"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配< on. ", "Our", " application form is ready, and we are prepared to proceed with the process quickly. We look forward to hearing from you soon. Best are prepared to proceed with the process quickly. We look forward to hearing from you soon. Best 4 have_made making like_making like_to_make"], "blanks": [{"a": "in", "o": ["for", "about", "at", "in"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>「interested in renting」固定搭配（be interested in＋動名詞）。</div><div class=\"why\">✗ for/about/at 都不與 interested 構成此慣用介系詞搭配。</div>"}, {"a": "pay", "o": ["afford", "get", "pay", "bring"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>「pay the rent」固定搭配（付租金）。</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>後接 on time，指準時繳付房租。</div><div class=\"why\">✗ afford 後不直接接 the rent on time 此結構；get/bring 與 rent 搭配語意不通。</div>"}, {"a": "have", "o": ["form", "meet", "decide", "have"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>「have the same positive experience」搭配（擁有同樣的經驗）。</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>希望和朋友一樣有正面租屋經驗，用 have。</div><div class=\"why\">✗ form/meet/decide 與 the same positive experience 搭配語意都不合。</div>"}, {"a": "like to make", "o": ["have made", "making", "like making", "like to make"], "why": "<div class=\"reason\"><span class=\"tag t-tense\">時態</span>「I would like to make an appointment」固定句型（would like to＋原形）。</div><div class=\"reason\"><span class=\"tag t-coll\">搭配</span>would like to make an appointment（想預約）是禮貌請求慣用語。</div><div class=\"why\">✗ have made/making/like making 都無法與 would 構成 would like to do 的正確結構。</div>"}, {"a": "Our", "o": ["Your", "Us", "Ours", "Our"], "why": "<div class=\"reason\"><span class=\"tag t-pos\">詞性</span>後接名詞 application form，需用所有格 Our。</div><div class=\"reason\"><span class=\"tag t-num\">單複數</span>指「我們的」申請表，所有格形容詞用 Our。</div><div class=\"why\">✗ Your 指對方；Us 為受格；Ours 為所有格代名詞不可接名詞。</div>"}], "pg": 212, "day": 58, "done": false}, {"id": "080541", "t": "Invention and Innovation(發明與創新)", "k": "d", "parts": ["For our purposes the words 'invention' and 'innovation' can be used interchangeably. More ", "specifically", " For our purposes the words 'invention' and 'innovation' can be used interchangeably. More specifically however, the term 'invention' refers to the discovery of new products or processes, while 'innovation' refers to the commercialization (bringing to the market) of new products or processes. ", "Furthermore", " , refers to the commercialization (bringing to the market) of new products or processes. Furthermore , we can distinguish between product innovations and process innovations. Product innovations result ", "in", " the production of a new product, such as the change from a three-wheel car to a four-wheel car, or the the production of a new product, such as the change from a three-wheel car to a four-wheel car, or the change from LP records to CDs. Process innovations increase the ", "efficiency", " of the methods of production of existing products, for example the invention of the assembly-line technique. The production of existing products, for example the invention of the assembly-line technique. The inventions and innovations that form industrial revolutions are those that open new doors and create new ways of doing things, not simply those that fill gaps in existing ways of doing things (Mokyr, new ways of doing things, not simply those that fill gaps in existing ways of doing things (Mokyr, 1997). The core of the First Industrial Revolution in the eighteenth century was a succession of technological changes that brought about material advances in three basic areas: (1) the substitution technological changes that brought about material advances in three basic areas: (1) the substitution of mechanical devices (such as machines) for human labour; (2) the substitution of inanimate sources of power (such as steam) for animate sources of power (such as horse power); and (3) the substitutiorn of power (such as steam) for animate sources of power (such as horse power); and (3) the substitutiorn of mineral raw materials for vegetable or animal substances, and in general the use of new and more"], "blanks": [{"a": "specifically", "o": ["naturally", "expectedly", "extensively", "specifically"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>More specifically「更具體地說」句首慣用語，引出更精確的定義</div><div class=\"reason\"><span class=\"tag t-pos\">詞性</span>More + 副詞 specifically 修飾全句</div><div class=\"why\">✗ naturally/expectedly/extensively 與 More 連用皆不如 More specifically 引出明確區分之意</div>"}, {"a": "Furthermore", "o": ["However", "Nevertheless", "Furthermore", "Anyway"], "why": "<div class=\"reason\"><span class=\"tag t-sem\">語意</span>前後皆為遞進補充（再區分產品/流程創新），需遞進副詞 Furthermore（且原文已現 Furthermore）</div><div class=\"reason\"><span class=\"tag t-pos\">詞性</span>句首連接副詞</div><div class=\"why\">✗ However/Nevertheless 表轉折、Anyway 偏口語收束，皆不符此「進一步補充」之遞進語氣</div>"}, {"a": "in", "o": ["on", "by", "at", "in"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>result in「導致、造成」固定片語動詞，後接 the production of a new product</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>產品創新「導致」新產品問世</div><div class=\"why\">✗ result on/by/at 皆非慣用，唯 result in 表「導致結果」</div>"}, {"a": "efficiency", "o": ["altitude", "qualification", "revenue", "efficiency"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>increase the efficiency of「提高...的效率」，efficiency 與 increase 搭配</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>流程創新提升既有產品「生產方法的效率」</div><div class=\"why\">✗ altitude 高度、qualification 資格、revenue 收入，皆不符「提升生產效率」之意</div>"}], "pg": 212, "day": 58, "done": false}, {"id": "080543", "t": "Durham University Sailing Boat Club(達勒姆大學帆船俱樂部)", "k": "d", "parts": ["Durham University Sailing club was ", "founded", " by Malcolm Dodds in1966. We have ", "grown", " a lot since then and now our members take part in team racing, fleet racing, match racing and yachting events around the country. We have a jet ", "flight", " of eleven Fireflies and sail at Derwent Reservoir, which is about a 30-minute drive from Durham. Any Durham University students can join the sailing club, and while most of the sailing that we currently do is racing, there are other opportunities too, for example, ", "enjoying", " the sunshine in one of our summer sailing sessions. It is always possible to come along to one of our sailing socials whether you are part of the team or not and if you would like to do some sailing while at Durham then it couldn't be easier. found founded was_founded has_founded"], "blanks": [{"a": "founded", "o": ["found", "founded"], "why": "<div class=\"reason\"><span class=\"tag t-tense\">時態</span>was ___ by Malcolm Dodds in 1966，被動語態需過去分詞 founded（was founded「被創立」）</div><div class=\"reason\"><span class=\"tag t-coll\">搭配</span>be founded by sb「由某人創立」固定被動搭配</div><div class=\"why\">✗ found 為原形/或「發現」的原形，無法構成 was + 過去分詞的被動，唯 founded 正確</div>"}, {"a": "grown", "o": ["grow", "growing", "grown"], "why": "<div class=\"reason\"><span class=\"tag t-tense\">時態</span>have ___ a lot，現在完成式需過去分詞 grown（grow-grew-grown）</div><div class=\"reason\"><span class=\"tag t-coll\">搭配</span>have grown a lot since then「自那時起成長許多」</div><div class=\"why\">✗ grow 原形、growing 現在分詞，皆不能接在 have 之後構成完成式</div>"}, {"a": "flight", "o": ["passage", "lag", "delay", "flight"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>a flight of「一隊/一群」，a flight of eleven Fireflies「十一艘 Firefly 帆船隊」（Firefly 為船型）</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>下文 sail at Reservoir，指俱樂部擁有的船隊</div><div class=\"why\">✗ passage 通道、lag 延遲、delay 延誤，皆不符「一隊帆船」的集合量詞之意</div>"}, {"a": "enjoying", "o": ["enjoy", "enjoyed", "enjoying"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>for example, ___ the sunshine，與前文舉例並列，動名詞 enjoying 作 opportunities 的同位舉例</div><div class=\"reason\"><span class=\"tag t-tense\">時態</span>舉例的活動用 -ing 動名詞 enjoying</div><div class=\"why\">✗ enjoy 原形、enjoyed 過去式，皆不符 for example 後接動名詞舉例的結構</div>"}], "pg": 213, "day": 58, "done": false}, {"id": "080544", "t": "Brain Bus", "k": "d", "parts": ["Why does the smell of cut grass remind you of summer? How can you measure your nerve endings with a paper fastener? And how can you create the sound of church bells with just a serving spoon and a piece of string ...? These ", "fascinating", " questions and more will be revealed by University of Manchester scientists when they take to the road on their 'Brain Bus'. The bus is taking hands-on ", "activities", " to test the senses to the suburbs, to show young and old alike how the brain works and how science can answer some of life's most captivating questions. Organizer Dr Stuart Allan, lecturer at the Faculty of Life Sciences, explains: \"Three-year-olds and upwards can understand the senses and it's an area that is ", "intriguing", " to all ages.\" It takes effort to get out of bed on a Saturday morning and go to the Museum. We are bringing science to your doorstep and going further afield this year in the hope of finding new and different ", "audiences", ". audiences . \"We want people to see that science is interesting as well as important in our lives, and to ", "encourage", " people who may not consider it possible to go to University.' activities images facets revenues misleading disproportionate intriguing proximal groups mobs auditors audiences"], "blanks": [{"a": "fascinating", "o": ["fascinating", "unattended", "gratuitous", "underlying"], "why": "<div class=\"reason\"><span class=\"tag t-sem\">語意</span>These ___ questions and more will be revealed，呼應後文 intriguing/captivating，指「引人入勝的」問題</div><div class=\"reason\"><span class=\"tag t-pos\">詞性</span>修飾 questions 的形容詞</div><div class=\"why\">✗ unattended 無人理會、gratuitous 無端、underlying 潛在，皆不符「迷人有趣的問題」之意</div>"}, {"a": "activities", "o": ["activities", "images", "facets", "revenues"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span> Street financiers caused the situation to spiral out of control, and traders and investors who made extravagant bets without ", "understanding", " the"], "blanks": [{"a": "explanations", "o": ["explanations", "confusions", "mysteries", "assumptions"], "why": "<div class=\"reason\"><span class=\"tag t-sem\">語意</span>two main explanations as to why（解釋為何...的兩大說法）</div><div class=\"reason\"><span class=\"tag t-coll\">搭配</span>explanations as to why 慣用搭配</div><div class=\"why\">✗ confusions/mysteries/assumptions 與「對原因提出的解釋」語意不合</div>"}, {"a": "function", "o": ["failures", "function", "malfunctions", "decorations"], "why": "<div class=\"reason\"><span class=\"tag t-tense\">時態</span>did not ___ as they should，助動詞 did 後接原形動詞 function</div><div class=\"reason\"><span class=\"tag t-coll\">搭配</span>function as（發揮...功能）固定搭配</div><div class=\"why\">✗ failures/malfunctions/decorations 為名詞，無法接在 did not 之後作動詞</div>"}, {"a": "incompetence", "o": ["incompetence", "skill", "proficiency", "expertise"], "why": "<div class=\"reason\"><span class=\"tag t-sem\">語意</span>下文 disastrous decisions、out of control，指金融家的「無能」</div><div class=\"why\">✗ skill/proficiency/expertise 皆正面，與導致失控災難的負面語境相反</div>"}, {"a": "understanding", "o": ["misunderstanding", "ignorance", "understanding", "confusion"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>without understanding the ...（不了解...就下注）固定搭配</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>亂下注是因「不了解」風險，without 已含否定不需再用負面詞</div><div class=\"why\">✗ misunderstanding/ignorance/confusion 與 without 連用會語意疊加雙重否定，邏輯不順；understanding 才通順</div>"}], "pg": 143, "day": 67, "done": true}, {"id": "080350", "t": "Mass Extinction (大規模滅絕)", "k": "d", "parts": ["Scientists have discovered the cause of the mass extinction of undersea marine life 800,000 years ago Scientists have discovered the cause of the mass extinction of undersea marine life 800,000 years ago and it's shedding light on how climate change is affecting on deep ocean biota. In a new study ", "published", " in the journal Nature Communications, scientists have found a link between the number of published in the journal Nature Communications, scientists have found a link between the number of foraminifera and the mass extinction. This finding was ", "previously", " unknown. it is now certain that the ", "causes", " of the mass extinction was not climate change. ", "Instead", " , they have found that the extinction causes of the mass extinction was not climate change. Instead , they have found that the extinction was caused by global changes brought about by a decrease in the amount of plankton on the surface causes results effects outcomes Likewise Similarly Instead Together"], "blanks": [{"a": "published", "o": ["published", "hidden", "erased", "ignored"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>a study published in the journal（發表於期刊的研究）固定搭配</div><div class=\"reason\"><span class=\"tag t-pos\">詞性</span>過去分詞修飾 study</div><div class=\"why\">✗ hidden/erased/ignored 與「發表於 Nature Communications 期刊」的語意相反</div>"}, {"a": "previously", "o": ["recently", "previously", "suddenly", "never"], "why": "<div class=\"reason\"><span class=\"tag t-sem\">語意</span>previously unknown（先前未知），指這項發現過去不為人知</div><div class=\"why\">✗ recently/suddenly/never 與「先前未知、如今才發現」的時間對比不合</div>"}, {"a": "causes", "o": ["causes", "results", "effects", "outcomes"], "why": "<div class=\"reason\"><span class=\"tag t-sem\">語意</span>the causes of the mass extinction（大滅絕的原因）</div><div class=\"reason\"><span class=\"tag t-num\">單複數</span>後接動詞 was，但慣用 the causes ... was not climate change 指成因</div><div class=\"why\">✗ results/effects/outcomes 表「結果」，但氣候變遷與否討論的是滅絕的「成因」</div>"}, {"a": "Instead", "o": ["Likewise", "Similarly", "Instead", "Together"], "why": "<div class=\"reason\"><span class=\"tag t-sem\">語意</span>前句否定氣候變遷是主因，Instead（取而代之）引出真正成因，表對比</div><div class=\"why\">✗ Likewise/Similarly/Together 表類同並列，無法表達「不是A，而是B」的轉折</div>"}], "pg": 144, "day": 67, "done": true}, {"id": "110003", "t": "Australia and New Zealand (澳大利亞和新西蘭)", "k": "dd", "parts": ["Australia and New Zealand have many common links. Both countries were recently settled by Europeans, are predominantly English speaking and in that sense, share a common cultural ", "heritage", ". Although in close proximity to one another, both countries are geographically isolated and have small populations by world ", "standards", ". They have similar histories and enjoy close relations on many fronts. In terms of population ", "characteristics", ", Australia and New Zealand have much in common. Both countries have minority indigenous populations, and during the latter half of the 20th century have seen a steady stream of migrants from a variety of regions throughout the world. Both countries have ", "experienced", " similar declines in fertility since the high levels recorded during the baby boom, and alongside this have enjoyed the benefits of continually improving life expectancy. One consequence of these trends is that both countries are faced with an ageing population, and the ", "associated", " challenge of providing appropriate care and support for this growing group within the community."], "opts": ["heritage", "associated", "observer", "limitation", "characteristics", "experimented", "history", "experienced", "standards", "association", "personaility"], "pg": 11, "day": 67, "done": true}, {"id": "110005", "t": "The logic of Scientific method (科學方法的邏輯)", "k": "dd", "parts": ["The logic of the scientific method was set out by John Stuart Mill in 1843 and was named the method of difference. A simple example of what he meant by this is to take two glasses of water which are ", "identical", " in every respect. Introduce a few drops of ink into one of these glasses. The water changes colour! According to Mills method of difference it is safe to assume that the change in the colour of the water is due to the ", "introduction", " of a new factor - the ", "independent", " variable -in this case, the ink."], "opts": ["identical", "introduction", "similar", "divide", "independent", "exploration"], "pg": 12, "day": 68, "done": true}, {"id": "110006", "t": "Exponential growth of the Internet (互聯網的指數級增長)", "k": "dd", "parts": ["The exponential growth of the Internet was ", "heralded", ", in the 1990s, as revolutionizing the production and ", "dissemination", " of information. Some people saw the Internet as a means of ", "democratizing", " access to knowledge. For people ", "concerned", " about African development, it seemed to offer the possibility of leapfrogging over the technology gap ", "separating", " Africa from advanced industrialized countries."], "opts": ["separating", "democratizing", "concerned", "heralded", "concerning", "dissemination", "propaganda", "separate", "approaching"], "pg": 12, "day": 68, "done": true}, {"id": "110007", "t": "Teenage daughter (十幾歲的女兒)", "k": "dd", "parts": ["Your teenage daughter gets top marks in school, captains the debate team, and volunteers at a shelter for homeless people. But while driving the family car, she text-messages her best friend and rear-ends another vehicle. How can teens be so clever, accomplished, and responsible—and reckless ", "at the same time", "? Easily, according to two physicians at Children’s Hospital Boston and Harvard Medical School (HMS) who have been ", "exploring", " the unique structure and chemistry of the adolescent brain. “The teenage brain is not just an adult brain with fewer miles on it,” says Frances E. Jensen, a professor of neurology. “It’s a paradoxical time of ", "development", ". These are people with very ", "sharp", " brains, but they’re not quite sure what to do with them.”"], "opts": ["development", "growing", "dull", "respectively", "exploring", "sharp", "explored", "special", "at the same time", "adult"], "pg": 12, "day": 69, "done": true}, {"id": "110011", "t": "Volcanoes (火山)", "k": "dd", "parts": ["Volcanoes blast more than 100 million tons of carbon dioxide into the atmosphere every year but the gas is usually ", "harmless", ". When a volcano erupts, carbon dioxide spreads out into the atmosphere and isn't ", "concentrated", " in one spot. But sometimes the gas gets trapped ", "underground", " under enormous pressure. If it escapes to the surface in a dense ", "cloud", ", it can push out oxygen-rich air and become deadly."], "opts": ["cloud", "underground", "concentrated", "harmful", "undercover", "atmosphere", "air", "harmless", "condensed"], "pg": 13, "day": 69, "done": true}, {"id": "110057", "t": "The wholeness of thought (思想的完整性)", "k": "dd", "parts": ["The writer-or, for that matter, the speaker conceives his thought whole, as a unity, but must express it in a line of words; the reader- or listener-must take this line of symbols and from it ", "reconstruct", " the original wholeness of thought. There is ", "little", " difficulty in conversation, because the listener receives innumerable cues from the physical expressions of the speaker; there is a dialogue, and the listener can ", "cut in", " at any time. The advantage of group discussion is that people can overcome linear sequence of words by ", "converging", " on ideas from different directions; which makes for wholeness of thought. But the reader is confronted by line upon line of printed symbols, without benefits of physical ", "tone", " and emphasis or the possibility of dialogue or discussion."], "opts": ["cut in", "tone", "converging", "revive", "emerging", "reconstruct", "little", "few", "cut off", "intonation"], "pg": 25, "day": 70, "done": true}, {"id": "110076", "t": "Fingerprint (指紋)", "k": "dd", "parts": ["Fingerprints, referred to as “fingermarks” in forensics, are formed when residue from the ridged skin of the fingers or palms is ", "transferred", " onto a surface, leaving behind an impression. Fingermarks are often made of sweat and colorless ", "contaminating", " materials such as soap, moisturizer and grease. These fingermarks are described as “latent” as they are generally invisible to the naked eye, which means that ", "locating", " them at a crime scene can be challenging."], "opts": ["copying", "identify", "contamination", "contaminating", "locating", "transferred"], "pg": 30, "day": 70, "done": true}, {"id": "110090", "t": "Rudman (魯德曼)", "k": "dd", "parts": ["Rudman looks at how a poor understanding of Maths has led historians to false conclusions about the Mathematical sophistication of early societies. Rudman’s final observation – that ancient Greece ", "enjoyed", " unrivalled progress in the subject while ", "failing", " to teach it at school – leads to a ", "radical", " punchline: Mathematics could be better learned after we ", "leave", " school."], "opts": ["leave", "radical", "failing", "enjoyed", "attending", "enter", "deferred", "pleasant"], "pg": 33, "day": 71, "done": true}, {"id": "110122", "t": "Walt Disney World (華特迪士尼世界)", "k": "dd", "parts": ["Walt Disney World has become a pilgrimage site partly because of the luminosity of its cross culture and marketing and partly because its ", "utopian", " aspects appeal powerfully to real needs in the capitalist ", "society", ". Disney’s marketing is unique because it captured the symbolic essence of ", "childhood", " but the company has gained access to all public shows, comic books, dolls, apparels, and ", "educational", " film strips all point to the parks and each other."], "opts": ["utopian", "realistic", "society", "educational", "corporation", "illusion", "childhood", "adults"], "pg": 41, "day": 71, "done": true}, {"id": "110130", "t": "Genetically modified corn (轉基因玉米)", "k": "dd", "parts": ["Almost no one regards corn with suspicion. But the ", "same", " can’t be said for humans’ ingenious ability to engineer the plants we eat. Genetically modified (GM) crops are viewed with ", "such", " hostility that they are barely grown in Europe. However, a new study by an independent group of scientists, who have done the most comprehensive ", "review", " of the evidence so far, shows that our aversion to GM food is pointless, ", "unscientific", " and harmful to farmers."], "opts": ["such", "similar", "same", "idea", "review", "unscientific", "trustworthy", "profound"], "pg": 43, "day": 72, "done": true}, {"id": "110171", "t": "Smarter organism(聰明的生物體)", "k": "dd", "parts": ["Some of the most basic organisms are smarter than we thought. Rather than moving about randomly, amoebas and plankton employ sophisticated ", "strategies", " to look for food and might travel in a way that ", "optimizes", " their foraging. Immediately after an amoeba turned right, it was twice as likely to turn left as right again, and vice versa, they told a meeting of the American Physical Society meeting in Denver, Colorado, last week. This suggests that the cells have a rudimentary ", "memory", ", being able to remember the last direction they had just turned in."], "opts": ["thought", "optimizes", "memory", "experience", "polishes", "strategies"], "pg": 51, "day": 72, "done": true}, {"id": "110173", "t": "City Design(城市設計)", "k": "dd", "parts": ["The way we design our cities needs a serious rethink. After thousands of years of progress in urban development, we ", "plateaued", " some 60 years ago. Cities are not safer, healthier, more efficient, or more ", "equitable", ". They are getting worse on these measures. The statistics on chronic disease, rising road tolls and congestion in our urban environments paint a ", "bleak", " future. The clues to why lie in how we think about and design our cities."], "opts": ["broad", "equitable", "plateaued", "recovered", "bleak", "retarded"], "pg": 52, "day": 73, "done": true}, {"id": "110188", "t": "Low Fertility(低生育率)", "k": "dd", "parts": ["Low fertility is a concern for many OECD countries as they face the prospect of population aging. This article makes ", "comparisons", " between Australia and seven other OECD countries in fertility rates between 1970 and 2004. Changing age ", "patterns", " of fertility are also compared and show that for most of the countries, women are ", "postponing", " childbirth and having fewer babies. The ", "associations", " of women's education levels and rates of employment with fertility are also ", "explored", "."], "opts": ["sense", "patterns", "postponing", "associations", "comparisons", "gaps", "accelerating", "explored", "comparable"], "pg": 55, "day": 73, "done": true}, {"id": "110196", "t": "An Artist's Life(藝術家的生活)", "k": "dd", "parts": ["The ", "closing", " decades of an artist's life do not generally make the biographer's heart beat faster, but Claude Monet is one of a handful of painters who bucks the pattern of an ", "irrelevant", " old age. While it's true that by the time he was 73 he had ", "accumulated", " all the usual dragging baggage - ", "outhouses", " full of fancy cars, a taste for expensive wine and a sprawl of dependents – it was also now that he produced career-defining work."], "opts": ["closing", "irrelevant", "possessions", "outhouses", "gathered", "accumulated", "final", "unimportant"], "pg": 57, "day": 74, "done": true}, {"id": "110201", "t": "Botswana(博茨瓦納)", "k": "dd", "parts": ["Although Botswana is rich in diamonds, it has high unemployment and stratified socioeconomic classes. In 1999, the nation ", "suffered", " its first budget deficit in 16 years ", "because", " of a slump in the international diamond market. Yet Botswana ", "remains", " one of the wealthiest and most stable countries on the African ", "continent", "."], "opts": ["because", "remains", "stays", "endured", "continent", "suffered", "region", "due"], "pg": 58, "day": 74, "done": true}, {"id": "110202", "t": "Desert(沙漠)", "k": "dd", "parts": ["Wind-blown ", "grains", " of sand from dunes may carry far inland, covering fields and diverting streams. More seriously, drifting sands can bury whole buildings and transform ", "fertile", " land into desert. However, dunes can be made more stable by the artificial ", "planting", " of marram grass, a plant so robust that it can find ", "nourishment", " even in sand. The grass spreads over the ", "surface", " of the dune, protecting it against wind, while its roots bind the sand together."], "opts": ["sustenance", "surface", "nourishment", "fertile", "grains", "productive", "planting", "seeding", "particles", "layer"], "pg": 58, "day": 75, "done": true}, {"id": "110206", "t": "Quake-resistant Structures(抗震結構)", "k": "dd", "parts": ["In the past, making structures quake-resistant meant firm yet ", "flexible", " materials, such as steel and wood, that bend without breaking. Later, people tried to lift a building off its foundation, and insert rubber and steel between the building and its foundation to ", "reduce", " the impact of ground vibrations. The most ", "recent", " designs give buildings brains as well as concrete and steel supports, called smart buildings, the structures respond like living organisms to an earthquake's vibrations. When ground shakes and the building tips forward, the computer would ", "force", " the building to shift in the opposite direction. The new designs should offer even greater ", "security", " to cities where earthquakes often take place."], "opts": ["flexible", "secure", "lessen", "recent", "latest", "adaptable", "reduce", "force", "compel", "security"], "pg": 59, "day": 75, "done": true}];

function seg(id, set) {
  document.querySelectorAll('#' + id + ' button').forEach(b => b.onclick = () => {
    document.querySelectorAll('#' + id + ' button').forEach(x => x.classList.toggle('on', x === b)); set(b.dataset.v); renderList();

}

  const L = Q.filter(q => (fk === 'all' || q.k === fk) && (fs === 'all' || status(q) === fs) && (!s || q.t.toLowerCase().includes(s) || q.id.includes(s)));
  document.getElementById('stat').textContent = `${L.length} 篇 · 做過 ${Q.filter(q => rec[q.id]).length}／${Q.length}`;
  document.getElementById('list').innerHTML = L.map(q => `<div class="row" onclick="location.hash='${q.id}'">${kindTag(q)}<span class="id">#${q.id}</span><span class="t">${esc(q.t)}${q.done ? ' <span class="hint">（練過）</span>' : ''}</span>${q.day ? `<span class="day">D${q.day}</span>` : ''}${badge(q)}</div>`).join('');
}

// ---------- 作答 ----------
let cur = null, fill = [], act = -1, checked = false, revealing = false, t0 = 0, tick = null;
function open(q) {
  cur = q; checked = false; act = -1; fill = Array(q.parts.length >> 1).fill(null);
  document.getElementById('home').style.display = 'none'; document.getElementById('view').style.display = 'block';
  document.getElementById('vk').outerHTML = kindTag(q).replace('class="kind', 'id="vk" class="kind');
  document.getElementById('vt').textContent = q.t;
  document.getElementById('vid').textContent = '#' + q.id + ' · PDF p' + q.pg;
  document.getElementById('vday').textContent = q.day ? '菜單 D' + q.day : '';
  const r = rec[q.id];
  document.getElementById('vhint').textContent = (q.k === 'dd' ? '點空格 → 點下面的字（或直接把字拖進空格）；點已填的空格可清掉。' : '每格從下拉選單選一個。') + (r ? `　上次：${r.date} 錯 ${r.wrong.length}／${r.total}` : '');
  draw(); scrollTo(0, 0);
  t0 = Date.now(); clearInterval(tick); tick = setInterval(() => {
    if (checked) return; const s = Math.floor((Date.now() - t0) / 1000);
    document.getElementById('timer').textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  }, 1000);
}
function draw() {
  const q = cur; let h = '';
  q.parts.forEach((p, j) => {
    if (j % 2 === 0) { h += esc(p); return; }
    const b = j >> 1, res = checked ? (fill[b] === ans(b) ? ' ok-b' : ' ng-b') : '';
    const fix = checked && fill[b] !== ans(b) ? `<span class="fix">→ ${esc(ans(b))}</span>` : '';
    if (q.k === 'd') {
      h += `<span class="bno">${b + 1}</span><select class="bk${res}" ${checked ? 'disabled' : ''} onchange="fill[${b}]=this.value||null"><option value="">　—　</option>${q.blanks[b].o.map(o => `<option${fill[b] === o ? ' selected' : ''}>${esc(o)}</option>`).join('')}</select>${fix}`;
    } else {
      const f = fill[b] !== null ? esc(q.opts[fill[b]]) : '&nbsp;';
      h += `<span class="bno">${b + 1}</span><span class="slot${fill[b] !== null ? ' filled' : ''}${act === b ? ' act' : ''}${res}" data-b="${b}" onclick="slotClick(${b})" ondragover="event.preventDefault();this.classList.add('over')" ondragleave="this.classList.remove('over')" ondrop="dropOn(event,${b})">${f}</span>${fix}`;
    }
  });
  document.getElementById('psg').innerHTML = h;
  const bank = document.getElementById('bank');
  if (q.k === 'dd') {
    bank.style.display = 'flex';
    bank.innerHTML = q.opts.map((o, k) => { const used = fill.includes(k); return `<span class="chip${used ? ' used' : ''}" draggable="${!used && !checked}" ondragstart="event.dataTransfer.setData('text/plain','${k}')" onclick="chipClick(${k})">${esc(o)}</span>`; }).join('');
  } else bank.style.display = 'none';
  if (!checked) { document.getElementById('score').textContent = ''; document.getElementById('why').classList.remove('show'); }
}
function ans(b) { return cur.k === 'd' ? cur.blanks[b].a : cur.parts[2 * b + 1]; }
function given(b) { return cur.k === 'd' ? fill[b] : (fill[b] === null ? null : cur.opts[fill[b]]); }
function slotClick(b) {
  if (checked) return;
  if (fill[b] !== null) { fill[b] = null; act = b; } else act = act === b ? -1 : b;
  draw();
}
function chipClick(k) {
  if (checked || fill.includes(k)) return;
  let b = act >= 0 ? act : fill.indexOf(null); if (b < 0) return;
  fill[b] = k; const nx = fill.indexOf(null); act = nx; draw();
}
function dropOn(e, b) { e.preventDefault(); if (checked) return; const k = +e.dataTransfer.getData('text/plain'); const old = fill.indexOf(k); if (old >= 0) fill[old] = null; fill[b] = k; act = fill.indexOf(null); draw(); }
function check() {
  if (checked) return;
  const q = cur, n = fill.length;
  const g = Array.from({length: n}, (_, b) => given(b));   // 下拉存字串、拖拉存選項序號 → 一律換成字串比對
  if (!revealing && g.some(x => x === null) && !confirm('還有空格沒填，要直接對答案嗎？')) return;
  checked = true;
  const wrong = []; for (let b = 0; b < n; b++) if (g[b] !== ans(b)) wrong.push(b);
  const d = new Date(), sec = Math.floor((Date.now() - t0) / 1000);
  rec[q.id] = {date: (d.getMonth() + 1) + '/' + d.getDate(), wrong, total: n, sec, tries: ((rec[q.id] || {}).tries || 0) + 1};
  save();
  drawChecked(g, wrong, sec);
}
function drawChecked(g, wrong, sec) {
  const q = cur, n = g.length;
  let h = '';
  q.parts.forEach((p, j) => {
    if (j % 2 === 0) { h += esc(p); return; }
    const b = j >> 1, ok = g[b] === ans(b);
    h += `<span class="bno">${b + 1}</span><span class="slot filled ${ok ? 'ok-b' : 'ng-b'}">${g[b] === null ? '&nbsp;' : esc(g[b])}</span>${ok ? '' : `<span class="fix">→ ${esc(ans(b))}</span>`}`;
  });
  document.getElementById('psg').innerHTML = h;
  document.getElementById('bank').style.display = 'none';
  document.getElementById('score').innerHTML = (wrong.length ? `❌ 錯 ${wrong.length}／${n}` : `✅ 全對 ${n}／${n}`) + `<span class="hint">　用時 ${Math.floor(sec / 60)} 分 ${sec % 60} 秒</span>`;
  const w = document.getElementById('why');
  w.innerHTML = Array.from({length: n}, (_, b) => {
    const ok = g[b] === ans(b);
    const opts = q.k === 'd' ? q.blanks[b].o.join(' / ') : '';
    const why = q.k === 'd' ? q.blanks[b].why : '';
    return `<div class="wb"><div class="h">空格 ${b + 1}　<span class="a">${esc(ans(b))}</span>${ok ? ' ✓' : `<span class="u">${g[b] === null ? '（沒填）' : esc(g[b])}</span>`}</div>${opts ? `<div class="o">${esc(opts)}</div>` : ''}${why}</div>`;
  }).join('') + (q.k === 'dd' ? `<div class="wb"><div class="o">選項庫：${esc(q.opts.join(' / '))}</div></div>` : '');
  w.classList.add('show');
}
function reveal() {
  if (checked) return;
  if (!confirm('直接看答案會記成這篇全錯，確定？')) return;
  fill = fill.map(() => null); revealing = true; check(); revealing = false;
}
function retry() { open(byId[cur.id]); }
function go(dx) { const i = cur.i + dx; if (i >= 0 && i < Q.length) location.hash = Q[i].id; }
function route() {
  const h = decodeURIComponent(location.hash.slice(1)).replace(/^#/, '');
  if (byId[h]) open(byId[h]);
  else { clearInterval(tick); document.getElementById('view').style.display = 'none'; document.getElementById('home').style.display = 'block'; renderList(); }
}
window.addEventListener('hashchange', route);
route();
</script>
</body>

<script>
const Q = [{"id": "080001", "t": "Oxford medical school (牛津醫學院)", "k": "d", "parts": ["\"When I enrolled in my master's course at Oxford last year, I had come straight from medical school with the decision to leave clinical science for good. Thinking back, I realize that I didn't put very much ", "weight", " on this decision at the time. But today, I more clearly understand the ", "consequences", " of leaving my original profession. When I meet old friends who are now physicians and surgeons, I sense how our views on medical problems have ", "diverged", " . They scrutinize the effects of disease and try to eliminate or alleviate them; I try to understand how they come about in the first place. I feel happier working on this side of the problem, although I do occasionally miss clinical work and seeing patients. However, when I think about the rate at which my medical skills and knowledge have ", "dissipated", " , the years spent reading weighty medical textbooks, the hours spent at the bedside, I sometimes wonder if these years were partly a ", "waste", " of time now that I am pursuing a research career. Nonetheless, I know the value of my medical education. It is easy to forget the importance of the biosciences when working with model organisms in basic research that seem to have nothing to do with a sick child or a suffering elderly person. Yet, I still have vivid memories of the cruel kaleidoscope of severe diseases and of how they can ", "strike", " a human being. I hope to retain these memories as a guide in my current occupation.\""], "blanks": [{"a": "weight", "o": ["attention", "weight", "significance", "consideration"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>put weight on something＝看重某事，是固定搭配（put much weight on this decision）</div><div class=\"why\">✗ put attention/significance/consideration on 都不是道地搭配；put weight on 才慣用</div>"}, {"a": "consequences", "o": ["impacts", "meaning", "consequences", "influences"], "why": "<div class=\"reason\"><span class=\"tag t-sem\">語意</span>下文 leaving my original profession（離開原本職業）帶來的「後果」，consequences 最貼切</div><div class=\"reason\"><span class=\"tag t-coll\">搭配</span>the consequences of＝…的後果，常見搭配</div><div class=\"why\">✗ impacts/influences 偏中性影響、meaning 意義 語氣不合；consequences 才扣住「離職的代價」</div>"}, {"a": "diverged", "o": ["moved", "fluctuated", "diverged", "run"], "why": "<div class=\"reason\"><span class=\"tag t-sem\">語意</span>對比「他們研究疾病、我研究成因」，views have diverged＝看法分歧最貼切</div><div class=\"why\">✗ moved/run 太籠統、fluctuated（上下波動）不合「分道揚鑣」之意</div>"}, {"a": "dissipated", "o": ["managed", "accumulated", "dissipated", "developed"], "why": "<div class=\"reason\"><span class=\"tag t-sem\">語意</span>下文 wonder if these years were a waste（懷疑白費），技能 dissipated＝逐漸消散最合</div><div class=\"why\">✗ accumulated（累積）、developed（發展）方向相反；managed 語意不通</div>"}, {"a": "waste", "o": ["period", "waste", "number", "lot"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>a waste of time＝浪費時間，固定片語，由 of time 鎖定</div><div class=\"why\">✗ a period/number/lot of time 文法都通，但下文 wonder if...partly（懷疑是否白費）需貶意，只有 waste 表否定評價</div>"}, {"a": "strike", "o": ["strike", "end", "kill", "affect"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>strike a human being＝（疾病）侵襲人，是疾病主詞的慣用動詞，呼應前文 strike a human being</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>形容 severe diseases（重病）如何「打擊」人體，strike 最有力</div><div class=\"why\">✗ end/kill 太極端絕對、affect 太弱；strike 才貼「重病突然侵襲」的畫面</div>"}], "pg": 17, "day": 1, "done": false}, {"id": "080003", "t": "Push and pull factors (推動和拉動因素)", "k": "d", "parts": ["People move to a new region for many different reasons. The ", "motivation", " for moving can come from a People move to a new region for many different reasons. The motivation for moving can come from a combination of what researchers sometimes call 'push and pull factors' – those that encourage people to leave a region, and those that attract people to a region. Some of the factors that motivate people to leave a region, and those that attract people to a region. Some of the factors that motivate people to move ", "include", " seeking a better climate, finding more affordable housing, looking for work or retiring from work, leaving the ", "congestion", " of city living, wanting a more pleasant environment, and wanting to from work, leaving the congestion of city living, wanting a more pleasant environment, and wanting to be near to family and friends. In reality, many complex ", "factors", " and personal reasons may ", "interact", " to motivate a person or family to move. motivate a person or family to move. motivation solution energy courage include including includes included congestion transportation environment construction"], "blanks": [{"a": "motivation", "o": ["motivation", "solution", "energy", "courage"], "why": "<div class=\"reason\"><span class=\"tag t-pos\">詞性</span>The ___ for moving，定冠詞後接名詞作主詞</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>全文談「搬遷的動機（push and pull factors）」，motivation 扣題</div><div class=\"why\">✗ solution 解答、energy 能量、courage 勇氣 語意都不合「搬家的動機」</div>"}, {"a": "include", "o": ["include", "including", "includes", "included"], "why": "<div class=\"reason\"><span class=\"tag t-num\">單複數</span>主詞 the factors（複數）需動詞原形 include，主謂一致</div><div class=\"reason\"><span class=\"tag t-tense\">時態</span>陳述普遍事實用現在式，且非分詞片語，故用 include 而非 including/included</div><div class=\"why\">✗ includes 是第三人稱單數、不合複數主詞；including/included 為分詞，無法當主要動詞</div>"}, {"a": "congestion", "o": ["congestion", "transportation", "environment", "construction"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>the congestion of city living＝都市生活的壅塞，leaving 的受詞</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>與 leaving（離開）相配，人們想逃離都市壅塞</div><div class=\"why\">✗ transportation 運輸、construction 建設 非人們想離開的負面項；environment 中性，下文另有 pleasant environment</div>"}, {"a": "factors", "o": ["attributes", "factors", "influences", "ratios"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>呼應全文 push and pull factors，many complex factors＝許多複雜因素</div><div class=\"why\">✗ attributes 屬性、influences 影響、ratios 比例 都不及 factors 扣住主題</div>"}, {"a": "interact", "o": ["interact", "interacted", "complicate", "disorder"], "why": "<div class=\"reason\"><span class=\"tag t-tense\">時態</span>may ___ 助動詞 may 後接原形動詞，interact 為原形</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>many factors may interact＝諸多因素可能交互作用</div><div class=\"why\">✗ interacted 為過去式不接在 may 後；complicate/disorder 語意不合「交互作用」</div>"}], "pg": 18, "day": 1, "done": false}, {"id": "080008", "t": "The United Nations (聯合國)", "k": "d", "parts": ["The United Nations is an international organization founded in 1945. Due to its unique international character, and the powers vested in its founding Charter, the organization can take ", "action", " on a wide character, and the powers vested in its founding Charter, the organization can take action on a wide range of issues and provide a forum for its 193 Member States to ", "express", " their views, through the General Assembly, the Security Council, the Economic and Social Council and other bodies and General Assembly, the Security Council, the Economic and Social Council and other bodies and committees. The work of the United Nations reaches every ", "corner", " of the globe. Although best known for peacekeeping, peacebuilding, conflict ", "prevention", " and humanitarian assistance, there are many for peacekeeping, peacebuilding, conflict prevention and humanitarian assistance, there are many other ways the United Nations and its System (specialized agencies, funds and programmes) affect our lives and make the world a better place. lives and make the world a better place. picture define express sketch angle corner hole spot ban prohibition prevention disallowance"], "blanks": [{"a": "action", "o": ["responsibility", "motion", "action", "decision"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>take action＝採取行動，固定搭配（can take ___ on a wide range of issues）</div><div class=\"why\">✗ take responsibility/motion/decision 雖有 take＋名詞，但 take action on issues 才道地，語意也最合「對議題行動」</div>"}, {"a": "express", "o": ["picture", "define", "express", "sketch"], "why": "<div class=\"reason\"><span class=\"tag t-tense\">時態</span>to ___ their views，to 後接原形動詞，express 為動詞原形</div><div class=\"reason\"><span class=\"tag t-coll\">搭配</span>express views＝表達看法，固定搭配</div><div class=\"why\">✗ picture/sketch 是描繪、define 是定義，皆不搭 views；express their views 才慣用</div>"}, {"a": "corner", "o": ["angle", "corner", "hole", "spot"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>every corner of the globe＝世界每個角落，固定片語</div><div class=\"why\">✗ angle 角度、hole 洞、spot 點 都無法構成 every ___ of the globe 這個慣用語</div>"}, {"a": "prevention", "o": ["ban", "prohibition", "prevention", "disallowance"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>conflict prevention＝衝突預防，是聯合國語境固定詞組</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>與 peacekeeping、peacebuilding 並列的維和工作</div><div class=\"why\">✗ ban/prohibition/disallowance（禁止）都偏「明令禁止」，不及 conflict prevention 指「預防衝突」</div>"}], "pg": 20, "day": 1, "done": false}, {"id": "080010", "t": "Allergies (過敏)", "k": "d", "parts": ["Allergies are abnormal immune system reactions to things that are typically harmless to most people. Allergies are abnormal immune system reactions to things that are typically harmless to most people. When you’re allergic to something, your immune system ", "mistakenly", " believes that this substance is harmful to your body. Substances that cause allergic reactions — such as certain foods, dust, plant harmful to your body. Substances that cause allergic reactions — such as certain foods, dust, plant pollen, or medicines — are known as allergens. In an attempt to ", "protect", " the body, the immune system produces IgE antibodies to that allergen. Those antibodies then cause certain cells in the body to produces IgE antibodies to that allergen. Those antibodies then cause certain cells in the body to ", "release", " chemicals into the bloodstream, one of which is histamine. The histamine then ", "acts", " on a person's eyes, nose, throat, lungs, skin, or gastrointestinal tract and causes the symptoms of the person's eyes, nose, throat, lungs, skin, or gastrointestinal tract and causes the symptoms of the allergic reaction. Future exposure to that same allergen will trigger this antibody response again. This means that every time you come into contact with that allergen, you'll have an allergic reaction. means that every time you come into contact with that allergen, you'll have an allergic reaction. precisely illogically chaotic mistakenly prohibit protect protest preclude sponge release dispose digest"], "blanks": [{"a": "mistakenly", "o": ["precisely", "illogically", "chaotic", "mistakenly"], "why": "<div class=\"reason\"><span class=\"tag t-pos\">詞性</span>your immune system ___ believes，副詞修飾動詞 believes，mistakenly 為副詞</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>免疫系統「錯誤地」以為物質有害，mistakenly 扣 abnormal（異常反應）</div><div class=\"why\">✗ chaotic 是形容詞詞性不符；precisely（精準地）語意相反；illogically 雖是副詞但不及 mistakenly 貼「誤判」</div>"}, {"a": "protect", "o": ["prohibit", "protect", "protest", "preclude"], "why": "<div class=\"reason\"><span class=\"tag t-tense\">時態</span>In an attempt to ___ the body，to 後接原形動詞</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>免疫系統「保護」身體而產生抗體，protect the body</div><div class=\"why\">✗ prohibit 禁止、protest 抗議、preclude 排除 語意都不合「保護身體」</div>"}, {"a": "release", "o": ["sponge", "release", "dispose", "digest"], "why": "<div class=\"reason\"><span class=\"tag t-tense\">時態</span>cause certain cells to ___ chemicals，to 後接原形動詞</div><div class=\"reason\"><span class=\"tag t-coll\">搭配</span>release chemicals into the bloodstream＝把化學物質釋放進血液，固定搭配</div><div class=\"why\">✗ sponge/dispose/digest 都不搭 chemicals into the bloodstream；release 才指「釋放」</div>"}, {"a": "acts", "o": ["acts", "indulges", "pretends", "forces"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>act on＝作用於，固定搭配（histamine acts on a person&#x27;s eyes, nose...）</div><div class=\"reason\"><span class=\"tag t-num\">單複數</span>主詞 The histamine 單數，故用 acts（第三人稱單數）</div><div class=\"why\">✗ indulges/pretends/forces 都不接 on 表「作用於」；act on 才道地</div>"}], "pg": 21, "day": 1, "done": false}, {"id": "080012", "t": "What's a herbal? (什麽是草藥？)", "k": "d", "parts": ["A herbal is a book of plants, describing their appearance, their properties and how they may be used for preparing ointments and medicines. The medical use of plants is ", "recorded", " on fragments of papyrus for preparing ointments and medicines. The medical use of plants is recorded on fragments of papyrus and clay tablets from ancient Egypt, Samaria and China that date back 5,000 years but document traditions far older still. Over 700 herbal remedies were detailed in the Papyrus Ebers, an Egyptian text traditions far older still. Over 700 herbal remedies were detailed in the Papyrus Ebers, an Egyptian text written in 1500 BC. Around 65 BC, a Greek physician called Dioscorides wrote a herbal that was ", "translated", " into Latin and Arabic. Known as ‘De materia medica’, it became the most influential work translated into Latin and Arabic. Known as ‘De materia medica’, it became the most influential work on medicinal plants in both Christian and Islamic worlds until the late 17th century. An illustrated manuscript copy of the text made in Constantinople (modern-day Istanbul) ", "survives", " from the sixth manuscript copy of the text made in Constantinople (modern-day Istanbul) survives from the sixth century. The first printed herbals date from the dawn of European printing in the 1480s. They provided valuable information for apothecaries, whose job was to make the pills and potions ", "prescribed", " by valuable information for apothecaries, whose job was to make the pills and potions prescribed by physicians. In the next century, landmark herbals were produced in England by William Turner, considered to be the father of British botany, and John Gerard, whose illustrations would ", "inspire", " the considered to be the father of British botany, and John Gerard, whose illustrations would inspire the floral fabric, wallpaper and tile designs of William Morris four centuries later."], "blanks": [{"a": "recorded", "o": ["recorded", "registered", "inscribed", "subscribed"], "why": "<div class=\"reason\"><span class=\"tag t-tense\">時態</span>is ___ on fragments of papyrus 被動式，需過去分詞 recorded</div><div class=\"reason\"><span class=\"tag t-coll\">搭配</span>recorded on＝記載於，搭配書寫載體 papyrus／clay tablets</div><div class=\"why\">✗ registered 登記、subscribed 訂閱 語意不合；inscribed（鐫刻）雖近，但慣用 recorded on fragments 且 inscribed 多接硬質表面</div>"}, {"a": "translated", "o": ["imported", "translated", "interpreted", "traded"], "why": "<div class=\"reason\"><span class=\"tag t-tense\">時態</span>was ___ into Latin and Arabic 被動式，需過去分詞</div><div class=\"reason\"><span class=\"tag t-coll\">搭配</span>translated into（語言）＝翻譯成…，由 into Latin and Arabic 鎖定</div><div class=\"why\">✗ imported/traded into 語意不合；interpreted（口譯）多指即時翻譯，不接 into a language 表書面翻譯</div>"}, {"a": "survives", "o": ["compensates", "survives", "outlasts", "suffers"], "why": "<div class=\"reason\"><span class=\"tag t-sem\">語意</span>六世紀的手抄本「留存至今」，survives from the sixth century＝自六世紀存留下來</div><div class=\"reason\"><span class=\"tag t-num\">單複數</span>主詞 An illustrated manuscript copy 單數，用 survives</div><div class=\"why\">✗ compensates 補償、suffers 受苦 語意不合；outlasts 需受詞，不接 from</div>"}, {"a": "prescribed", "o": ["determined", "forced", "prescribed", "resolved"], "why": "<div class=\"reason\"><span class=\"tag t-tense\">時態</span>pills and potions ___ by physicians 被動分詞，需過去分詞</div><div class=\"reason\"><span class=\"tag t-coll\">搭配</span>prescribed by physicians＝由醫師開立（處方），藥物與醫師的固定搭配</div><div class=\"why\">✗ determined/forced/resolved by physicians 都不合「醫師開藥」；prescribe 才是「開處方」</div>"}, {"a": "inspire", "o": ["expire", "simulate", "vanish", "inspire"], "why": "<div class=\"reason\"><span class=\"tag t-sem\">語意</span>illustrations would ___ the floral fabric...designs＝插畫「啟發」了日後設計，inspire＝啟發</div><div class=\"why\">✗ expire 到期、vanish 消失 語意相反；simulate（模擬）不合「啟發後世設計」</div>"}], "pg": 21, "day": 1, "done": false}, {"id": "110009", "t": "Class Attendance (出勤)", "k": "dd", "parts": ["Because instructional methods, expected class participation, and the nature of the courses vary, no fixed number of absences is applicable to all ", "situations", ". Each ", "instructor", " is responsible for making clear to the class at the beginning of the ", "semester", " his or her policies and procedures in regard to class ", "attendance", " and the reasons for them."], "opts": ["attendance", "situations", "semester", "instructor", "regulations", "ceremony", "student", "assignment"], "pg": 13, "day": 1, "done": false}, {"id": "110013", "t": "Kathryn Mewes (凱瑟琳·梅維斯)", "k": "dd", "parts": ["Kathryn Mewes does not meet bohemian, hippy parents in her line of work. Typically one, or both, of the parents she sees work in the City of London. “Professionals seek professionals,” she says. Originally a nanny, Mewes is now a parenting consultant, advising couples privately on changing their child’s behaviour, ", "as well as", " doing corporate seminars for working parents. Her clients find they are unprepared for the chaos and unpredictability that having a child can entail. “Parents are getting older, they have been in control their ", "whole lives", " and been successful. Suddenly a baby turns up and life turns on its head.” Nicknamed the “Three-Day Nanny” ", "because of", " her pledge to fix behavioural problems in children under the age of 12 within three days, she is filming a new Channel 4 television series demonstrating her techniques. The ", "role", " of the parenting consultant – distinct from that of a nanny – has developed, she says, as people are used to buying in expertise, such as personal trainers or, in her case, parenting advice."], "opts": ["whole lives", "because", "because of", "act", "at times", "entire life", "as well as", "role", "identity"], "pg": 14, "day": 1, "done": false}, {"id": "080022", "t": "Tomb of Tutankhamun (圖坦卡蒙墓)", "k": "d", "parts": ["The last tourists may have been leaving the Valley of the Kings on the West Bank in Luxor but the area in front of the tomb of Tutankhamun remained far from deserted. Instead of the ", "tranquility", " that usually descends on the area in the evening it was a hive of activity. TV crews trailed masses of equipment, journalists milled and photographers held their cameras at the ready. The reason? For the first time since Howard Carter ", "discovered", " the tomb in 1922 the mummy of Tutankhamun was being prepared for public display. Inside the subterranean burial chamber Egypt's archaeology supremo Zahi Hawass, accompanied by four Egyptologists, two restorers and three workmen, were slowly lifting the mummy from the golden sarcophagus where it has been rested--mostly undisturbed--for more than 3,000 years. The body was then placed on a wooden stretcher and ", "transported", " to its new home, a high-tech, climate-controlled plexi-glass showcase located in the outer chamber of the tomb where, covered in linen, with only the face and feet exposed, it now greets visitors. tranquility composure kindness noisy"], "blanks": [{"a": "tranquility", "o": ["tranquility", "composure", "kindness", "noisy"], "why": "<div class=\"reason\"><span class=\"tag t-pos\">詞性</span>the ___ that usually descends，定冠詞後接名詞作主詞；noisy 為形容詞詞性不符</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>傍晚通常降臨的「寧靜」，與下文 a hive of activity（熱鬧忙碌）形成對比</div><div class=\"why\">✗ noisy 是形容詞且語意相反；composure（鎮定）、kindness（善意）形容人的心緒，不形容場域氛圍</div>"}, {"a": "discovered", "o": ["founded", "discovered", "created", "investiga t hunt for a living (like canines) are smarter than strict vegetarians (you don't need much intelligence to outsmart a leaf of lettuce). Animals that live in social groups are always smarter and have large EQ's than solitary animals. have large EQ's than solitary animals. towards across through against Although Thus Instead Otherwise follows followed follow following"], "blanks": [{"a": "does", "o": ["do", "did", "does", "done"], "why": "<div class=\"reason\"><span class=\"tag t-tense\">時態</span>a technique that ___ not require 現在式，主詞 technique 為第三人稱單數，用 does</div><div class=\"reason\"><span class=\"tag t-num\">單複數</span>助動詞須配單數主詞 technique，故 does not require</div><div class=\"why\">✗ do(複數)、did(過去)、done(過去分詞)皆與單數現在式不符</div>"}, {"a": "across", "o": ["towards", "across", "through", "against"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>compare across species 跨物種比較，across 為固定介系詞</div><div class=\"why\">✗ towards/through/against 皆不搭 compare ___ species 的「跨越」語意</div>"}, {"a": "Instead", "o": ["Although", "Thus", "Instead", "Otherwise"], "why": "<div class=\"reason\"><span class=\"tag t-sem\">語意</span>前句說大腦大小不可靠，本句改用 Cephalization index，Instead 表「改而」轉折</div><div class=\"why\">✗ Although 須引導子句；Thus(因此)語意相反；Otherwise(否則)不合</div>"}, {"a": "followed", "o": ["follows", "followed", "follow", "following"], "why": "<div class=\"reason\"><span class=\"tag t-tense\">時態</span>humans, ___ by great apes 為被動分詞片語 followed by（其後依序為），表排名</div><div class=\"reason\"><span class=\"tag t-coll\">搭配</span>A, followed by B 固定句型表列舉次序</div><div class=\"why\">✗ follows/follow 主動現在式不合被動片語；following 方向相反（其前）</div>"}, {"a": "rule", "o": ["theme", "rule", "theory", "regulation"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>as a general rule 一般而言，固定片語</div><div class=\"why\">✗ theme/theory/regulation 皆不構成 as a general ___ 的慣用語</div>"}], "pg": 26, "day": 2, "done": false}, {"id": "080030", "t": "Politics and International Relations (政治與國際關系)", "k": "d", "parts": ["This course provides students with an in-depth understanding of the exciting disciplines of politics and international relations and commerce. Students will learn about the ", "workings", " of political institutions in international relations and commerce. Students will learn about the workings of political institutions in countries around the world and explore the complex field of relations between nations. Topics in governance, public policy, public administration, national security, border control and commerce governance, public policy, public administration, national security, border control and commerce ensure that students receive a ", "broad", " and current education in the range of issues which are covered under the label of politics and international relations and commerce. In addition to acquiring specialist under the label of politics and international relations and commerce. In addition to acquiring specialist ", "knowledge", " and competencies in Politics and International Relations and Commerce, students will graduate with a range of generic skills such as critical thinking, enhanced communication abilities, graduate with a range of generic skills such as critical thinking, enhanced communication abilities, problem solving and strong capacities to work with others. They will also develop ethically based and socially ", "responsible", " attitudes and behaviors. socially responsible attitudes and behaviors. narrow broad widely mild experiment knowledge information capacity answerable accountability responsible rebuttable"], "blanks": [{"a": "workings", "o": ["workings", "characters", "regulars", "principals"], "why": "<div class=\"reason\"><span class=\"tag t-sem\">語意</span>the ___ of political institutions 政治機構的「運作」，workings 指運作機制</div><div class=\"reason\"><span class=\"tag t-coll\">搭配</span>the workings of 某事物的運作，固定搭配</div><div class=\"why\">✗ characters/regulars/principals 皆不搭「機構運作方式」</div>"}, {"a": "broad", "o": ["narrow", "broad", "widely", "  other (group in white box). If the virus has changed so little over time, why is it rearing its ugly head now? Scientists are not sure yet, but new experimental work in mosquitoes suggests that the virus was capable of ", "causing", " detrimental health effects and outbreaks all along. Therefore, it is unlikely mutations enabled new abilities. Instead public health officials probably did not understand Zika’s potential because the virus ", "circulated", " mostly in remote locations until recently."], "blanks": [{"a": "range", "o": ["capacity", "range", "similarity", "immutability"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>vast range 廣大範圍，over almost 70 years 指時間與地理跨度，vast range 固定搭配</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>Despite Zika&#x27;s vast ___ over 70 years 儘管病毒分布範圍廣</div><div class=\"why\">✗ capacity/similarity/immutability 皆不搭 vast ___ over 70 years 表「範圍」</div>"}, {"a": "indistinguishable", "o": ["indistinguishable", "invisible", "imperceptible", "indistinct"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>indistinguishable from each other 彼此難以區分，indistinguishable from 固定搭配</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>兩株病毒幾乎相同，practically ___ from each other 表「無法區分」</div><div class=\"why\">✗ invisible(看不見)/imperceptible(難察覺)/indistinct(模糊)皆不搭 ___ from each other 表互相難辨</div>"}, {"a": "causing", "o": ["revoking", "causing", "making", "evoking"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>capable of causing detrimental health effects 能造成有害健康影響，cause effects 固定搭配</div><div class=\"reason\"><span class=\"tag t-pos\">詞性</span>capable of 後接動名詞，causing 表「造成」</div><div class=\"why\">✗ revoking(撤銷)/making(較弱不搭 effects)/evoking(喚起)皆不符「造成有害健康影響」</div>"}, {"a": "circulated", "o": ["circulated", "circulate"], "why": "<div class=\"reason\"><span class=\"tag t-tense\">時態</span>the virus ___ mostly in remote locations 過去主動式 circulated 表病毒「曾流通」於偏遠地</div><div class=\"reason\"><span class=\"tag t-pos\">詞性</span>circulate 為不及物動詞，此處無 be 動詞作被動，故用主動過去式 circulated</div><div class=\"why\">✗ circulate 為原形與過去語境不符；無 be 動詞故不取被動形</div>"}], "pg": 31, "day": 2, "done": false}, {"id": "110014", "t": "Clones (克隆)", "k": "dd", "parts": ["Clones of an Eastern cottonwood (Populus deltoides) in the Bronx and other city spots grew to double the biomass of clones ", "planted", " outside small towns upstate or on Long Island, says Jillian Gregg, now of the Environmental Protection Agency's western-ecology division in Corvallis, Ore. The growth gap comes from ozone damage, she and her New York colleagues report. Ozone chemists have known that concentrations may spike skyscraper high in city air, but during a full 24 hours, rural trees actually get a higher cumulative ozone exposure from urban pollution that ", "blows", " in and lingers. A series of new experiments now show that this hang-around ozone is the ", "overwhelming", " factor in tree growth, the researchers say in the July 10 Nature. \"This study has profound importance in showing us most vividly that rural areas ", "pay", " the price for urban pollution,\" says Stephen P. Long of the University of Illinois at Urbana- Champaign. \"This work should be a wake-up call,\" he adds."], "opts": ["overwhelming", "blows", "invades", "breathes", "pay", "planted", "necessary", "purchase", "built"], "pg": 14, "day": 2, "done": false}, {"id": "110015", "t": "Selling Price (售價)", "k": "dd", "parts": ["Once an organization has its product to sell, it must then ", "determine", " the appropriate price to sell it at. The price is set by balancing many ", "factors", " including supply-and-demand, cost, desired profit competition, perceived value, and market behavior. Ultimately, the final price is determined by what the market is willing to ", "exchange", " for the product. Pricing theory can be quite complex because so many factors influence what the purchaser ", "decides", " is a fair value."], "opts": ["transfer", "determine", "decides", "substitute", "factors", "exchange", "conditions"], "pg": 14, "day": 2, "done": false}, {"id": "080043", "t": "Agrarian parties (農業政黨)", "k": "d", "parts": ["Agrarian parties are political parties chiefly representing the interests of peasants or, more broadly, the rural sector of society. The extent to ", "which", " they are important, or whether they even exist, depends rural sector of society. The extent to which they are important, or whether they even exist, depends mainly ", "on", " two factors. One, obviously, is the size of an identifiable peasantry, or the size of the rural relative to the urban population. The other is a matter of social integration: ", "for", " agrarian parties to be relative to the urban population. The other is a matter of social integration: for agrarian parties to be important, the representation of countryside or peasantry must not be integrated with the other major sections of society. ", "Thus", " , a country might possess a sizeable rural population, but have an economic system in which the interests of the voters were predominantly related to their incomes, ", "rather", " than system in which the interests of the voters were predominantly related to their incomes, rather than their occupations or location; and in such a country the political system would be unlikely to include an on as to within for as even_if although Thus Moreover Nonetheless After_all"], "blanks": [{"a": "which", "o": ["which", "whom", "where", "that"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>The extent to which 在何種程度上，to which 固定關係子句結構</div><div class=\"reason\"><span class=\"tag t-pos\">詞性</span>先行詞 extent 為物，介系詞 to 後用 which 不用 that/whom</div><div class=\"why\">✗ whom 指人；where/that 不能用於 to ___ 結構（介系詞後不接 that）</div>"}, {"a": "on", "o": ["on", "as", "to", "within"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>depends on two factors 取決於兩個因素，depend on 固定片語</div><div class=\"why\">✗ as/t "a": "able", "o": ["able", "professional", "proficient", "sensible"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>固定搭配 be able to + 原形動詞 (must also be able to balance...)，後面接 to balance</div><div class=\"why\">✗ professional/proficient/sensible 後面不接 to do 不定式，無法構成 be ___ to 句型。</div>"}, {"a": "staff", "o": ["colleague", "staff", "volunteer"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>固定搭配 a large and diverse staff，staff 作集合名詞指全體員工</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>motivate a ___「激勵...團隊」語意上要整體員工而非單一同事</div><div class=\"why\">✗ colleague/co_worker 指個別同事與 a large and diverse 不搭；volunteer 志工語意不合。</div>"}, {"a": "decisions", "o": ["decisions", "propositions", "perceptions", "actions"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>固定搭配 make decisions（做決定），與 marketing and legal 修飾相符</div><div class=\"why\">✗ make propositions/perceptions/actions 都非英語自然搭配，make decisions 才是慣用。</div>"}], "pg": 34, "day": 3, "done": false}, {"id": "080047", "t": "Northern spotted owls (北方斑點貓頭鷹)", "k": "d", "parts": ["Our analysis of the genetic structure of northern spotted owls across most of the range of the Our analysis of the genetic structure of northern spotted owls across most of the range of the subspecies allowed us to test for genetic discontinuities and identify landscape features that influence the subspecies’ genetic structure. Although no ", "distinct", " genetic breaks were found in northern the subspecies’ genetic structure. Although no distinct genetic breaks were found in northern spotted owls, ", "several", " landscape features were important in structuring genetic variation. Dry, low elevation valleys and the high elevation Cascade and Olympic Mountains restricted gene flow, while elevation valleys and the high elevation Cascade and Olympic Mountains restricted gene flow, while the lower Oregon Coast Range ", "facilitated", " gene flow, acting as a “genetic corridor.” The Columbia River did not act as a barrier, ", "suggesting", " owls readily fly over this large river. Thus, even in taxa such as River did not act as a barrier, suggesting owls readily fly over this large river. Thus, even in taxa such as northern spotted owls with potential for long-distance dispersal, landscape features can have an important impact on gene flow and genetic structure. important impact on gene flow and genetic structure. vague identical distinct varied several numerous plenty much quitted facilitated prevented permitted"], "blanks": [{"a": "distinct", "o": ["vague", "identical", "distinct", "varied"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>固定搭配 distinct genetic breaks（明顯的基因斷層），distinct 指清楚可辨</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>Although no ___ breaks were found 表示未發現明顯區隔，與後文 several features were important 形成轉折</div><div class=\"why\">✗ vague 模糊、identical 完全相同、varied 多樣，都不修飾 breaks 表「明顯」之意。</div>"}, {"a": "several", "o": ["several", "numerous", "plenty", "much"], "why": "<div class=\"reason\"><span class=\"tag t-num\">單複數</span>後接可數複數 landscape features，several 修飾可數名詞</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>語意「好幾個」地景特徵，程度適中合理</div><div class=\"why\">✗ much 修飾不可數；plenty 須作 plenty of；numerous 雖可，但語境「好幾個」用 several 最貼切。</div>"}, {"a": "facilitated", "o": ["quitted", "facilitated", "prevented", "permitted"], "why": "<div class=\"reason\"><span class=\"tag t-sem\">語意</span>與前句 restricted gene flow 對比，海岸低地「促進 (facilitated) 基因流動」，後接 acting as a genetic corridor 佐證</div><div class=\"reason\"><span class=\"tag t-tense\">時態</span>與前句 restricted 並列用過去式</div><div class=\"why\">✗ prevented 阻止與 corridor（通道）矛盾；quitted 停止不通；permitted 允許語氣弱於「促進」。</div>"}, {"a": "suggesting", "o": ["proved", "suggesting", "suggested", "proving"], "why": "<div class=\"reason\"><span class=\"tag t-tense\">時態</span>分詞構句 ..., suggesting owls readily fly over，現在分詞接主句補充說明</div><div class=\"reason\"><span class=\"tag t-pos\">詞性</span>逗號後引導分詞片語，不可用 suggested(完成式語意)/proved</div><div class=\"why\">✗ suggested/proved 為過去式無法接續分詞構句；proving 雖為分詞但 prove 此處語意過強（證明 vs 暗示）。</div>"}], "pg": 35, "day": 3, "done": false}, {"id": "080055", "t": "Standard English (標准英語)", "k": "d", "parts": ["At the beginning of the twenty-first century, the relationship between standard and nonstandard language is, evidently, still an uncertain one. We are at a ", "transitional", " point between two eras. We seem to be leaving an era when the rules of Standard English, as elected and defined by prescriptive grammarians, totally conditioned our sense of ", "acceptable", " usage, so that all other usages and varieties were considered to be inferior or corrupt, and excluded from serious consideration. And we seem to be approaching an era when nonstandard usages and varieties, previously denigrated or ignored, are achieving a new presence and ", "respectability", " within society, reminiscent of that found in Middle English, when dialect variation in literature was widespread and uncontentious. But we are not there yet. The rise of Standard English has resulted in a confrontation between the standard and nonstandard dimensions of the language which has lasted for over 200 years, and this has had traumatic ", "consequences", " which will take some years to eliminate. Once people have been given an inferiority complex about the way they speak or write, they find it difficult to shake off. transitional transactional transferable transient"], "blanks": [{"a": "transitional", "o": ["transitional", "transactional", "transferable", "transient"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>固定搭配 a transitional point（過渡點），後接 between two eras 佐證</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>語意「兩個時代之間的過渡階段」</div><div class=\"why\">✗ transactional 交易的、transferable 可轉讓的、transient 短暫的，皆不合「兩時代間的過渡」之意。</div>"}, {"a": "acceptable", "o": ["commendable", "acceptable", "eloquent", "sufficient"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>固定搭配 acceptable usage（可接受的用法），our sense of ___ usage</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>與後文 inferior or corrupt（低劣／敗壞）對比，指「可接受」的標準</div><div class=\"why\">✗ commendable 值得稱讚、eloquent 雄辯、sufficient 足夠，皆不修飾 usage 表「可接受性」。</div>"}, {"a": "respectability", "o": ["dependence", "respectability", "expectation", "reliance"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>固定搭配 a new presence and respectability（新的地位與受尊重），與 within society 連用</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>指非標準用法正獲得「尊重認可」</div><div class=\"why\">✗ dependence/reliance 依賴、expectation 期待，皆與「獲得社會尊重」語意不合。</div>"}, {"a": "consequences", "o": ["principles", "controversies", "quarrels", "consequences"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>固定搭配 traumatic consequences（創傷性後果），this has had ___</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>與後文 take some years to eliminate（需數年消除）呼應，指對立造成的後果</div><div class=\"why\">✗ principles 原則、controversies 爭議、quarrels 爭吵皆與 traumatic 及「需時間消除的後果」不合。</div>"}], "pg": 38, "day": 3, "done": false}, {"id": "110017", "t": "Humans began farming (人類開始務農)", "k": "dd", "parts": ["When humans began farming some 12,000 years ago, they altered the future of our ", "species", " forever. Our ancestors were ecological ", "pioneers", ", discovering and cultivating the most valuable crops, scaling them up to feed entire communities and transforming wild crops so fundamentally that they became dependent on humans for their survival. Farming, in the words of National Geographic’s Genographic Project, “sowed the seeds for the modern ", "age", ""], "opts": [".”", "pioneers", "means", "age", "species", "practitioners", "environment"], "pg": 15, "day": 3, "done": false}, {"id": "110022", "t": "Concrete Jungle (混凝土叢林)", "k": "dd", "parts": ["Spending too much time in the concrete jungle is bad for city ", "dwellers'", " health and could have potentially catastrophic ", "consequences", " for the environment, conservation biologist Richard Fuller will argue during a seminar at the University of Canberra today. Dr. Fuller, ", "lecturer", " in biodiversity and conservation at the University of Queensland and and CSIRO, will explore the fact that although there's evidence that the well-being of humans increases with ", "exposure", " to our surrounding biodiversity, the ", "opportunities", " for people to experience nature are declining rapidly in the modern world."], "opts": ["opportunities", "factors", "dwellings’", "dwellers'", "consequences", "lecturer", "correlation", "exposure", "lecturers", "challenges"], "pg": 16, "day": 3, "done": false}, {"id": "080057", "t": "A Dog (一只狗)", "k": "d", "parts": ["A DOG may be man's best friend. But man is not always a dog's. Over the centuries ", "selective", " breeding has pulled at the canine body shape to produce what is often a grotesque distortion of the underlying wolf. Indeed, some of these distortions are, when found in people, regarded as ", "pathologies", " . Dog breeding does, though, offer a chance to those who would like to understand how body shape is controlled. The ancestry of pedigree pooches is well recorded, their generation time is short and their ", "litter", " size reasonably large, so there is plenty of material to work with. ", "Moreover", ", Moreover , breeds are, by definition, inbred, and this simplifies genetic analysis. Those such as Elaine Ostrander, of America's National Human Genome Research Institute, who wish to identify the genetic basis of the features of particular pedigrees thus have an ", "ideal", " experimental animal. pandemics epidemics pathologies medications brood household litter kin Hence However Moreover Nevertheless"], "blanks": [{"a": "selective", "o": ["exclusive", "excessive", "selective", "scrupulous"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>固定搭配 selective breeding（選擇性育種／選育）</div><div class=\"reason\"><span class=\"tag t-pos\">詞性</span>形容詞修飾名詞 breeding</div><div class=\"why\">✗ exclusive 獨家、excessive 過度、scrupulous 嚴謹皆不與 breeding 構成「選育」術語。</div>"}, {"a": "pathologies", "o": ["pandemics", "epidemics", "pathologies", "medications"], "why": "<div class=\"reason\"><span class=\"tag t-sem\">語意</span>句意「這些變形在人身上被視為病理／病態 (pathologies)」，regarded as ___</div><div class=\"reason\"><span class=\"tag t-num\">單複數</span>複數名詞對應前文 distortions（複數）</div><div class=\"why\">✗ pandemics/epidemics 指大規模流行病、medications 指藥物，皆與「個體身上的病態」語意不合。</div>"}, {"a": "litter", "o": ["brood", "household", "litter", "kin"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>固定搭配 litter size（一胎產仔數），their ___ size reasonably large</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>談犬隻繁殖，litter 指一窩幼崽</div><div class=\"why\">✗ brood 多指鳥類雛群、household 家庭、kin 親屬皆不用於犬隻「一窩幼崽」的 litter size。</div>"}, {"a": "Moreover", "o": ["Hence", "However", "Moreover", "Nevertheless"], "why": "<div class=\"reason\"><span class=\"tag t-sem\">語意</span>前列舉育種研究的有利條件，故用 Moreover（此外）再加一條 inbred 的優勢，為遞進關係</div><div class=\"why\">✗ However/Nevertheless 表轉折、Hence 表因果，皆不合此處「再補充一項優點」的遞進語氣。</div>"}, {"a": "ideal", "o": ["representative", "attainable", "theoretical", "ideal"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>固定搭配 an ideal experimental animal（理想的實驗動物）</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>總結前述優勢，犬隻是「理想」研究對象</div><div class=\"why\">✗ representative 具代表性、attainable 可達成、theoretical 理論的皆不如 ideal 切合「總結為理想對象」。</div>"}], "pg": 38, "day": 4, "done": false}, {"id": "080058", "t": "Trinity Sport and Fitness (叁一運動與健身)", "k": "d", "parts": ["Whether you want to exercise and stay ", "healthy", " , train professionally with like-minded people, or indulge your competitive streak, Trinity Sport and Fitness ", "has it covered", " . We've got a dedicated indulge your competitive streak, Trinity Sport and Fitness has it covered . We've got a dedicated support de  "intentionally", "accidentally", "considerably"], "why": "<div class=\"reason\"><span class=\"tag t-sem\">語意</span>perhaps ___ designed to jar the visitor「或許是刻意設計來衝擊訪客」intentionally 與 designed 呼應</div><div class=\"reason\"><span class=\"tag t-pos\">詞性</span>副詞修飾 designed，表「刻意地」</div><div class=\"why\">✗ unintentionally/accidentally 與 designed to jar(刻意製造衝擊)矛盾；considerably「相當地」語意不合</div>"}], "pg": 51, "day": 7, "done": false}, {"id": "080096", "t": "Paris Opera (巴黎歌劇院)", "k": "d", "parts": ["Most important of all is the fact that for each new ballet-pantomime created at the Paris Opera during the July Monarchy, a new score was produced. The reason for this is simple: these ballet-pantomimes told stories-elaborate ones-and music was considered an indispensable tool in getting them across to the audience. ", "Therefore", " , music had to be newly created to fit each story Music tailor-made for each new ballet-pantomime, however, was only one weapon in the Opera's explanatory arsenal. ", "Another", " was the ballet-pantomime libretto, a printed booklet of fifteen to forty pages in length, which was sold in the Operas lobby (like the opera libretto), and which laid out the plot in painstaking detail, scene by scene. Critics also took it upon themselves to recount the plots (of both ballet-pantomimes and operas) in their ", "reviews", " of premieres. So did the publishers of souvenir albums, which also featured pictures of famous ", "performers", " and of scenes from favorite ballet-pantomimes and operas. In_brief Nevertheless In_reality Therefore"], "blanks": [{"a": "Therefore", "o": ["Nevertheless", "Therefore"], "why": "<div class=\"reason\"><span class=\"tag t-sem\">語意</span>前句說音樂是傳達故事的必要工具，本句推論「因此」每個故事都要新作音樂，因果關係</div><div class=\"why\">✗ Nevertheless「儘管如此」表轉折，與前後因果推論不符</div>"}, {"a": "Another", "o": ["Another", "Others", "ItIt"], "why": "<div class=\"reason\"><span class=\"tag t-sem\">語意</span>前句 music was only one weapon，本句 ___ was the libretto「另一項是劇本」Another 接續列舉 d been_penalised 3 be_penalised be_penalty is_penalised been_penalised condense shorten amplify retrench It_is There_are They_are Those_are 5 It_is There_are They_are Those_are"], "blanks": [{"a": "considerably", "o": ["considerable", "considerably", "considerate", "considerately"], "why": "<div class=\"reason\"><span class=\"tag t-pos\">詞性</span>修飾形容詞 different 需用副詞 considerably「相當地」</div><div class=\"why\">✗ considerable（形容詞）不能修飾形容詞；considerate/considerately（體貼）語意不符。</div>"}, {"a": "in", "o": ["of", "by", "in", "as"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>in your own writing style「以你自己的寫作風格」，介系詞用 in</div><div class=\"why\">✗ of、by、as 皆不與 your own writing style 構成「以…風格」的慣用搭配。</div>"}, {"a": "be penalised", "o": ["be penalised", "be penalty", "is penalised", "been penalised"], "why": "<div class=\"reason\"><span class=\"tag t-tense\">時態</span>will probably + 原形被動 be penalised「可能會被處罰」</div><div class=\"reason\"><span class=\"tag t-pos\">詞性</span>助動詞 will 後接原形 be</div><div class=\"why\">✗ be penalty 名詞錯置；is penalised 與 will 衝突；been penalised 缺助動詞。</div>"}, {"a": "condense", "o": ["condense", "shorten", "amplify", "retrench"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>condense and simplify「濃縮並簡化」並列，condense 搭配作者觀點的壓縮</div><div class=\"why\">✗ shorten 偏縮短長度；amplify（擴大）語意相反；retrench（裁減）不符改寫語境。</div>"}, {"a": "It is", "o": ["It is", "There are", "They are", "Those are"], "why": "<div class=\"reason\"><span class=\"tag t-pos\">詞性</span>形式主詞句型 It is important to credit...，It 指代後面不定詞</div><div class=\"reason\"><span class=\"tag t-num\">單複數</span>搭配單數 is 與形容詞 important</div><div class=\"why\">✗ There are、They are、Those are 為複數或存在句，與後接 to credit 的形式主詞結構不符。</div>"}], "pg": 64, "day": 11, "done": false}, {"id": "080130", "t": "Edo-Tokyo Architectural Museum (江戶東京建築博物館)", "k": "d", "parts": ["The Edo-Tokyo Tatemono En is an open-air architectural museum but could be better thought of as a The Edo-Tokyo Tatemono En is an open-air architectural museum but could be better thought of as a park. Thirty buildings from the 19th and early 20th centuries from ", "all", " around Tokyo were restored and relocated to the space, where they can be explored by future generations to come. The buildings are a relocated to the space, where they can be explored by future generations to come. The buildings are a collection of houses and businesses, shops, and bathhouses, all of which would have been present on a typical middle-class street from Edoera to Showa-era Tokyo. The west section is ", "residential", " , with typical middle-class street from Edoera to Showa-era Tokyo. The west section is residential , with traditional thatched roof bungalows of the 19th century. Meiji-era houses are also on view, constructed in a more Western style after Japan opened its borders in 1868. The Musashino Sabo Café occupies the in a more Western style after Japan opened its borders in 1868. The Musashino Sabo Café occupies the ", "ground", " floor of one such house, where visitors can enjoy a cup of tea. Grand residences like that of Korekiyo Takahashi, an early 20th century politician assassinated over his controversial policies, Korekiyo Takahashi, an early 20th century politician assassinated over his controversial policies, demonstrate how the upper class lived during that time period. The east section is primarily businesses from the 1920s and ’30s, preserved with their wares on display. Visitors are free to ", "wander", " through a from the 1920s and ’30s, preserved with their wares on display. Visitors are free to wander through a kitchenware shop, a florist’s, an umbrella store, a bar, a soy sauce shop, a tailor’s, a cosmetics shop, and an inn complete with an operational noodle shop. and an inn complete with an operational noodle shop. industrial commercial residential governmental base ground top basement to_wander wandering wander wandered"], "blanks": [{"a": "all", "o": ["part", "all", "throughout", "entire"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>all of which（其全部，引導關係子句）固定搭配 all of which</div><div class=\"reason\"><span class=\"tag t-pos\">詞性</span>後接 of which 需 all/some 等限定詞</div><div class=\"why\">✗ part 須作 part of which 但語意指全部、throughout 為副詞/介系詞、entire 不接 of which</div>"}, {"a": "residential", "o": ["industrial", "commercial", "residential", "governmental"], "why": "<div class=\"reason\"><span class=\"tag t-sem\">語意</span>後文有 traditional bungalows、houses，西區是「住宅」區，與東區 businesses 對比</div><div class=\"reason\"><span class=\"tag t-pos\">詞性</span>需形容詞作補語 The west section is ___</div><div class=\"why\">✗ industrial/commercial/governmental「工業/商業/政府」皆與後文住宅平房不符（商業留給東區）</div>"}, {"a": "ground", "o": ["base", "ground", "top", "basement"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>ground floor（一樓/底層）固定搭配</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>咖啡館占用房子的「一樓」</div><div class=\"why\">✗ base/top/basement 皆不搭 floor 表英式「一樓」（ground floor）</div>"}, {"a": "wander", "o": ["wandering", "wander", "wandered"], "why": "<div class=\"reason\"><span class=\"tag t-tense\">時態</span>be free to ___（可自由地…）to 後接原形動詞 wander</div><div class=\"reason\"><span class=\"tag t-coll\">搭配</span>free to wander through（自由漫步穿越）</div><div class=\"why\">✗ wandering 分詞、wandered 過去式皆不能接在 free to 不定式後；原形 wander 正確</div>"}], "pg": 65, "day": 11, "done": false}, {"id": "080135", "t": "Colonial Era (殖民時代)", "k": "d", "parts": ["At the end of the colonial era, as many new nations gained independence, relative levels of economic At the end of the colonial era, as many new nations gained independence, relative levels of economic development became an important criterion by which to distinguish between countries. The former colonial powers and ", "wealthier", " parts of the world generally became known as advanced industrial, or colonial powers and wealthier parts of the world generally became known as advanced industrial, or developed countries, ", "while", " former colonies and poorer nations became known as less developed, or more positively, developing countries. Critics of the ", "uneven", " distribution of wealth across the globe more positively, developing countries. Critics of the uneven distribution of wealth across the globe highlighted the role which wealth creation in some places had played in impoverishing poorer nations and, rather, described them as actively underdeveloped. The question as to ", "whether", " economic change and, rather, described them as actively underdeveloped. The question as to whether economic change is developing or underdeveloping countries remains a vital issue, as the debate over sweatshops"], "blanks": [{"a": "wealthier", "o": ["wealthier", "poorer", "destitute", "affluent"], "why": "<div class=\"reason\"><span class=\"tag t-sem\">語意</span>與 former colonial powers 並列、後接 became advanced industrial / developed countries，語意需「較富裕的」地區</div><div class=\"reason\"><span class=\"tag t-coll\">搭配</span>後文 uneven distribution of wealth、wealth creation 對照，wealthier 與 poorer nations 形成貧富對比</div><div class=\"why\">✗ poorer/destitute 語意相反；affluent 雖近義但全文以 wealthier↔poorer 成對，比較級語感更貼合 generally became known</div>"}, {"a": "while", "o": ["while", "whether", "because", "which"], "why": "<div class=\"reason\"><span class=\"tag t-pos\">詞性</span>連接兩個對比子句（developed countries ... ／ former colonies became less developed），需對比連接詞 while「然而、相對地」</div><div class=\"why\">✗ whether 引導名詞子句、because 表原因、which 為關係代名詞，均無法表達兩類國家的對比</div>"}, {"a": "uneven", "o": ["uneven", "even", "disparate", "balanced"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>固定搭配 uneven distribution of wealth（財富分配不均）</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>批評者所指責的是分配「不均」並使窮國更窮（impoverishing），語意需負面</div><div class=\"why\">✗ even/balanced 表「平均、平衡」與批評語境矛盾；disparate 修飾 distribution 搭配不自然</div>"}, {"a": "whether", "o": ["whether", "what", "which", "when"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>the question as to whether ... 固定句型，引導 yes/no 名詞子句「是否」</div><div class=\"reason\"><span class=\"tag t-pos\">詞性</span>後接完整子句且有 developing or underdeveloping 對比，需 whether</div><div class=\"why\">✗ what/which 需子句缺主受詞（此處完整）；when 表時間，皆不合 as to ___ 的「是否」語意</div>"}], "pg": 66, "day": 11, "done": false}, {"id": "080137", "t": "Seminars (研討會)", "k": "d", "parts": ["Seminars are not designed to be mini-lectures. Their educational ", "role", " is to provide an opportunity for you to discuss interesting and /or difficult aspects of the course. This is founded on the ", "assumption", " that it is only by actively trying to use the knowledge that you have acquired from lectures and texts that you can achieve an adequate understanding of the subject. If you do not understand a point it is highly ", "unlikely", " that you will be the only person in the group in that position; you will invariably be undertaking a ", "service", " for the entire group if you come to the seminar equipped with questions on matters which you feel you did not fully understand. The seminar is to ", "provoke", " discussion. method ranking role approach dedication resolution consolation assumption"], "blanks": [{"a": "role", "o": ["method", "ranking", "role", "approach"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>搭配 their educational role is to provide（教育角色在於）</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>全句說明研討會「扮演的功能」，role 最貼合</div><div class=\"why\">✗ method/approach 指「方法」與 is to provide an opportunity 語意錯位；ranking 表「排名」無關</div>"}, {"a": "assumption", "o": ["dedication", "resolution", "consolation", "assumption"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>固定搭配 founded on the assumption that...（建立在…的假設上）</div><div class=\"reason\"><span class=\"tag t-pos\">詞性</span>後接 that 同位語子句，assumption that 為慣用結構</div><div class=\"why\">✗ dedication/resolution/consolation（奉獻／決心／安慰）均不接 that 同位語、語意也不通</div>"}, {"a": "unlikely", "o": ["similarly", "likely", "possibly", "unlikely"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>句型 it is highly unlikely that...（極不可能）</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>you will be the only person 的語意需「極不可能是唯一一個」，安慰讀者不孤單</div><div class=\"why\">✗ likely 語意相反；similarly 為副詞語意不合；possibly 無法與 highly 構成此慣用語且語氣不對</div>"}, {"a": "service", "o": ["service", "investigation", "reservation", "research"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>搭配 undertaking a service for...（為…提供服務／貢獻）</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>帶問題來上課是「對全組的貢獻」，service 貼合</div><div class=\"why\">✗ investigation/research/reservation（調查／研究／保留）與 undertake ... for the group 的「貢獻」語意不符</div>"}, {"a": "provoke", "o": ["hinder", "provoke", "raise", "create"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>固定搭配 provoke discussion（激發討論）</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>研討會目的在「引發」討論，此處 provoke 取中性「激起」義</div><div class=\"why\">✗ hinder 表「阻礙」相反；raise 多接 question/issue；create discussion 搭配不道地</div>"}], "pg": 67, "day": 11, "done": false}, {"id": "110053", "t": "Concept of Culture (文化的概念)", "k": "dd", "parts": ["Many people today think of culture in the way that it was thought of in Europe during the 18th and early 19th centuries. This ", "concept", " of culture reflected inequalities within European societies and their colonies around the world. This understanding of culture equates culture with civilization and contrasts both with nature or non-civilization. According to this understanding of culture, some countries are more civilized than others, and some people are more cultured than others. Anything that doesn’t FIT into this category is labeled as chaos or anarchy. From this perspective, culture is closely tied to cultivation, which is the progressive refinement of human ", "behavior", ". In practice, culture referred to elite goods and activities such as haute cuisine, high fashion or haute couture, museum-caliber art and classical music. The word cultured referred to people who knew about and took part in these activities. For example, someone who used culture in this sense might ", "argue", " that classical music is more refined than music by working-class people, such as jazz or the indigenous music traditions of aboriginal peoples."], "opts": ["argue", "mindset", "behavior", "concept", "language", "society", "blame"], "pg": 24, "day": 11, "done": false}, {"id": "110054", "t": "Teacher’s response (教師的回應)", "k": "dd", "parts": ["The ", "casual", " observer does not necessarily recognise the ", "skill", " in how a teacher, for instance, responds to a thoughtful question from a normally quiet student and how that may be very different from the 'standard response' to a commonly inquisitive or ", "talkative", " student. Expert teachers are aware of what they are doing; they monitor and adjust their teaching behaviors to bring out the ", "best", " in their students."], "opts": ["reason", "timid", "casual", "best", "talkative", "optimistic", "skill", "professional"], "pg": 24, "day": 11, "done": false}, {"id": "080138", "t": "English is changing (英語正在改變)", "k": "d", "parts": ["English has been changing throughout its lifetime and it's still changing today. For most of us, these changes are fine as long as they’re well and truly in the past. Paradoxically, we can be ", "curious", " about word origins and the stories behind the structures we find in our language, but we ", "experience", " a queasy distaste for any change that might be happening right under our noses. There are even language critics who are ", "convinced", " that English is dying, or if not dying at least being progressively ", "damaged", " through long years of mistreatment. worried concerned indifferent curious practice experience cope possess"], "blanks": [{"a": "curious", "o": ["worried", "concerned", "indifferent", "curious"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>固定搭配 be curious about...，後接 about word origins</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>Paradoxically 與後句 queasy distaste 形成對比，前半需正面的「好奇」</div><div class=\"why\">✗ worried/concerned 語意為「擔憂」（負面），與 distaste 構不成 paradox；indifferent「冷漠」與 curious about 矛盾</div>"}, {"a": "experience", "o": ["practice", "experience", "cope", "possess"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>搭配 experience a distaste for...（感受到一種厭惡）</div><div class=\"reason\"><span class=\"tag t-pos\">詞性</span>及物動詞直接接受詞 a queasy distaste</div><div class=\"why\">✗ cope 為不及物需 cope with；practice/possess（練習／擁有）接 distaste 語意不通</div>"}, {"a": "convinced", "o": ["persuaded", "convinced", "satisfied", "reassured"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>固定搭配 be convinced that...（深信），後接 that English is dying</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>語境是「堅信」英語正在消亡，convinced 表內在確信</div><div class=\"why\">✗ persuaded 多指被他人說服且常接 to do；satisfied/reassured（滿意／安心）與 dying 的負面論斷不合</div>"}, {"a": "damaged", "o": ["unable", "disabled", "impaired", "damaged"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>搭配 damaged through ... mistreatment（因虐待而受損）</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>與前 dying 並列遞減語氣 if not dying at least ... damaged，需「受損」</div><div class=\"why\">✗ unable/disabled 用於主體無能力，主詞 English 不適用；impaired 雖近義但 progressively damaged through mistreatment 更道地</div>"}], "pg": 67, "day": 12, "done": false}, {"id": "080145", "t": "Good looks win votes (漂亮的外表贏得選票)", "k": "d", "parts": ["It is tempting to try to prove that good looks win votes, and many academics have tried. The ", "difficulty", " is that beauty is in the eye of the ", "beholder", " , and you cannot behold a politician’s face without a veil of extraneous prejudice getting in the way. Does George Bush possess a disarming grin, or a facetious ", "smirk", " ? It’s hard to find anyone who can look at some way", ", on natural cycles of light and dark. Artificial light is known to have detrimental effects on the ecology of sea turtles, particularly at the hatchling stage when they emerge from nests on natal beaches and head towards the sea. Under natural conditions, turtles hatch predominantly at night (although some early morning and late afternoon emergences occur) and show an innate and well-directed orientation to the water, ", "relying", " mostly on light cues that attract them toward the brighter horizon above the sea surface. Artificial lighting on beaches is strongly attractive to hatchlings and can cause them ", "to move away from", " the sea and ", "interfere", " with their ability to orient in a constant direction. Ultimately, this disorientation due to light pollution can lead to death of hatchlings from exhaustion, dehydration and predation."], "opts": ["feeding", "contingent", "by the way", "exceptionally", "interfere", "relying", "in some way", "disturb", "respectively", "to move away from"], "pg": 26, "day": 12, "done": false}, {"id": "080157", "t": "Experience of Crime (犯罪經驗)", "k": "d", "parts": ["Crime is an integral part of everyday life. It is a prominent ", "feature", " in the news and is a popular subject for frictional portrayal. Most students commencing legal studies will have some ", "experience", " of crime, for frictional portrayal. Most students commencing legal studies will have some experience of crime, whether directly, as a victim of crime or indirectly through exposure to media coverage. This means that most offenses ", "covered", " on the syllabus, such as murder, theft and rape will be familiar terms. This that most offenses covered on the syllabus, such as murder, theft and rape will be familiar terms. This tends to give students the impression that they know more about criminal law than they do about other subjects on the syllabus. This can be a real disadvantage ", "in terms of", " the academic study of other subjects on the er tongue – shared by several hundred contemporary languages, as well as many now extinct, and spoken by people who lived from about 6,000 to 3,500 BC on the steppes to the north of the Caspian Sea. They left no written texts and about 6,000 to 3,500 BC on the steppes to the north of the Caspian Sea. They left no written texts and ", "although", " historical linguists have, since the 19th century, painstakingly reconstructed the language from daughter languages, the question of how it actually sounded was assumed to be permanently from daughter languages, the question of how it actually sounded was assumed to be permanently out of reach. Now, researchers at the Universities of Cambridge and Oxford have developed a sound- based method to move back through the family tree of languages that stem from PIE. They can based method to move back through the family tree of languages that stem from PIE. They can simulate how certain words ", "would have sounded", " when they were spoken 8,000 years ago. Remarkably, at the ", "heart", " of the technology is the statistics of shape. “Sounds have shape,” explains Professor at the heart of the technology is the statistics of shape. “Sounds have shape,” explains Professor John Aston, from Cambridge’s Statistical Laboratory. “As a word is uttered it vibrates air, and the shape of this soundwave can be measured and turned into a series of numbers. Once we have these stats, and the stats of another spoken word, we can start asking how similar they are and what it would stats, and the stats of another spoken word, we can start asking how similar they are and what it would take to shift from one to another.” 2 would_sound sounded were_sounded would_have_sounded"], "blanks": [{"a": "although", "o": ["however", "therefore", "although", "thus"], "why": "<div class=\"reason\"><span class=\"tag t-sem\">語意</span>語意：「雖然」語言學家已重建語言，發音問題仍被認為無解，讓步轉折</div><div class=\"reason\"><span class=\"tag t-pos\">詞性</span>although 引導讓步子句，後接 the question... wa "report", "play", "causes", "reasons", "predicts"], "pg": 28, "day": 13, "done": false}, {"id": "080165", "t": "UBC expeditions-Canadian Arctic (加拿大北極探險隊)", "k": "d", "parts": ["This summer, 41 UBC alumni and friends participated in expeditions to the Canadian Arctic and the legendary Northwest Passage. Presentations, conversations and learning accompanied their exploration of the great ", "outdoors", " aboard the Russian-flagged Akademik Ioffe, designed and built in Finland as a scientific research vessel in 1989. Her bridge was open to passengers virtually 24 hours a day. Experts on ", "board", " presented on topics including climate change, wildlife, Inuit culture and history, and early European explorers. UBC professor Michael Byers presented on the issue of Arctic sovereignty, a ", "growing", " cause of debate as ice melts, new shipping routes open, and natural resources ", "become", " accessible. Recommended pre-trip reading was late UBC alumnus Pierre Bertons book, The became becoming has_become become"], "blanks": [{"a": "outdoors", "o": ["outdoors", "indoors", "outside", "outward"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>「the great outdoors」固定講法，指戶外大自然</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>exploration of the great ___ aboard the vessel，指探索戶外天地</div><div class=\"why\">✗ indoors 室內與探險矛盾、outside/outward 不構成 the great ___ 慣用語</div>"}, {"a": "board", "o": ["aboard", "board", "trip", "ship"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>「on board」固定片語，指在船上</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>Experts on ___ presented on topics，指船上的專家</div><div class=\"why\">✗ aboard 本身已含 on 不再接 on、trip/ship 不構成 on ___ 此搭配</div>"}, {"a": "growing", "o": ["grow", "grown", "growth", "growing"], "why": "<div class=\"reason\"><span class=\"tag t-pos\">詞性</span>a ___ cause of debate 需形容詞性現在分詞修飾 cause</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>「a growing cause of debate」指日

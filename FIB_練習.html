h has already shed important new life on the character of human cultures and which ", "promises", " to which has already shed important new life on the character of human cultures and which promises to continue to do so. While there is a little doubt that cultural studies are coming to be_widely_recognized as an important and distinctive field of study, it does seem to encompass a be_widely_recognized as an important and distinctive field of study, it does seem to encompass a potentially enormous area. This is because the term 'culture' has a complex history and range of usages, which have provided a legitimate ", "focus", " of inquiry for several academic disciplines. usages, which have provided a legitimate focus of inquiry for several academic disciplines. same resulting spontaneous simultaneous promise promises promised promising idea view focus point"], "blanks": [{"a": "renewed", "o": ["renew", "renewing", "renewed", "renewable"], "why": "<div class=\"reason\"><span class=\"tag t-pos\">詞性</span>a ___ interest 需形容詞修飾名詞 interest；renewed 為過去分詞作形容詞</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>語意指『重新燃起的』興趣</div><div class=\"why\">✗ renew 為動詞；renewing 主動義不合；renewable 指『可再生的』語意不符</div>"}, {"a": "resulting", "o": ["same", "resulting", "spontaneous", "simultaneous"], "why": "<div class=\"reason\"><span class=\"tag t-sem\">語意</span>The ___ activities：承上指『由此產生的』活動</div><div class=\"why\">✗ same/spontaneous/simultaneous 不合『因前述而產生』的承接語意</div>"}, {"a": "promises", "o": ["promise", "promises", "promised", "promising"], "why": "<div class=\"reason\"><span class=\"tag t-num\">單複數</span>關係子句 which ___ to continue，先行詞為單數，動詞用 promises</div><div class=\"reason\"><span class=\"tag t-tense\">時態</span>敘述現況用現在式單數 promises</div><div class=\"why\">✗ promise 為複數動詞不合單數主詞；promised 時態不符；promising 為分詞</div>"}, {"a": "focus", "o": ["idea", "view", "focus", "point"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>固定搭配 a legitimate focus of inquiry（正當的探究焦點）</div><div class=\"why\">✗ idea/view/point 不與 of inquiry 構成『探究焦點』慣用語</div>"}], "pg": 119, "day": 26, "done": false}, {"id": "110161", "t": "Truancy (逃課)", "k": "dd", "parts": ["In reality, however, the causes of truancy and non-attendance are diverse and multifaceted. There are as many ", "triggers", " of non-attendance as there are non-attenders. Each child has her own ", "unique", " story, and whilst there may often be certain identifiable factors in common, each non- attending child demands and ", "deserves", " an individual response, tailored to meet her individual needs. This applies ", "equally", " to the 14-year-old who fails to attend school because a parent is terminally ill, the overweight 11 -year-old who fails to attend because he is ", "embarrassed", " about changing for PE in front of peers, the 15-year-old who is 'bored' by lessons, and to the seven-year-old who is teased in the playground because she doesn’t wear the latest designer-label clothes."], "opts": ["embarrassed", "equally", "ubiquitous", "deserves", "triggers", "unique", "demands", "introverted"], "pg": 49, "day": 26, "done": false}, {"id": "110164", "t": "The resultant force (合力)", "k": "dd", "parts": ["The overall result of two or ", "more", " forces acting on an object is called the resultant force. The ", "resultant", " of two forces is a single force, which has the same effect as the two forces combined. If two forces pull an object in ", "opposite", " directions, the size of the resultant can be found by ", "subtracting", " one force from the other. If the forces are equal, they ", "balance", " each other."], "opts": ["more", "subtracting", "distracting", "opposite", "same", "equal", "adding", "balance", "resultant"], "pg": 50, "day": 26, "done": false}, {"id": "080279", "t": "Dance(舞蹈)", "k": "d", "parts": ["Dance has played an important role in many musicals. In some ", "cases", " , dance numbers are included as Dance has played an important role in many musicals. In some cases , dance numbers are included as an excuse to add to the color and spectacle of the show, but dance is more effective when it forms an integral part of the ", "plot", " . An early example is Richard Rodgers On Your Toes(1936) in which the story integral part of the plot . An early example is Richard Rodgers On Your Toes(1936) in which the story about classical ballet meeting the world of jazz enabled dance to be introduced in a way that ", "enhances", " , rather than interrupts the drama. , rather than interrupts the drama. prowess plot phenomenon roundabout encumbers enhances levels crumples"], "blanks": [{"a": "cases", "o": ["dimensions", "cases", "brief", "extent"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>固定搭配 in some cases（在某些情況下）</div><div class=\"why\">✗ dimensions/brief/extent 不與 in some ___ 構成『某些情況』慣用語</div>"}, {"a": "plot", "o": ["prowess", "plot", "phenomenon", "roundabout"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>固定搭配 an integral part of the plot（劇情不可或缺的一環）</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>戲劇語境指舞蹈融入『劇情』</div><div class=\"why\">✗ prowess/phenomenon/roundabout 不合戲劇『劇情』語境</div>"}, {"a": "enhances", "o": ["encumbers", "enhances", "levels", "crumples"], "why": "<div class=\"reason\"><span class=\"tag t-sem\">語意</span>與後文對比 rather than interrupts the drama：舞蹈『增強』而非打斷戲劇</div><div class=\"reason\"><span class=\"tag t-num\">單複數</span>關係子句先行詞 a way 為單數，動詞用 enhances</div><div class=\"why\">✗ encumbers/levels/crumples 皆負面或不合，與 rather than interrupts 的對比需正面詞</div>"}], "pg": 120, "day": 27, "done": false}, {"id": "080280", "t": "Dinosaurs(恐龍)", "k": "d", "parts": ["What killed off the dinosaurs? The end of the Cretaceous Period saw one of the most dramatic mass extinctions the Earth has ever seen. The fossil record shows that throughout their 160-million-year ", "existence", " , dinosaurs took on a huge variety of forms as the environment changed and new species evolved that were suited to these new conditions. Others that failed to adapt ", "went", " extinct. But then 66 million years ago, over a relatively short time, dinosaurs disappeared ", "completely", " (except for birds). Many other animals also died out, including pterosaurs, large marine reptiles, and other sea creatures such as ammonites. ", "Although", " the number of dinosaur species was already declining, this suggests a sudden catastrophic event sealed their fate, causing unfavorable changes to the environment more quickly than dinosaurs and other creatures could adapt. The exact nature of this catastrophic event is still ", "open", " to scientific debate. The catastrophe could have been an asteroid impact, volcanic eruptions or the effect of both, together with more ", "gradual", " changes in the Earth's climate over millions of years. Whatever the causes, the huge extinction that ended the age of the dinosaur left gaps in the ecosystem that were subsequently filled by mammals and birds, allowing them to evolve rapidly. went to_go going go partially gradually completely excessively However Because Unless Although"], "blanks": [{"a": "existence", "o": ["existence", "continuous", "extent", "expectation"], "why": "<div class=\"reason\"><span class=\"tag t-pos\">詞性</span>their 160-million-year ___ 需名詞，existence（存續）</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>指恐龍長達 1.6 億年的『存在期間』</div><div class=\"why\">✗ continuous 為形容詞詞性不合；extent/expectation 語意不貼合『存續期間』</div>"}, {"a": "went", "o": ["went", "going", "go"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>固定片語 went extinct（滅絕）</div><div class=\"reason\"><span class=\"tag t-tense\">時態</span>過去敘事用過去式 went</div><div class=\"why\">✗ going/go 時態與形式不合，需過去式定動詞 went extinct</div>"}, {"a": "completely", "o": ["partially", "gradually", "completely", "excessively"], "why": "<div class=\"reason\"><span class=\"tag t-sem\">語意</span>dinosaurs disappeared ___ (except for birds)：恐龍『完全』消失</div><div class=\"why\">✗ partially/gradually 與『短時間內消失』及 except 例外語境不合；excessively 語意不通</div>"}, {"a": "Although", "o": ["However", "Because", "Unless", "Although"], "why": "<div class=\"reason\"><span class=\"tag t-sem\">語意</span>讓步轉折：『雖然』恐龍物種已在減少，這仍暗示突發災難封定其命運</div><div class=\"why\">✗ However 為副詞不引導從句；Because 語意因果不合；Unless 條件義不通</div>"}, {"a": "open", "o": ["relative", "open", "additional", "focused"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>固定搭配 open to debate（仍有爭議/有待討論）</div><div class=\"why\">✗ relative/additional/focused 不與 to scientific debate 構成『有待爭論』慣用語</div>"}, {"a": "gradual", "o": ["irregular", "gradual", "spiritual", "positive"], "why": "<div class=\"reason\"><span class=\"tag t-sem\">語意</span>more ___ changes in climate over millions of years：氣候歷經數百萬年的『漸進』變化</div><div class=\"why\">✗ irregular/spiritual/positive 不合『歷時長久、緩慢』的氣候變化語意</div>"}], "pg": 120, "day": 27, "done": false}, {"id": "080281", "t": "Water security(水安全)", "k": "d", "parts": ["Equally critical is the challenge of water security. The UN Environment Programme (UNEP) has pointed out that about one- third of the world's population lives in countries with moderate to high water out that about one- third of the world's population lives in countries with moderate to high water stress, with a ", "disproportionate", " impact on the poor. With current projected global population growth, the task of providing water for human ", "sustenance", " will become increasingly difficult. And increasing the task of providing water for human sustenance will become increasingly difficult. And increasing competition over this scarce but vital resource may fuel instability and conflict within states as well as between states. The UN is doing a great deal in both areas to proactively foster ", "collaboration", " among between states. The UN is doing a great deal in both areas to proactively foster collaboration among Member States. UNEP has long been actively addressing the water issue together with partner UN ", "agencies", " and other organizations. Looking ahead, the UN can do more to build synergies of agencies and other organizations. Looking ahead, the UN can do more to build synergies of technology, policy and capacity in this field. In this regard, events like the annual World Water Week in Stockholm come to the forefront of the public mind when talking about championing water issues. Stockholm come to the forefront of the public mind when talking about championing water issues. specific significance disproportionate mild sustenance exist lives consumption alliance collaboration contribution association"], "blanks": [{"a": "disproportionate", "o": ["specific", "significance", "disproportionate", "mild"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>固定搭配 a disproportionate impact on the poor（對窮人不成比例的影響）</div><div class=\"why\">✗ significance 為名詞詞性不合；specific/mild 語意不貼合『不成比例的衝擊』</div>"}, {"a": "sustenance", "o": ["sustenance", "exist", "lives", "consumption"], "why": "<div class=\"reason\"><span class=\"tag t-pos\">詞性</span>providing water for human ___ 需名詞，sustenance（維生）</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>語意指供水以維持人類『生存』</div><div class=\"why\">✗ exist 為動詞詞性不合；lives/consumption 不如 sustenance 貼合『維生』語境</div>"}, {"a": "collaboration", "o": ["alliance", "collaboration", "contribution", "association"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>固定搭配 foster collaboration among（促進…之間的協作）</div><div class=\"why\">✗ alliance/association 偏『聯盟/協會』；contribution 為『貢獻』，foster collaboration 才慣用</div>"}, {"a": "agencies", "o": ["officials", "countries", "companies", "agencies"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>固定搭配 partner UN agencies（夥伴 UN 機構），呼應後文 other organizations</div><div class=\"why\">✗ officials/countries/companies 不合『UN 夥伴機構』語境，agencies 才指聯合國轄下機構</div>"}], "pg": 121, "day": 27, "done": false}, {"id": "080286", "t": "Marshmallows(棉花糖)", "k": "d", "parts": ["In the original test, which was administered at the Bing Nursery School, at Stanford, in the nineteen- sixties, Mischel’s team would present a child with a treat (marshmallows were just one option) and sixties, Mischel’s team would present a child with a treat (marshmallows were just one option) and tell her that she could either eat the one treat ", "immediately", " or ", "wait", " alone in the room for several minutes until the researcher returned, at which point she could have two treats. The promised treats were always visible and the child knew that all she had to do to stop the agonizing wait was ring a bell were always visible and the child knew that all she had to do to stop the agonizing wait was ring a bell to call the experimenter back—although in that ", "case", " , she wouldn’t get the second treat. The longer a child delayed gratification, Mischel found—that is, the longer she was able to wait—the better she child delayed gratification, Mischel found—that is, the longer she was able to wait—the better she would fare later in life at numerous measures of what we now call executive function. She would ", "perform", " better academically, earn more money, and be healthier and happier. She would also be more perform better academically, earn more money, and be healthier and happier. She would also be more likely to avoid a number of negative outcomes, including jail time, obesity, and drug use."], "blanks": [{"a": "immediately", "o": ["later", "immediately", "before", "today"], "why": "<div class=\"reason\"><span class=\"tag t-sem\">語意</span>與 or wait...two treats 對比：『立刻』吃掉一份 或 等待換兩份</div><div class=\"reason\"><span class=\"tag t-coll\">搭配</span>固定搭配 eat...immediately（馬上吃掉）</div><div class=\"why\">✗ later/today 與『立即 vs 等待』的對立結構不合；before 語意不通</div>"}, {"a": "wait", "o": ["wait", "promise", "treat", "play"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>固定搭配 the agonizing wait（煎熬的等待），呼應全文 wait 主題</div><div class=\"why\">✗ promise/treat/play 不貼合『停止煎熬的等待』語境</div>"}, {"a": "case", "o": ["possibility", "case", "wait", "treat"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>固定搭配 in that case（那樣的話/在那種情況下）</div><div class=\"why\">✗ possibility/wait/treat 不與 in that ___ 構成『那種情況下』慣用語</div>"}, {"a": "perform", "o": ["perform", "play", "work", "search"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>固定搭配 perform better academically（學業表現更好）</div><div class=\"why\">✗ play/work/search 不與 better academically 搭配表『表現』</div>"}], "pg": 121, "day": 27, "done": false}, {"id": "110165", "t": "Iceland Volcanic Events (冰島火山事件)", "k": "dd", "parts": ["On average, Iceland ", "experiences", " a major volcanic event once every 5 years. Since the Middle Ages, a third of all the lava that has ", "covered", " the earth's surface has erupted in Iceland. However, according to a recent geological hypothesis, this estimate does not include ", "submarine", " eruptions, which are much more extensive than those on the land surface."], "opts": ["covered", "expects", "experiences", "replaced", "submarine", "overseas"], "pg": 50, "day": 27, "done": false}, {"id": "110166", "t": "Lake Turkana (圖爾卡納湖)", "k": "dd", "parts": ["Lake Turkana is a large lake in Kenya, East Africa. This ", "part", " of Africa was home to some of the first humans. Here, archaeologists have found piles of ", "bones", " (both human and animal) and collections of stones that humans used as ", "tools", ". By carefully uncovering and ", "examining", " these remains, scientists have started to put together the story of our earliest ancestors. In 2001, a 4 million year-old skeleton was uncovered in the area. Although a link between it and modern- day humans has not been established, the skeleton shows the species was walking upright."], "opts": ["bones", "part", "tools", "examining", "kind", "dictating"], "pg": 50, "day": 27, "done": false}, {"id": "080287", "t": "Valuable shrimp farms(有價值的養蝦場)", "k": "d", "parts": ["", "Over", " the past two decades, around a third of the world's mangrove swamps have been ", "converted", " for Over the past two decades, around a third of the world's mangrove swamps have been converted for human use, with many turned into valuable shrimp farms. In 2007 an economic study of such shrimp farms in Thailand showed that the commercial profits per hectare were $9,632. If that were the only farms in Thailand showed that the commercial profits per hectare were $9,632. If that were the only ", "factor", " , conversion would seem an excellent idea. However, proper ", "accounting", " shows that for each hectare government subsidies formed $8,412 of this figure and there were costs, too: $1,000 for hectare government subsidies formed $8,412 of this figure and there were costs, too: $1,000 for pollution and $12,392 for losses to ecosystem services. These comprised damage to the supply of foods and medicines that people had taken from the forest, the loss of habitats for fish, and less foods and medicines that people had taken from the forest, the loss of habitats for fish, and less buffering against storms. And because a given shrimp farm only stays ", "productive", " for three or four years, there was the additional cost of restoring them afterwards. years, there was the additional cost of restoring them afterwards. production cost factor price forecast accounting number prospect to_produce produce productive production"], "blanks": [{"a": "Over", "o": ["With", "Over", "Although", "Under"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>固定搭配 Over the past two decades（過去二十年來）</div><div class=\"why\">✗ With/Under 不與 the past...years 構成時間片語；Although 引導從句語意不合</div>"}, {"a": "converted", "o": ["converted", "transmitted", "transferred", "translated"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>固定搭配 converted for human use / converted into farms（轉作…用途）</div><div class=\"why\">✗ transmitted/transferred/translated 語意分別為傳送/轉移/翻譯，不合土地『轉作用途』</div>"}, {"a": "factor", "o he and globally. When the global average temperature hits one and a half degrees hotter - and it will, the carbon dioxide already in the atmosphere ", "commits", " us to that much warming - some countries will no longer be able to feed their people. Others, further from the equator, will still have enough food for longer be able to feed their people. Others, further from the equator, will still have enough food for themselves, but none to ", "spare", " ."], "blanks": [{"a": "predicted", "o": ["predicting", "predicted", "predicts", "predict"], "why": "<div class=\"reason\"><span class=\"tag t-tense\">時態</span>going up faster than ___：被動省略 than (was) predicted，需過去分詞</div><div class=\"why\">✗ predicting 為主動分詞；predicts/predict 為定動詞，不合『比預測的更快』的被動比較</div>"}, {"a": "purely", "o": ["pure", "purely", "just", "only"], "why": "<div class=\"reason\"><span class=\"tag t-pos\">詞性</span>a ___ historical document：修飾形容詞 historical 需副詞，purely（純粹）</div><div class=\"why\">✗ pure 為形容詞詞性不合；just/only 通常不置於 a 與形容詞之間修飾，purely 最自然</div>"}, {"a": "commits", "o": ["commits", "committing", "commission"], "why": "<div class=\"reason\"><span class=\"tag t-num\">單複數</span>主詞 the carbon dioxide 單數，動詞用 commits</div><div class=\"reason\"><span class=\"tag t-coll\">搭配</span>固定搭配 commit us to（使我們注定…），後接 that much warming</div><div class=\"why\">✗ committing 為分詞不能作主句動詞；commission 為名詞/不同義動詞，語意與形態不合</div>"}, {"a": "spare", "o": ["eat", "have", "spare", "consume"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>固定搭配 none to spare（沒有多餘的可分給別人）</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>與前 enough food for themselves 對比：自給有餘但無餘糧外援</div><div class=\"why\">✗ eat/have/consume 不與 none to ___ 構成『沒有多餘可分』的慣用語</div>"}], "pg": 123, "day": 28, "done": false}, {"id": "080291", "t": "Quiet or noisy study space(安靜或嘈雜的學習空間)", "k": "d", "parts": ["Some students say that they need complete quiet to read and study. Others study best in a crowded, noisy room because the noise actually ", "helps", " them concentrate. Some students like quiet music playing; others ", "do", " not. The point is, you should know the level of noise that is optimal for your own studying. However, one general rule for all students is that the television seems to be more of a distraction than music or other background noise, so ", "leave", " the TV off when you are reading or studying. ", "Also", " , don’t let yourself become distracted by computer games, email, or Internet surfing."], "blanks": [{"a": "helps", "o": ["distracts", "helps", "facilitates", "reduces"], "why": "<div class=\"reason\"><span class=\"tag t-num\">單複數</span>主詞 the noise 單數，動詞用 helps</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>noise actually ___ them concentrate：噪音『幫助』他們專注</div><div class=\"why\">✗ distracts/reduces 語意相反；facilitates 後不接 sb + 原形，help sb do 才合句型</div>"}, {"a": "do", "o": ["do", "are", "like"], "why": "<div class=\"reason\"><span class=\"tag t-tense\">時態</span>others ___ not：代動詞替代前句 like，否定用 do not</div><div class=\"why\">✗ are 對應 be 動詞、like 為原型重複，皆不能與 not 構成替代前述 like 的代動詞</div>"}, {"a": "leave", "o": ["make", "leave", "let", "maintain"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>固定搭配 leave the TV off（讓電視保持關閉），leave + 受詞 + off</div><div class=\"why\">✗ make/let 接受詞後需原形動詞非 off；maintain 不與 the TV off 搭配</div>"}, {"a": "Also", "o": ["Therefore", "However", "Even", "Also"], "why": "<div class=\"reason\"><span class=\"tag t-sem\">語意</span>承接前句叮嚀，再補充一項建議『此外』，don&#x27;t let yourself...distracted</div><div class=\"why\">✗ Therefore 表因果、However 表轉折、Even 語意不合此處『再補一項』的並列補述</div>"}], "pg": 123, "day": 28, "done": false}, {"id": "080292", "t": "Speed of sound (音速)", "k": "d", "parts": ["The speed of sound (otherwise known as Mach 1) varies with temperature. At sea level on a “standard day,” the temperature is 59°F, and Mach 1 is approximately 761 mph. As the altitude increases, the temperature and speed of sound ", "both", " decrease until about 36,000 feet, afte hers are preparing to conduct health assessments of low surface vegetation in the Antarctic, at ask that is physically ", "demanding", " in harsh weather conditions. So, some scientists have suggested that drones should be used to replace their work ", "as well as", " monitor the long-term effects of climate change. Researchers have found that drones ", "equipped", " with sensors can detect various states of vegetation more accurately than satellite images, ", "making", " the images used to assess their health more accurate than human observations. easy relaxing simple demanding as_well_as but_also instead_of because_of 2 as_well_as but_also instead_of because_of"], "blanks": [{"a": "demanding", "o": ["easy", "relaxing", "simple", "demanding"], "why": "<div class=\"reason\"><span class=\"tag t-sem\">語意</span>task that is physically ___ in harsh weather，demanding(費力)貼合 harsh 惡劣天候</div><div class=\"why\">✗ easy/relaxing/simple 皆「輕鬆」，與 harsh weather 及後文派無人機代勞的需求矛盾</div>"}, {"a": "as well as", "o": ["as well as", "but also", "instead of", "because of"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>replace their work as well as monitor... 並列兩任務，連接兩動詞片語</div><div class=\"why\">✗ but also 須前有 not only；instead of 表替代；because of 表原因，皆破壞兩任務並列</div>"}, {"a": "equipped", "o": ["stripped", "equipped", "deprived", "hindered"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>drones equipped with sensors「配備感測器的無人機」，be equipped with 固定搭配</div><div class=\"why\">✗ stripped/deprived 指被剝奪與 with 語意相反；hindered(阻礙)不合配備語意</div>"}, {"a": "making", "o": ["breaking", "making", "destroying", "avoiding"], "why": "<div class=\"reason\"><span class=\"tag t-pos\">詞性</span>..., ___ the images...more accurate 為分詞構句表結果，現在分詞 making</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>make + 受詞 + 形容詞 more accurate「使...更準確」</div><div class=\"why\">✗ breaking/destroying 語意相反；avoiding(避免)不合使影像更準確的結果</div>"}], "pg": 141, "day": 32, "done": false}, {"id": "110180", "t": "Hippocrates(希波克拉底)", "k": "dd", "parts": ["Hippocrates allowed observation, rationality and his own genuine respect for his patients to ", "guide", " his practice. Using the scientific method, he carefully recorded his patient's symptoms and ", "responses", " to treatments and used the data ", "gathered", " to evaluate and prescribe the most successful regimens. His prestige as a great ", "medical", " practitioner, educator, and author helped spread these ideals of ", "rational", " medicine throughout the ancient world."], "opts": ["lead", "rational", "medical", "gathered", "react", "irrational", "responses", "guide"], "pg": 53, "day": 32, "done": false}, {"id": "110181", "t": "New ideas(新思想)", "k": "dd", "parts": ["First, new ideas are the wheels of progress. Without them, stagnation reigns. Whether you're a designer dreaming of another world, an engineer working on a new kind of ", "structure", ", an executive charged with developing a fresh business ", "concept", ", an advertiser seeking a breakthrough way to sell your product, a fifth-grade teacher trying to plan a ", "memorable", " school assembly program, or a volunteer looking for a new way to sell the same old raffle tickets, your ability to ", "generate", " good ideas is critical to your success."], "opts": ["concept", "memorable", "generate", "rise", "engineer", "change", "structure"], "pg": 53, "day": 32, "done": false}, {"id": "080343", "t": "Icerbergs' Sound (冰山之聲)", "k": "d", "parts": ["In the past ", "few", " years, scientists have begun to learn to distinguish the sounds made by Antarctic In the past few years, scientists have begun to learn to distinguish the sounds made by Antarctic icebergs, ", "which", " ground on the sea floor - and to measure the extent to which these sounds affect the stability of the iceberg's structure. But understanding the sounds of icebergs can help them stability of the iceberg's structure. But understanding the sounds of icebergs can help them understand the  solar system's biggest ", "planet", " and orbit very close to their host stars, are excellent targets for ", "astronomers", " in their biggest planet and orbit very close to their host stars, are excellent targets for astronomers in their search for their extrasolar worlds. The size and proximity of these planets is easy to ", "detect", " as they create a large decrease in brightness when passing in front of their parent stars. create a large decrease in brightness when passing in front of their parent stars. astronomers biologists geologists chemists forget ignore overlook detect"], "blanks": [{"a": "characteristics", "o": ["decorations", "anomalies", "characteristics", "accessories"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>similar in characteristics to（特徵上類似於）固定搭配</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>熱木星在「特徵」上類似太陽系最大行星</div><div class=\"why\">✗ decorations/anomalies/accessories 與「行星特徵相似」的語意不合</div>"}, {"a": "planet", "o": ["galaxy", "star", "planet", "asteroid"], "why": "<div class=\"reason\"><span class=\"tag t-sem\">語意</span>the solar system&#x27;s biggest planet（太陽系最大行星）指木星</div><div class=\"why\">✗ galaxy/star/asteroid 與「太陽系最大行星」木星的指稱不符</div>"}, {"a": "astronomers", "o": ["astronomers", "biologists", "geologists", "chemists"], "why": "<div class=\"reason\"><span class=\"tag t-sem\">語意</span>觀測系外行星、恆星亮度變化的是「天文學家」</div><div class=\"why\">✗ biologists/geologists/chemists 與觀測系外行星的研究領域不合</div>"}, {"a": "detect", "o": ["forget", "ignore", "overlook", "detect"], "why": "<div class=\"reason\"><span class=\"tag t-sem\">語意</span>easy to detect（容易偵測），承接亮度大幅下降使其易被察覺</div><div class=\"why\">✗ forget/ignore/overlook 皆表忽略，與「容易偵測到」的語意相反</div>"}], "pg": 143, "day": 34, "done": false}, {"id": "080351", "t": "Plains Indians (平原印第安人)", "k": "d", "parts": ["\"Plains lndians\" are people who don't like to live in one place. They like to travel around and move camp ", "at least", " once a year. For this reason, they generally lived in something ", "like", " a large tent house because it was easy to set up and take down. Indians would also build fires in their tents ", "in the middle", " to cook food. They also ", "used to", " put buffalo hides on the floor to use as rugs. In Indian camps, everyone had a job to do. The men had to hunt for food and keep their families safe. The women had to ", "look after", " the children, prepare meals, etc. And whenever the camp moved, men and women had to help tear down the tents together. at_most at_least exactly barely 3 on_the_edge in_the_middle at_the_beginning at_the_end"], "blanks": [{"a": "at least", "o": ["at most", "at least", "exactly", "barely"], "why": "<div class=\"reason\"><span class=\"tag t-sem\">語意</span>一年至少搬一次營地，at least once 表「至少」一次</div><div class=\"reason\"><span class=\"tag t-coll\">搭配</span>at least + 數量 為固定搭配，表最低限度</div><div class=\"why\">✗ at most 表最多上限；exactly 太精確；barely 幾乎不，皆不合「至少」之意。</div>"}, {"a": "like", "o": ["like", "unlike", "opposite", "against"], "why": "<div class=\"reason\"><span class=\"tag t-sem\">語意</span>住在「像」大帳篷一樣的東西，something like a large tent 表類比</div><div class=\"reason\"><span class=\"tag t-coll\">搭配</span>something like 固定搭配，意為「類似…的東西」</div><div class=\"why\">✗ unlike/opposite/against 表相反或對立，與「類似帳篷」語意矛盾。</div>"}, {"a": "in the middle", "o": ["on the edge", "in the middle", "at the beginning", "at the end"], "why": "<div class=\"reason\"><span class=\"tag t-sem\">語意</span>在帳篷「中間」生火煮食，build fires in the middle 合理安全</div><div class=\"reason\"><span class=\"tag t-coll\">搭配</span>in the middle 表位置居中，固定片語</div><div class=\"why\">✗ on the edge 在邊緣會燒到帳壁；at the beginning/end 指時間或順序，非空間中央。</div>"}, {"a": "used to", "o": ["used to", "never did", "avoided", "resisted"], "why": "<div class=\"reason\"><span class=\"tag t-tense\">時態</span>敘述過去習慣，used to + 原形 put，表「過去常做」</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>描述印第安人過去鋪野牛皮的習俗</div><div class=\"why\">✗ never did/avoided/resisted 表否定不做，與下文鋪皮為地毯的事實相反。</div>"}, {"a": "look after", "o": ["abandon", "ignore", "neglect", "look after"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>look after the children 固定片語動詞，意為「照顧」</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>婦女負責照顧孩童，與 prepare meals 並列為照料家務</div><div class=\"why\">✗ abandon/ignore/neglect 表拋棄忽視，與母親照顧小孩語意相反。</div>"}], "pg": 144, "day": 34, "done": false}, {"id": "080352", "t": "Economic Depression (經濟蕭條)", "k": "d", "parts": ["An economic depression is a period of sustained, long-term ", "downturn", " in economic activity in one economies. lt is more severe than a recession, which is a slowdown in economic activity over the ", "course", " of a normal business cycle. Economic depressions are characterized by their length, and by abnormally large increases in unemployment ", "rate", " . increase upturn downturn improvement"], "blanks": [{"a": "downturn", "o": ["increase", "upturn", "downturn", "improvement"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>economic downturn（經濟下滑）固定搭配</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>蕭條是長期經濟「衰退」</div><div class=\"why\">✗ increase/upturn/improvement 皆表上升好轉，與蕭條的衰退語意相反</div>"}, {"a": "course", "o": ["end", "path", "course", "halt"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>over the course of（在...過程中）固定片語</div><div class=\"why\">✗ end/path/halt 皆不與 over the ___ of a business cycle 構成慣用語</div>"}, {"a": "rate", "o": ["rate", "cost", "amount", "sum"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>unemployment rate（失業率）固定術語</div><div class=\"why\">✗ cost/amount/sum 與「失業率」的固定搭配不符</div>"}], "pg": 144, "day": 34, "done": false}, {"id": "110184", "t": "Bentham (邊沁)", "k": "dd", "parts": ["By the 1820s Bentham had become a well-known ", "figure", ", both in Britain and in other parts of the world. His ideas were to influence the reforms of public administration made during the nineteenth century, and his writings are still at the centre of academic debate, especially regarding social policy, legal positivism, and welfare economics. Bentham died on 6 June 1832, a day before the first Reform Act was given Royal Assent. As per the directions in his will, Bentham's body was dissected by his friend, the surgeon Thomas Southwood Smith, and his skeleton was ", "preserved", " as the Auto-Icon. Research into Bentham's thought and life continues today at UCL's Bentham Project, set up in the early 1960s with the aim ", "of", " producing the first scholarly edition of his works and correspondence. This edition is projected to run to some eighty volumes. Members of the public are invited to assist in this massive editorial task by helping to ", "transcribe", " Bentham's manuscripts via Transcribe Bentham."], "opts": ["envisaged", "figure", "transcribe", "among", "preserved", "of", "transcend", "characteristic"], "pg": 54, "day": 34, "done": false}, {"id": "110186", "t": "Next Task(下一個任務)", "k": "dd", "parts": ["Having tracked down research that is ", "relevant", " to your area of interest, the next task is to actually ", "make sense", " of that research. This section is intended to show you how to be critical of the research you ", "are reviewing", " and how to check that the ", "evidence", " is credible and represented appropriately. Unfortunately this means discussing the ways in which research findings may be misrepresented."], "opts": ["make sense", "have fun", "statement", "are reviewing", "acceptable", "relevant", "evidence"], "pg": 54, "day": 34, "done": false}, {"id": "080353", "t": "English Language (英語)", "k": "d", "parts": ["English has come to ", "dominate", " all the languages of the world. There are now about 6,800 languages left in the world, whereas in agricultural times this number was probably ", "twice", " as high as it is now. Thanks in ", "part", " to the rise of über-languages, most importantly English, the remaining languages are now dying at the ", "rate", " of about one a fortnight. follow submit dominate yield once twice never always"], "blanks": [{"a": "dominate", "o": ["follow", "submit", "dominate", "yield"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>come to dominate（逐漸主宰）固定搭配，動詞原形接於 come to 後</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>英語「主宰」世界各語言</div><div class=\"why\">✗ follow/submit/yield（跟隨、屈服、讓步）語意與英語的強勢主宰地位相反</div>"}, {"a": "twice", "o": ["once", "twice", "never", "always"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>twice as high as（兩倍高）固定倍數句型</div><div class=\"why\">✗ once/never/always 無法構成 ___ as high as 的倍數比較</div>"}, {"a": "part", "o": ["part", "whole", "entirety", "sum"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>thanks in part to（部分歸功於）固定片語</div><div class=\"why\">✗ whole/entirety/sum 不與 in ___ to 構成此慣用語</div>"}, {"a": "rate", "o": ["cost", "rate", "amount", "total"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>at the rate of（以...的速率）固定片語</div><div class=\"why\">✗ cost/amount/total 與 at the ___ of one a fortnight 的速率搭配不符</div>"}], "pg": 145, "day": 35, "done": false}, {"id": "080354", "t": "Democracy (民主)", "k": "d", "parts": ["Democracy is a political system in which the laws, policies, leadership, and main ", "undertakings", " of a country or region are determined directly or indirectly by the people. Historically, this group of people\" country or region are determined directly or indirectly by the people. Historically, this group of people\" usually included only a small percentage of the population (in ancient Rome, adult men had the right to vote), but ", "since", " the mid-20th century, the definition of people has gradually shifted to include all to vote), but since the mid-20th century, the definition of people has gradually shifted to include all adult citizens. Democratic governments are better able to ", "guarantee", " our basic human rights than non- democratic countries. Democracies are also b in a risk-averse society and this is certainly true with ", "regard to", " children. We know that children are likely to run risks ", "if", " they access the internet unsupervised or stay online for long periods of unbroken time. Adults’ fears for children and their worry about their own lack of control over their children are the single biggest obstacles to ", "accepting", " digital technology."], "opts": ["concerns", "reasons", "regard to", "embracing", "accepting", "until", "if", "while"], "pg": 56, "day": 38, "done": false}, {"id": "110195", "t": "Math&Scientific Literacy(數學和科學素養)", "k": "dd", "parts": ["Mathematical and scientific literacy is fundamental to the effective functioning of a knowledge-based society. Mathematics and science skills are part of a ", "broader", " skill set that can assist young people in further education, participation in home and life activities and ", "obtaining", " employment. Mathematics and science skills are important in enabling Australians to function ", "effectively", " in a flexible, often technical, labor force that can ", "respond", " to changing workplace demands."], "opts": ["foundational", "broader", "obtaining", "effectively", "respond", "potential", "efficiently", "productive", "conform"], "pg": 57, "day": 38, "done": false}, {"id": "080377", "t": "Good Information (信息)", "k": "d", "parts": ["One of the characteristics of 'good' information identified earlier was that it should be 'balanced'. In an ideal world, ' ", "objective", " ' or 'balanced' information would present all the ", "evidence", " for and against, and leave you to weigh this up and draw conclusions. In the real world, however, we recognize that all information presents a position of ", "interest", " , although this may not necessarily be intentional. Objectivity may therefore be an unachievable ideal. This means that the onus is on you as the reader and user of the information to ", "develop", " a critical awareness of the positions represented in what you read, and to take account of this when you interpret the information. In some cases, authors may explicitly express a particular viewpoint — this is perfectly valid as long as they are open about the perspective they represent. Hidden bias, whether or not it is ", "deliberate", " , can be misleading. This could be particularly important in a subject area where there is controversy. subjective objective proper appropriate"], "blanks": [{"a": "objective", "o": ["subjective", "objective", "proper", "appropriate"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>「&#x27;objective&#x27; or &#x27;balanced&#x27; information」客觀的資訊，與 balanced 並列同義</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>理想中呈現正反證據的資訊即客觀的，需 objective</div><div class=\"why\">✗ subjective 主觀（相反）；proper/appropriate 偏「適當」與 balanced 並列不對等。</div>"}, {"a": "evidence", "o": ["evidence", "information", "facts", "stories"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>「all the evidence for and against」正反兩面的證據，evidence for and against 固定搭配</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>下文 weigh this up and draw conclusions 指權衡證據下結論，需 evidence</div><div class=\"why\">✗ information 與主詞 information 重複、facts/stories 不與 for and against 自然搭配權衡。</div>"}, {"a": "interest", "o": ["interesting", "interested", "interest"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>「a position of interest」立場/利害關係，a position of interest 固定搭配</div><div class=\"reason\"><span class=\"tag t-pos\">詞性</span>介系詞 of 後需名詞 interest（不可用形容詞 interesting/interested）</div><div class=\"why\">✗ interesting/interested 為形容詞，不能接在 a position of 之後作名詞。</div>"}, {"a": "develop", "o": ["produce", "make", "develop", "form"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>「develop a critical awareness」培養批判意識，develop awareness 固定搭配</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>讀者需「培養」批判意識，需 develop</div><div class=\"why\">✗ produce/make/form 與 a critical awareness 搭配不如 develop（培養意識）慣用。</div>"}, {"a": "deliberate", "o": ["biased", "deliberate", "unintentional", "ignored"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>「whether or not it is deliberate」是否刻意的，呼應前文 may not be intentional</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>隱性偏見不論是否「刻意」都會誤導，需 deliberate（蓄意）</div><div class=\"why\">✗ biased 與主詞 bias 重複、unintentional 與 whether or not 的對比邏輯衝突、ignored 語意不合。</div>"}], "pg": 152, "day": 39, "done": false}, {"id": "080378", "t": "Honorary Degree(榮譽學位)", "k": "d", "parts": ["Victoria University of Wellington has conferred an honorary degree on a distinguished astrophysicist in a recent graduation ceremony. Professor Warrick Couch ", "received", " the honorary degree of Doctor of Science for his remarkable contribution to our knowledge of galaxies and dark energy. Professor Couch is a distinguished astrophysicist who has ", "played", " a crucial role in the discovery that the Universe is expanding at an accelerating rate, a finding ", "which", " led to the lead scientists being awarded a Nobel Prize in Physics in 2011, which he attended in recognition of his contribution. In his research, Professor Couch uses large ground-based and space-based telescopes to observe galaxy clusters, which are the largest Structures in the Universe. He is also involved in a number of national and international committees overseeing the management of these telescopes. In addition to his own research activities, Professor Couch has worked to support young researchers and provide public comment on astronomy In_addition_to Attached_to Because_of Evidently_as 4 In_addition_to Attached_to Because_of Evidently_as"], "blanks": [{"a": "received", "o": ["received", "receives"], "why": "<div class=\"reason\"><span class=\"tag t-tense\">時態</span>「Professor Couch received the honorary degree」描述已發生的頒授，過去式 received</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>前文 in a recent graduation c ggests that fMRI might show more than what the brain is doing—it might reveal what the brain's about to do. FMRI studies assume that blood flow in the brain ", "correlates", " with neuronal ", "activity", " . Active brain cells FMRI studies assume that blood flow in the brain correlates with neuronal activity . Active brain cells need ", "nutrients", " , which are brought to the cells by freshly oxygenated blood. But in the new study, scientists found that fMRI also detects ", "increased", " blood flow in brain regions that aren't active—but scientists found that fMRI also detects increased blood flow in brain regions that aren't active—but that may be in the near future. The researchers trained monkeys to perform a specific visual task. And they found that, even when the animals were sitting in the dark waiting for the test to begin, fMRI they found that, even when the animals were sitting in the dark waiting for the test to begin, fMRI nevertheless revealed an increased blood flow to the monkeys' visual cortex. The study suggests that fMRI data may be a lot more interesting than we thought. Scientists may be looking at their imaging fMRI data may be a lot more interesting than we thought. Scientists may be looking at their imaging data in a way that's too simplistic. And fMRI may not be measuring exactly what we thought it did. What will they think of next? Maybe fMRI can tell. What will they think of next? Maybe fMRI can tell. activity contour circuit flow nutrients proteins sugar carbohydrate increased decreased faster slower"], "blanks": [{"a": "chronicle", "o": ["chronicle", "mimic", "intercept", "improve"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>「chronicle the brain in action」記錄運作中的大腦，chronicle 表詳實記錄</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>fMRI 用來記錄大腦活動，下文 show what the brain is doing 呼應</div><div class=\"why\">✗ mimic 模仿、intercept 攔截、improve 改善，皆不合 fMRI「記錄/觀察」功能。</div>"}, {"a": "correlates", "o": ["activities" the ", "money", ". The doors were shuttered, and the plant’s four tall chimney stacks were demolished, leaving the rest of the plant to rot by the sea."], "opts": ["artists", "demands", "money", "factories", "tourists", "contribution"], "pg": 57, "day": 39, "done": false}, {"id": "110203", "t": "Advertising Aim(廣告宗旨)", "k": "dd", "parts": ["The main aim of advertising is to sell ", "products", " by getting them known and, here, brash, sensational ideas may often serve the ", "purpose", ". But by no means is all advertising aimed at promoting a new product or even a product at all. One of the most famous posters of the 20th century ", "shows", " Lord Kitchener early in the 1914-18 war pointing a finger, perhaps accusingly, at the entire male military-age population of Britain."], "opts": ["products", "items", "shows", "purpose", "exhibits"], "pg": 59, "day": 39, "done": false}, {"id": "080381", "t": "Distance Learning（B）(遠程教育（B）)", "k": "d", "parts": ["If you are interested in studying but have other ", "commitments", " , our online and distance learning courses offer an alternative flexible ", "mode", " of study. Teaching is conducted through a mixture of audio- courses offer an alternative flexible mode of study. Teaching is conducted through a mixture of audio- visual, written and interactive materials. There are also ", "opportunities", " for online discussion and collaborative projects with tutors and other students. Some programs include residential ", "modules", " collaborative projects with tutors and other students. Some programs include residential modules taught on campus, giving you the chance to meet and work alongside your tutors and fellow students face-to-face. Our Graduate School provides comprehensive support for distance and part-time face-to-face. Our Graduate School provides comprehensive support for distance and part-time researchers, many of whom study for up to six years or more."], "blanks": [{"a": "commitments", "o": ["enthusiasms", "commitments", "employments", "commissions"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>「have other commitments」有其他要事/責任，have commitments 固定搭配</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>指有其他事務佔用時間故選遠距課程，commitments 表責任承諾</div><div class=\"why\">✗ enthusiasms 熱情、employments 受雇、commissions 佣金，均不合「其他要忙的事」語意。</div>"}, {"a": "mode", "o": ["mode", "range", "method", "field"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>「flexible mode of study」彈性的學習方式，mode of study 固定搭配</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>下文 Teaching is conducted through... 描述學習模式，需 mode</div><div class=\"why\">✗ range/method/field 與 of study 搭配時，mode of study（修課模式）最符遠距學習語境。</div>"}, {"a": "opportunities", "o": ["capacities", "opportunities", "promises", "scheduling"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>「opportunities for online discussion」線上討論的機會，opportunities for 固定搭配</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>提供線上討論與協作機會，需 opportunities</div><div class=\"why\">✗ capacities 容量、promises 承諾、scheduling 排程，與 for online discussion 搭配不合。</div>"}, {"a": "modules", "o": ["segments", "tutorials", "modules", "fieldworks"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>「residential modules taught on campus」駐校課程單元，residential modules 為學制術語</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>指在校園上的課程模組，與遠距並存</div><div class=\"why\">✗ segments/tutorials/fieldworks 不如 modules 對應大學「課程單元」這個固定學制用語。</div>"}], "pg": 153, "day": 40, "done": false}, {"id": "080382", "t": "Willful Blindness(故意視而不見)", "k": "d", "parts": ["Willful blindness had started life as a legal concept in the nineteenth century. A judge in Regina v. Sleep ruled that an accused could not be convicted for possession of government property ", "unless", " the Sleep ruled that an accused could not be convicted for possession of government property unless the jury found that he either knew the goods came from government stores or had \"willfully shut his eyes to the fact.\" Thereafter, English judicial authorities referred to the state of mind that accompanied one to the fact.\" Thereafter, English judicial authorities referred to the state of mind that accompanied one who \"willfully shut his eyes\" as \"connivance\" or \"constructive knowledge.\" Over time, lots of other phrases came into play-\"deliberate or willful ignorance,\"\"conscious avoidance,\" and \"deliberate phrases came into play-\"deliberate or willful ignorance,\"\"conscious avoidance,\" and \"deliberate indifference.\" What they all have in ", "common", " is the idea that there is an opportunity for knowledge and a responsibility to be informed, but it is shirked. Nowadays, the law is ", "most", " often applied in cases of a responsibility to be informed, but it is shirked. Nowadays, the law is most often applied in cases of money laundering and drug trafficking: if you've been paid a large amount of money to carry a suitcase, then you are being willfully blind if you don't check what is inside. suitcase, then you are being willfully blind if you don't check what is inside. common nature conjunction collective most frequently least invariably"], "blanks": [{"a": "unless", "o": ["because", "since", "unless", "until"], "why": "<div class=\"reason\"><span class=\"tag t-sem\">語意</span>「could not be convicted...unless the jury found...」除非陪審團認定否則不能定罪，unless 表唯一例外條件</div><div class=\"reason\"><span class=\"tag t-coll\">搭配</span>not...unless 固定條件句型</div><div class=\"why\">✗ because/since 表原因不合；until 表時間，與「定罪條件」邏輯不符。</div>"}, {"a": "common", "o": ["common", "nature", "conjunction", "collective"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>「have in common」共同點，have...in common 固定片語</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>列舉多個同義詞後指出共通概念，需 in common</div><div class=\"why\">✗ nature/conjunction/collective 無法構成 have ___ in common 固定片語。</div>"}, {"a": "most", "o": ["most", "frequently", "least", "invariably"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>「most often applied」最常被應用，most often 固定副詞搭配</div><div class=\"reason\"><span class=\"tag t-pos\">詞性</span>修飾 often 構成最高級副詞片語，most + often</div><div class=\"why\">✗ frequently 與 often 語意重複；least 相反；invariably（總是）與 often 搭配不合。</div>"}], "pg": 153, "day": 40, "done": false}, {"id": "080383", "t": "Wrist watch(手表)", "k": "d", "parts": ["The wrist watch works by ", "tracking", " information such as a person's pulse or movement. When it ", "detects", " a change in a person's health, the watch sends information to a touchscreen hub ", "located", " in the home. The hub then ", "alerts", " pre-determined contacts and calls for help immediately. collecting tracking analyzing regulating"], "blanks": [{"a": "tracking", "o": ["collecting", "tracking", "analyzing", "regulating"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>「works by tracking information」藉由追蹤資訊運作，track information 搭配</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>下文 detects a change（偵測變化）需先持續追蹤脈搏/動作</div><div class=\"why\">✗ collecting 偏一次性收集、analyzing 是後續分析、regulating 是調節，不如 tracking 表持續監測。</div>"}, {"a": "detects", "o": ["detecting", "detects", "detected"], "why": "<div class=\"reason\"><span class=\"tag t-tense\">時態</span>「When it detects a change」時間從句一般現在式</div><div class=\"reason\"><span class=\"tag t-num\">單複數</span>主詞 it 第三人稱單數，動詞 detects 加 -s</div><div class=\"why\">✗ detecting 分詞、detected 過去式，皆不符 When it ___ 從句需單數現在式謂語。</div>"}, {"a": "located", "o": ["located", "locating", "locates", "hidden"], "why": "<div class=\"reason\"><span class=\"tag t-tense\">時態</span>「a hub located in the home」過去分詞作後位修飾（被動，=which is located）</div><div class=\"reason\"><span class=\"tag t-pos\">詞性</span>hub 是被定位，被動用過去分詞 located</div><div class=\"why\">✗ locating 主動分詞不合；locates 為謂語動詞會造成結構錯誤；hidden（隱藏）語意不合。</div>"}, {"a": "alerts", "o": ["reaches", "alerts", "connects", "calls"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>「alerts pre-determined contacts」通知預設聯絡人，alert sb 固定搭配</div><div class=\"reason\"><span class=\"tag t-num\">單複數</span>主詞 The hub 單數，動詞 alerts 加 -s</div><div class=\"why\">✗ reaches/connects 與 contacts 搭配不如 alert 精準；calls 與後句 calls for help 重複。</div>"}], "pg": 154, "day": 40, "done": false}, {"id": "080384", "t": "Antarctic plants(南極植物)", "k": "d", "parts": ["Antarctic plants can be important indicators of subtle changes in environmental conditions, including climate change. Traditional ground-based assessments of vegetation health are, however, not ideal in Antarctica, as they can destroy the vegetation and are physically ", "demanding", " in the harsh weather conditions. Co-author Professor Sharon Robinson from UOW’s School of Biological Sciences said the study found drone-based monitoring of vegetation health produced similar results to traditional techniques, but with much greater efficiency and with no damage to the vegetation. “Drones are a powerful tool for monitoring fragile Antarctic vegetation,” Professor Robinson said. “They could be used to provide timely warnings about specific environmental stress events, ", "as well as", " to monitor the longer-term impacts of climate change. “These methods could also be adapted to monitor the health of other small-stature, patchy plant communities, including in alpine or desert regions.” The researchers found that drones ", "equipped", " with sensors were able to detect vegetation health indicators more accurately than satellite imagery. Mosses are one of the key Antarctic vegetation types that need to be monitored. However, they tend to occur in patches among rocks, ice and soil, ", "making", " it important that the imagery used to assess their health is as accurate and spatially detailed as possible. being_demanded demanding demand demanded as_well_as besides but including"], "blanks": [{"a": "demanding", "o": ["demanding", "demand", "demanded"], "why": "<  as the place where ideas are born and where support for criticism is ", "found", " among students, who form the mass base for many protest movements, has been true for a long time and in many countries."], "opts": ["found", "functional", "staff", "key", "trends", "located", "faculty", "movements", "essential", "role"], "pg": 59, "day": 40, "done": false}, {"id": "110205", "t": "Migration(遷移)", "k": "dd", "parts": ["Migration could be described as the well-defined journey animals make to a familiar ", "destination", " at specific seasons or times of the year. All species that migrate do so for a common ", "purpose", ", in order to survive. Migration allows them to spend their life in more than one area and thus ", "avoid", " problems that can occur in one habitat, such as lack of food, shelter or exposure to harsh weather."], "opts": ["prohibit", "destination", "purpose", "avoid", "implication", "achievement"], "pg": 59, "day": 40, "done": false}, {"id": "080385", "t": "International Journal(國際期刊)", "k": "d", "parts": ["The international journal of design is a peer-reviewed, open access journal devoted to publishing The international journal of design is a peer-reviewed, open access journal devoted to publishing research papers in all fields of design, including industrial design, visual communication design, interface design, animation and game design, architectural design, urban design, and other design interface design, animation and game design, architectural design, urban design, and other design related fields. It aims to provide an international forum for the ", "exchange", " of ideas and findings from researchers across different cultures and encourages research ", "on", " the impact of cultural factors on researchers across different cultures and encourages research on the impact of cultural factors on design theory and practice. It also seeks to promote the ", "transfer", " of knowledge between professionals in academia and industry by emphasizing research re ", "purposeful", ". . It can help you to plan your work and to can help you to be more motivated and more purposeful It can help you to plan your work and to think more clearly and ", "logically", " about it. In other words, it can help you stay on top of things. Sit down at your desk and make a start on writing down all the things you have to do to ", "prepare", " for the exams. at your desk and make a start on writing down all the things you have to do to prepare for the exams. purposeful hopeful comfortable peaceful simply logically stably greatly arrange prepare finish complete"], "blanks": [{"a": "wondering", "o": ["asking", "looking", "wondering", "believing"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>wonder where…（納悶…）固定搭配，you wonder where the years have gone</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>語意為「納悶時間都去哪了」，wondering 最貼切</div><div class=\"why\">✗ asking/looking/believing 不與 where the years gone 的「感嘆時間流逝」語意搭配</div>"}, {"a": "anxiety", "o": ["anxiety", "happiness", "sadness"], "why": "<div class=\"reason\"><span class=\"tag t-sem\">語意</span>上下文 can help you to be more motivated，指「適量焦慮」有助於激勵，anxiety 切題</div><div class=\"why\">✗ happiness/sadness（快樂/悲傷）的「適量」並不會讓人更有動力，語意不合考試壓力情境</div>"}, {"a": "purposeful", "o": ["purposeful", "hopeful", "comfortable", "peaceful"], "why": "<div class=\"reason\"><span class=\"tag t-sem\">語意</span>與前面 more motivated 並列，purposeful（有目標的）語意一致</div><div class=\"why\">✗ hopeful/comfortable/peaceful 與「激勵、有動力」的並列語意不搭</div>"}, {"a": "logically", "o": ["simply", "logically", "stably", "greatly"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>與後文 think more clearly 並列，clearly and logically 為常見搭配</div><div class=\"why\">✗ simply/stably/greatly 無法與 think clearly 形成「清晰且有邏輯地思考」的並列</div>"}, {"a": "prepare", "o": ["arrange", "prepare", "finish", "complete"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>prepare for the exams（為考試做準備）固定搭配，後接 for</div><div class=\"why\">✗ arrange/finish/complete 不與 for the exams 搭配，且 finish/complete 語意是「完成」非「準備」</div>"}], "pg": 155, "day": 41, "done": false}, {"id": "080387", "t": "Psychology(心理)", "k": "d", "parts": ["Psychology as a subject of study has largely developed in the West since the late nineteenth century. During this period there has been an ", "emphasis", " on scientific thinking. Because of this, there have been During this period there has been an emphasis on scientific thinking. Because of this, there have been many scientific studies in psychology which ", "explore", " different aspects of human nature. These include studies into how biology (physical factors) influences human experience, how people use their ", "senses", " studies into how biology (physical factors) influences human experience, how people use their senses (touch, taste, smell, sight and hearing) to get to know the world, how people develop, why people behave in certain ways, how memory works, how people develop language, how people understand behave in certain ways, how memory works, how people develop language, how people understand and think about the world, what motivates people, why people have emotions and how personality develops. These scientific ", "investigations", " all contribute to an ", "understanding", " of human nature. What do develops. These scientific investigations all contribute to an understanding of human nature. What do we mean by the practical applications of these studies? An understanding of psychology is useful in many different areas in life, such as education, the workplace, social services and medicine. This means many different areas in life, such as education, the workplace, social services and medicine. This means that people who have knowledge of psychology can ", "use", " or apply that knowledge in areas such as the"], "blanks": [{"a": "emphasis", "o": ["essential", "analysis", "point", "emphasis"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>an emphasis on（對…的重視）固定搭配，an emphasis on scientific thinking</div><div class=\"why\">✗ essential 是形容詞、analysis/point 不與 an…on scientific thinking 搭配且語意不合「重視」</div>"}, {"a": "explore", "o": ["explore", "explores", "exploring"], "why": "<div class=\"reason\"><span class=\"tag t-num\">單複數</span>先行詞 studies 為複數，關係子句動詞用原形 explore（studies which explore）</div><div class=\"why\">✗ explores 為單數動詞（主詞為複數 studies 不合）、exploring 為分詞無法當關係子句主要動詞</div>"}, {"a": "senses", "o": ["feelings", "senses", "sensations", "consciousness"], "why": "<div class=\"reason\"><span class=\"tag t-sem\">語意</span>後文括號 (touch, taste, smell, sight and hearing) 即五感，對應 senses</div><div class=\"why\">✗ feelings/sensations/consciousness 無法對應「觸味嗅視聽」五種感官的列舉</div>"}, {"a": "investigations", "o": ["inspection", "investigations", "research", "survey"], "why": "<div class=\"reason\"><span class=\"tag t-num\">單複數</span>後接 all contribute（複數動詞），主詞需複數可數名詞，investigations 合</div><div class=\"reason\"><span class=\"tag t-coll\">搭配</span>scientific investigations（科學調查）常見搭配，呼應前文 scientific studies</div><div class=\"why\">✗ research 為不可數無法搭 all…contribute 的複數、inspection/survey 較不符通篇「科學探究」語意</div>"}, {"a": "understanding", "o": ["understanding", "acknowledge", "awareness", "intuition"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>contribute to an understanding of（有助於對…的理解）固定搭配</div><div class=\"why\">✗ acknowledge 為動詞、awareness/intuition 不與 an…of human nature 搭且語意不如 understanding 貼切</div>"}, {"a": "use", "o": ["get", "acquire", "use", "avail"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>與後文 or apply that knowledge 並列，use or apply 為自然搭配</div><div class=\"why\">✗ get/acquire 語意是「取得」非「運用」、avail 須用 avail oneself of 不合句構</div>"}], "pg": 155, "day": 41, "done": false}, {"id": "080388", "t": "Chemicals(化學品)", "k": "d", "parts": ["Chemicals used to control weeds in crops such as corn and soybeans may sometimes run off farmland Chemicals used to control weeds in crops such as corn and soybeans may sometimes run off farmland and enter surface water bodies such as lakes and streams. If a surface water body that is used as a ", "drinking", " water supply receives excess amounts of these herbicides, then the municipal water treatment drinking water supply receives excess amounts of these herbicides, then the municipal water treatment plant must ", "filter", " them out in order for the water to be safe to drink. This added filtration process can be expensive. Farmers can help control excess herbicides in runoff by choosing chemicals that bind be expensive. Farmers can help control excess herbicides in runoff by choosing chemicals that bind with ", "soil", " more readily, are less toxic, or degrade more quickly. Additionally, selecting the best tillage practice can help minimize herbicide ", "pollution", " . practice can help minimize herbicide pollution . water soil crops agriculture damages impairment harm pollution"], "blanks": [{"a": "drinking", "o": ["fishing", "dietary", "drinking", "agricultural"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>drinking water supply（飲用水供應）固定搭配</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>下文 safe to drink、water treatment plant 指飲用水，drinking 切題</div><div class=\"why\">✗ fishing/dietary/agricultural 與 water supply 接「安全飲用」的語意不合</div>"}, {"a": "filter", "o": ["filter", "purify", "distill", "exclude"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>filter…out（過濾掉）片語動詞，must filter them out</div><div class=\"reason\"><span class=\"tag t-tense\">時態</span>助動詞 must 後接原形動詞，filter 為原形</div><div class=\"why\">✗ purify/distill/exclude 不與 out 構成「過濾掉雜質」的片語動詞語意</div>"}, {"a": "soil", "o": ["water", "soil", "crops", "agriculture"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>bind with soil（與土壤結合）語意搭配，chemicals that bind with soil more readily</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>化學物質與土壤結合可減少逕流污染，soil 符合農地情境</div><div class=\"why\">✗ water/crops/agriculture 與 bind with…more readily 的「易與之結合」語意不合</div>"}, {"a": "pollution", "o": ["damages", "impairment", "harm", "pollution"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>herbicide pollution（除草劑污染）名詞搭配，minimize herbicide pollution</div><div class=\"reason\"><span class=\"tag t-num\">單複數</span>minimize 後接不可數名詞 pollution 最自然</div><div class=\"why\">✗ damages/harm 語意偏「傷害」、impairment 偏「損害/減損」，皆不如 pollution 對應前文 runoff 污染主題</div>"}], "pg": 156, "day": 41, "done": false}, {"id": "110207", "t": "Car Mechanic(汽車修理工)", "k": "dd", "parts": ["A spokesman for the project said: \"A car mechanic for ", "instance", " could find at a glance where a part on a certain car model is so that it can be identified and repaired. For the motorist the system could ", "highlight", " accident black spots or dangers on the road.\" In other cases the glasses could be worn by people going on a guided tour, ", "indicating", " points of interest or by people looking at panoramas where all the sites could be identified."], "opts": ["instance", "showing", "case", "emphasize", "indicating", "highlight"], "pg": 60, "day": 41, "done": false}, {"id": "110208", "t": "Bilingual Education(雙語教育)", "k": "dd", "parts": ["Roberto's story is just one of ", "countless", " success stories. Research has shown that bilingual education is the most ", "effective", " way both to teach children English and ensure that they succeed academically. In Arizona and Texas, bilingual students ", "consistently", " outperform their peers in monolingual programs. Calexico, California implemented bilingual education, and now has dropout rates that are less than half the state average and college ", "acceptance", " rates of more than 90%. In El Paso, bilingual education programs have helped raise student scores from the lowest in Texas to among the highest in the nation."], "opts": ["countless", "acceptance", "countable", "effective", "consistently", "regularly", "efficient", "approval"], "pg": 60, "day": 41, "done": false}, {"id": "080389", "t": "Babies(嬰兒)", "k": "d", "parts": ["How can you tell the difference between a French baby and a German baby? No, it's not that one is wearing a saucy little beret while the other is tucked into tiny pair of lederhosen. Well, maybe that's part of it. But a new study in the journal Current Biology shows that the babies actually sound different. Because the melody of an infant's cry matches its mother tongue. We all know that babies start ", "eavesdropping", " while they're still in the womb. So when they come out, they know their mother's voice. When they're older, they start to imitate the sounds they hear. Eventually they babble, and then start to speak, and then you never hear the end of it. But long before that first burble or coo, babies are learning the ", "elements", " of language. A team of scientists recorded the cries of 60 newborns: 30 born into ", "French speaking", " families and 30 that heard German. And they found that French infants wail on a rising note while the Germans favor a falling melody . Those ", "patterns", " match the rhythms of their native languages. So next time you hear a baby cry, listen closely. He could be telling you where he's from. eavesdropping overhearing snooping crying 3 French_speaking German_speaking French_spoken German_spoken"], "blanks": [{"a": "eavesdropping", "o": ["eavesdropping", "overhearing", "snooping", "crying"], "why": "<div class=\"reason\"><span class=\"tag t-sem\">語意</span>嬰兒在子宮內「偷聽」，eavesdropping while still in the womb 帶趣味語氣，後文重述此字</div><div class=\"why\">✗ overhearing 偏無意聽到；snooping 偏窺探打探；crying 哭與「在子宮聆聽語言」主題不符。</div>"}, {"a": "elements", "o": ["ingredients", "factors", "elements", "components"], "why": "<div class=\"reason\"><span class=\"tag t-sem\">語意</span>嬰兒學習語言的「要素/基本元素」，elements of language 為慣用說法</div><div class=\"reason\"><span class=\"tag t-coll\">搭配</span>elements of language 固定搭配，指語言要素</div><div class=\"why\">✗ ingredients 多指食材；factors 指因素；components 偏零件，皆不如 elements of language 自然。</div>"}, {"a": "French speaking", "o": ["French speaking", "German speaking", "French spoken", "German spoken"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>French-speaking families 固定複合形容詞，指「說法語的」家庭，用主動 -speaking</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>與下文 heard German 對比，指法語家庭</div><div class=\"why\">✗ French spoken/German spoken 用被動 -spoken 修飾 families 語法不當；German speaking 與下文 German 重複且與法語嬰兒對比不符。</div>"}, {"a": "patterns", "o": ["habits", "patterns", "routines", "behaviors"], "why": "<div class=\"reason\"><span class=\"tag t-sem\">語意</span>哭聲的升降「模式」對應母語節奏，those patterns match the rhythms，patterns 指規律模式</div><div class=\"reason\"><span class=\"tag t-coll\">搭配</span>patterns match the rhythms 表模式契合節奏</div><div class=\"why\">✗ habits/routines 偏個人習慣作息；behaviors 偏行為，皆不如 patterns 表哭聲的旋律規律。</div>"}], "pg": 156, "day": 42, "done": false}, {"id": "080390", "t": "Drinking Water(生活飲用水)", "k": "d", "parts": ["Water involves in almost all the ", "processes", " in our body such as digestion, elimination, assimilation, respiration, maintaining body temperature, etc. It is required to ", "remove", " the thirst of our body. We can live for days without food, however, cannot imagine living without water more than a day. The level of useful drinking water on the earth is very less and other water is salty and not useful to the living beings. Water is ", "required", " by everything like plants, animals, microorganisms, human being, etc, to fulfill the body requirements. Do we imagine what will ", "happen", " if the drinking water gets ", "finished", " a day or gets polluted? Yes, it is the main question which has opened the eyes of everyone and starts saving water at every place we belong like home, surrounding area, office, school, college, etc."], "blanks": [{"a": "processes", "o": ["operations", "processes", "work", "procedures"], "why": "<div class=\"reason\"><span class=\"tag t-sem\">語意</span>後接 such as digestion, respiration（消化、呼吸）等身體運作，processes（過程）切題</div><div class=\"why\">✗ operations/work/procedures 與「消化、呼吸等生理運作」語意不如 processes 自然</div>"}, {"a": "remove", "o": ["shift", "strengthen", "remove", "eradicate"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>remove the thirst（解渴）語意搭配，required to remove the thirst</div><div class=\"why\">✗ shift/strengthen 語意不合（移動/強化）、eradicate 語氣過強且不與 thirst 搭</div>"}, {"a": "required", "o": ["requiring", "required", "necessary", "essential"], "why": "<div class=\"reason\"><span class=\"tag t-tense\">時態</span>被動語態 is ___ by everything，需用過去分詞，Water is required by…</div><div class=\"reason\"><span class=\"tag t-coll\">搭配</span>be required by（被…所需）固定被動結構</div><div class=\"why\">✗ requiring 為現在分詞不合被動、necessary/essential 為形容詞無法接 by 形成被動</div>"}, {"a": "happen", "o": ["generate", "proceed", "happen"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>what will happen if…（如果…會發生什麼）固定搭配</div><div class=\"reason\"><span class=\"tag t-tense\">時態</span>what will ___ 後接原形動詞，happen 為不及物原形</div><div class=\"why\">✗ generate/proceed 語意不合、且 generate 為及物需受詞，what will happen 才自然</div>"}, {"a": "finished", "o": ["disappeared", "ended", "finished", "finalized"], "why": "<div class=\"reason\"><span class=\"tag t-tense\">時態</span>gets ___ 被動結構需過去分詞，the drinking water gets finished</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>與後文 or gets polluted 並列，gets finished（用盡）語意對應「水用完」</div><div class=\"why\">✗ disappeared 為不及物分詞不合 gets+pp 被動、ended/finalized 與「飲用水用盡」語意不貼</div>"}], "pg": 156, "day": 42, "done": false}, {"id": "080391", "t": "Competent Skills(勝任技能)", "k": "d", "parts": ["The skills you will develop on this course will help you become more confident and competent in The skills you will develop on this course will help you become more confident and competent in managing written and social aspects in your current career. It will ", "prepare", " you for further study in your area of interest. We ategy", " and control, while accounting degree students will be more focused on professional ", "principles", " and processes, used in order to manage numbers rather than ", "influence", " them."], "opts": ["reports", "influence", "statements", "location", "assess", "standards", "analyze", "principles", "strategy", "manage"], "pg": 68, "day": 46, "done": false}, {"id": "080412", "t": "Culturomics(文化經濟學)", "k": "d", "parts": ["They call it culturomics: the obvious play on the word \"genomics\" looks at trends in human thought and culture. But scientists say culturomics has been hampered by a lack of quantitative data. So researchers at Harvard, along with Google, Encyclopedia Britannica, and the ", "American", " Heritage Dictionary, have come up with a new tool. It's a database of 5·2 million books, published since the year 1500. That's four percent of all the books ever published, with a total of 500 billion words. The focus is on English language culture, so three quarters of the books are in English. Among the first findings of on English language culture, so three quarters of the books are in English. Among the first findings of the research, published in the journal Science : about, 8500 new words enter the English language annually. But many of them don't end up in ", "dictionaries", " . And about fame — actors become famous annually. But many of them don't end up in dictionaries . And about fame — actors become famous around age 30, writers around 40, and politicians around 50. But the fame of politicians can ", "eventually", " exceed that of actors. A Google tool called the Books Ngram Viewer is ", "available", " based on this data — exceed that of actors. A Google tool called the Books Ngram Viewer is available based on this data — users can track the usage and ", "frequency", " of a word or phrase over the past few centuries. Thus, we can watch the fall and rise of Melville. And soon the rise and fall of Snooki. watch the fall and rise of Melville. And soon the rise and fall of Snooki. dictionaries documentaries documents books inevitably successfully undoubtedly eventually applicable available accessible advisable"], "blanks": [{"a": "American", "o": ["America", "American", "Americans"], "why": "<div class=\"reason\"><span class=\"tag t-pos\">詞性</span>空格需形容詞修飾 Heritage Dictionary，American 為形容詞</div><div class=\"reason\"><span class=\"tag t-coll\">搭配</span>the American Heritage Dictionary 是專有名詞（美國傳統辭典）</div><div class=\"why\">✗ America 是名詞、Americans 是複數名詞，皆不能直接修飾後面的名詞片語</div>"}, {"a": "dictionaries", "o": ["dictionaries", "documentaries", "documents", "books"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>end up in dictionaries 固定搭配，指收錄入辭典</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>新詞 don&#x27;t end up in dictionaries，多數沒被收進辭典</div><div class=\"why\">✗ documentaries(紀錄片)、documents(文件)、books 與「新詞被收錄」語意不合</div>"}, {"a": "eventually", "o": ["inevitably", "successfully", "undoubtedly", "eventually"], "why": "<div class=\"reason\"><span class=\"tag t-sem\">語意</span>fame of politicians can eventually exceed，最終可超越，eventually=最終</div><div class=\"reason\"><span class=\"tag t-coll\">搭配</span>can eventually exceed 表終究會超過的時間推移</div><div class=\"why\">✗ inevitably(必然)、successfully(成功地)、undoubtedly(無疑)語氣與「隨時間最終」不符</div>"}, {"a": "available", "o": ["applicable", "available", "accessible", "advisable"], "why": "<div class=\"reason\"><span class=\"tag t-pos\">詞性</span>is available 形容詞當主詞補語，工具可取得</div><div class=\"reason\"><span class=\"tag t-coll\">搭配</span>a tool is available 固定搭配，指工具上線可用</div><div class=\"why\">✗ applicable(適用)、accessible(可進入)、advisable(明智)語意不如 available 貼切「可使用」</div>"}, {"a": "frequency", "o": ["frequency", "fluctuation", "popularity", "length"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>usage and frequency 並列，frequency 指出現頻率</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>track the usage and frequency of a word，追蹤詞的使用與頻率</div><div class ot."], "opts": ["is", "and", "possesses", "dry", "has", "dispose", "arid", "use", "also", "exists"], "pg": 92, "day": 47, "done": false}, {"id": "080432", "t": "Hibernation(冬眠)", "k": "d", "parts": ["Hibernation is a way for many creatures - from butterflies to bats - to survive cold, dark winters without having to forage for food or migrate to somewhere warmer. ", "Instead", " , they turn down their metabolisms to save energy. Animals in hot climates also ", "undergo", " a form of hibernation called aestivation. This works in a similar way and enables them to survive extreme heat, drought or lack of food. Hibernating is much more ", "profound", " than simply sleeping, though. Depending on the species, it can vary from long, deep unconsciousness to light spells of inactivity. But hibernation carries risks as the dormant animal is ", "vulnerable", " to predators and the unpredictable climate. However But Whereas Instead undergo stand experience bear"], "blanks": [{"a": "Instead", "o": ["However", "But", "Whereas", "Instead"], "why": "<div class=\"reason\"><span class=\"tag t-sem\">語意</span>前句講不必覓食或遷徙，後句講「改為調降代謝」，Instead 表「取而代之」的替代關係</div><div class=\"reason\"><span class=\"tag t-coll\">搭配</span>Instead, + 子句 為句首副詞用法，後接逗號獨立成句，文法成立</div><div class=\"why\">✗ However/But 表轉折而非替代、Whereas 為連接詞須連接兩子句不能單獨領句</div>"}, {"a": "undergo", "o": ["undergo", "stand", "experience", "bear"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>undergo a form of hibernation 為固定搭配，undergo 指「經歷（過程/變化）」</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>受詞為 aestivation 這種生理過程，undergo 最貼切</div><div class=\"why\">✗ stand/bear 偏「忍受」、experience 雖通但搭配 a form of 不如 undergo 自然</div>"}, {"a": "profound", "o": ["profound", "deep", "lasting", "remote"], "why": "<div class=\"reason\"><span class=\"tag t-sem\">語意</span>句意「冬眠遠比單純睡覺更___」，profound 指「程度深刻、根本」對比 simply sleeping</div><div class=\"reason\"><span class=\"tag t-coll\">搭配</span>much more profound than 為慣用比較結構</div><div class=\"why\">✗ deep 與後文 deep unconsciousness 重複且太字面、lasting 重「持久」、remote 語意不合</div>"}, {"a": "vulnerable", "o": ["vulnerable", "weak", "fragile", "delicate"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>vulnerable to predators 為固定搭配，vulnerable to 表「易受…侵害」</div><div class=\"reason\"><span class=\"tag t-sem\">語意</span>描述沉睡動物易遭掠食者與氣候威脅，vulnerable 強調「易受攻擊」</div><div class=\"why\">✗ weak/fragile/delicate 指本身脆弱，無法接 to predators 表達「易受外部威脅」之意</div>"}], "pg": 172, "day": 48, "done": false}, {"id": "080443", "t": "Crustaceans' Pain(甲殼動物的疼痛)", "k": "d", "parts": ["The last time you ", "splurged", " on a live lobster for dinner, you might not have given any thought to how much the little guy was going to suffer as he boiled to death. Until recently many researchers ", "believed", " the crustacean nervous system too primitive to process pain. But scientists at Queen's University in Belfast now think that crustaceans may be more sensitive to pain than ", "previously", " thought. The researchers used crabs as their test animals. And they found that crabs that ", "experienced", " an electric shock when they hid under a safe, dark rock would ", "eventually", " learn to avoid the hiding place. And that avoidance is key: the animals' ability to remember the unpleasant shock and avoid it is consistent with the ability to feel and remember pain. If the behavior was merely a reflex, the critters would continue to visit the shelter. The study is in the Journal of Experimental Biology. [Also see Nicola Stead, Painful Feelings in Crabs] The situation is likely the same with lobsters. So before you break out the bibs and melted butter, it might be nice to put your future dinner on a little anesthetic ice. believed speculated doubted assumed initially eventually previously ultimately survived experienced practiced handled"], "blanks": [{"a": "splurged", "o": ["spent", "indulged", "splurged", "consumed"], "why": "<div class=\"reason\"><span class=\"tag t-coll\">搭配</span>s

<!DOCTYPE html>
<html lang="zh-Hant" spellcheck="false">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SWT 四格漫畫 — 179 題一題一條，看圖就知道在講什麼</title>
<style>
:root{--ink:#222;--paper:#fffdf7;--line:#222;--and:#1d4ed8;--andbg:#dbeafe;--but:#b91c1c;--butbg:#fee2e2;--sw:#16a34a;}
*{box-sizing:border-box}
body{margin:0;font-family:'Noto Sans TC','Microsoft JhengHei',sans-serif;background:#f0ede6;color:var(--ink)}
header{position:sticky;top:0;z-index:5;background:#1a3a5c;color:#fff;padding:8px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
header h1{font-size:1rem;margin:0 8px 0 0}
header select,header button{padding:5px 10px;border:none;border-radius:4px;font-family:inherit;font-size:.85rem;cursor:pointer}
header select{max-width:46vw}
header button{background:#2c5282;color:#fff}
header button.on{background:#f1c40f;color:#222}
header a{color:#bdc3c7;font-size:.8rem;margin-left:auto;text-decoration:none}
main{max-width:1180px;margin:0 auto;padding:12px}
.legend{font-size:.8rem;color:#666;margin:0 0 10px;line-height:1.7}
.legend .cj{font-size:.8rem}
.strip{margin-bottom:34px}
.title{background:#fff;border:3px solid var(--line);border-radius:6px;padding:10px 14px;margin-bottom:12px;box-shadow:4px 4px 0 #222;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 10px}
.title .n{display:inline-block;background:#1a3a5c;color:#fff;border-radius:4px;padding:1px 10px;font-weight:700}
.title b{font-size:1.1rem}
.title .code{font-size:.75rem;color:#888}
.title .cnt{font-size:.75rem;color:#888;margin-left:auto}
.row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:10px}
.row.n3{grid-template-columns:repeat(3,1fr)}
.row.n5{grid-template-columns:repeat(5,1fr)}
.panel{background:var(--paper);border:3px solid var(--line);border-radius:4px;padding:6px 8px 10px;box-shadow:4px 4px 0 #222;display:flex;flex-direction:column;cursor:pointer;user-select:none}
.panel .num{font-size:.7rem;font-weight:700;color:#888;letter-spacing:1px;display:flex;justify-content:space-between}
.panel .num .cj{font-size:.85rem;letter-spacing:0}
.panel .pic{margin:2px 0 4px}.panel .pic svg{width:100%;height:auto;display:block;border:1.5px solid #bbb;border-radius:3px;background:#fff}
.panel .cap{font-size:.85rem;text-align:center;color:#444;margin-bottom:6px;font-weight:600}
.bubble{position:relative;background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px 12px;font-size:.98rem;line-height:1.55;margin-top:auto;font-weight:600}
.bubble::before{content:'';position:absolute;top:-12px;left:22px;border:6px solid transparent;border-bottom-color:var(--line);border-top:0}
.cj{font-weight:800;padding:0 5px;border-radius:4px;margin:0 2px}
.cj.and{color:var(--and);background:var(--andbg)}
.cj.but{color:var(--but);background:var(--butbg)}
.bubble .cj.lead{font-size:1.08em}
.sw{color:var(--sw);font-weight:800}
.og{color:#9ca3af;font-size:.8em;font-weight:400}
body.hideog .og{display:none}
.bubble .h{display:none;color:#999;font-weight:400;letter-spacing:1px;line-height:1.7}
body.hide .panel:not(.open) .bubble .f{display:none}
body.hide .panel:not(.open) .bubble .h{display:inline}
body.nocap .panel .cap{display:none}
body.nocap .zh{display:none}
.full{background:#fff;border:2px solid #222;border-radius:6px;padding:10px 14px;font-size:1rem;line-height:1.7;box-shadow:3px 3px 0 #222}
.full .lab{font-size:.72rem;color:#888;font-weight:700;letter-spacing:1px;display:block;margin-bottom:2px}
body.hide .full .ft{display:none}
body.hide .full .fh{display:block}
.full .fh{display:none;color:#999;font-weight:400;letter-spacing:1px}
.zh{background:#fff;border:2px dashed #aaa;border-radius:6px;padding:8px 12px;font-size:.88rem;color:#555;margin:8px 0 0;line-height:1.6}
.note{font-size:.8rem;color:#8a6d3b;background:#fff8e1;border-left:4px solid #f1c40f;padding:6px 10px;margin-top:8px;line-height:1.5}
.nav{display:flex;justify-content:space-between;margin:14px 0 30px}
.nav button{padding:8px 16px;border:2px solid #222;background:#fff;border-radius:6px;font-family:inherit;cursor:pointer;box-shadow:3px 3px 0 #222;font-size:.95rem}
.tip{font-size:.78rem;color:#888;text-align:center;margin-bottom:20px}
#loading{padding:40px;text-align:center;color:#888}
.err{color:#c0392b}
@media(max-width:900px){.row,.row.n5,.row.n3{grid-template-columns:repeat(2,1fr);gap:8px}.bubble{font-size:.92rem}}
@media(max-width:420px){.row,.row.n5,.row.n3{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>🎞️ SWT 四格漫畫</h1>
  <select id="sel"></select>
  <button id="bHide" title="遮住英文，點格子揭開">默寫</button>
  <button id="bCap" title="隱藏中文">藏中文</button>
  <button id="bOg" title="隱藏換字的原字">藏原字</button>
  <button id="bAll" title="179 題一頁連讀">連讀</button>
  <a href="SWT_擬答.html">擬答</a>
</header>
<main>
  <div class="legend">一格＝擬答裡的一句原文句（要打出來的句子）。格與格之間用 <span class="cj and">and</span>（接續）或 <span class="cj but">but</span>（轉折）接起來，最後一列是拼好的整句。<span class="sw">綠字</span>＝換字，<span class="og">(灰字)</span>＝原字。藍色關鍵字＝這格在講什麼。</div>
  <div id="loading">載入 SWT 擬答題庫中…</div>
  <div id="app" hidden></div>
</main>

    let [x, y, s] = lay[i];
    const body = SPR[name] || SPR.q;
    if (CONNECT.has(name)) { const s2 = s*.55; x += (100*s - 100*s2)/2; y += (100*s - 100*s2)/2; s = s2; }
    h += `<g transform="translate(${x} ${y}) scale(${s})">${body}`;
    badges.forEach((b, k) => {
      if (b === 'x') h += `<g>${BADGE.x}</g>`;
      else if (BADGE[b]) h += `<g transform="translate(${62 - k*4} ${-6 + k*30}) scale(.42)">${BADGE[b]}</g>`;
    });
    h += `</g>`;
  });
  if (label) h += `<text x="6" y="17" font-size="13" font-weight="700" fill="#2980b9" stroke="#fff" stroke-width="4" paint-order="stroke">${esc(label)}</text>`;
  return h + `</svg>`;
}

// ---------- 把擬答切成一格一句（對齊 src 來源句；對不齊就照連接詞切） ----------
const norm = t => t.replace(/[’‘]/g, "'").replace(/[“”]/g, '"');
const toks = t => norm(t).toLowerCase().replace(/[^a-z0-9'&\-\s]/g, ' ').split(/\s+/).filter(w => w && w !== 'and' && w !== 'but');
const UNIT = /\{(and|but)\}|\[([^|\]]+)\|([^\]]+)\]|\S+|\s+/g;
function splitPanels(d){
  const kept = (d.src || []).map(s => toks(s.replace(/~~.+?~~/g, ' ')).length);
  const units = []; let m;
  UNIT.lastIndex = 0;
  while ((m = UNIT.exec(d.ans))) {
    const u = m[0];
    if (m[1]) units.push(['conn', u, 0]);
    else if (m[2]) units.push(['swap', u, toks(m[3]).length]);
    else if (!u.trim()) units.push(['sp', u, 0]);
    else units.push(['w', u, toks(u).length]);
  }
  const total = units.reduce((a, u) => a + u[2], 0);
  if (kept.length && total === kept.reduce((a, b) => a + b, 0)) {
    const out = []; let cur = '', cnt = 0, i = 0;
    units.forEach(([kind, u, c]) => {
      if (i < kept.length - 1 && cnt >= kept[i] && (kind === 'conn' || (c > 0))) { out.push(cur.trim()); cur = ''; cnt = 0; i++; }
      cur += u; cnt += c;
    });
    out.push(cur.trim());
    return out;
  }
  // 後備：照 {and}/{but} 切
  return d.ans.split(/(?=\{(?:and|but)\})/).map(s => s.trim()).filter(Boolean);
}
function fmt(t){ // 標記 → HTML
  return esc(t).replace(/\[([^|\]]+)\|([^\]]+)\]/g, '<span class="sw">$1</span><span class="og">($2)</span>')
    .replace(/\{(and|but)\}/g, (m, c) => `<span class="cj ${c}">${c}</span>`);
}
function hint(t){ // 默寫提示：每字首字母
  const plain = t.replace(/\[([^|\]]+)\|[^\]]+\]/g, '$1').replace(/\{(and|but)\}/g, '$1');
  return plain.split(/\s+/).map(w => { const m = w.match(/[A-Za-z0-9]/); return m ? m[0] + '·' : w; }).join(' ');
}
function leadConn(t){ const m = t.match(/^\{(and|but)\}\s*/); return m ? [m[1], t.slice(m[0].length)] : [null, t]; }

// ---------- 畫一條 ----------
let DATA = [], cur = 0, ALL = false;
function stripHtml(d, idx){
  const pans = splitPanels(d), pic = PIC[d.num] || [];
  let h = `<div class="strip" id="s${d.num}"><div class="title"><span class="n">#${d.num}</span><b>${esc(d.title)}</b><span class="code">${esc(d.code || '')}</span><span class="cnt">${pans.length} 格｜${idx + 1} / ${DATA.length}</span></div>`;
  h += `<div class="row n${pans.length}">`;
  pans.forEach((p, i) => {
    const [conn, rest] = leadConn(p);
    const pp = pic[i] || [['q'], '', ''];
    const [icons, lab, zh] = pp;
    h += `<div class="panel"><div class="num"><span>${i + 1} / ${pans.length}</span>${conn ? `<span class="cj ${conn}">${conn}</span>` : ''}</div>
      <div class="pic">${scene(icons, lab)}</div>
      <div class="cap">${esc(zh || '')}</div>
      <div class="bubble">${conn ? `<span class="cj ${conn} lead">${conn}</span> ` : ''}<span class="f">${fmt(rest)}</span><span class="h">${esc(hint(rest))}</span></div></div>`;
  });
  h += `</div>`;
  h += `<div class="full"><span class="lab">整句（考場要打的）</span><span class="ft">${fmt(d.ans)}</span><span class="fh">${esc(hint(d.ans))}</span></div>`;
  if (d.zh) h += `<div class="zh">🗒️ ${esc(d.zh)}</div>`;
  if (d.note) h += `<div class="note">⚠️ ${d.note}</div>`;
  return h + `</div>`;
}
function render(){
  let h = '';
  if (ALL) h = DATA.map((d, i) => stripHtml(d, i)).join('');
  else h = stripHtml(DATA[cur], cur) + `<div class="nav"><button id="prev">◀ 上一題</button><button id="next">下一題 ▶</button></div><div class="tip">← → 鍵換題｜開「默寫」後點格子揭開英文｜網址加 #q題號 直達</div>`;
  $('app').innerHTML = h;
  if (!ALL) { $('prev').onclick = () => go(cur - 1); $('next').onclick = () => go(cur + 1); }
  document.querySelectorAll('.panel').forEach(p => p.onclick = () => p.classList.toggle('open'));
  $('sel').value = cur;
  if (!ALL) { history.replaceState(null, '', '#q' + DATA[cur].num); window.scrollTo(0, 0); }
}
function go(i){ cur = (i + DATA.length) % DATA.length; if (ALL) { const el = $('s' + DATA[cur].num); if (el) el.scrollIntoView(); $('sel').value = cur; history.replaceState(null, '', '#q' + DATA[cur].num); } else render(); }

const tog = (id, cls) => { $(id).onclick = () => { document.body.classList.toggle(cls); $(id).classList.toggle('on'); }; };
tog('bHide', 'hide'); tog('bCap', 'nocap'); tog('bOg', 'hideog');
$('bAll').onclick = () => { ALL = !ALL; $('bAll').classList.toggle('on', ALL); render(); if (ALL) go(cur); };
$('sel').onchange = () => go(+$('sel').value);
document.addEventListener('keydown', ev => { if (ev.target.tagName === 'SELECT') return; if (ev.key === 'ArrowRight') go(cur + 1); if (ev.key === 'ArrowLeft') go(cur - 1); });

fetch('SWT_擬答.html').then(r => { if (!r.ok) throw new Error(r.status); return r.text(); }).then(t => {
  try {
    const i = t.indexOf('const DATA = ['), j = t.indexOf('\n];', i);
    if (i < 0 || j < 0) throw new Error('找不到 const DATA');
    DATA = new Function('return ' + t.slice(t.indexOf('[', i), j + 2))();
  } catch (err) { $('loading').className = 'err'; $('loading').textContent = '擬答 DATA 解析失敗：' + err.message; return; }
  $('sel').innerHTML = DATA.map((d, i) => `<option value="${i}">#${d.num} ${esc(d.title)}</option>`).join('');
  const m = location.hash.match(/q(\d+)/); if (m) { const k = DATA.findIndex(d => d.num === +m[1]); if (k >= 0) cur = k; }
  $('loading').hidden = true; $('app').hidden = false;
  render();
}).catch(err => {
  $('loading').className = 'err';
  $('loading').innerHTML = '題庫載入失敗（' + esc(err.message) + '）。本機雙擊開會被擋，請用網址開：<b>jameskan-tw.github.io/pte-study/SWT_四格漫畫.html</b>';
});
</script>

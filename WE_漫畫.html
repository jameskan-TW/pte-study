<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WE 十格漫畫 — 一題一頁像讀漫畫</title>
<style>
:root{--ink:#222;--paper:#fffdf7;--line:#222;--g1:#2980b9;--g2:#e67e22;--g3:#8e44ad;--g4:#e74c3c;}
*{box-sizing:border-box}
body{margin:0;font-family:'Noto Sans TC','Microsoft JhengHei',sans-serif;background:#f0ede6;color:var(--ink)}
header{position:sticky;top:0;z-index:5;background:#2c3e50;color:#fff;padding:8px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
header h1{font-size:1rem;margin:0 8px 0 0}
header select,header button{padding:5px 10px;border:none;border-radius:4px;font-family:inherit;font-size:.85rem;cursor:pointer}
header button{background:#34495e;color:#fff}
header button.on{background:#f1c40f;color:#222}
header a{color:#bdc3c7;font-size:.8rem;margin-left:auto;text-decoration:none}
main{max-width:1100px;margin:0 auto;padding:12px}
.title{background:#fff;border:3px solid var(--line);border-radius:6px;padding:10px 14px;margin-bottom:12px;box-shadow:4px 4px 0 #222}
.title .n{display:inline-block;background:var(--c);color:#fff;border-radius:4px;padding:1px 8px;font-weight:700;margin-right:8px}
.title .en{font-size:.85rem;color:#555;margin-top:4px}
.title .st{font-size:.85rem;margin-top:4px}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:10px}
.row.one{grid-template-columns:1fr}
.plabel{grid-column:1/-1;font-size:.8rem;font-weight:700;color:#fff;background:var(--c);display:inline-block;width:max-content;padding:2px 10px;border-radius:12px;margin-bottom:-4px}
.panel{background:var(--paper);border:3px solid var(--line);border-radius:4px;padding:6px 8px 10px;box-shadow:4px 4px 0 #222;display:flex;flex-direction:column;cursor:pointer;user-select:none}
.panel .num{font-size:.7rem;font-weight:700;color:#888;letter-spacing:1px}
.panel .pic{margin:2px 0 4px}.panel .pic svg{width:100%;height:auto;display:block;border:1.5px solid #bbb;border-radius:3px;background:#fff}
.row.one .panel .pic svg{max-width:420px;margin:0 auto}
.panel .cap{font-size:.85rem;text-align:center;color:#444;margin-bottom:6px}
.panel .cap b{color:var(--c)}
.bubble{position:relative;background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px 12px;font-size:1rem;line-height:1.5;margin-top:auto;font-weight:600}
.bubble::before{content:'';position:absolute;top:-12px;left:22px;border:6px solid transparent;border-bottom-color:var(--line);border-top:0}
.bubble .s{display:block}
.bubble .s+.s{margin-top:4px;padding-top:4px;border-top:1px dashed #ccc}
.bubble i.a1{color:var(--g1);font-style:normal}.bubble i.a2{color:var(--g2);font-style:normal}.bubble i.a3{color:var(--g3);font-style:normal}.bubble i.a4{color:var(--g4);font-style:normal}
.bubble .h{display:none;color:#999;font-weight:400;letter-spacing:2px;background:#eee;border-radius:3px;padding:0 4px}
body.hide .panel:not(.open) .bubble .f{display:none}
body.hide .panel:not(.open) .bubble .h{display:inline}
body.nocap .panel .cap{display:none}
.zh{background:#fff;border:2px dashed #aaa;border-radius:6px;padding:8px 12px;font-size:.85rem;color:#555;margin:-2px 0 14px}
.nav{display:flex;justify-content:space-between;margin:10px 0 30px}
.nav button{padding:8px 16px;border:2px solid #222;background:#fff;border-radius:6px;font-family:inherit;cursor:pointer;box-shadow:3px 3px 0 #222}
.note{font-size:.78rem;color:#888;text-align:center;margin-bottom:20px}
#loading{padding:40px;text-align:center;color:#888}
.err{color:#c0392b}
@media(max-width:640px){.row{grid-template-columns:repeat(2,1fr);gap:8px}.bubble{font-size:.9rem}}
</style>
</head>
<body>
<header>
  <h1>🎞️ WE 十格漫畫</h1>
  <select id="sel"></select>
  <button id="bHide" title="遮住英文，點格子揭開">默寫</button>

  <a href="WE_論點總表.html">總表</a>

// 場景：[bg 名稱, [元件, x, y, 縮放, 選項]...]。座標是元件左上角在 300×150 畫布上的位置；縮放 1 = 100px 高。
// 選項：{flip:1} 左右翻轉、{t:'文字'} 元件上寫字（sign / bubble 用）。
function scene(sc){
  let h = `<svg viewBox="0 0 300 150" xmlns="http://www.w3.org/2000/svg">`;
  const [bg, ...items] = sc;
  if (bg) h += SPR[bg] || '';
  items.forEach(([name, x, y, s = 1, o = {}]) => {
    if (name === 'lbl') { h += `<text x="${x}" y="${y}" font-size="${11*s}" font-weight="700" fill="#2980b9" stroke="#fff" stroke-width="4" paint-order="stroke" text-anchor="${o.a||'middle'}">${o.t}</text>`; return; }
    const tf = o.flip ? `translate(${x + 100*s} ${y}) scale(${-s} ${s})` : `translate(${x} ${y}) scale(${s})`;
    h += `<g transform="${tf}">${SPR[name] || SPR.q}`;
    if (o.t) h += `<text x="50" y="${o.ty || 38}" font-size="${o.fs || 14}" text-anchor="middle" font-weight="700" fill="${o.fc || '#222'}">${o.t}</text>`;
    h += `</g>`;
  });
  return h + `</svg>`;
}

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
let DATA = [], ZH = {}, cur = 0;

function hint(html){ return html.replace(/<[^>]+>/g,'').split(/\s+/).map(w => w[0] || '').join(' '); }
function slotHtml(v){ return `<span class="s"><span class="f">${v}</span><span class="h">${esc(hint(v))}</span></span>`; }

function render(){
  const e = DATA[cur], es = e.es, c = GCOLOR[e.p3c] || '#7f8c8d';
  const own = PIC[e.n] || [], ln = LINE[QLINE[e.n]] || LINE.D;
  const p8 = ln.p8;
  const pics = [own[0],own[1],own[2],own[3],own[4],own[5],own[6], p8, ln.p9, own[7]].map(x => x || [null, ['q',110,20,.8]]);
  const z = ZH[e.n] || {};
  let h = `<div class="title" style="--c:${c}"><span class="n">${esc(e.n)}</span><b>${esc(e.t)}</b>
    <div class="en">${esc(e.en)}</div><div class="st">立場：${esc(e.stance)}｜P2 ${esc(e.p2zh||'')}｜P3 ${esc(e.p3zh||'')}</div></div>`;
  let lastP = 0;
  FRAMES.forEach((fr, i) => {
    if (fr.p !== lastP) {
      if (lastP) h += `</div>` + (z['p'+lastP] ? `<div class="zh">🗒️ ${esc(z['p'+lastP])}</div>` : '');
      h += `<div class="row${fr.p===4?' one':''}" style="--c:${c}"><div class="plabel">${PNAME[fr.p]}</div>`;
      lastP = fr.p;
    }
    const slots = fr.keys.filter(k => es[k]).map(k => slotHtml(es[k])).join('');
    let cap = (i === 7 || i === 8) ? fr.cap + `<span style="color:${c};font-size:.75rem">（${esc(ln.name)}）</span>` : fr.cap;
    if (i === 7) cap += `<div style="color:#2980b9;font-weight:700;font-size:.8rem">→ ${esc(DOES[e.n] || '')}</div>`;
    h += `<div class="panel" style="--c:${c}">
      <div class="num">${i+1} / 10</div>
      <div class="pic">${scene(pics[i])}</div>
      <div class="cap">${cap}</div>
      <div class="bubble">${slots}</div>
    </div>`;
  });
  h += `</div>` + (z.p4 ? `<div class="zh">🗒️ ${esc(z.p4)}</div>` : '');
  h += `<div class="nav"><button id="prev">◀ 上一題</button><button id="next">下一題 ▶</button></div>`;
  h += `<div class="note">第 8、9 格是「${esc(ln.name)}」共用畫面（同線題目看到同一張圖）｜開「默寫」後點格子揭開英文</div>`;
  $('app').innerHTML = h;
  $('prev').onclick = () => go(cur-1); $('next').onclick = () => go(cur+1);
  document.querySelectorAll('.panel').forEach(p => p.onclick = () => p.classList.toggle('open'));
  $('sel').value = cur;
  history.replaceState(null, '', '#q' + (cur+1));
  window.scrollTo(0,0);
}
function go(i){ cur = (i + DATA.length) % DATA.length; render(); }

$('bHide').onclick = () => { document.body.classList.toggle('hide'); $('bHide').classList.toggle('on'); };
$('bCap').onclick = () => { document.body.classList.toggle('nocap'); $('bCap').classList.toggle('on'); };
$('sel').onchange = () => go(+$('sel').value);
document.addEventListener('keydown', ev => { if (ev.key==='ArrowRight') go(cur+1); if (ev.key==='ArrowLeft') go(cur-1); });

fetch('WE_論點總表.html').then(r => { if(!r.ok) throw new Error(r.status); return r.text(); }).then(t => {
  try {
    const i = t.indexOf('const DATA = ['), j = t.indexOf('\n];', i);
    if (i < 0 || j < 0) throw new Error('找不到 const DATA');
    DATA = new Function('return ' + t.slice(t.indexOf('[', i), j + 2))();
    const zi = t.indexOf('const ZH = {'), zj = t.indexOf('\n};', zi);
    ZH = zi >= 0 && zj >= 0 ? new Function('return ' + t.slice(t.indexOf('{', zi), zj + 2))() : {};
  } catch (err) { $('loading').className='err'; $('loading').textContent = '總表 DATA 解析失敗：' + err.message; return; }
  $('sel').innerHTML = DATA.map((e,i) => `<option value="${i}">${esc(e.n)} ${esc(e.t)}</option>`).join('');
  const m = location.hash.match(/q(\d+)/); if (m) cur = Math.min(DATA.length-1, Math.max(0, +m[1]-1));
  $('loading').hidden = true; $('app').hidden = false;
  render();
}).catch(err => {
  $('loading').className='err';
  $('loading').innerHTML = '題庫載入失敗（' + esc(err.message) + '）。本機雙擊開會被擋，請用網址開：<b>jameskan-tw.github.io/pte-study/WE_漫畫.html</b>';
});

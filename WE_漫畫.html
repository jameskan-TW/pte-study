<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WE 十格漫畫 — 一題一頁像讀漫畫</title>
<style>
:root{--ink:#222;--paper:#fffdf7;--line:#222;--g1:#2980b9;--g2:#e67e22;--g3:#8e44ad;--g4:#e74c3c;}
*{box-sizing:border-box}
body{margin:0;font-family:'Noto Sans TC','Microsoft JhengHei',sans-serif;background:#f0ede6;color:var(--ink)}
header{position:sticky;top:0;z-index:5;background:#2c3e50;color:#fff;padding:8px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
header h1{font-size:1rem;margin:0 8px 0 0}
header select,header button{padding:5px 10px;border:none;border-radius:4px;font-family:inherit;font-size:.85rem;cursor:pointer}
header button{background:#34495e;color:#fff}
header button.on{background:#f1c40f;color:#222}
header a{color:#bdc3c7;font-size:.8rem;margin-left:auto;text-decoration:none}
main{max-width:1100px;margin:0 auto;padding:12px}
.title{background:#fff;border:3px solid var(--line);border-radius:6px;padding:10px 14px;margin-bottom:12px;box-shadow:4px 4px 0 #222}
.title .n{display:inline-block;background:var(--c);color:#fff;border-radius:4px;padding:1px 8px;font-weight:700;margin-right:8px}
.title .en{font-size:.85rem;color:#555;margin-top:4px}
.title .st{font-size:.85rem;margin-top:4px}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:10px;position:relative}
.row.one{grid-template-columns:1fr}
.plabel{grid-column:1/-1;font-size:.8rem;font-weight:700;color:#fff;background:var(--c);display:inline-block;width:max-content;padding:2px 10px;border-radius:12px;margin-bottom:-4px}
.panel{background:var(--paper);border:3px solid var(--line);border-radius:4px;padding:8px 10px 10px;box-shadow:4px 4px 0 #222;display:flex;flex-direction:column;min-height:190px;cursor:pointer;user-select:none}
.panel .num{font-size:.7rem;font-weight:700;color:#888;letter-spacing:1px}
.panel .pic{margin:4px 0 2px;text-align:center}.panel .pic svg{width:100%;max-width:260px;height:auto;display:block;margin:0 auto}
.panel .cap{font-size:.85rem;text-align:center;color:#444;margin-bottom:6px;min-height:1.2em}
.panel .cap b{color:var(--c)}
.bubble{position:relative;background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px 10px;font-size:.92rem;line-height:1.5;margin-top:auto}
.bubble::before{content:'';position:absolute;top:-12px;left:22px;border:6px solid transparent;border-bottom-color:var(--line);border-top:0}
.bubble .t{color:#999;font-size:.8rem}
.bubble .s{font-weight:600}
.bubble i.a1{color:var(--g1);font-style:normal}.bubble i.a2{color:var(--g2);font-style:normal}.bubble i.a3{color:var(--g3);font-style:normal}.bubble i.a4{color:var(--g4);font-style:normal}
.bubble .s .h{display:none;color:#999;font-weight:400;letter-spacing:2px;background:#eee;border-radius:3px;padding:0 4px}
body.hide .panel:not(.open) .bubble .s .f{display:none}
body.hide .panel:not(.open) .bubble .s .h{display:inline}
body.nocap .panel .cap{display:none}
.zh{background:#fff;border:2px dashed #aaa;border-radius:6px;padding:8px 12px;font-size:.85rem;color:#555;margin:-2px 0 14px}
.nav{display:flex;justify-content:space-between;margin:10px 0 30px}
.nav button{padding:8px 16px;border:2px solid #222;background:#fff;border-radius:6px;font-family:inherit;cursor:pointer;box-shadow:3px 3px 0 #222}
.note{font-size:.78rem;color:#888;text-align:center;margin-bottom:20px}
#loading{padding:40px;text-align:center;color:#888}
.err{color:#c0392b}
@media(max-width:640px){.row{grid-template-columns:repeat(2,1fr);gap:8px}.panel{min-height:160px}.panel .pic svg{max-width:100%}.bubble{font-size:.85rem}}
</style>
</head>
<body>
<header>
  <h1>🎞️ WE 十格漫畫</h1>
  <select id="sel"></select>
  <button id="bHide" title="遮住英文，點格子揭開">默寫</button>
  <button id="bCap" title="隱藏中文提示">藏中文</button>
  <a href="WE_論點總表.html">總表</a>
</header>
<main>
  <div id="loading">載入總表題庫中…</div>
  <div id="app" hidden></div>
</main>
<script>
// ---------- 十格對應（每題固定，這是「漫畫分鏡」） ----------
// 段落  格  內容 slot
// P1    1  topic        場景：這題在講什麼
//       2  va           反方說
//       3  vb (+p1end)  我方說
// P2    4  con + conR   讓步：承認對方有理
//       5  cond → resA  如果…就會…
//       6  resB → concl 進而導致…所以很多人…
// P3    7  stance+reason我方主張＋理由
//       8  does         James 做了什麼
//       9  result+impl  結果 → 帶回家庭
// P4   10  final+rec    結論＋建議
const FRAMES = [
 {p:1,k:'topic', cap:'這題在講…', t:'It is generally true that', keys:['topic']},
 {p:1,k:'va',    cap:'反方說', t:'Some people are of the opinion that', keys:['va']},
 {p:1,k:'vb',    cap:'我方說', t:'while others hold the view that', keys:['vb']},
 {p:2,k:'con',   cap:'先承認：<b>對方有理</b>', t:'It has to be admitted that … one argument in favor of this view can be that', keys:['con','conR']},
 {p:2,k:'cond',  cap:'如果…就會…', t:'If … then', keys:['cond','resA']},
 {p:2,k:'resB',  cap:'進而導致 → 難怪', t:'in turn leading to … As a result, it is unsurprising that', keys:['resB','concl']},
 {p:3,k:'stance',cap:'我方主張＋理由', t:'On the other hand, I firmly believe that … one compelling reason is that', keys:['stance','reason']},
 {p:3,k:'does',  cap:'James 做了什麼', t:'A pertinent case in point is James, who … As James', keys:['does']},
 {p:3,k:'result',cap:'結果 → <b>帶回家</b>', t:'he is able to … In other words,', keys:['result','impl']},
 {p:4,k:'final', cap:'結論＋建議', t:'In conclusion … I believe that … and it is crucial that', keys:['final','rec']},
];
const PNAME = {1:'P1 開場（立場）',2:'P2 讓步（承認對方）',3:'P3 主論（James 的故事）',4:'P4 結論'};
const GCOLOR = {1:'#2980b9',2:'#e67e22',3:'#8e44ad',4:'#e74c3c'};

// ---------- 線稿元件庫（每個都是 100×100 的黑線稿）----------
const ST = 'stroke="#222" stroke-width="3.5" fill="#fff" stroke-linecap="round" stroke-linejoin="round"';
const SPR = {
person:`<circle cx="50" cy="22" r="11" ${ST}/><path d="M50 33v32M50 45l-16 14M50 45l16 14M50 65l-13 28M50 65l13 28" ${ST}/>`,
james:`<circle cx="50" cy="22" r="11" ${ST}/><path d="M50 33v32M50 45l-16 14M50 45l16 14M50 65l-13 28M50 65l13 28" ${ST}/><path d="M46 34l4 8 4-8z" fill="#e74c3c" stroke="#222" stroke-width="2"/><text x="50" y="27" font-size="11" text-anchor="middle" font-weight="700" fill="#222">J</text>`,
old:`<circle cx="50" cy="26" r="11" ${ST}/><path d="M50 37v30M50 50l-14 12M50 50l14 12M50 67l-11 26M50 67l11 26M66 60v33" ${ST}/><path d="M40 20q10-8 20 0" ${ST}/>`,
family:`<circle cx="25" cy="24" r="9" ${ST}/><path d="M25 33v28M25 43l-12 10M25 43l12 10M25 61l-9 22M25 61l9 22" ${ST}/><circle cx="75" cy="24" r="9" ${ST}/><path d="M75 33v28M75 43l-12 10M75 43l12 10M75 61l-9 22M75 61l9 22" ${ST}/><circle cx="50" cy="48" r="7" ${ST}/><path d="M50 55v18M50 62l-8 7M50 62l8 7M50 73l-6 12M50 73l6 12" ${ST}/>`,
two:`<circle cx="30" cy="24" r="10" ${ST}/><path d="M30 34v30M30 45l-14 12M30 45l14 8M30 64l-11 26M30 64l11 26" ${ST}/><circle cx="70" cy="24" r="10" ${ST}/><path d="M70 34v30M70 45l14 12M70 45l-14 8M70 64l-11 26M70 64l11 26" ${ST}/>`,
house:`<path d="M15 50L50 18l35 32" ${ST}/><path d="M24 46v42h52V46" ${ST}/><rect x="42" y="62" width="16" height="26" ${ST}/><rect x="60" y="54" width="10" height="10" ${ST}/>`,
mall:`<rect x="10" y="30" width="80" height="58" ${ST}/><path d="M10 30l8-14h64l8 14" ${ST}/><path d="M20 45h12v10H20zM44 45h12v10H44zM68 45h12v10H68zM20 65h12v10H20zM68 65h12v10H68z" ${ST}/><rect x="42" y="66" width="16" height="22" ${ST}/><text x="50" y="27" font-size="11" text-anchor="middle" font-weight="700" fill="#222">MALL</text>`,
shop:`<rect x="20" y="45" width="60" height="43" ${ST}/><path d="M14 45l6-14h60l6 14z" ${ST}/><path d="M14 45q7 8 14 0q7 8 14 0q7 8 14 0q7 8 14 0q7 8 14 0" ${ST}/><rect x="42" y="64" width="16" height="24" ${ST}/><rect x="26" y="56" width="10" height="10" ${ST}/>`,
tv:`<rect x="14" y="26" width="72" height="50" rx="4" ${ST}/><path d="M50 26l-10-14M50 26l10-14M36 84h28M50 76v8" ${ST}/>`,
tvoff:`<rect x="14" y="26" width="72" height="50" rx="4" ${ST}/><path d="M50 26l-10-14M50 26l10-14M36 84h28M50 76v8" ${ST}/><path d="M24 36l52 30M76 36L24 66" stroke="#e74c3c" stroke-width="5" stroke-linecap="round"/>`,
plug:`<path d="M20 80q20 0 30-20t30-20" ${ST}/><rect x="72" y="30" width="20" height="18" rx="3" ${ST}/><path d="M92 35h6M92 43h6" ${ST}/>`,
clock:`<circle cx="50" cy="50" r="34" ${ST}/><path d="M50 26v24l16 10" ${ST}/><path d="M50 18v5M50 77v5M18 50h5M77 50h5" ${ST}/>`,
money:`<rect x="10" y="30" width="80" height="44" rx="4" ${ST}/><circle cx="50" cy="52" r="13" ${ST}/><text x="50" y="58" font-size="18" text-anchor="middle" font-weight="700" fill="#222">$</text>`,
heart:`<path d="M50 84L20 54q-12-14 0-26t30 4q18-16 30-4t0 26z" stroke="#222" stroke-width="3.5" fill="#f9c" stroke-linejoin="round"/>`,
check:`<path d="M20 55l20 20 40-45" stroke="#27ae60" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`,
cross:`<path d="M25 25l50 50M75 25L25 75" stroke="#e74c3c" stroke-width="9" stroke-linecap="round"/>`,
arrow:`<path d="M15 50h60M55 32l22 18-22 18" stroke="#222" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`,
vs:`<path d="M15 50h30M65 50h30M30 36l-14 14 14 14M80 36l14 14-14 14" stroke="#222" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`,
q:`<text x="50" y="80" font-size="90" text-anchor="middle" font-weight="700" fill="#222">?</text>`,
speech:`<path d="M15 20h70v40H45L30 75V60H15z" ${ST}/><path d="M30 40h40" stroke="#222" stroke-width="3.5" stroke-linecap="round"/>`,
nospeech:`<path d="M15 20h70v40H45L30 75V60H15z" ${ST}/><path d="M22 22l56 44" stroke="#e74c3c" stroke-width="5" stroke-linecap="round"/>`,
cart:`<path d="M10 25h12l10 40h44l8-28H30" ${ST}/><circle cx="38" cy="78" r="6" ${ST}/><circle cx="70" cy="78" r="6" ${ST}/>`,
sofa:`<rect x="10" y="45" width="80" height="30" rx="6" ${ST}/><rect x="20" y="30" width="60" height="20" rx="4" ${ST}/><path d="M16 75v10M84 75v10" ${ST}/>`,
table:`<ellipse cx="50" cy="50" rx="35" ry="6" ${ST}/><path d="M25 52v33M75 52v33" ${ST}/><circle cx="40" cy="44" r="6" ${ST}/><circle cx="62" cy="44" r="6" ${ST}/>`,
smile:`<circle cx="50" cy="50" r="34" ${ST}/><circle cx="37" cy="42" r="3" fill="#222"/><circle cx="63" cy="42" r="3" fill="#222"/><path d="M33 60q17 16 34 0" ${ST}/>`,
sad:`<circle cx="50" cy="50" r="34" ${ST}/><circle cx="37" cy="42" r="3" fill="#222"/><circle cx="63" cy="42" r="3" fill="#222"/><path d="M33 68q17-14 34 0" ${ST}/>`,
globe:`<circle cx="50" cy="50" r="34" ${ST}/><ellipse cx="50" cy="50" rx="14" ry="34" ${ST}/><path d="M16 50h68M22 32h56M22 68h56" stroke="#222" stroke-width="3"/>`,
building:`<rect x="20" y="15" width="60" height="75" ${ST}/><path d="M30 25h10v10H30zM45 25h10v10H45zM60 25h10v10H60zM30 45h10v10H30zM45 45h10v10H45zM60 45h10v10H60zM30 65h10v10H30zM60 65h10v10H60z" ${ST}/><rect x="44" y="70" width="12" height="20" ${ST}/>`,
book:`<path d="M15 25q17-6 35 4q18-10 35-4v55q-17-6-35 4q-18-10-35-4z" ${ST}/><path d="M50 29v55" stroke="#222" stroke-width="3"/>`,
phone:`<rect x="32" y="10" width="36" height="80" rx="6" ${ST}/><path d="M44 18h12" stroke="#222" stroke-width="3.5" stroke-linecap="round"/><circle cx="50" cy="82" r="2.5" fill="#222"/>`,
shield:`<path d="M50 12l32 10v28q0 26-32 40Q18 76 18 50V22z" ${ST}/><path d="M36 50l10 10 18-20" stroke="#222" stroke-width="4" fill="none"/>`,
flag:`<path d="M25 90V15" ${ST}/><path d="M25 18h50l-10 14 10 14H25z" stroke="#222" stroke-width="3.5" fill="#f1c40f"/>`,
target:`<circle cx="50" cy="50" r="34" ${ST}/><circle cx="50" cy="50" r="20" ${ST}/><circle cx="50" cy="50" r="6" fill="#e74c3c" stroke="#222" stroke-width="3"/>`,
bulb:`<path d="M35 60q-15-12-8-30t23-14q16 4 23 14t-8 30v8H35z" ${ST}/><path d="M38 78h24M42 88h16" ${ST}/>`,
};
// 場景 = 一排元件（由左到右）。畫布 300×110。
function scene(items){
  const n = items.length, w = 300 / n;
  let h = `<svg viewBox="0 0 300 110" xmlns="http://www.w3.org/2000/svg">`;
  items.forEach((name, i) => {
    const sz = Math.min(w, 100), x = w * i + (w - sz) / 2, y = (110 - sz) / 2;
    h += `<g transform="translate(${x} ${y}) scale(${sz/100})">${SPR[name] || SPR.q}</g>`;
  });
  return h + `</svg>`;
}
// ---------- 每題專屬的 10 格分鏡（元件名稱串起來）----------
// 只做了 #1、#2 當原型；其他題先用 GENERIC 通用分鏡。
const PIC = {
'①-1':[['mall','vs','shop'], ['shop','shield'], ['mall','check'],
       ['shop','two','speech'], ['cart','shop','two'], ['globe','two','heart'],
       ['mall','clock','arrow','family'], ['james','cart','mall'], ['clock','arrow','family','house'],
       ['mall','check','shop']],
'①-2':[['tv','q'], ['old','sofa','tv','heart'], ['tv','cross'],
       ['old','tv'], ['old','tv','smile'], ['smile','heart'],
       ['tv','nospeech'], ['james','tvoff','plug'], ['family','table','speech','heart'],
       ['tvoff','arrow','family','house']],
};
const GENERIC = [['q'], ['two','speech'], ['person','check'], ['two','heart'], ['arrow'], ['arrow','arrow'], ['target','bulb'], ['james','building'], ['family','house','heart'], ['flag']];

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
let DATA = [], ZH = {}, cur = 0;

function hint(html){ // 首字母提示：每個字只留第一個字母
  const txt = html.replace(/<[^>]+>/g,'');
  return txt.split(/\s+/).map(w => w[0] || '').join(' ');
}
function slotText(e, keys, fr){
  const parts = keys.map(k => {
    let v = e[k] || '';
    if (k === 'cond' && e.subj) v = v; // 主詞在模板灰字裡
    return `<span class="s"><span class="f">${v}</span><span class="h">${esc(hint(v))}</span></span>`;
  });
  // 連接灰字
  const glue = {
    'con':' , <span class="t">and one argument in favor of this view can be that</span> ',
    'cond':` , <span class="t">then ${esc(e.subj||'they')} ${esc(e.modal||'can')}</span> `,
    'resB':' . <span class="t">As a result, it is unsurprising that</span> ',
    'stance':' , <span class="t">and one compelling reason is that</span> ',
    'result':' . <span class="t">In other words,</span> ',
    'final':' , <span class="t">and it is crucial that</span> ',
  }[fr.k] || ' ';
  return parts.join(glue);
}
function lead(fr, e){
  if (fr.k === 'does') return `<span class="t">James, who ${esc(e.jv||'works')} at a … ${esc(e.jn||'firm')}. As James</span> `;
  if (fr.k === 'result') return `<span class="t">, ${esc(e.able||'he is able to')}</span> `;
  if (fr.k === 'vb' && e.p1end) return '<span class="t">while others hold the view that</span> ';
  return `<span class="t">${esc(fr.t.split(' … ')[0])}</span> `;
}

function render(){
  const e = DATA[cur], es = e.es, c = GCOLOR[e.p3c] || '#7f8c8d';
  const pics = PIC[e.n] || GENERIC;
  const z = ZH[e.n] || {};
  let h = `<div class="title" style="--c:${c}"><span class="n">${esc(e.n)}</span><b>${esc(e.t)}</b>
    <div class="en">${esc(e.en)}</div><div class="st">立場：${esc(e.stance)}｜P2 ${esc(e.p2zh||'')}｜P3 ${esc(e.p3zh||'')}</div></div>`;
  let lastP = 0;
  FRAMES.forEach((fr, i) => {
    if (fr.p !== lastP) {
      if (lastP) h += `</div>` + (z['p'+lastP] ? `<div class="zh">🗒️ ${esc(z['p'+lastP])}</div>` : '');
      h += `<div class="row${fr.p===4?' one':''}" style="--c:${c}"><div class="plabel">${PNAME[fr.p]}</div>`;
      lastP = fr.p;
    }
    let extra = '';
    if (fr.k === 'vb' && es.p1end) extra = ` . <span class="s"><span class="f">${es.p1end}</span><span class="h">${esc(hint(es.p1end))}</span></span>`;
    h += `<div class="panel" style="--c:${c}" data-i="${i}">
      <div class="num">${i+1} / 10</div>
      <div class="pic">${scene(pics[i])}</div>
      <div class="cap">${fr.cap}</div>
      <div class="bubble">${lead(fr,es)}${slotText(es, fr.keys, fr)}${extra}</div>
    </div>`;
  });
  h += `</div>` + (z.p4 ? `<div class="zh">🗒️ ${esc(z.p4)}</div>` : '');
  h += `<div class="nav"><button id="prev">◀ 上一題</button><button id="next">下一題 ▶</button></div>`;
  h += `<div class="note">${PIC[e.n] ? '這題有專屬分鏡圖' : '這題還是通用圖（原型階段只畫了 ①-1、①-2）'}｜開「默寫」後點格子揭開英文</div>`;
  $('app').innerHTML = h;
  $('prev').onclick = () => go(cur-1); $('next').onclick = () => go(cur+1);
  document.querySelectorAll('.panel').forEach(p => p.onclick = () => p.classList.toggle('open'));
  $('sel').value = cur;
  location.hash = 'q' + (cur+1);
  window.scrollTo(0,0);
}
function go(i){ cur = (i + DATA.length) % DATA.length; render(); }

$('bHide').onclick = () => { document.body.classList.toggle('hide'); $('bHide').classList.toggle('on'); };
$('bCap').onclick = () => { document.body.classList.toggle('nocap'); $('bCap').classList.toggle('on'); };
$('sel').onchange = () => go(+$('sel').value);
document.addEventListener('keydown', ev => { if (ev.key==='ArrowRight') go(cur+1); if (ev.key==='ArrowLeft') go(cur-1); });

fetch('WE_論點總表.html').then(r => { if(!r.ok) throw new Error(r.status); return r.text(); }).then(t => {
  try {
    const i = t.indexOf('const DATA = ['), j = t.indexOf('\n];', i);
    if (i < 0 || j < 0) throw new Error('找不到 const DATA');
    DATA = new Function('return ' + t.slice(t.indexOf('[', i), j + 2))();
    const zi = t.indexOf('const ZH = {'), zj = t.indexOf('\n};', zi);
    ZH = zi >= 0 && zj >= 0 ? new Function('return ' + t.slice(t.indexOf('{', zi), zj + 2))() : {};
  } catch (err) { $('loading').className='err'; $('loading').textContent = '總表 DATA 解析失敗：' + err.message; return; }
  $('sel').innerHTML = DATA.map((e,i) => `<option value="${i}">${esc(e.n)} ${esc(e.t)}</option>`).join('');
  const m = location.hash.match(/q(\d+)/); if (m) cur = Math.min(DATA.length-1, Math.max(0, +m[1]-1));
  $('loading').hidden = true; $('app').hidden = false;
  render();
}).catch(err => {
  $('loading').className='err';
  $('loading').innerHTML = '題庫載入失敗（' + esc(err.message) + '）。本機雙擊開會被擋，請用網址開：<b>jameskan-tw.github.io/pte-study/WE_漫畫.html</b>';
});
</script>
</body>
</html>

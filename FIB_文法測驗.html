", "ty": "FIB-DD", "cat": "ten", "ctx": "Easily, according to two physicians at Children's Hospital Boston and Harvard Medical School (HMS) who have been ____ the unique structure and chemistry of the adolescent brain.", "r": "exploring", "w": "explored", "why": "現在完成進行式 <span class=\"en\">have been exploring<\/span>；主詞是醫生＝動作發動者，用主動現在分詞。explored 會變成「大腦被探索」語態錯。", "opts": ["explored", "exploring", "explores", "explore"], "zh": "", "card": ""}, {"id": "10-2", "a": 10, "t": "Teenage Daughter 青少年大腦", "ty": "FIB-DD", "cat": "pos", "ctx": "\"It's a paradoxical time of ____.", "r": "development", "w": "growing", "why": "介系詞 of 後接標準名詞 <span class=\"en\">a time of development<\/span>＝發展的時期。學術寫作偏好名詞而非動名詞 growing。", "opts": ["growing", "grown", "development", "develops"], "zh": "of 後面接名詞", "card": "D2｜文法｜介系詞 of 後面要接名詞 → development；growing 是動名詞，學術文偏好正式名詞"}, {"id": "10-3", "a": 10, "t": "Teenage Daughter 青少年大腦", "ty": "FIB-DD", "cat": "sem", "ctx": "These are people with very ____ brains, but they're not quite sure what to do with them.\"", "r": "sharp", "w": "special", "why": "<span class=\"en\">sharp brains<\/span>＝敏銳犀利的大腦，精準點出反應敏捷。special（特別）太籠統空泛。", "opts": ["sharp", "special"], "zh": "腦筋敏銳", "card": "D2｜語意｜sharp 專指腦筋快、反應敏捷；special 只是「特別」，沒說到聰明"}, {"id": "11-1", "a": 11, "t": "Radioactivity 放射性", "ty": "FIB-DD", "cat": "log", "ctx": "____, we understand quite well the radiation levels to which people can be exposed without harm, and those levels are orders of magnitude above the typical background levels.", "r": "Nevertheless", "w": "Therefore", "why": "前句「令人害怕」與後句「其實我們很清楚安全劑量」是<b>轉折<\/b>，用 <span class=\"en\">Nevertheless<\/span>（然而），不是 Therefore（因此）。", "opts": ["Nevertheless", "Therefore"], "zh": "前後轉折＝然而", "card": "D2｜邏輯｜前句說輻射可怕，後句說其實很清楚安全劑量＝轉折 → Nevertheless；Therefore 是因果（因此）"}, {"id": "11-2", "a": 11, "t": "Radioactivity 放射性", "ty": "FIB-DD", "cat": "pos", "ctx": "Nevertheless, we understand quite well the radiation levels to which people can be ____ without harm, and those levels are orders of magnitude above the typical background levels.", "r": "exposed", "w": "exposure", "why": "<span class=\"en\">can be exposed<\/span> 被動語態需過去分詞。exposure 是名詞，詞性錯。", "opts": ["exposure", "exposed", "exposing", "expose"], "zh": "", "card": ""}, {"id": "11-3", "a": 11, "t": "Radioactivity 放射性", "ty": "FIB-DD", "cat": "col", "ctx": "Nevertheless, we understand quite well the radiation levels to which people can be exposed without harm, and those levels are orders of ____ above the typical background levels.", "r": "magnitude", "w": "volume", "why": "固定片語 <span class=\"en\">orders of magnitude<\/span>＝數量級（差好幾個級距）。volume 搭不上。", "opts": ["magnitude", "volume"], "zh": "數量級", "card": "D2｜搭配｜orders of magnitude 是固定片語；volume（體積、音量）搭不上"}, {"id": "12-1", "a": 12, "t": "Volcanoes 火山", "ty": "FIB-DD", "cat": "log", "ctx": "Volcanoes blast more than 100 million tons of carbon dioxide into the atmosphere every year but the gas is usually ____.", "r": "harmless", "w": "harmful", "why": "轉折詞 <span class=\"en\">but<\/span> + 後文「擴散、不集中、無立即危險」→ 平常是<b>無害的(harmless)<\/b>。harmful 與後文矛盾。", "opts": ["harmless", "harmful"], "zh": "", "card": ""}, {"id": "12-2", "a": 12, "t": "Volcanoes 火山", "ty": "FIB-DD", "cat": "col", "ctx": "When a volcano erupts, carbon dioxide spreads out into the atmosphere and isn't ____ in one spot.", "r": "concentrated", "w": "condensed", "why": "氣體在局部「聚集、集中」用 <span class=\"en\">concentrated<\/span>。condensed（凝結成液體）指物態改變，這裡是擴散/稀釋。", "opts": ["concentrated", "condensed"], "zh": "", "card": ""}, {"id": "12-3", "a": 12, "t": "Volcanoes 火山", "ty": "FIB-DD", "cat": "col", "ctx": "If it escapes to the surface in a dense ____, it can push out oxygen-rich air and become deadly.", "r": "cloud", "w": "air", "why": "高濃度氣體湧出形成 <span class=\"en\">gas cloud<\/span>（氣雲）。填 air 語意重複（後面已有 oxygen-rich air）且不通。", "opts": ["cloud", "air"], "zh": "", "card": ""}, {"id": "13-1", "a": 13, "t": "School-to-work Transitions 學校到工作的過渡", "ty": "FIB-DD", "cat": "sem", "ctx": "The status passage of youth from school-to-work has changed structurally under late modernism, and young people are ____ to adapt to changing demands of their environment especially when planning for entry into the labour market.", "r": "forced", "w": "struggling", "why": "語意：年輕人「被迫」<span class=\"en\">forced to adapt<\/span> 適應環境變化。<span class=\"en\">struggling<\/span>（掙扎）雖文法通，但機經正解強調外在壓力下的<b>被迫<\/b>，語意更精準。", "opts": ["forced", "struggling"], "zh": "被迫適應", "card": "D2｜語意｜前面說環境結構改變＝外在壓力 → be forced to（被迫）；be struggling to 是自己掙扎，沒有被逼的意思"}, {"id": "14-1", "a": 14, "t": "The Bridge to Pop 通往流行音樂的橋樑", "ty": "FIB-DD", "cat": "ten", "ctx": "Jasper Johns ____ iconic imagery like the American flag; Robert Rauschenberg employed silk-screen printings and found objects; and Larry Rivers used images of mass-produced goods.", "r": "reimagined", "w": "have been reimagining", "why": "時態：主詞 Jasper Johns（單數人名），且與後文 <span class=\"en\">Rauschenberg employed<\/span>、<span class=\"en\">Rivers used<\/span> 並列，全用<b>過去簡單式<\/b> → <span class=\"en\">reimagined<\/span>。", "opts": ["have been reimagining", "reimagined", "has reimagined", "reimagining"], "zh": "跟後面 employed／used 並列，過去式", "card": "D2｜文法｜分號串三個人：Rauschenberg employed、Rivers used 都是過去簡單式 → 第一個也用過去式 reimagined"}, {"id": "15-1", "a": 15, "t": "Wine and ale 葡萄酒與麥芽酒", "ty": "FIB-DD", "cat": "col", "ctx": "From that date on, the blood of the grape began to make its ____ north and east along major river systems together with imported metal and ceramic drinking vessels from the Greek world.", "r": "way", "w": "direction", "why": "固定搭配 <span class=\"en\">make its way<\/span>（一路前行、蔓延）。<span class=\"en\">make its direction<\/span> 不成搭配。", "opts": ["way", "direction"], "zh": "make its way＝一路前進", "card": "D2｜搭配｜make its way 是固定片語（一路往某方向前進）；make its direction 不是英文說法"}, {"id": "16-1", "a": 16, "t": "Monkeys and typewriters 猴子與打字機", "ty": "FIB-DD", "cat": "sem", "ctx": "This ____ often used is the one that the monkey and the typewriters.", "r": "illustration", "w": "scenario", "why": "語意：這裡指「常被拿來<b>舉例說明<\/b>的例子」→ <span class=\"en\">illustration<\/span>（例證）。<span class=\"en\">scenario<\/span>（情境）語意不對。", "opts": ["illustration", "scenario"], "zh": "", "card": ""}, {"id": "16-2", "a": 16, "t": "Monkeys and typewriters 猴子與打字機", "ty": "FIB-DD", "cat": "sem", "ctx": "…he numbers \"to be or not to be is the question\" takes 12.6 trillion trillion trillion years to type just that ____ and a DNA string that something of that complexity emerges by chance undirected within 600 million years?", "r": "phrase", "w": "sentence", "why": "語意：引文 \"to be or not to be\" 稱作 <span class=\"en\">phrase<\/span>（片語／短語），非完整句子 <span class=\"en\">sentence<\/span>。", "opts": ["phrase", "sentence"], "zh": "", "card": ""}, {"id": "17-1", "a": 17, "t": "Job-hunting 求職", "ty": "FIB-DD", "cat": "col", "ctx": "With the job interview, it's how you're dressed that sets the ____ of the interview.", "r": "tone", "w": "standard", "why": "固定搭配 <span class=\"en\">set the tone<\/span>（定調、奠定基調）。<span class=\"en\">set the standard<\/span> 語意（設立標準）不合此處。", "opts": ["tone", "standard"], "zh": "", "card": ""}, {"id": "17-2", "a": 17, "t": "Job-hunting 求職", "ty": "FIB-DD", "cat": "sem", "ctx": "Dressing conservatively is always the safest route, but you should also try and do a little ____ of your prospective employer so that what you wear to the interview makes you look as though you fit in with the organization.", "r": "investigation", "w": "integration", "why": "語意：對未來雇主「做點<b>調查了解<\/b>」→ <span class=\"en\">investigation<\/span>。<span class=\"en\">integration<\/span>（整合）意思不對。", "opts": ["investigation", "integration"], "zh": "", "card": ""}, {"id": "18-1", "a": 18, "t": "An Artist's Life 藝術家的生活", "ty": "FIB-DD", "cat": "col", "ctx": "The ____ decades of an artist's life do not generally make the biographer's heart beat faster, but Claude Monet is one of a handful of painters who bucks the pattern of an irrelevant old age.", "r": "closing", "w": "final", "why": "固定搭配 <span class=\"en\">the closing decades / years<\/span>＝人生/生涯的<b>晚期<\/b>。final 意思雖近，但機經正解用慣用的 closing 收尾。", "opts": ["closing", "final"], "zh": "人生晚期", "card": "D3｜搭配｜the closing years／decades 是講「晚年」的慣用說法；final 意思接近但不是正解"}, {"id": "18-2", "a": 18, "t": "An Artist's Life 藝術家的生活", "ty": "FIB-DD", "cat": "sem", "ctx": "The closing decades of an artist's life do not generally make the biographer's heart beat faster, but Claude Monet is one of a handful of painters who bucks the pattern of an ____ old age.", "r": "irrelevant", "w": "unimportant", "why": "語意：多數藝術家晚年會<b>淡出、失去影響力<\/b>→ <span class=\"en\">an irrelevant old age<\/span>（無足輕重的晚年），Monet 打破這模式。unimportant 太籠統。", "opts": ["irrelevant", "unimportant"], "zh": "無足輕重的晚年", "card": "D3｜語意｜後面說 Monet「打破」這模式 → 一般藝術家晚年是失去影響力、沒人在乎＝irrelevant；unimportant 太籠統"}, {"id": "19-1", "a": 19, "t": "Quake-resistant Structures 抗震結構", "ty": "FIB-DD", "cat": "col", "ctx": "Later, people tried to lift a building off its foundation, and insert rubber and steel between the building and its foundation to ____ the impact of ground vibrations.", "r": "reduce", "w": "force", "why": "固定搭配 <span class=\"en\">reduce the impact<\/span>＝<b>減弱<\/b>衝擊。你把 force 錯放這格；這裡要「削弱地震震動」→ reduce。", "opts": ["reduce", "force"], "zh": "", "card": ""}, {"id": "19-2", "a": 19, "t": "Quake-resistant Structures 抗震結構", "ty": "FIB-DD", "cat": "col", "ctx": "The most ____ designs give buildings brains as well as concrete and steel supports, called smart buildings, the structures respond like living organisms to an earthquake's vibrations.", "r": "recent", "w": "latest", "why": "慣用 <span class=\"en\">the most recent designs<\/span>＝最新設計。英文不說 <span class=\"en\">most latest<\/span>（latest 本身已含最高級意味）。", "opts": ["recent", "latest"], "zh": "", "card": ""}, {"id": "19-3", "a": 19, "t": "Quake-resistant Structures 抗震結構", "ty": "FIB-DD", "cat": "sem", "ctx": "When ground shakes and the building tips forward, the computer would ____ the building to shift in the opposite direction.", "r": "force", "w": "secure", "why": "語意：電腦「<b>迫使<\/b>」建築往反方向移動→ <span class=\"en\">force the building to shift<\/span>。secure（固定住）與「移動」矛盾。", "opts": ["force", "secure"], "zh": "", "card": ""}, {"id": "20-1", "a": 20, "t": "Botswana 博茨瓦納", "ty": "FIB-DD", "cat": "sem", "ctx": "Yet Botswana remains one of the wealthiest and most stable countries on the African ____.", "r": "continent", "w": "region", "why": "語意/常識：非洲是一塊<b>大陸<\/b>→ <span class=\"en\">the African continent<\/span>。region（地區）範圍較小、指大陸內的一部分，用字不精準。", "opts": ["continent", "region"], "zh": "非洲大陸", "card": "D3｜語意｜非洲是一整塊大陸 → continent；region 指大陸裡的一小塊地區"}, {"id": "21-1", "a": 21, "t": "Taylor's Restaurant 學生經營餐廳", "ty": "FIB-D", "cat": "sem", "ctx": "Students in quantity food production and service management ____ make the articulate and detailed dishes.", "r": "classes", "w": "disciplines", "why": "線索是「學生做菜」→ 是修「量化食品製作與服務管理<b>課<\/b>」的學生：<span class=\"en\">students in ... classes<\/span>。<span class=\"en\">disciplines<\/span>（學科領域）是抽象領域，不是上課的班。", "opts": ["classes", "disciplines"], "zh": "修課的學生；-ss 結尾加 -es", "card": "D3｜語意＋文法｜students in … classes＝修某課的學生；disciplines 是抽象學科。學生是複數 → 課也用複數，class 是 -ss 結尾所以加 -es"}, {"id": "21-2", "a": 21, "t": "Taylor's Restaurant 學生經營餐廳", "ty": "FIB-D", "cat": "sem", "ctx": "Dishes such as orecchiette and butternut squash, pappardelle with duck and bistro chicken will please any appetite while imparting the need to ____ for a second taste.", "r": "return", "w": "review", "why": "語意：菜好吃到讓人想「<b>回來<\/b>再嚐一次」→ <span class=\"en\">return for a second taste<\/span>。<span class=\"en\">review<\/span>（評論）跟 second taste 接不起來。", "opts": ["return", "review"], "zh": "回來再吃一次", "card": "D3｜語意｜for a second taste＝再嚐一次 → 要「回來」return；review（評論）接不上"}, {"id": "22-1", "a": 22, "t": "Walt Disney World 華特迪士尼世界", "ty": "FIB-DD", "cat": "sem", "ctx": "Walt Disney World has become a pilgrimage site partly because of the luminosity of its cross culture and marketing and partly because its ____ aspects appeal powerfully to real needs in the capitalist society.", "r": "utopian", "w": "childhood", "why": "「___ aspects 呼應資本主義社會的<b>真實需求<\/b>」→ 烏托邦式想像 <span class=\"en\">utopian aspects<\/span>。childhood 是下一格的答案——放錯位置引發<b>連鎖錯<\/b>（拖拉題先想全局再放字）。", "opts": ["utopian", "childhood"], "zh": "", "card": ""}, {"id": "22-2", "a": 22, "t": "Walt Disney World 華特迪士尼世界", "ty": "FIB-DD", "cat": "sem", "ctx": "Disney's marketing is unique because it captured the symbolic essence of ____ but the company has gained access to all public shows, comic books, dolls, apparels, and educational film strips all point to the parks and each other.", "r": "childhood", "w": "illusion", "why": "<span class=\"en\">captured the symbolic essence of childhood<\/span>＝抓住<b>童年<\/b>的象徵本質（迪士尼的核心）。illusion（幻覺）語意偏掉。", "opts": ["childhood", "illusion"], "zh": "", "card": ""}, {"id": "22-3", "a": 22, "t": "Walt Disney World 華特迪士尼世界", "ty": "FIB-DD", "cat": "sem", "ctx": "Disney's marketing is unique because it captured the symbolic essence of childhood but the company has gained access to all public shows, comic books, dolls, apparels, and ____ film strips all point to the parks and each other.", "r": "educational", "w": "adults", "why": "並列清單全是兒童產品（comic books、dolls、apparels）→ <span class=\"en\">educational film strips<\/span>（教育影片）；而且這格要<b>形容詞<\/b>修飾 film strips，adults 是名詞。", "opts": ["educational", "adults"], "zh": "", "card": ""}, {"id": "23-1", "a": 23, "t": "Integrate Sales Activities 整合銷售活動", "ty": "FIB-D", "cat": "col", "ctx": "The book addresses how sales can help organisations to become more customer oriented and considers how they are responding to challenges such as increasing competition, more ____ customers and a more complex selling environment.", "r": "demanding", "w": "considerable", "why": "固定搭配 <span class=\"en\">demanding customers<\/span>＝<b>要求高的<\/b>顧客（跟 increasing competition、complex environment 並列的挑戰）。considerable（相當大的）不能拿來形容顧客難搞。", "opts": ["demanding", "considerable"], "zh": "", "card": ""}, {"id": "23-2", "a": 23, "t": "Integrate Sales Activities 整合銷售活動", "ty": "FIB-D", "cat": "pos", "ctx": "Many organisations are facing escalating costs and a growth in customer power, ____ makes it necessary to allocate resources more strategically.", "r": "which", "w": "that", "why": "逗號後的非限定關係子句只能用 <span class=\"en\">which<\/span>（指前面整件事）：<span class=\"en\">..., which makes it necessary...<\/span>。<b>that 不能接在逗號後面<\/b>。", "opts": ["that", "which", "it", "what"], "zh": "這件事使得……", "card": "D4｜文法｜逗號後接補充說明只能用 which（指前面整件事）；that 不能放逗號後"}, {"id": "23-3", "a": 23, "t": "Integrate Sales Activities 整合銷售活動", "ty": "FIB-D", "cat": "pos", "ctx": "However, the authors say that within the industry ____ is still uncertainty about the shape a future sales team should take, how it should be managed, and how it fits into their organisations business model.", "r": "there", "w": "that", "why": "存在句：<span class=\"en\">there is still uncertainty<\/span>＝「業界仍存在不確定性」。that is uncertainty 不成句。", "opts": ["that", "it", "there", "this"], "zh": "業界裡有不確定性", "card": "D4｜文法｜____ + is + 名詞、意思是「有」→ there is；within the industry 是介系詞片語不能當主詞，that 沒東西可指"}, {"id": "23-4", "a": 23, "t": "Integrate Sales Activities 整合銷售活動", "ty": "FIB-D", "cat": "col", "ctx": "However, the authors say that within the industry there is still uncertainty about the shape a future sales team should take, how it should be managed, and how it ____ into their organisations business model.", "r": "fits", "w": "adapts", "why": "固定搭配 <span class=\"en\">fit into<\/span>＝融入 → <span class=\"en\">how it fits into their business model<\/span>。adapt 的搭配是 <span class=\"en\">adapt to<\/span>，不接 into。", "opts": ["fits", "adapts"], "zh": "", "card": ""}, {"id": "24-1", "a": 24, "t": "Zika Virus 茲卡病毒", "ty": "FIB-D", "cat": "log", "ctx": "Despite Zika's vast ____ over almost 70 years, there is little genetic difference among the various strains, according to an analysis by researchers at the University of Texas Medical Branch at Galveston.", "r": "range", "w": "immutability", "why": "<span class=\"en\">Despite<\/span> 轉折：「儘管分布<b>範圍<\/b>廣、流行近 70 年，基因差異卻很小」→ <span class=\"en\">vast range<\/span>。填 immutability（不變性）跟後半「差異小」<b>同方向<\/b>，Despite 就轉不起來。", "opts": ["range", "immutability"], "zh": "", "card": ""}, {"id": "24-2", "a": 24, "t": "Zika Virus 茲卡病毒", "ty": "FIB-D", "cat": "ten", "ctx": "Instead public health officials probably did not understand Zika's potential because the virus ____ mostly in remote locations until recently.", "r": "circulated", "w": "are circulated", "why": "<span class=\"en\">circulate<\/span>（流行、傳播）在這裡是<b>不及物<\/b>動詞，用主動過去式：<span class=\"en\">the virus circulated mostly in remote locations<\/span>。不用被動、也不是現在式。", "opts": ["are circulated", "circulated", "is circulated", "circulating"], "zh": "病毒（以前）主要在偏遠地區流傳", "card": "D4｜文法｜三關：主詞 the virus 單數；病毒自己流傳、後面沒有 by → 主動；until recently → 過去式。對照同篇 which is transmitted by mosquito bite（被蚊子傳 → 被動）"}, {"id": "25-1", "a": 25, "t": "City Design 城市設計", "ty": "FIB-DD", "cat": "sem", "ctx": "After thousands of years of progress in urban development, we ____ some 60 years ago.", "r": "plateaued", "w": "用猜的", "why": "<span class=\"en\">plateau<\/span> 當動詞＝<b>進步到頂、停滯<\/b>（像走到高原平台）。線索：前面「進步了幾千年」＋後面「不再更安全、還在變差」→ 60 年前就停滯了。字庫裡 <span class=\"en\">recovered<\/span>（恢復）方向相反、<span class=\"en\">retarded<\/span>（遲滯）是及物動詞這裡不合。", "opts": ["plateaued", "用猜的"], "zh": "（進步）停滯、到頂了", "card": "D4｜語意｜plateau 當動詞＝走到高原平台不再往上；前面「進步幾千年」＋後面「不再更安全、還在變差」→ 60 年前就停了。recovered（恢復）方向相反"}, {"id": "25-2", "a": 25, "t": "City Design 城市設計", "ty": "FIB-DD", "cat": "sem", "ctx": "Cities are not safer, healthier, more efficient, or more ____.", "r": "equitable", "w": "用猜的", "why": "並列線索：<span class=\"en\">safer, healthier, more efficient, or more ___<\/span> 全是「城市的優點」→ <span class=\"en\">equitable<\/span>＝<b>公平的<\/b>（equal 同字根）。<span class=\"en\">broad<\/span>（寬的）不是城市優點，塞不進這串。", "opts": ["equitable", "用猜的"], "zh": "", "card": ""}, {"id": "25-3", "a": 25, "t": "City Design 城市設計", "ty": "FIB-DD", "cat": "col", "ctx": "The statistics on chronic disease, rising road tolls and congestion in our urban environments paint a ____ future.", "r": "bleak", "w": "用猜的", "why": "固定搭配 <span class=\"en\">paint a bleak future<\/span>＝描繪出<b>黯淡的<\/b>前景（同款：<span class=\"en\">a bleak picture/outlook<\/span>）。線索：前面全是慢性病、路費、塞車等壞消息。", "opts": ["bleak", "用猜的"], "zh": "描繪出黯淡的前景", "card": "D4｜搭配｜paint a bleak future／picture／outlook 是固定說法；線索：前面全是慢性病、車禍死亡、塞車等壞消息"}, {"id": "26-1", "a": 26, "t": "Imperial Control 帝國控制", "ty": "FIB-D", "cat": "sem", "ctx": "In the southern cone especially, from Venezuela to Argentina, the region is rising to overthrow the legacy of external ____ of the past centuries and the cruel and destructive social forms that they have helped to establish.", "r": "domination", "w": "invasion", "why": "<span class=\"en\">external domination of the past centuries<\/span>＝數世紀的外部<b>支配<\/b>（長期狀態，才「幫忙建立了社會形態」）。invasion（入侵）是單次事件，接不上 of the past centuries。", "opts": ["domination", "invasion"], "zh": "幾世紀的外來支配", "card": "D4｜語意｜of the past centuries＝持續幾百年的狀態 → domination（長期支配）；invasion（入侵）是單次事件，撐不了幾世紀"}, {"id": "26-2", "a": 26, "t": "Imperial Control 帝國控制", "ty": "FIB-D", "cat": "col", "ctx": "Throughout the region a vibrant ____ of popular movements provide the basis for a meaningful democracy.", "r": "array", "w": "group", "why": "固定搭配 <span class=\"en\">an array of<\/span>＝一系列、林林總總 → <span class=\"en\">a vibrant array of popular movements<\/span>。group 語氣太弱也不慣用。", "opts": ["array", "group"], "zh": "一系列活躍的人民運動", "card": "D4｜搭配｜an array of＝一系列、各式各樣；group 多指一群人，配 movements 不自然"}, {"id": "26-3", "a": 26, "t": "Imperial Control 帝國控制", "ty": "FIB-D", "cat": "sem", "ctx": "They have sought to construct democratic systems based on popular participation rather than elite and foreign ____.", "r": "domination", "w": "suppression", "why": "呼應開頭的 <span class=\"en\">external domination<\/span>——同一篇文章常<b>重複同一個字<\/b>當線索：<span class=\"en\">elite and foreign domination<\/span>。suppression（鎮壓）偏離「菁英／外國主導」的語意。", "opts": ["domination", "suppression"], "zh": "幾世紀的外來支配", "card": "D4｜語意｜of the past centuries＝持續幾百年的狀態 → domination（長期支配）；invasion（入侵）是單次事件，撐不了幾世紀"}, {"id": "27-1", "a": 27, "t": "SpaceX Dragon Capsule 龍飛船", "ty": "FIB-D", "cat": "sem", "ctx": "The rocket lofted an uncrewed ____ of SpaceX's Dragon capsule, which is designed to one-day carry both crew and cargo to orbit.", "r": "mockup", "w": "structure", "why": "火箭載的是無人的<b>實體模型 (mockup)<\/b>——Dragon 太空艙的樣機，還不是真的載人艙。structure（結構）太空泛，<span class=\"en\">an uncrewed structure<\/span> 說不通。", "opts": ["mockup", "structure"], "zh": "無人的實體模型、樣機", "card": "D4｜語意｜uncrewed＋of Dragon capsule → 測試送上去的是樣機，不是真的載人艙；structure（結構）太空泛"}, {"id": "27-2", "a": 27, "t": "SpaceX Dragon Capsule 龍飛船", "ty": "FIB-D", "cat": "col", "ctx": "\"This has been a good day for SpaceX and a ____ development for the US human space flight programme,\" said Robyn Ringuette of SpaceX in a webcast of the launch.", "r": "promising", "w": "encouraging", "why": "慣用搭配 <span class=\"en\">a promising development<\/span>＝有前景的進展；下文 SpaceX 想贏 NASA 合約，重點是「未來可期」。encouraging 意思近，但這裡搭 promising 才道地。", "opts": ["promising", "encouraging"], "zh": "有前景的進展", "card": "D4｜搭配｜a promising development 是慣用搭配；下文想拿 NASA 合約＝未來可期。encouraging 意思近但不是正解"}, {"id": "27-3", "a": 27, "t": "SpaceX Dragon Capsule 龍飛船", "ty": "FIB-D", "cat": "sem", "ctx": "In a teleconference with the media on Thursday, SpaceX's CEO, Paypal co-founder Elon Musk, said he would consider the flight 100 percent successful if it reached ____.", "r": "orbit", "w": "route", "why": "第一句就有線索 <span class=\"en\">reaching orbit 9 minutes later<\/span>——同篇文章<b>重複同一個字<\/b>。太空飛行的成功標準是進入<b>軌道 (orbit)<\/b>，route 是地面路線。", "opts": ["orbit", "route"], "zh": "進入軌道", "card": "D4｜語意｜第一句 reaching orbit 9 minutes later 就是線索（同篇重複同一個字）；太空飛行成功標準＝進入軌道，route 是路線"}, {"id": "28-1", "a": 28, "t": "The return of chemistry 化學的回歸", "ty": "FIB-D", "cat": "sem", "ctx": "…dents in chemistry.\" Phoenix is adamant that the new course will teach solid chemistry, but he thinks that an ____ for students will be a teaching approach that differs significantly from his days as an undergraduate.", "r": "attraction", "w": "approach", "why": "空格後同一句已經有 <span class=\"en\">a teaching approach<\/span>——填 approach 變成「approach 就是 approach」的重複句。這裡要的是對學生的<b>吸引力 (attraction)<\/b>：課程教的是 <span class=\"en\">solid chemistry<\/span>（紮實偏傳統，你的筆記：solid 在教育/科學類偏「太傳統」），<span class=\"en\">but<\/span> 轉折 → 吸引學生的賣點是教法不同。", "opts": ["attraction", "approach"], "zh": "對學生的吸引點", "card": "D5｜語意｜上一句 attract a new supply of students → 同字根 attraction；填 approach 變「一個方法會是一個教學方法」等於沒說"}, {"id": "29-1", "a": 29, "t": "DNA is a molecule DNA是一種分子", "ty": "FIB-D", "cat": "pos", "ctx": "First, it acts as the ____ material, which is passed down from generation to generation.", "r": "hereditary", "w": "gene", "why": "<span class=\"en\">the ___ material<\/span> 名詞前要<b>形容詞<\/b>：<span class=\"en\">hereditary material<\/span>＝遺傳物質。gene 是名詞塞不進去（「基因的」要說 genetic／hereditary）；後面 <span class=\"en\">passed down from generation to generation<\/span> 正是 hereditary 的定義。", "opts": ["gene", "heredity", "hereditary", "hereditarily"], "zh": "", "card": ""}, {"id": "30-1", "a": 30, "t": "The wholeness of thought 思想的完整性", "ty": "FIB-DD", "cat": "pos", "ctx": "…but must express it in a line of words; the reader - or listener - must take this line of symbols and from it ____ the original wholeness of thought.", "r": "reconstruct", "w": "emerging", "why": "與前面的 <span class=\"en\">must take<\/span> 並列，要<b>原形動詞<\/b>：<span class=\"en\">take this line of symbols and from it reconstruct ~<\/span>（讀者把一行行符號「重建」回完整思想——呼應標題 wholeness）。emerging 是 -ing，文法接不上。", "opts": ["emerging", "reconstruct", "reconstructing", "reconstruction"], "zh": "重建出原本完整的想法", "card": "D5｜文法｜遮掉插入語 from it：and 對齊前面 must take（原形）＋後面接名詞片語＝受詞 → 動詞原形"}, {"id": "30-2", "a": 30, "t": "The wholeness of thought 思想的完整性", "ty": "FIB-DD", "cat": "log", "ctx": "There is ____ difficulty in conversation, because the listener receives innumerable cues from the physical expressions of the speaker; there is a dialogue, and the listener can cut in at any time.", "r": "little", "w": "converging", "why": "<span class=\"en\">because<\/span> 後面說聽者收到<b>無數線索 (innumerable cues)<\/b> → 對話中「幾乎沒有」困難：<span class=\"en\">little difficulty<\/span>。difficulty 不可數，用 little 不用 few（few 給可數）。", "opts": ["little", "converging"], "zh": "對話時沒什麼困難", "card": "D5｜文法＋語意｜修飾名詞 difficulty 要形容詞；後面 because 聽者有無數線索 → 困難很少"}, {"id": "30-3", "a": 30, "t": "The wholeness of thought 思想的完整性", "ty": "FIB-DD", "cat": "col", "ctx": "There is little difficulty in conversation, because the listener receives innumerable cues from the physical expressions of the speaker; there is a dialogue, and the listener can ____ at any time.", "r": "cut in", "w": "cut off", "why": "片語動詞 <span class=\"en\">cut in<\/span>＝<b>插話<\/b>（對話中聽者隨時能插進來）；<span class=\"en\">cut off<\/span>＝切斷／打斷別人，是及物、後面要接受詞。", "opts": ["cut in", "cut off"], "zh": "隨時插話", "card": "D5｜文法｜cut in＝插話，不接受詞；cut off＝打斷某人，後面要接人（cut him off）。空格後直接 at any time → cut in"}, {"id": "30-4", "a": 30, "t": "The wholeness of thought 思想的完整性", "ty": "FIB-DD", "cat": "col", "ctx": "The advantage of group discussion is that people can overcome linear sequence of words by ____ on ideas from different directions; which makes for wholeness of thought.", "r": "converging", "w": "cut in", "why": "固定搭配 <span class=\"en\">converge on ~<\/span>＝從不同方向<b>聚焦<\/b>於：<span class=\"en\">by converging on ideas from different directions<\/span>。cut in 後面接不了 on。", "opts": ["converging", "cut in"], "zh": "從不同方向匯聚在想法上", "card": "D5｜文法＋搭配｜介系詞 by 後面接動作 → V-ing；converge on＝匯聚、集中在。emerging（浮現）語意不對"}, {"id": "30-5", "a": 30, "t": "The wholeness of thought 思想的完整性", "ty": "FIB-DD", "cat": "sem", "ctx": "But the reader is confronted by line upon line of printed symbols, without benefits of physical ____ and emphasis or the possibility of dialogue or discussion.", "r": "tone", "w": "intonation", "why": "印刷文字缺的是說話者身體的<b>語氣 (tone)<\/b> 與強調：<span class=\"en\">physical tone and emphasis<\/span>。intonation 專指聲音高低起伏，這裡泛指語氣、與 physical 搭配用 tone。", "opts": ["tone", "intonation"], "zh": "語氣和強調", "card": "D5｜語意＋搭配｜tone＝語氣、口吻（範圍廣）；intonation＝語調高低（偏技術、範圍窄）。tone and emphasis 常一起出現"}, {"id": "31-1", "a": 31, "t": "DNA sequence 猛獁象基因組", "ty": "FIB-D", "cat": "col", "ctx": "But someone someday is sure to try it, ____ Stephan Schuster, a molecular biologist at Pennsylvania State University, University Park, and a driving force behind the mammoth genome project.", "r": "predicts", "w": "foresees", "why": "這是<b>引述動詞<\/b>（「…，某某人如此預測」）：<span class=\"en\">\"...,\" predicts Stephan Schuster<\/span> 是新聞體固定寫法。<span class=\"en\">foresee<\/span> 幾乎只接名詞受詞（foresee problems／foresee a change），不拿來當引述動詞插在句尾。", "opts": ["predicts", "foresees"], "zh": "某某人預測", "card": "D5｜文法＋語意｜引述句型「意見, ＿＿＋說話者」→ 填「說」類動詞：predict＝pre 先＋dict 說；foresee＝fore 先＋see 看，是腦中預見不是說出來。主詞單數 → predicts"}, {"id": "31-2", "a": 31, "t": "DNA sequence 猛獁象基因組", "ty": "FIB-D", "cat": "pos", "ctx": "But someone someday is sure to try it, predicts Stephan Schuster, a ____ biologist at Pennsylvania State University, University Park, and a driving force behind the mammoth genome project.", "r": "molecular", "w": "molecule", "why": "空格後面是名詞 <span class=\"en\">biologist<\/span>，前面要<b>形容詞<\/b>：<span class=\"en\">a molecular biologist<\/span>＝分子生物學家（固定職稱）。molecule 是名詞（分子），名詞疊名詞不通。<b>看到「a ___ 名詞」先問詞性<\/b>。", "opts": ["molecule", "molecular", "molecules", "molecularly"], "zh": "", "card": ""}, {"id": "31-3", "a": 31, "t": "DNA sequence 猛獁象基因組", "ty": "FIB-D", "cat": "col", "ctx": "But someone someday is sure to try it, predicts Stephan Schuster, a molecular biologist at Pennsylvania State University, University Park, and a ____ force behind the mammoth genome project.", "r": "driving", "w": "carrying", "why": "固定搭配 <span class=\"en\">a driving force behind ~<\/span>＝背後的<b>推動力／主導者<\/b>。carrying force 不是英文說法。", "opts": ["driving", "carrying"], "zh": "", "card": ""}, {"id": "32-1", "a": 32, "t": "Agrarian Parties 農民政黨", "ty": "FIB-DD", "cat": "pos", "ctx": "The other is a matter of social integration: ____ agrarian parties to be important, the representation of countryside or peasantry must not be integrated with the other major sections of society.", "r": "for", "w": "although", "why": "空格後是「名詞＋<span class=\"en\">to be<\/span>」不是完整子句 → 只能用 <span class=\"en\">For + 受詞 + to V<\/span>（＝「要讓…，就必須…」）。<span class=\"en\">although<\/span> 是連接詞，後面一定要接<b>主詞＋動詞<\/b>的完整子句，接不上 <span class=\"en\">agrarian parties to be important<\/span>。<b>選連接詞前先看後面是子句還是不定詞片語。<\/b>", "opts": ["although", "for", "because", "despite"], "zh": "要讓農民政黨變重要", "card": "D5｜文法｜空格後是「誰＋to＋動詞」（to be 不是真動詞，不是完整句子）→ For；although 後面要完整句子（parties are important）"}, {"id": "32-2", "a": 32, "t": "Agrarian Parties 農民政黨", "ty": "FIB-DD", "cat": "log", "ctx": "____, a country might possess a sizeable rural population, but have an economic system in which the interests of the vot…", "r": "Thus", "w": "After all", "why": "前一句立下條件「農民必須<b>沒有<\/b>被整合進社會其他部門」，這一句是<b>順著推<\/b>出的反例（有大量農村人口，但選民利益按收入分 → 不會有農民政黨）→ 用 <span class=\"en\">Thus<\/span>（因此）。<span class=\"en\">After all<\/span>＝「畢竟」，是補理由、不是推結論。", "opts": ["Thus", "After all"], "zh": "", "card": ""}, {"id": "33-1", "a": 33, "t": "Northern Spotted Owls 北方斑點鴞", "ty": "FIB-DD", "cat": "log", "ctx": "…and the high elevation Cascade and Olympic Mountains restricted gene flow, while the lower Oregon Coast Range ____ gene flow, acting as a \"genetic corridor.\" The Columbia River did not act as a barrier, suggesting owls readily fly…", "r": "facilitated", "w": "prevented", "why": "<span class=\"en\">while<\/span> 在這裡是<b>對比<\/b>：前半「山谷與高山 <span class=\"en\">restricted<\/span> 基因流」→ 後半必須<b>反向<\/b>＝<span class=\"en\">facilitated<\/span>（促進）。同句還有第二個線索：<span class=\"en\">acting as a \"genetic corridor\"<\/span>——走廊是讓東西<b>通過<\/b>的。你填 prevented 等於跟 restricted 同向，把對比抹掉了。", "opts": ["facilitated", "prevented"], "zh": "（海岸山脈）促進了基因交流", "card": "D5｜邏輯｜while 連兩個不同主角＝對比（而）：前半 restricted → 後半相反 facilitated；同句 genetic corridor（走廊＝讓東西通過）、high vs lower 也在對比"}, {"id": "33-2", "a": 33, "t": "Northern Spotted Owls 北方斑點鴞", "ty": "FIB-DD", "cat": "sem", "ctx": "…ast Range facilitated gene flow, acting as a \"genetic corridor.\" The Columbia River did not act as a barrier, ____ owls readily fly over this large river.", "r": "suggesting", "w": "proving", "why": "學術寫作的<b>推論語氣<\/b>：只觀察到「河沒形成屏障」，只能<span class=\"en\">suggesting<\/span>（顯示、推測）貓頭鷹會飛越，不能 <span class=\"en\">proving<\/span>（證明）。論文類文章看到單一觀察推結論，一律選<b>弱語氣<\/b>的 suggest／indicate。", "opts": ["suggesting", "proving"], "zh": "顯示貓頭鷹能飛越", "card": "D5｜語意｜只觀察到「河沒擋住」→ 只能推測，用語氣弱的 suggest／indicate；prove＝證明，要決定性證據。學術文從觀察推結論選弱語氣"}, {"id": "34-1", "a": 34, "t": "Farming 農事", "ty": "FIB-DD", "cat": "sem", "ctx": "Farmers on the Great Plains were working ____ nature, he thundered in speeches.", "r": "against", "w": "with", "why": "整段的語氣是<b>批評<\/b>：frustrated（不滿）、exploitative（剝削式的）、went directly after（開砲）、misleading（誤導）。所以農民是<span class=\"en\">working <b>against<\/b> nature<\/span>（違逆自然）。<span class=\"en\">work with nature<\/span>（順應自然）是<b>褒義<\/b>，跟前面四個負面詞全部打架。<b>先讀完整段定調性，再選字。<\/b>", "opts": ["against", "with"], "zh": "", "card": ""}, {"id": "34-2", "a": 34, "t": "Farming 農事", "ty": "FIB-DD", "cat": "sem", "ctx": "Farmers on the Great Plains were working against nature, he ____ in speeches.", "r": "thundered", "w": "praised", "why": "<span class=\"en\">thunder<\/span>（打雷）當動詞＝<b>怒吼、疾言厲色地說<\/b>，跟批評的調性一致。<span class=\"en\">praised<\/span>（讚揚）方向完全相反——他正在罵農業部，不可能在讚美。<b>這是本篇同一個坑踩第二次<\/b>：兩格都是沒跟著段落調性走。", "opts": ["thundered", "praised"], "zh": "", "card": ""}, {"id": "35-1", "a": 35, "t": "Stress 壓力", "ty": "FIB-DD", "cat": "pos", "ctx": "Stress is tense feeling often connected to having too ____ to do, too many bills to pay and not enough time or money — is a common emotion that knows few borders.", "r": "much", "w": "many", "why": "<span class=\"en\">too <b>much<\/b> to do<\/span>＝<span class=\"en\">too much <b>(work)<\/b> to do<\/span>——much 後面<b>沒有接名詞<\/b>，它自己當名詞用，省略掉的是 work／stuff 這種不可數的「事情」，所以用 much。<span class=\"en\">to do<\/span> 不是名詞，只是說明「這堆東西是拿來做的」。旁邊的 <span class=\"en\">too <b>many<\/b> bills<\/span> 才是 many（後面有可數複數 bills）；many 單獨站著時英文習慣指「很多人」，不會拿來指事情。<b>判斷法：空格後有複數名詞 → many；後面直接接 to do／to say／to learn → 補一個 work 進去，用 much。<\/b>同類固定說法：<span class=\"en\">so much to learn<\/span>、<span class=\"en\">not much to say<\/span>、<span class=\"en\">have much to lose<\/span>。", "opts": ["many", "much", "lot", "more"], "zh": "", "card": ""}, {"id": "36-1", "a": 36, "t": "Nutrition scientists 營養科學家", "ty": "FIB-DD", "cat": "sem", "ctx": "Since nutrition scientists are constantly making new discoveries, we need to revise our ____ for healthy eating from time to time.", "r": "recommendations", "w": "conjecture", "why": "<b>答案就寫在文章最後一句<\/b>：<span class=\"en\">a single set of dietary <b>recommendations<\/b><\/span>——同一篇重複出現的字幾乎一定是答案。<span class=\"en\">conjecture<\/span>（臆測）是「還沒證實的猜想」，不會拿來給大眾「修訂」。<b>FIB 遇到不確定，先掃全文有沒有同一個字再出現。<\/b>", "opts": ["recommendations", "conjecture"], "zh": "", "card": ""}, {"id": "36-2", "a": 36, "t": "Nutrition scientists 營養科學家", "ty": "FIB-DD", "cat": "col", "ctx": "However, nutrition is an art as well as a ____.", "r": "science", "w": "theme", "why": "<span class=\"en\">an art as well as a <b>science<\/b><\/span> 是<b>固定對照組<\/b>（藝術 vs 科學），英文寫作最常見的成對講法。而且下一句 <span class=\"en\">It's an art because...<\/span> 只解釋了 art 那一半，另一半必須是能跟 art 對立的字。<span class=\"en\">theme<\/span>（主題）跟 art 不成對。", "opts": ["science", "theme"], "zh": "", "card": ""}, {"id": "37-1", "a": 37, "t": "Pinker 平克", "ty": "FIB-DD", "cat": "col", "ctx": "Sometimes it seems as if nothing is ____ from being explained this way.", "r": "immune", "w": "deducted", "why": "<span class=\"en\"><b>immune from<\/b> ~<\/span>＝免疫於、不受…影響，是固定搭配。整句 <span class=\"en\">nothing is immune from being explained this way<\/span>＝「沒有什麼能逃過這種解釋」。<span class=\"en\">deducted<\/span>（被扣除）是會計用字，跟 from being explained 完全接不起來。<b>看到空格後面是 from，先想 immune from／free from／far from。<\/b>", "opts": ["immune", "deducted"], "zh": "", "card": ""}, {"id": "37-2", "a": 37, "t": "Pinker 平克", "ty": "FIB-DD", "cat": "col", "ctx": "… offices on the top floor, and the smaller number of women who become mechanical engineers—all may have their ____ in natural selection, Pinker claims.", "r": "roots", "w": "origins", "why": "<b>origins＝起點，roots＝原因<\/b>。origin 問「從哪裡、什麼時候開始」，in 後面接<b>地方或年代<\/b>：<span class=\"en\">The festival has its origins in ancient Rome.<\/span>／<span class=\"en\">The word has its origins in Latin.<\/span> roots 問「是什麼造成的」，in 後面接<b>原因、機制、情緒<\/b>：<span class=\"en\">The problem has its roots in poverty.<\/span>／<span class=\"en\">His anger has its roots in fear.<\/span> 這題 in 後面是 <span class=\"en\">natural selection<\/span>（天擇）——不是地方也不是年代，是造成這些行為的<b>機制<\/b> → roots。若句子是 <span class=\"en\">in Africa<\/span>／<span class=\"en\">in the Stone Age<\/span> 才是 origins。<b>考場：看 in 後面接什麼。地名、年代 → origins；原因、理論、情緒 → roots。<\/b>", "opts": ["roots", "origins"], "zh": "", "card": ""}, {"id": "37-3", "a": 37, "t": "Pinker 平克", "ty": "FIB-DD", "cat": "sem", "ctx": "The controversial implications are obvious: that men and women might differ in their inborn abilities at performing certain tasks, for example, or that parenting may have ____ influence on personality.", "r": "little", "w": "plenty", "why": "兩個理由。<b>語意<\/b>：這句在講 <span class=\"en\">controversial implications<\/span>（有爭議的推論）——「男女天生能力有別」「教養對人格影響<b>很小<\/b>」才是會惹議的主張，parenting 影響大反而是常識。<b>用法<\/b>：plenty 當「大量」要接 of（<span class=\"en\">plenty <b>of<\/b> influence<\/span>），這裡後面直接是名詞，plenty 塞不進去。", "opts": ["little", "plenty"], "zh": "", "card": ""}, {"id": "38-1", "a": 38, "t": "Definition of Country 國家的定義", "ty": "FIB-DD", "cat": "log", "ctx": "After all, we've explored the whole planet, we have international travel, satellite navigation and plenty of global organizations like the United Nations ____ we should really know how many countries there are!", "r": "so", "w": "although", "why": "前半列了一堆<b>有利條件<\/b>（探索完地球、國際旅行、衛星導航、聯合國）→ 後半「我們理應知道有幾個國家」是<b>順接的結論<\/b>，用 <span class=\"en\">so<\/span>。<span class=\"en\">although<\/span> 是逆接，會變成「雖然有這些條件，我們理應知道」——邏輯不通。<b>轉折詞先問自己：前後同向還是反向？<\/b>下一句的 However 才是真正的轉折點。", "opts": ["so", "although"], "zh": "", "card": ""}, {"id": "38-2", "a": 38, "t": "Definition of Country 國家的定義", "ty": "FIB-DD", "cat": "sem", "ctx": "The problem arises because there isn't a universally agreed definition of 'country' and because, for political reasons, some countries find it convenient to recognize or not recognize ____ countries.", "r": "other", "w": "these", "why": "<span class=\"en\">recognize or not recognize <b>other<\/b> countries<\/span>＝承認或不承認<b>別的<\/b>國家（主詞是 some countries，對象要是「其他國家」才講得通）。<span class=\"en\">these<\/span> 是指示詞，<b>前文沒有具體指到哪些國家<\/b>，指代落空。<b>選 these／those 之前，先回頭找它指的是誰。<\/b>", "opts": ["other", "these"], "zh": "", "card": ""}, {"id": "39-1", "a": 39, "t": "The Origin of Music 音樂的起源", "ty": "FIB-DD", "cat": "col", "ctx": "…tic musicology, endorsed the idea that music originally spawned from 'motherese' – the playful voices mothers ____ when speaking to infants and toddlers.", "r": "adopt", "w": "make", "why": "<span class=\"en\"><b>adopt<\/b> a voice / tone / accent / manner<\/span>＝<b>刻意採用某種說話方式<\/b>，學術文章描述「切換成某種腔調」動詞幾乎都用 adopt。<span class=\"en\">make a voice<\/span> 不是英文講法（有的是 make a face 做鬼臉、make a sound 發出聲響）；這句的重點是媽媽<b>採用<\/b>一種俏皮語調，不是「發出聲音」。同款：<span class=\"en\">adopt an approach／a strategy<\/span>。", "opts": ["adopt", "make"], "zh": "", "card": ""}, {"id": "39-2", "a": 39, "t": "The Origin of Music 音樂的起源", "ty": "FIB-DD", "cat": "col", "ctx": "… changes occurring between one and 2,000,000 years ago resulted in earlier births, more fragile infants and a ____ need for stronger relationships between mothers and their newborn babies.", "r": "critical", "w": "virtual", "why": "<span class=\"en\">a <b>critical<\/b> need<\/span>＝迫切的需求，固定搭配（同 urgent／pressing need）。兩條線索：①<b>並列結構<\/b> <span class=\"en\">earlier births, more fragile infants and a ___ need<\/span>——三項都是腦容量變大的後果，語氣一路加重；②<span class=\"en\">virtual<\/span>＝虛擬的／名義上的，<b>「虛擬的需求」跟整段「嬰兒脆弱所以真的很需要」的因果相反<\/b>。", "opts": ["critical", "virtual"], "zh": "", "card": ""}, {"id": "40-1", "a": 40, "t": "New Zealand 紐西蘭", "ty": "FIB-DD", "cat": "col", "ctx": "…race of warriors, the Maoris, had sailed across the Pacific from the northeast and established a civilization ____ for the brilliance of its art and the strength of its military system.", "r": "notable", "w": "evident", "why": "<b>線索就在空格後面的 <span class=\"en\">for<\/span><\/b>：<span class=\"en\"><b>notable for<\/b> ~<\/span>＝以…著稱。同家族一起記：<span class=\"en\">famous／renowned／known／celebrated <b>for<\/b><\/span>——後面接的就是這句的 brilliance of its art、strength of its military system（因為某個優點而出名）。<br><span class=\"en\">evident<\/span>（明顯的）<b>不接 for<\/b>，它的固定用法是 <span class=\"en\">It is evident that ~<\/span> 或 <span class=\"en\">evident in ~<\/span>；而且「一個明顯的文明」語意也不通。<br><b>本日第 6 個搭配題失分<\/b>（immune from／roots in／art as well as a science／adopt a voice／critical need）——<b>看到空格旁邊有介系詞，先用搭配刷選項<\/b>。", "opts": ["notable", "evident"], "zh": "", "card": ""}, {"id": "41-1", "a": 41, "t": "Genetically modified corn 轉基因玉米", "ty": "FIB-DD", "cat": "col", "ctx": "But the ____ can't be said for humans' ingenious ability to engineer the plants we eat.", "r": "same", "w": "idea", "why": "固定句型 <span class=\"en\">the <b>same<\/b> can't be said for ~<\/span>＝「同樣的話不能套在…身上」，用來做<b>對比轉折<\/b>（前句「沒人懷疑玉米」→ 後句「但對基改就不是這麼回事」）。<br><b>兩個線索<\/b>：①空格前是 <span class=\"en\">the<\/span>、後面是 <span class=\"en\">can't be said for<\/span>——<b>said 前面接的是「被說的內容」<\/b>，the same 才講得通；<span class=\"en\">the idea can't be said<\/span> 不是英文講法（idea 要搭 expressed／put forward）。②整段在做<b>今昔／彼此對照<\/b>，the same 就是對照的信號詞。<br>同家族一起記：<span class=\"en\">the same goes for ~<\/span>、<span class=\"en\">the same is true of ~<\/span>。", "opts": ["same", "idea"], "zh": "", "card": =\"en\">after we leave school<\/span> 引你上鉤，但「延後的結論」講不通——空格修飾的是 punchline 本身，不是「學數學的時間」。<br>順帶記：<span class=\"en\">un·rival·led<\/span>＝無人能敵的（un + rival），配 <span class=\"en\">enjoyed<\/span>（享有）是正面搭配。", "opts": ["radical", "deferred"], "zh": "", "card": ""}, {"id": "45-1", "a": 45, "t": "Walt Disney World 迪士尼世界", "ty": "FIB-DD", "cat": "sem", "ctx": "Walt Disney World has become a pilgrimage site partly because of the luminosity of its cross culture and marketing and partly because its ____ aspects appeal powerfully to real needs in the capitalist society.", "r": "utopian", "w": "realistic", "why": "<b>先判詞性<\/b>：<span class=\"en\">its ___ aspects<\/span>，空格在名詞前 → 形容詞（realistic／utopian／educational 三選一）。<br><b>卡住就造極簡句<\/b>：<span class=\"en\">Disney is a ___ place.<\/span> → <span class=\"en\">utopian<\/span>（夢幻、理想國般的）✅，<span class=\"en\">realistic<\/span> ✗ 一聽就怪。<br><b>再對照後面的 <span class=\"en\">real needs<\/span><\/b>：填 realistic＝「真實的東西滿足真實需求」是廢話；填 utopian＝「<b>夢幻的東西卻滿足真實需求<\/b>」才是作者要的反差。<br>🎬 老師記憶鉤：<b>Utopia → Zootopia<\/b>（迪士尼《動物方城市》＝zoo + utopia）。", "opts": ["utopian", "realistic"], "zh": "", "card": ""}, {"id": "46-1", "a": 46, "t": "Fingerprint 指紋", "ty": "FIB-DD", "cat": "sem", "ctx": "These fingermarks are described as \"latent\" as they are generally invisible to the naked eye, which means that ____ them at a crime scene can be challenging.", "r": "locating", "w": "copying", "why": "兩個都是 <b>-ing 當主詞<\/b>，文法都對 → 只能靠意思。<br><b>意思卡住就把因果講成一句<\/b>：前面 <span class=\"en\">invisible to the naked eye<\/span>（肉眼看不見）＋ <span class=\"en\">which means that<\/span>（所以）→ <span class=\"en\">I can't see it, so ___ it is hard.<\/span> 看不見 → <b>很難找到<\/b> → <span class=\"en\">locating<\/span>。copying（複製）跟「看不見」沒有因果。<br>用短句記 locate：<span class=\"en\">I can't locate my phone.<\/span>＝找不到手機在哪（locate＝找出<b>位置<\/b>，同字根 location）。", "opts": ["locating", "copying"], "zh": "", "card": ""}, {"id": "47-1", "a": 47, "t": "Sustainable transportation system 可持續交通系統", "ty": "FIB-D", "cat": "col", "ctx": "Applying ____ of sustainability to transportation will reduce pollution generated by gasoline-powered engines, noise, traffic con…", "r": "principles", "w": "regulations", "why": "<b>先砍主幹<\/b>（老師劃掉 <span class=\"en\">of sustainability to transportation<\/span>）：整塊是 <span class=\"en\">Applying A to B<\/span>＝把 A 套用到 B。<br><b>A of B 翻成「B 的 A」<\/b>——老師的極簡例：<span class=\"en\">employee of the month<\/span>＝本月的員工。→ <span class=\"en\">principles of sustainability<\/span>＝<b>永續的原則<\/b> ✅；「永續的規定」✗——<span class=\"en\">regulations<\/span> 是政府／公司訂的條文（常用 <span class=\"en\">regulations on smoking<\/span>＝管什麼），一個<b>理念<\/b>不會有「規定」，理念有的是<b>原則<\/b>。", "opts": ["principles", "regulations"], "zh": "", "card": ""}, {"id": "47-2", "a": 47, "t": "Sustainable transportation system 可持續交通系統", "ty": "FIB-D", "cat": "ten", "ctx": "Street-front retail and commercial establishments will ____ from the large volume of foot traffic drawn to an environment enhanced by trees, appropriately designed \"street fur…", "r": "prosper", "w": "be prospered", "why": "<b>詞性卡住就換熟字進短句<\/b>：<span class=\"en\">prosper<\/span>＝興旺、成功，換成 <span class=\"en\">do well<\/span>：<span class=\"en\">My shop will do well.<\/span> ✅／<span class=\"en\">My shop will be done well.<\/span> ✗ 一聽就怪。<br>店是<b>自己<\/b>變興旺，不是被別人弄興旺 → <span class=\"en\">prosper<\/span> 現代英文幾乎只當<b>不及物動詞<\/b>，<b>沒有被動<\/b>。<br>搭配：<span class=\"en\">prosper from ~<\/span>＝從…獲益而興旺（同 <span class=\"en\">benefit from<\/span>），後面接的就是 <span class=\"en\">the large volume of foot traffic<\/span>（大量人潮）。", "opts": ["be prospered", "prosper", "prosperous", "prosperity"], "zh": "", "card": ""}];
const CAT = {col:'固定搭配', sem:'語意精準', log:'轉折邏輯', pos:'詞性詞形', ten:'時態語態'};
const KEY = 'fib_quiz_v1', PREF = 'fib_quiz_pref';
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm = s => s.trim().toLowerCase().replace(/\s+/g, ' ');
function load(k, d){ try { return JSON.parse(localStorage.getItem(k)) || d; } catch(e){ return d; } }
function save(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
let ST = load(KEY, {});            // id → {n 做過次數, bad 錯過次數, last 1/0}
let P = Object.assign({mode:'choice', cats:Object.keys(CAT), scope:'all', num:20}, load(PREF, {}));

function chips(el, items, isOn, onClick){
  el.innerHTML = '';
  items.forEach(([v, label]) => {
    const b = document.createElement('button');
    b.className = 'chip' + (isOn(v) ? ' on' : ''); b.innerHTML = label;
    b.onclick = () => { onClick(v); renderSetup(); };
    el.appendChild(b);
  });
}
function poolList(){
  return Q.filter(q => P.cats.includes(q.cat) && (
    P.scope === 'all' || (P.scope === 'bad' && ST[q.id] && ST[q.id].last === 0) || (P.scope === 'new' && !ST[q.id])));
}
function renderSetup(){
  save(PREF, P);
  chips($('modeC'), [['choice','選擇'],['type','默打（練拼字）']], v => P.mode === v, v => P.mode = v);
  chips($('catC'), Object.entries(CAT).map(([k, n]) => [k, `${n}<small>${Q.filter(q => q.cat === k).length}</small>`]),
    v => P.cats.includes(v), v => { P.cats = P.cats.includes(v) ? P.cats.filter(x => x !== v) : [...P.cats, v]; });
  const nb = Q.filter(q => ST[q.id] && ST[q.id].last === 0).length, nn = Q.filter(q => !ST[q.id]).length;
  chips($('scopeC'), [['all','全部'],['bad',`上次答錯<small>${nb}</small>`],['new',`還沒做過<small>${nn}</small>`]], v => P.scope === v, v => P.scope = v);
  chips($('numC'), [[10,'10 題'],[20,'20 題'],[0,'全部']], v => P.num === v, v => P.num = v);
  const n = poolList().length;
  $('pool').textContent = `符合 ${n} 題` + (P.num && n > P.num ? `，抽 ${P.num}` : '');
  $('go').disabled = !n;
  const done = Object.keys(ST).length, ok = Object.values(ST).filter(s => s.last === 1).length;
  $('hist').innerHTML = done ? `累計做過 ${done}／93 格，最近一次答對 ${ok} 格、答錯 ${nb} 格<button id="reset">清除紀錄</button>` : '還沒有作答紀錄';
  if (done) $('reset').onclick = () => { if (confirm('清掉這台瀏覽器的作答紀錄？')) { ST = {}; save(KEY, ST); renderSetup(); } };
}

function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; }
let S = null;   // 本輪：{list, i, ok, res:[{q, ok, said}], mode}
function start(list){
  S = {list, i:0, ok:0, res:[], mode:P.mode};
  $('setup').classList.add('hide'); $('result').classList.add('hide'); $('quiz').classList.remove('hide');
  show();
}
$('go').onclick = () => { const l = shuffle(poolList()); start(P.num ? l.slice(0, P.num) : l); };
$('quit').onclick = finish;
$('next').onclick = next;

function blankHtml(q, state){
  const inner = state ? esc(q.r) : (S.mode === 'type' ? esc(q.r[0]) + '…' : '　');
  return `<span class="blank ${state || ''}" id="blank">${inner}</span>`;
}
function show(){
  const q = S.list[S.i];
  S.cur = {q, first:null, done:false};
  $('pos').textContent = `第 ${S.i + 1} / ${S.list.length} 題`;
  $('score').textContent = `第一次就對 ${S.ok}`;
  $('barI').style.width = (S.i / S.list.length * 100) + '%';
  $('tags').innerHTML = `<span class="tag c-${q.cat}">${CAT[q.cat]}</span><span class="tag">${q.ty}</span><span class="tag">第 ${q.a} 篇 ${esc(q.t)}</span>`;
  $('sent').innerHTML = esc(q.ctx).replace('____', blankHtml(q));
  $('fb').classList.add('hide'); $('next').classList.add('hide');
  if (S.mode === 'choice') {
    const o = shuffle(q.opts);
    $('ans').innerHTML = `<div class="opts">${o.map((w, k) => `<button class="opt" data-w="${esc(w)}"><kbd>${k + 1}</kbd>${esc(w)}</button>`).join('')}</div>`
      + (o.length === 2 ? `<div class="note2">二選一：其中一個是你當時選錯的</div>` : '');
    $('ans').querySelectorAll('.opt').forEach(b => b.onclick = () => pick(b));
  } else {
    const shape = q.r.split('').map((c, k) => c === ' ' ? '　' : (k ? '_' : c)).join(' ');
    $('ans').innerHTML = `<div class="shape">${esc(shape)}　（${q.r.replace(/ /g, '').length} 個字母）</div>
      <div class="typ"><input id="inp" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="打出空格的字"><button class="btn" id="sub">送出</button></div>
      <div><button class="chip" id="hintB" style="margin-top:8px">💡 提示</button></div><div id="hintBox"></div><div id="tfb"></div>`;
    $('sub').onclick = typed;
    $('hintB').onclick = () => {
      $('hintBox').innerHTML = `<div class="hintbox">不是 <b>${esc(q.w)}</b>（你當時選的）${q.zh ? `；意思：${esc(q.zh)}` : ''}</div>`;
      $('hintB').remove(); $('inp').focus();
    };
    $('inp').focus();
  }
}
function record(q, ok, said){
  S.cur.first = ok; if (ok) S.ok++;
  S.res.push({q, ok, said});
  const s = ST[q.id] || {n:0, bad:0}; s.n++; if (!ok) s.bad++; s.last = ok ? 1 : 0; ST[q.id] = s; save(KEY, ST);
  $('score').textContent = `第一次就對 ${S.ok}`;
}
function pick(b){
  if (S.cur.done) return;
  const q = S.cur.q, ok = b.dataset.w === q.r;
  $('ans').querySelectorAll('.opt').forEach(x => { x.disabled = true; if (x.dataset.w === q.r) x.classList.add('ok'); });
  if (!ok) b.classList.add('ng');
  record(q, ok, b.dataset.w);
  reveal(ok, b.dataset.w);
}
// 逐字 LCS：標出多打（紅刪除線）和漏打（綠）
function diff(a, b){
  const m = a.length, n = b.length, d = Array.from({length:m + 1}, () => new Array(n + 1).fill(0));
  for (let i = m - 1; i >= 0; i--) for (let j = n - 1; j >= 0; j--) d[i][j] = a[i] === b[j] ? d[i+1][j+1] + 1 : Math.max(d[i+1][j], d[i][j+1]);
  let i = 0, j = 0, out = '';
  while (i < m || j < n) {
    if (i < m && j < n && a[i] === b[j]) { out += esc(a[i]); i++; j++; }
    else if (j < n && (i >= m || d[i][j+1] >= d[i+1][j])) { out += `<span class="m">${esc(b[j])}</span>`; j++; }
    else { out += `<span class="x">${esc(a[i])}</span>`; i++; }
  }
  return out;
}
function typed(){
  const q = S.cur.q, inp = $('inp'), v = inp.value;
  if (!v.trim() || S.cur.done) return;
  const ok = norm(v) === norm(q.r);
  if (S.cur.first === null) record(q, ok, v.trim());
  if (ok) {
    inp.disabled = true; inp.classList.remove('ng'); $('sub').disabled = true;
    if ($('hintB')) $('hintB').remove();
    $('tfb').innerHTML = '';
    reveal(S.cur.first, S.res[S.res.length - 1].said);
  } else {
    $('tfb').innerHTML = `<div class="diff">你打：${diff(norm(v), norm(q.r))}</div><div class="retry">↻ 再打一遍（正解 ${esc(q.r)}）</div>`;
    inp.value = ''; inp.classList.add('ng'); inp.focus();
  }
}
function reveal(ok, said){
  const q = S.cur.q; S.cur.done = true;
  $('blank').outerHTML = blankHtml(q, ok ? 'ok' : 'ng');
  const wasTrap = norm(said) === norm(q.w);
  $('fb').innerHTML = `<div class="head ${ok ? 'ok' : 'ng'}">${ok ? '✅ 答對' : S.mode === 'type' ? '❌ 第一次拼錯（已重打對）' : (wasTrap ? '❌ 又踩到同一個陷阱' : '❌ 答錯')}</div>
    <div>正解 <span class="en"><b>${esc(q.r)}</b></span>　·　你當時選 <span class="en">${esc(q.w)}</span>${!ok && !wasTrap && S.mode === 'choice' ? `　·　這次選 <span class="en">${esc(said)}</span>` : ''}</div>
    <div class="why" style="margin-top:6px">${q.why}</div>
    ${q.card ? `<div class="card">📇 複習卡 ${esc(q.card)}</div>` : ''}
    <div class="src"><a href="閱讀訂正.html#p${q.a}" target="_blank">看原文第 ${q.a} 篇 ↗</a></div>`;
  $('fb').classList.remove('hide');
  $('next').textContent = S.i + 1 < S.list.length ? '下一題 ↵' : '看結果 ↵';
  $('next').classList.remove('hide');
  $('next').focus();
}
function next(){ if (++S.i < S.list.length) show(); else finish(); }

function finish(){
  if (!S || !S.res.length) { $('quiz').classList.add('hide'); $('setup').classList.remove('hide'); renderSetup(); return; }
  const r = S.res, ok = r.filter(x => x.ok).length, bad = r.filter(x => !x.ok);
  const rows = Object.keys(CAT).map(k => { const a = r.filter(x => x.q.cat === k); return a.length ? `<tr><td>${CAT[k]}</td><td>${a.filter(x => x.ok).length} / ${a.length}</td></tr>` : ''; }).join('');
  $('result').innerHTML = `<div class="lab">本輪結果（${S.mode === 'type' ? '默打' : '選擇'}）</div>
    <div class="big">${ok} / ${r.length}</div><div class="meta" style="margin:0">第一次就對 ${Math.round(ok / r.length * 100)}%${r.length < S.list.length ? `（中途結束，共 ${S.list.length} 題）` : ''}</div>
    <table><tr><th>分類</th><th>答對</th></tr>${rows}</table>
    ${bad.length ? `<div class="lab" style="margin-top:14px">錯的 ${bad.length} 題</div>` + bad.map(x => `<div class="wl"><div class="s">${esc(x.q.ctx).replace('____', `<b>${esc(x.q.r)}</b>`)}</div>
      <div>你這次：<span class="en" style="color:var(--ng)">${esc(x.said)}</span>　<span class="tag c-${x.q.cat}">${CAT[x.q.cat]}</span></div><div class="why">${x.q.why}</div></div>`).join('') : '<p>🎉 全對</p>'}
    <div class="nav">${bad.length ? `<button class="btn" id="again">錯的 ${bad.length} 題再考一輪</button>` : '<span></span>'}<button class="btn ghost" id="back">回設定</button></div>`;
  $('quiz').classList.add('hide'); $('result').classList.remove('hide');
  if (bad.length) $('again').onclick = () => start(shuffle(bad.map(x => x.q)));
  $('back').onclick = () => { $('result').classList.add('hide'); $('setup').classList.remove('hide'); renderSetup(); };
  window.scrollTo(0, 0);
}

document.addEventListener('keydown', e => {
  if (!S || $('quiz').classList.contains('hide')) return;
  if (e.key === 'Enter') {
    if (S.cur.done) { e.preventDefault(); next(); }
    else if (S.mode === 'type' && e.target.id === 'inp') { e.preventDefault(); typed(); }
  } else if (S.mode === 'choice' && !S.cur.done && /^[1-4]$/.test(e.key)) {
    const b = $('ans').querySelectorAll('.opt')[+e.key - 1]; if (b) pick(b);
  }
});
renderSetup();
</script>
</body>
</html>

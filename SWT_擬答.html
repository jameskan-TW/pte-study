{"num": 123, "title": "Crop rotation (輪作)", "code": "#060123", "full": "With a good system of crop rotation, and especially with the addition of any sort of fertilizer you may be able to come up with, it’s possible to grow crops on a plot of land for upwards of 2 – 3 years at a time with good results. Ultimately, though, you must let the land rest if you hope to continue farming there in the long-run. Allowing a plot of land to rest for a period of time is known as letting the field go fallow, and there are several reasons for this. Allowing a field or plot to lie fallow means that you don’t grow anything new on it, don’t harvest anything and don’t graze any animals on the land for at least a year. Sometimes a field will lay fallow for two, three or even four years, but the traditional standard on many farms was to let a field lie fallow once every 2 – 3 years. This fallow period allows the land to replenish many of its nutrients. The root networks of various grasses or groundcovers (like clover) have a chance to expand and grow, which further strengthens the soil and protects it from erosion. During the fallow period, there are many beneficial flora and micro-fauna, including cyanobacteria, which live in the soil. These microorganisms continue to be active at the root level, steadily improving the quality of the soil so that when you come back in a year or two, you can begin planting food or cash crops anew.", "ans": "You must let the land rest if you [want|hope] to [keep|continue] farming there in the long-run, {and} allowing a plot of land to rest is known as letting the field go fallow, {and} this fallow period allows the land to [rebuild|replenish] many of its nutrients, {and} there are many [helpful|beneficial] flora and micro-fauna which live in the soil.", "zh": "如果你希望長期繼續在那裡耕作，就必須讓土地休息，讓一塊地休息稱為休耕，休耕期讓土地補充許多養分，而土壤中有許多有益的植物和微小動物。", "src": ["~~Ultimately, though,~~ you must let the land rest if you hope to continue farming there in the long-run.", "Allowing a plot of land to rest ~~for a period of time~~ is known as letting the field go fallow~~, and there are several reasons for this~~.", "This fallow period allows the land to replenish many of its nutrients.", "~~During the fallow period,~~ there are many beneficial flora and micro-fauna~~, including cyanobacteria,~~ which live in the soil."], "note": "難字：fallow、replenish、nutrients、beneficial、flora（題目可抄）"},
{"num": 124, "title": "Malaysia travel (馬來西亞旅遊)", "code": "#060124", "full": "Malaysia is one of the most pleasant, hassle-free countries to visit in Southeast Asia. Aside from its gleaming 21st century glass towers, it boasts some of the most superb beaches, mountains and national parks in the region. Malaysia is also launching its biggest-ever tourism campaign in effort to lure 20 million visitors here this year. More than 16 million tourists visited in 2005, the last year for which complete statistics were available. Of the 885,000 travelers from the West, 240,000 were from the United Kingdom, 265,000 from Australia and 150,000 from the US. Any tourist itinerary would have to begin in the capital, Kuala Lumpur, where you will find the Petronas Twin Towers, which once comprised the world's tallest buildings and now hold the title of second- tallest. Both the 88-story towers soar 452 meters (1,480 feet) high and are connected by a sky-bridge on the 41st floor. Also, worth visiting is the Central Market, a pre-war building that was the main wet market for the city, and has now been transformed into an arts and cultural center. The limestone temple Batu Caves, located 15 kilometers (9 miles) north of the city, have a 100-meter-high (328-foot- high) ceiling and feature ornate Hindu shrines, including a 43-meter-tall (141-foot-tall) gold-painted statue of a Hindu deity. To reach the caves, visitors have to climb a steep flight of 272 steps. In Sabah state on Borneo island, you'll find the small mushroom-shaped Sipadan island, off the coast of Sabah, rated as one of the top five diving sites in the world. Sipadan is the only oceanic island in Malaysia, rising from a 700-meter (2,300-foot) abyss in the Celebes Sea. You can also climb Mount Kinabalu, the tallest peak in Southeast Asia, visit the Sepilok Orang Utan Sanctuary, go white-water rafting and catch a glimpse of the bizarre Proboscis monkey, a primate found only in Borneo with a huge pendulous nose, a characteristic pot belly and strange honking sounds. While you're in Malaysia, consider a trip to Malacca. In its heyday, this southern state was a powerful Malay sultanate and a booming trading port in the region. Facing the Straits of Malacca, this historical state is now a place of intriguing Chinese streets, antique shops, old temples and reminders of European colonial powers. Another interesting destination is Penang, known as the \"Pearl of the Orient.'' This island off the northwest coast of Malaysia boasts of a rich Chinese cultural heritage, good food and beautiful beaches.", "ans": "Malaysia is one of the most [nice|pleasant], hassle-free countries to visit in Southeast Asia, {and} it [has|boasts] some of the most [great|superb] beaches, mountains and national parks in the region, {and} Malaysia is also launching its biggest-ever tourism campaign in effort to [attract|lure] 20 million visitors, {and} any tourist itinerary would have to begin in the capital, Kuala Lumpur.", "zh": "馬來西亞是東南亞最宜人、最省事的旅遊國家之一，它擁有區域內最棒的海灘、山脈和國家公園，馬來西亞也在推出史上最大的旅遊宣傳以吸引 2000 萬遊客，而任何旅遊行程都得從首都吉隆坡開始。", "src": ["Malaysia is one of the most pleasant, hassle-free countries to visit in Southeast Asia.", "~~Aside from its gleaming 21st century glass towers,~~ it boasts some of the most superb beaches, mountains and national parks in the region.", "Malaysia is also launching its biggest-ever tourism campaign in effort to lure 20 million visitors ~~here this year~~.", "Any tourist itinerary would have to begin in the capital, Kuala Lumpur~~, where you will find the Petronas Twin Towers, which once comprised the world's tallest buildings and now hold the title of second- tallest~~."], "note": "pleasant 換 nice 時是 most <b>pleasant</b>→<b>nicest</b> 較自然（most nice 不順），考場建議直接抄 pleasant。難字：hassle-free、superb、campaign、lure、itinerary（題目可抄）"},
{"num": 125, "title": "School bullying (校園霸淩)", "code": "#060125", "full": "Spurred by the sense that disorderly behavior among students in South Euclid was increasing, the school resource officer (SRO) reviewed data regarding referrals to the principal's office. He found that the high school reported thousands of referrals a year for bullying and that the junior high school had recently experienced a 30 percent increase in bullying referrals. Police data showed that juvenile complaints about disturbances, bullying, and assaults after school hours had increased 90 percent in the past 10 years. The SRO worked in close collaboration with a social worker and the university researcher. They coordinated a Response Planning Team comprising many stakeholders that was intended to respond to each of the areas identified in the initial analysis. Environmental changes included modifying the school schedule and increasing teacher supervision of hotspots. Counsellors and social workers conducted teacher training courses in conflict resolution and bullying prevention. Parent education included mailings with information about bullying, an explanation of the new school policy, and a discussion about what could be done at home to address the problems. Finally, student education included classroom discussions between homeroom teachers and students, as well as assemblies conducted by the SRO. The SRO also opened a substation next to a primary hotspot. The Ohio Department of Education contributed by opening a new training center to provide a non-traditional setting for specialized help. The results from the various responses were dramatic. School suspensions decreased 40 percent. Bullying incidents dropped 60 percent in the hallways and 80 percent in the gym area. Follow- up surveys indicated that there were positive attitudinal changes among students about bullying and that more students felt confident that teachers would take action when a problem arose. Teachers indicated that training sessions were helpful and that they were more likely to talk about bullying as a serious issue. Parents responded positively, asking for more information about the problem in future mailings. The overall results suggest that the school environments were not only safer; but that early intervention was helping at-risk students succeed in school (South Euclid (Ohio) Police Department, 2001).", "ans": "The school resource officer [checked|reviewed] data [about|regarding] referrals to the principal's office, {and} he found that the high school reported thousands of referrals a year for bullying, {and} environmental changes included [changing|modifying] the school schedule and increasing teacher supervision of hotspots, {and} the results from the various responses were dramatic, school suspensions [dropped|decreased] 40 percent.", "zh": "校園駐點警察檢視了轉介到校長室的資料，發現高中每年通報數千件霸凌轉介，環境改變包括修改課表和加強老師對熱點的監督，而各種因應措施的結果很顯著，停學處分減少了 40%。", "src": ["~~Spurred by the sense that disorderly behavior among students in South Euclid was increasing,~~ the school resource officer ~~(SRO)~~ reviewed data regarding referrals to the principal's office.", "He found that the high school reported thousands of referrals a year for bullying ~~and that the junior high school had recently experienced a 30 percent increase in bullying referrals~~.", "Environmental changes included modifying the school schedule and increasing teacher supervision of hotspots.", "The results from the various responses were dramatic. School suspensions decreased 40 percent."], "note": "難字：referrals、principal's、modifying、supervision、suspensions（題目可抄）"},
{"num": 126, "title": "Sochi Olympics (索契冬奧會)", "code": "#060126", "full": "Major athletic events around the globe – from the 2014 Sochi Olympics to an annual powerboat race in Norwegian fjords – are striving to neutralize their carbon footprint as part of a world- wide climate network, the United Nations Environment Programme (UNEP) said today. The sporting events are the latest participants to join the network, and are particularly important for inspiring further global action on the environment, said Achim Steiner, UNEP Executive Director. \"Whether carried out on track and field or on ice and snow, sporting events ignite the spirit of achievement in thousands of competitors and billions of spectators worldwide,\" Mr· Steiner said. \"It is, therefore, heartening that this passion for excellence increasingly encompasses environmental performance, with sporting organizations raising the bar ever higher at each and every tournament,\" he added. Organizers of the 2014 Sochi Olympic and Paralympic Winter Games – to be held in a unique natural setting between the shores of the Black Sea and the soaring snow-capped Caucasus Mountains – say they will put an estimated $1·75 billion into energy conservation and renewable energy. That investment will be dedicated to improving transport infrastructure, offsetting greenhouse gas emissions from the use of electricity, air travel and ground transportation, the reforestation of Sochi National Park and the development of green belts in the city.", "ans": "[Big|Major] athletic events around the [world|globe] are [trying|striving] to neutralize their carbon footprint, {and} the sporting events are the latest participants to join the network, and are important for inspiring [more|further] global action on the environment, {and} organizers of the 2014 Sochi Olympic Winter Games say they will put an estimated $1·75 billion into energy conservation and renewable energy.", "zh": "全球各地的大型體育賽事正努力中和碳足跡，這些體育賽事是最新加入該網絡的成員，對激勵全球進一步的環境行動很重要，而 2014 年索契冬奧的主辦單位表示將投入約 17.5 億美元在節能和再生能源上。", "src": ["Major athletic events around the globe ~~– from the 2014 Sochi Olympics to an annual powerboat race in Norwegian fjords –~~ are striving to neutralize their carbon footprint ~~as part of a world- wide climate network, the United Nations Environment Programme (UNEP) said today~~.", "The sporting events are the latest participants to join the network, and are ~~particularly~~ important for inspiring further global action on the environment~~, said Achim Steiner, UNEP Executive Director~~.", "Organizers of the 2014 Sochi Olympic ~~and Paralympic~~ Winter Games ~~– to be held in a unique natural setting between the shores of the Black Sea and the soaring snow-capped Caucasus Mountains –~~ say they will put an estimated $1·75 billion into energy conservation and renewable energy."], "note": "難字：athletic、neutralize、carbon footprint、participants、conservation、renewable（題目可抄）"},
{"num": 127, "title": "Humans and animals (人和動物)", "code": "#060127", "full": "All non-human animals are constrained by the tools that nature has bequeathed them through natural selection. They are not capable of striving towards truth; they simply absorb information, and behave in ways useful for their survival. The kinds of knowledge they require of the world have been largely pre-selected by evolution. No animal is capable of asking questions or generating problems that are irrelevant to its immediate circumstances or its evolutionarily designed needs. When a beaver builds a dam, it doesn't ask itself why it does so or whether there is a better way of doing it. When a swallow flies south, it doesn't wonder why it is hotter in Africa or what would happen if it flew still further south. Humans do ask themselves these and many other kinds of questions, questions that have no relevance, indeed make little sense, in the context of evolved needs and goals. What marks out humans is our capacity to go beyond our naturally defined goals such as the need to find food, shelter or a mate and to establish human created goals.", "ans": "All non-human animals are [limited|constrained] by the tools that nature has [given|bequeathed] them through natural selection, {and} they are not capable of striving towards truth; they [just|simply] absorb information, and behave in ways useful for their survival, {but} what marks out humans is our [ability|capacity] to go beyond our naturally defined goals and to establish human created goals.", "zh": "所有非人類動物都受限於大自然透過天擇賦予牠們的工具，牠們無法追求真理，只是吸收資訊並以有利生存的方式行動，但人類的特別之處在於我們有能力超越天生設定的目標，建立人類自創的目標。", "src": ["All non-human animals are constrained by the tools that nature has bequeathed them through natural selection.", "They are not capable of striving towards truth; they simply absorb information, and behave in ways useful for their survival.", "What marks out humans is our capacity to go beyond our naturally defined goals ~~such as the need to find food, shelter or a mate~~ and to establish human created goals."], "note": "難字：constrained、bequeathed、striving、absorb、capacity、establish（題目可抄）"},
{"num": 128, "title": "Australian food (澳大利亞飲食）", "code": "#060128", "full": "In its periodic quest for culinary identity, Australia automatically looks to its indigenous ingredients, the foods that are native to this country. There can be little doubt that using an indigenous product must qualify a dish as Australian notes Stephanie Alexander. Similarly, and without qualification, states that ‘a uniquely Australian food culture can only be based upon foods indigenous to this country’, although, as Craw remarks, proposing Australian native foods as national symbols relies more upon their association with 'nature' and geographic origin than on common usage. Notwithstanding the lack of justification for the premise that national dishes are, of necessity, founded on ingredients native to the country—after all, Italy's gastronomic identity is tied to the non- indigenous tomato, Thailand to then on-indigenous chili—the reality is that Australians do not eat indigenous foods in significant quantities. The exceptions are fish, crustaceans and shellfish from oceans, rivers and lakes, most of which are unarguably unique to this country. Despite valiant and well-intentioned efforts today at promoting and encouraging the consumption of native resources, bush foods are not harvested or produced in sufficient quantities for them to be a standard component of Australian diets, nor are they generally accessible. Indigenous foods are less relevant to Australian identity today than lamb and passionfruit, both initially imported and now naturalized.", "ans": "In its [search|quest] for [food|culinary] identity, Australia looks to its indigenous ingredients, {but} the [truth|reality] is that Australians do not eat indigenous foods in [large|significant] quantities, {and} the exceptions are fish, crustaceans and shellfish from oceans, rivers and lakes, {and} indigenous foods are less relevant to Australian identity today than lamb and passionfruit, both initially imported and now naturalized.", "zh": "在尋找飲食認同時，澳洲會看向本土食材，但現實是澳洲人並沒有大量食用本土食物，例外是來自海洋、河流和湖泊的魚、甲殼類和貝類，而本土食物對今日澳洲認同的重要性，還不如原本進口、現已在地化的羊肉和百香果。", "src": ["In its ~~periodic~~ quest for culinary identity, Australia ~~automatically~~ looks to its indigenous ingredients~~, the foods that are native to this country~~.", "the reality is that Australians do not eat indigenous foods in significant quantities.", "The exceptions are fish, crustaceans and shellfish from oceans, rivers and lakes~~, most of which are unarguably unique to this country~~.", "Indigenous foods are less relevant to Australian identity today than lamb and passionfruit, both initially imported and now naturalized."], "note": "難字：quest、culinary、indigenous、ingredients、crustaceans、naturalized（題目可抄，拼字盯緊）"},
{"num": 129, "title": "Software engineer (軟件工程師)", "code": "#060129", "full": "Consider the current situation: like their counterparts in the United States, engineers and technicians in India have the capacity to provide both computer programming and innovative new technologies. Indian programmers and high-tech engineers earn one-quarter of what their counterparts earn in the United States; Consequently, India is able to do both jobs at a lower dollar cost than the United States: India has absolute advantage in both. In other words, it can produce a unit of programming for fewer dollars than the Unites States, and it can also produce a unit of technology innovation for fewer dollars. Does that mean that the United States will lose not only programming jobs but innovative technology job, too? Does that mean that our standard of living will fall if the United States and India engage in the international trade? David Ricardo would have answered no to both questions - as we do today. While India may have an absolute advantage in both activities, that fact is irrelevant in determining what India or the United States will produce. India has a comparative advantage in doing programming in part because of such activity requires little physical capital. The flip side is that the United States has a comparative advantage in technology innovation partly because it is relatively easy to obtain capital in this country to undertake such long-run projects. The result is that Indian programmers will do more and more of what U·S· programmers have been doing in the past. In contrast, American firms will shift to more and more innovation.", "ans": "Indian programmers [make|earn] one-quarter of what their counterparts earn in the United States, {and} India has a comparative advantage in doing programming because such [work|activity] [needs|requires] little physical capital, {and} the United States has a comparative advantage in technology innovation, {and} the result is that Indian programmers will do more and more of what U·S· programmers have been doing.", "zh": "印度程式設計師的收入只有美國同行的四分之一，印度在程式設計上有比較優勢，因為這類工作需要的實體資本很少，美國則在科技創新上有比較優勢，而結果是印度程式設計師會愈來愈多地做美國程式設計師以往做的工作。", "src": ["Indian programmers ~~and high-tech engineers~~ earn one-quarter of what their counterparts earn in the United States", "India has a comparative advantage in doing programming ~~in part~~ because ~~of~~ such activity requires little physical capital.", "~~The flip side is that~~ the United States has a comparative advantage in technology innovation ~~partly because it is relatively easy to obtain capital in this country to undertake such long-run projects~~.", "The result is that Indian programmers will do more and more of what U·S· programmers have been doing ~~in the past~~."], "note": "U·S· 的點是機經格式，作答寫 U.S. 即可。難字：counterparts、comparative advantage、innovation（題目可抄）"},
{"num": 130, "title": "Invisibility Cloak (隱形鬥篷)", "code": "#060130", "full": "According to researchers, the invisibility cloak illusion stems from the belief that we are much more socially observant than the people around us. This means that, while we watch and wonder about other people as much as possible, we often think that people around us are less aware. This illusion occurs because, while we are fully aware of our own impressions and speculations about other people, we have no idea about what those other people are thinking unless they choose to share with us, something that rarely happens except in exceptional circumstances. To better understand what is happening, it is important to consider the groundbreaking research by Amos Tversky and Daniel Kahneman on cognitive biases. When people make judgments about other people in social situations, they often depend on specific biases such as the availability heuristic, i·e·, that we attach more significance to thoughts that come to mind easily. This is why we consider thoughts about other people as being more important than thoughts about inanimate objects. And so, as we look around us, we tend to focus our thoughts on the people we see and what they happen to be doing. Which is why people-watching can be so addictive. What adds to the sense that we are relatively invisible to others is that people tend to be as discreet as possible about their people-watching. Just because other people aren't sharing their observations with us, it's easy to pretend that they are not as observant as we are. Of course, people may share their people-watching observations with anyone they happen to be with but, for the most part, that only applies to something remarkable enough to comment on. For most of us, what we are seeing tends to be extremely private and not to be shared with others.", "ans": "The invisibility cloak illusion [comes|stems] from the [idea|belief] that we are much more socially observant than the people around us, {and} while we watch and wonder about other people, we often think that people around us are less aware, {and} people tend to be as [quiet|discreet] as possible about their people-watching.", "zh": "隱形斗篷錯覺源自於我們相信自己比周圍的人更善於觀察社交，我們一邊觀察、好奇別人，一邊卻常認為周圍的人沒那麼留意，而人們對自己觀察別人這件事往往盡量低調。", "src": ["~~According to researchers,~~ the invisibility cloak illusion stems from the belief that we are much more socially observant than the people around us.", "~~This means that,~~ while we watch and wonder about other people ~~as much as possible~~, we often think that people around us are less aware.", "~~What adds to the sense that we are relatively invisible to others is that~~ people tend to be as discreet as possible about their people-watching."], "note": "難字：invisibility、illusion、observant、discreet（題目可抄）"},
{"num": 131, "title": "Pay your child (付錢給小孩的好處)", "code": "#060131", "full": "Many people who have written on the subject of allowances say it is not a good idea to pay your child for work around the home. These jobs are a normal part of family life. Paying children to do extra work around the house, however, can be useful. It can even provide an understanding of how a business works. Allowances give children a chance to experience the things they can do with money. They can share it in the form of gifts or giving to a good cause. They can spend it by buying things they want. Or they can save and maybe even invest it. Saving helps children understand that costly goals require sacrifice: you have to cut costs and plan for the future. Requiring children to save part of their allowance can also open the door to future saving and investing. Many banks offer services to help children and teenagers learn about personal finance. A savings account is an excellent way to learn about the power of compound interest. Compounding works by paying interest on interest. So, for example, one dollar invested at two percent interest for two years will earn two cents in the first year. The second year, the money will earn two percent of one dollar and two cents, and so on. That may not seem like a lot. But over time it adds up.", "ans": "Many people say it is not a good idea to pay your child for work around the home, {but} paying children to do extra work around the house can be [helpful|useful], {and} allowances give children a [way|chance] to experience the things they can do with money, {and} saving helps children understand that [expensive|costly] goals [need|require] sacrifice.", "zh": "很多人說付錢讓孩子做家事不是好主意，但付錢讓孩子做額外的家事可以有用，零用錢讓孩子有機會體驗金錢能做的事，而儲蓄讓孩子了解昂貴的目標需要犧牲。", "src": ["Many people ~~who have written on the subject of allowances~~ say it is not a good idea to pay your child for work around the home.", "Paying children to do extra work around the house~~, however,~~ can be useful.", "Allowances give children a chance to experience the things they can do with money.", "Saving helps children understand that costly goals require sacrifice~~: you have to cut costs and plan for the future~~."], "note": "難字：allowances、experience、sacrifice（題目可抄）"},
{"num": 132, "title": "Continental Drift (大陸漂移)", "code": "#060132", "full": "According to the theory of continental drift, the world was made up of a single continent through most of geologic time. That continent eventually separated and drifted apart, forming into the seven continents we have today. The first comprehensive theory of continental drift was suggested by the German meteorologist Alfred Wegener in 1912. The hypothesis asserts that the continents consist of lighter rocks that rest on heavier crustal material—similar to the manner in which icebergs float on water. Wegener contended that the relative positions of the continents are not rigidly fixed but are slowly moving—at a rate of about one yard per century. According to the generally accepted plate-tectonics theory, scientists believe that Earth's surface is broken into a number of shifting slabs or plates, which average about 50 miles in thickness. These plates move relative to one another above a hotter, deeper, more mobile zone at average rates as great as a few inches per year. Most of the world's active volcanoes are located along or near the boundaries between shifting plates and are called plate-boundary volcanoes. The peripheral areas of the Pacific Ocean Basin, containing the boundaries of several plates, are dotted with many active volcanoes that form the so-called Ring of Fire. The Ring provides excellent examples of plate-boundary volcanoes, including Mount St· Helens. However, some active volcanoes are not associated with plate boundaries, and many of these so-called intra-plate volcanoes form roughly linear chains in the interior of some oceanic plates. The Hawaiian Islands provide perhaps the best example of an intra-plate volcanic chain, developed by the northwest- moving Pacific plate passing over an inferred \"hot spot\" that initiates the magma-generation and volcano-formation process.", "ans": "According to the theory of continental drift, the world was made up of a [one|single] continent through most of geologic time, {and} that continent [finally|eventually] [split|separated] and drifted apart, forming into the seven continents we have today, {and} the first [complete|comprehensive] theory of continental drift was suggested by the German meteorologist Alfred Wegener in 1912.", "zh": "根據大陸漂移理論，在地質時間的大部分時期，世界是由一整塊大陸組成的，這塊大陸最終分裂漂移，形成今天的七大洲，而第一個完整的大陸漂移理論是德國氣象學家韋格納在 1912 年提出的。", "src": ["According to the theory of continental drift, the world was made up of a single continent through most of geologic time.", "That continent eventually separated and drifted apart, forming into the seven continents we have today.", "The first comprehensive theory of continental drift was suggested by the German meteorologist Alfred Wegener in 1912."], "note": "難字：continental drift、geologic、comprehensive、meteorologist（題目可抄，拼字盯緊）"},
{"num": 133, "title": "Straw as building material(稻草房)", "code": "#060133", "full": "Many technologies have promised these qualities, but few have been commercially viable. What's been lacking is the performance data needed to demonstrate that these technologies are durable, genuinely environmentally beneficial, and suitable to be insured. Over the past 13 years, our Department of Architecture & Civil Engineering has led on research into straw as a low-impact building material. This work, which has included developing a unique straw bale panel as well as scientific monitoring and testing, has now culminated in crucial industry certifications. The BM TRADA’s Q-Mark certification guarantees a straw building’s energy efficiency, fire safety, durability and weather-resilience and means that developers and homebuyers can now get insurance and mortgages for straw homes and buildings. The innovative straw walls in the new houses provide two times more insulation than required by current UK building regulations. Based on monitoring a residential straw-bale development in Leeds, fuel bill reductions up to 90% can be expected. The walls have been built using ModCell technology; prefabricated panels consisting of a wooden structural frame infilled with straw bales or hemp and rendered with either a breathable lime-based system or ventilated timber or brick cladding. This technology combines the lowest carbon footprint and the best operational CO² performance of any system of construction currently available. In fact, as an agricultural co-product, straw buildings can be carbon negative as straw absorbs CO² when it grows.", "ans": "Our Department of Architecture & Civil Engineering has led on research into straw as a low-impact building material, {and} the [new|innovative] straw walls [give|provide] two times more insulation than [needed|required] by current UK building regulations, {and} fuel bill reductions up to 90% can be expected, {and} straw buildings can be carbon negative as straw absorbs CO² when it grows.", "zh": "我們的建築與土木系主導了以稻草作為低衝擊建材的研究，創新的稻草牆提供的隔熱效果是英國現行建築法規要求的兩倍，燃料費可望減少高達 90%，而稻草建築可以是負碳的，因為稻草生長時會吸收二氧化碳。", "src": ["~~Over the past 13 years,~~ our Department of Architecture & Civil Engineering has led on research into straw as a low-impact building material.", "The innovative straw walls ~~in the new houses~~ provide two times more insulation than required by current UK building regulations.", "~~Based on monitoring a residential straw-bale development in Leeds,~~ fuel bill reductions up to 90% can be expected.", "~~In fact, as an agricultural co-product,~~ straw buildings can be carbon negative as straw absorbs CO² when it grows."], "note": "CO² 作答寫 CO2 即可。難字：Architecture、low-impact、insulation、regulations、absorbs（題目可抄）"},
{"num": 134, "title": "Electric Cars(電車）", "code": "#060134", "full": "Although we tend to think of electric cars as being something completely modern, they were in fact some of the earliest types of motorized vehicle. At the beginning of the twentieth century electric cars were actually more popular than cars with an internal combustion engine as they were more comfortable to ride in. However, as cars fueled by petrol increased in importance, electric cars declined. The situation became such that electric vehicles were only used for certain specific purposes, as fork- lift trucks, ambulances and urban delivery vehicles, for example. Although electricity declined in use in road vehicles, it steadily grew in importance as a means of powering trains. Switzerland, for example, was quick to develop an electrifed train system, encouraged in this no doubt by the fact that it had no coal or oil resources of its own. Nowadays there is renewed interest in electricity as a means of powering road vehicles. Why is this the case? Well, undoubtedly economic reasons are of considerable importance. The cost of oil has risen so sharply that there is a strong fnancial imperative to look for an alternative. However, there are also environmental motivations. Emissions from cars are blamed in large part for -among other things - the destruction of the ozone layer and the resultant rise in temperatures in the polar regions. A desire not to let things get any worse is also encouraging research into designing effective electric transport.", "ans": "Although we tend to think of electric cars as being something [new|modern], they were some of the [first|earliest] types of motorized vehicle, {but} as cars fueled by petrol increased in importance, electric cars declined, {and} there is renewed interest in electricity as a [way|means] of powering vehicles, {and} there is a strong financial [need|imperative] to look for an alternative.", "zh": "雖然我們往往認為電動車是很現代的東西，它們其實是最早的機動車輛之一，但隨著汽油車愈來愈重要，電動車衰退了，現在對用電驅動車輛重新產生興趣，而且有強烈的財務理由去尋找替代方案。", "src": ["Although we tend to think of electric cars as being something ~~completely~~ modern, they were ~~in fact~~ some of the earliest types of motorized vehicle.", "~~However,~~ as cars fueled by petrol increased in importance, electric cars declined.", "~~Nowadays~~ there is renewed interest in electricity as a means of powering ~~road~~ vehicles.", "~~The cost of oil has risen so sharply that~~ there is a strong fnancial imperative to look for an alternative."], "note": "機經「fnancial」是錯字，作答寫 financial。難字：motorized、declined、renewed、imperative、alternative（題目可抄）"},
{"num": 135, "title": "Postive Mindset(積極心態）", "code": "#060135", "full": "Research shows that when people work with a positive mind-set, performance on nearly every level - productivity, creativity, engagement - improves. Yet happiness is perhaps the most misunderstood driver of performance. For one, most people believe that success precedes happiness. “Once I get a promotion, I'll be happy,\" they think. Or, “Once I hit my sales target, I'll feel great”. But because success is a moving target - as soon as you hit your target, you raise it again, the happiness that results from success is fleeting. In fact, it works the other way around: people who cultivate a positive mind- set perform better in the face of challenge. I call this the \"happiness advantage”- every business outcome shows improvement when the brain is positive. I've observed this effect in my role as a researcher and lecturer in 48 countries on the connection between emplovee happiness and success. And I'm not alone: in a meta-analysis of 225 academic studies, researchers Sonja Lyubomirsky, Laura King, and Ed Diener found strong evidence of directional causality between life satisfaction and successful business outcomes. Another common misconception is that our genetics, our environment, or a combination of the two determines how happy we are. To be sure, both factors have an impact. But one's general sense of well- being is surprisingly malleable. The habits you cultivate, the way you interact with coworkers, how you think about stress - all these can be managed to increase your happiness and your chances of success.", "ans": "Research shows that when people work with a positive mind-set, performance on [almost|nearly] every level improves, {and} most people [think|believe] that success precedes happiness, {but} because success is a moving target the happiness that results from success is [brief|fleeting], {and} another common misconception is that our genetics, our environment, or a combination of the two [decides|determines] how happy we are.", "zh": "研究顯示，當人們以正向心態工作時，幾乎每個層面的表現都會進步，大多數人認為成功先於快樂，但因為成功是移動的目標，成功帶來的快樂稍縱即逝，而另一個常見誤解是我們的基因、環境或兩者的組合決定了我們有多快樂。", "src": ["Research shows that when people work with a positive mind-set, performance on nearly every level ~~- productivity, creativity, engagement -~~ improves.", "~~For one,~~ most people believe that success precedes happiness.", "~~But~~ because success is a moving target ~~- as soon as you hit your target, you raise it again,~~ the happiness that results from success is fleeting.", "Another common misconception is that our genetics, our environment, or a combination of the two determines how happy we are."], "note": "難字：mind-set、precedes、fleeting、misconception、genetics（題目可抄）"},
{"num": 136, "title": "New Women(新女性)", "code": "#060136", "full": "The concept of the \"New Woman\" emerged in Britain and North America during a time of social and cultural transformation. This idea was notably advanced by a writer named Sarah, who authored a book that sparked signifcant debate among commentators. Her work explored the shifting roles and expectations of middle-class women, focusing on financial independence, employment opportunities, and the nature of marriage. Sarah's arguments emphasized the need to protect and uplift women's status in society, highlighting the challenges they faced in a male-dominated structure. Although her ideas received mixed responses, with some embracing the push for gender equality while others criticized or resisted the change, the impact of her book was undeniable. It contributed to broader discussions about women's rights, autonomy, and social roles. Sarah's advocacy was part of a larger movement that sought to redefine the place of women not only in the domestic sphere but also in public and professional life. Despite the resistance and the fact that her vision wasn't fully realized at the time, the notion of the \"New Woman\" left a lasting impression and has since been commemorated as an important milestone in the history of women's movements. It represented a growing awareness of gender inequality and laid the groundwork for future reforms and feminist thought.", "ans": "The concept of the \"New Woman\" [appeared|emerged] in Britain and North America during a time of social and cultural [change|transformation], {and} this idea was advanced by a writer named Sarah, who [wrote|authored] a book that sparked significant debate, {and} her work explored the [changing|shifting] roles of middle-class women, {and} the notion of the \"New Woman\" left a lasting impression.", "zh": "「新女性」的概念在社會文化轉型時期出現在英國和北美，這個想法由一位名叫莎拉的作家推動，她寫的書引發了重大爭論，她的作品探討中產階級女性角色和期望的轉變，而「新女性」的概念留下了持久的影響。", "src": ["The concept of the \"New Woman\" emerged in Britain and North America during a time of social and cultural transformation.", "This idea was ~~notably~~ advanced by a writer named Sarah, who authored a book that sparked signifcant debate ~~among commentators~~.", "Her work explored the shifting roles ~~and expectations~~ of middle-class women~~, focusing on financial independence, employment opportunities, and the nature of marriage~~.", "~~Despite the resistance and the fact that her vision wasn't fully realized at the time,~~ the notion of the \"New Woman\" left a lasting impression ~~and has since been commemorated as an important milestone in the history of women's movements~~."], "note": "機經「signifcant」是錯字，作答寫 significant。難字：concept、emerged、transformation、authored、sparked、notion（題目可抄）"},
{"num": 137, "title": "Independent Workforce(獨立勞動力)", "code": "#060137", "full": "Working nine to five for a single employer bears little resemblance to the way a substantial share of the workforce makes a living today. Millions of people assemble various income streams and work independently, rather than in structured payroll jobs. This is hardly a new phenomenon, yet it has never been well measured in official statistics—and the resulting data gaps prevent a clear view of a large share of labor-market activity. To better understand the independent workforce and what motivates the people who participate in it, the McKinsey Global Institute surveyed some 8,000 respondents across Europe and the US. We asked about their income in the past 12 months, encompassing primary work, as well as any other income- generating activities, and about their professional satisfaction and aspirations for work in the future. The resulting report, Independent work: Choice, necessity, and the gig economy, finds that up to 162 million people in Europe and the US, or 20 to 30 percent of the working-age population, engage in some form of independent work. While demographically diverse, independent workers largely fit into four segments: free agents, who actively choose independent work and derive their primary income from it; casual earners, who use independent work for supplemental income and do so by choice; reluctants, who make their primary living from independent work but would prefer traditional jobs; and the financially strapped, who do supplemental independent work out of necessity.", "ans": "Working nine to five for a [one|single] employer bears little resemblance to the way a [large|substantial] share of the workforce makes a living today, {and} millions of people [combine|assemble] [different|various] income streams and work independently, rather than in structured payroll jobs, {and} up to 162 million people in Europe and the US engage in some form of independent work.", "zh": "為單一雇主朝九晚五工作，已經和今天很大一部分勞動力的謀生方式相去甚遠，數百萬人組合多種收入來源獨立工作，而不是做有固定薪資的工作，而歐美有多達 1.62 億人從事某種形式的獨立工作。", "src": ["Working nine to five for a single employer bears little resemblance to the way a substantial share of the workforce makes a living today.", "Millions of people assemble various income streams and work independently, rather than in structured payroll jobs.", "~~The resulting report, Independent work: Choice, necessity, and the gig economy, finds that~~ up to 162 million people in Europe and the US~~, or 20 to 30 percent of the working-age population,~~ engage in some form of independent work."], "note": "難字：resemblance、substantial、assemble、payroll、independently（題目可抄）"},
{"num": 138, "title": "The National Oceanography Centre(國家海洋學中心)", "code": "#060138", "full": "The National Oceanography Centre(NOC) is engaged in research into the potential risks and benefits of exploiting deep-sea mineral resources, some of which are essential for low-carbon technology, as well as using ocean robots to estimate the environmental impact of these potential deep-sea mining activities. The NOC has led an expedition on the RRS James Cook that found enough of the scarce element Tellurium present in the crust of a submerged volcano that, if it were all to be used in the production of solar PV panels, could provide 2/3rds of the UK's annual electricity supply. In addition, the NOC also led an international study demonstrating deep-sea nodule mining will cause long-lasting damage to deep-sea life, lasting at least for decades.These nodules are potato-sized rocks containing high levels of metals, including copper, manganese and nickel. They grow very slowly on the sea-bed, over millions of years. Although no commercial operations exist to extract these resources, many are planned. Professor Edward Hill, Executive Director at the NOC commented,\"By 2050 there will be nine billion people on earth and attention is increasingly turning to the ocean, particularly the deep ocean, for food, clean supplies of energy and strategic minerals. The NOC is undertaking research related to many aspects and perspectives involved in exploiting ocean resources. This research is aimed at informing with sound scientific evidence the decisions that will need to be taken in the future, as people increasingly turn to the oceans to address some of society's greatest challenges.\"", "ans": "The National Oceanography Centre(NOC) is engaged in research into the [possible|potential] risks and benefits of [using|exploiting] deep-sea mineral resources, {and} the NOC also led an international study [showing|demonstrating] deep-sea nodule mining will cause long-lasting damage to deep-sea life, lasting at least for decades, {and} although no commercial operations exist to [take|extract] these resources, many are planned.", "zh": "國家海洋學中心正在研究開採深海礦產資源的潛在風險和好處，該中心也主導了一項國際研究，證明深海結核採礦會對深海生物造成持續至少數十年的長期傷害，而雖然目前沒有商業開採作業，許多已在規劃中。", "src": ["The National Oceanography Centre(NOC) is engaged in research into the potential risks and benefits of exploiting deep-sea mineral resources~~, some of which are essential for low-carbon technology, as well as using ocean robots to estimate the environmental impact of these potential deep-sea mining activities~~.", "~~In addition,~~ the NOC also led an international study demonstrating deep-sea nodule mining will cause long-lasting damage to deep-sea life, lasting at least for decades.", "Although no commercial operations exist to extract these resources, many are planned."], "note": "難字：Oceanography、exploiting、nodule、commercial、extract（題目可抄）"},
{"num": 139, "title": "Immune System(免疫系統)", "code": "#060139", "full": "What is the Immune System? The immune system is a complex network of different organs, cells, and proteins that work together. There are 2 main parts of the immune system: the innate immune system - you are born with this, and the adaptive immune system - you develop this when your body is exposed to microbes or chemicals released by microbes. These two immune systems work together. The Innate Immune System This is your child's rapid response system. It is the first to respond when it finds an invader. It is made up of the skin, the eye's cornea, and the mucous membrane that lines the respiratory, gastrointestinal, and genitourinary tracts. These all create physical barriers to help protect your child's body. They protect against harmful germs, parasites (such as worms), or cells (such as cancer). The innate immune system is inherited. It is active from the moment your child is born. When this system recognizes an invader, it goes into action right away. The cells of this immune system surround and cover the invader. The invader is killed inside the immune system cells (called phagocytes). The Acquired Immune System The acquired immune system, with help from the innate system, makes special proteins (called antibodies) to protect your body from a specific invader. These antibodies are developed by cells called B lymphocytes after the body has been exposed to the invader. The antibodies stay in your child's body. It can take several days for antibodies to form. But after the first exposure, the immune system will recognize the invader and defend against it. The acquired immune system changes during your child's life. Immunizations train your child's immune system to make antibodies to protect them from harmful diseases.", "ans": "The immune system is a [complicated|complex] network of different organs, cells, and proteins that work together, {and} there are 2 [major|main] parts of the immune system: the innate immune system, and the adaptive immune system, {and} the acquired immune system, with help from the innate system, makes special proteins to [defend|protect] your body from a [certain|specific] invader.", "zh": "免疫系統是由不同器官、細胞和蛋白質共同運作的複雜網絡，免疫系統有兩大部分：先天免疫系統和適應性免疫系統，而後天免疫系統在先天系統的幫助下製造特殊蛋白質，保護身體對抗特定入侵者。", "src": ["The immune system is a complex network of different organs, cells, and proteins that work together.", "There are 2 main parts of the immune system: the innate immune system ~~- you are born with this~~, and the adaptive immune system ~~- you develop this when your body is exposed to microbes or chemicals released by microbes~~.", "The acquired immune system, with help from the innate system, makes special proteins ~~(called antibodies)~~ to protect your body from a specific invader."], "note": "難字：immune、innate、adaptive、acquired、invader（題目可抄）"},
{"num": 140, "title": "Bank Overdraft(銀行透支)", "code": "#060140", "full": "Banks provide short-term finance to companies in the form of an overdraft on a current account. The advantage of an overdraft is its flexibility. When the cash needs of the company increase with seasonal factors, the company can continue to write cheques and watch the overdraft increase. When the goods and services are sold and cash begins to flow in, the company should be able to watch the overdraft decrease again. The most obvious example of a business which operates in this pattern is farming. The farmer uses the overdraft to finance the acquisition of seed for arable farming, or feed through the winter for stock farming and to cover the period when the crops or animals are growing and maturing. The overdraft is reducedwhen the crops or the animals are sold. The main disadvantage of an overdraft is that it is repayable on demand. The farmer whose crop fails because of bad weather knows the problem of being unable to repay the overdraft. Having overdraft financing increases the worries of those who manage the company. The other disadvantage is that the interest payable on overdrafts is variable. When interest rates increase, the cost of the overdraft increases. Furthermore, for small companies there are often complaints that the rate of interest charged is high compared with that available to larger companies. The banks answer that the rates charged reflect relative risk and it is their experience that small companies are more risky.", "ans": "Banks [give|provide] short-term finance to companies in the form of an overdraft, {and} the [benefit|advantage] of an overdraft is its flexibility, {but} the [biggest|main] disadvantage of an overdraft is that it is repayable on demand, {and} the other disadvantage is that the interest payable on overdrafts is variable, when interest rates [rise|increase], the cost of the overdraft increases.", "zh": "銀行以透支的形式提供公司短期融資，透支的優點是彈性，但透支的主要缺點是隨時可能被要求償還，而另一個缺點是透支利息是浮動的，利率上升時透支成本就增加。", "src": ["Banks provide short-term finance to companies in the form of an overdraft ~~on a current account~~.", "The advantage of an overdraft is its flexibility.", "The main disadvantage of an overdraft is that it is repayable on demand.", "The other disadvantage is that the interest payable on overdrafts is variable. When interest rates increase, the cost of the overdraft increases."], "note": "難字：overdraft、flexibility、repayable、variable（題目可抄）"},
{"num": 141, "title": "Wright Brothers (B) (萊特兄弟-B版)", "code": "#060141", "full": "After the 1905 flying season, the Wrights contacted the United States War Department, as well as governments and individuals in England, France, Germany, and Russia, offering to sell a flying machine. They were turned down time and time again -- government bureaucrats thought they were crackpots; others thought that if two bicycle mechanics could build a successful airplane, they could do it themselves. But the Wright persisted, and in late 1907, the US Army Signal Corps asked for an aircraft. Just a few months later, in early 1908, a French syndicate of businessmen agreed to purchase another. Both the US Army and the French asked for an airplane capable of carrying a passenger. The Wright brothers hastily adapted their 1905 Flyer with two seats and a more powerful engine. They tested these modifications in secret, back at Kitty Hawk, North Carolina for the first time in several years. Then the brothers parted temporarily -- Wilbur to France and Orville to Virginia. In 1908 and 1909, Wilbur demonstrated Wright aircraft in Europe, and Orville flew in Fort Meyer, Virginia. The flights went well until Orville lost a propeller and crashed, breaking his leg and killing his passenger Lt Thomas Selfridge. While Orville recuperated, Wilbur kept flying in France, breaking record after record. Orville and his sister Kate eventually joined Wilbur in France, and the three returned home to Dayton to an elaborate homecoming celebration. Together, Orville and Wilbur returned to Fort Meyer with a new Military Flyer and completed the US Army trials. A few months later, Wilbur flew before over a million spectators in New York Harbor — his first public flight in his native land. All of these flights stunned and captivated the world. The Wright Brothers became the first great celebrities of the twentieth century.", "ans": "After the 1905 flying season, the Wrights contacted the United States War Department [trying|offering] to sell a flying machine, {and} they were turned down time and time again, {but} the Wright [continued|persisted], and in late 1907, the US Army Signal Corps asked for an [plane|aircraft], {and} the Wright Brothers became the first great [stars|celebrities] of the twentieth century.", "zh": "1905 年飛行季後，萊特兄弟聯繫美國陸軍部想賣飛行機器，他們一再被拒絕，但萊特兄弟堅持下去，1907 年底美國陸軍通信兵團要求購買一架飛機，而萊特兄弟成為二十世紀第一批大名人。", "src": ["After the 1905 flying season, the Wrights contacted the United States War Department~~, as well as governments and individuals in England, France, Germany, and Russia,~~ offering to sell a flying machine.", "They were turned down time and time again ~~-- government bureaucrats thought they were crackpots; others thought that if two bicycle mechanics could build a successful airplane, they could do it themselves~~.", "~~But~~ the Wright persisted, and in late 1907, the US Army Signal Corps asked for an aircraft.", "The Wright Brothers became the first great celebrities of the twentieth century."], "note": "機經「the Wright persisted」應為 the Wrights。難字：contacted、persisted、Signal Corps、celebrities（題目可抄）"},
{"num": 142, "title": "Education Technology (教育技術)", "code": "#060142", "full": "In 1953 BF Skinner visited his daughter's maths class. The Harvard psychologist found every pupil learning the same topic in the same way at the same speed. A few days later he built his first \"teaching machine\", which let children tackle questions at their own pace. By the mid-1960s similar gizmos were being flogged by door-to-door salesmen. Within a few years, though, enthusiasm for them had fizzled out. Since then education technology (edtech) has repeated the cycle of hype and flop, even as computers have reshaped almost every other part of life. One reason is the conservatism of teachers and their unions. But another is that the brain-stretching potential of edtech has remained unproven. Today, however, Skinner’s heirs are forcing the sceptics to think again (see article). Backed by billionaire techies such as Mark Zuckerberg and Bill Gates, schools around the world are using new software to \"personalize\" learning. This could help hundreds of millions of children stuck in dismal classes—but only if edtech boosters can resist the temptation to revive harmful ideas about how children learn. To succeed, edtech must be at the service of teaching, not the other way around. The conventional model of schooling emerged in Prussia in the 18th century. Alternatives have so far failed to teach as many children as efficiently. Classrooms, hierarchical year-groups, standardized curriculums and fixed timetables are still the norm for most of the world’s nearly one point five billion schoolchildren.", "ans": "In 1953 BF Skinner visited his daughter's maths class, {and} he [made|built] his first \"teaching machine\", which let children [answer|tackle] questions at their own [speed|pace], {and} since then education technology has repeated the cycle of hype and flop, {and} to [work|succeed], edtech must be at the service of teaching, not the other way around.", "zh": "1953 年史金納去看女兒的數學課，之後他造出第一台「教學機器」，讓孩子按自己的步調解題，從那時起教育科技不斷重複炒作與失敗的循環，而教育科技要成功，就必須為教學服務，而不是反過來。", "src": ["In 1953 BF Skinner visited his daughter's maths class.", "~~A few days later~~ he built his first \"teaching machine\", which let children tackle questions at their own pace.", "Since then education technology ~~(edtech)~~ has repeated the cycle of hype and flop~~, even as computers have reshaped almost every other part of life~~.", "To succeed, edtech must be at the service of teaching, not the other way around."], "note": "難字：tackle、pace、hype、flop（題目可抄）"}

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function plain(a){return a.replace(/\[([^|\]]+)\|[^\]]+\]/g,'$1').replace(/\{(and|but)\}/g,'$1');}
function wc(a){return plain(a).trim().split(/\s+/).length;}
function renderAns(a){
  return esc(a)
    .replace(/\[([^|\]]+)\|([^\]]+)\]/g,'<span class="sw">$1</span><span class="og">($2)</span>')
    .replace(/\{(and|but)\}/g,'<span class="cj">$1</span>');
}
function renderSrc(s){return esc(s).replace(/~~(.+?)~~/g,'<s>$1</s>');}
function renderFull(d){
  let f=esc(d.full);
  d.src.forEach(x=>{
    const plain=esc(x.replace(/~~/g,''));
    if(!f.includes(plain)) console.warn('來源句對不上 #'+d.num, x);
    f=f.replace(plain,'<mark>'+renderSrc(x)+'</mark>');
  });
  return f;
}

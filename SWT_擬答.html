{"num": 65, "title": "Ecology (生態學)", "code": "#060065", "full": "Ecology is the study of interactions of organisms among themselves and with their environment. It seeks to understand patterns in nature (eg, the spatial and temporal distribution of organisms) and the processes governing those patterns. Climatology is the study of the physical state of the atmosphere – its instantaneous state or weather, its seasonal-to-interannual variability, its long- term average condition or climate, and how climate changes over time. These two fields of scientific study are distinctly different. Ecology is a discipline within the biological sciences and has as its core the principle of natural selection. Climatology is a discipline within the geophysical sciences based on applied physics and fluid dynamics. Both, however, share a common history. The origin of these sciences is attributed to Aristotle and Theophrastus and their books Meteorological and Enquiry into Plants, respectively, but their modern beginnings trace back to natural history and plant geography. Seventeenth, eighteenth, and nineteenth century naturalists and geographers saw changes in vegetation as they explored new regions and laid the foundation for the development of ecology and climatology as they sought explanations for these geographic patterns. Alexander von Humboldt, in the early 1800s, observed that widely separated regions have structurally and functionally similar vegetation if their climates are similar. Alphonse de Candolle hypothesized that latitudinal zones of tropical, temperate, and arctic vegetation are caused by temperature and in 1874 proposed formal vegetation zones with associated temperature limits.", "ans": "Ecology is the study of interactions of organisms among themselves and with their environment, {and} climatology is the study of the physical state of the atmosphere, {and} these two [areas|fields] of scientific study are [clearly|distinctly] different, {but} both share a [shared|common] history, their modern beginnings [go|trace] back to natural history and plant geography.", "zh": "生態學研究生物彼此之間以及與環境的互動，氣候學研究大氣的物理狀態，這兩個科學領域明顯不同，但兩者有共同的歷史，它們的現代起源都可追溯到自然史和植物地理學。", "src": ["Ecology is the study of interactions of organisms among themselves and with their environment.", "Climatology is the study of the physical state of the atmosphere ~~– its instantaneous state or weather, its seasonal-to-interannual variability, its long- term average condition or climate, and how climate changes over time~~.", "These two fields of scientific study are distinctly different.", "Both~~, however,~~ share a common history. ~~The origin of these sciences is attributed to Aristotle and Theophrastus and their books Meteorological and Enquiry into Plants, respectively, but~~ their modern beginnings trace back to natural history and plant geography."], "note": "難字：Ecology、interactions、organisms、Climatology、atmosphere（題目可抄）"},
{"num": 66, "title": "Television viewing(小孩看電視)", "code": "#060066", "full": "Why and to what extent should parents control their children’s TV watching? There is certainly nothing inherently wrong with TV. The problem is how much television a child watches and what effect it has on his life. Research has shown that as the amount of time spent watching TV goes up, the amount of time devoted not only to homework and study but other important aspects of life such as social development and physical activities decreases. Television is bound to have it tremendous impact on a child, both in terms of how many hours a week he watches TV and of what he sees. When a parent is concerned about the effects of television, he should consider a number of things: what TV offers the child in terms of information and knowledge, how many hours a week a youngster his age should watch television, the impact of violence and sex, and the influence of commercials. What about the family as a whole ? Is the TV set a central piece of furniture in your home! Is it flicked on the moment someone enters the empty house? Is it on during the daytime? Is it part of the background notice of your family life? Do you demonstrate by your own viewing that television should be watched selectively?", "ans": "There is nothing [really|inherently] wrong with TV, {but} the problem is how much television a child watches and what effect it has on his life, {and} as the amount of time spent watching TV goes up, the amount of time [given|devoted] to homework and study [drops|decreases], {and} television is bound to have its [huge|tremendous] impact on a child.", "zh": "電視本身沒有什麼問題，但問題是孩子看多少電視以及對他生活的影響，隨著看電視的時間增加，花在功課和學習上的時間就減少，而電視必然對孩子有巨大影響。", "src": ["There is ~~certainly~~ nothing inherently wrong with TV.", "The problem is how much television a child watches and what effect it has on his life.", "~~Research has shown that~~ as the amount of time spent watching TV goes up, the amount of time devoted ~~not only~~ to homework and study ~~but other important aspects of life such as social development and physical activities~~ decreases.", "Television is bound to have it tremendous impact on a child~~, both in terms of how many hours a week he watches TV and of what he sees~~."], "note": "機經「have it tremendous impact」是錯字，作答寫 <b>its</b>。難字：inherently、devoted、tremendous（題目可抄）"},
{"num": 67, "title": "Office Space (辦公室環境)", "code": "#060067", "full": "The notion that office space has a role in promoting or inhibiting performance is backed up by solid research. A recent study conducted by Harvard University and Massachusetts General Hospital showed that improvements to the physical surroundings of workers impacted on productivity not because the working environment was more attractive, but because the changes made employees feel cared for. A Swedish research paper revealed a strong link between the type of office an employee worked in and their overall job satisfaction and health. Various findings have emerged as a result of studies such as this. Pot plants and greenery can apparently have a real impact on psychological well-being. Those who work in a private room tend to be in better health than workers based in open-plan offices. Sufficient light can reduce sickness among workers and increase productivity, and an attractive office can make workers feel more cared for and therefore more loyal to their company. Most of these points make good rational sense. But some companies aren’t content simply to increase the health, productivity and contentment of their employees. Pioneers such as Google, Walt Disney and Dyson have tried to create offices that will do everything from promoting collaboration between workers to stimulating their creative juices. \"Environment, both physical and cultural, can make or break creativity.\" says Kursty Groves, author of I Wish I Worked There! A look inside the most creative spaces in business. Stimulating spaces expose the mind to a variety of stimuli - planned or random - In order to encourage people to think differently. Reflective spaces promote the filtering of information into the brain slowing it to make connections. An environment which encourages a team to build trust and to play freely is an essential ingredient for innovation.", "ans": "The [idea|notion] that office space has a role in promoting or inhibiting performance is backed up by [strong|solid] research, {and} a recent study showed that improvements to the physical [environment|surroundings] of workers impacted on productivity because the changes made [staff|employees] feel cared for, {and} pot plants and greenery can apparently have a real impact on psychological well-being.", "zh": "辦公空間會促進或抑制表現的想法有扎實研究支持，最近一項研究顯示改善員工的實體環境會影響生產力，因為這些改變讓員工覺得被關心，而盆栽和綠意顯然對心理健康有實際影響。", "src": ["The notion that office space has a role in promoting or inhibiting performance is backed up by solid research.", "A recent study ~~conducted by Harvard University and Massachusetts General Hospital~~ showed that improvements to the physical surroundings of workers impacted on productivity ~~not because the working environment was more attractive, but~~ because the changes made employees feel cared for.", "Pot plants and greenery can apparently have a real impact on psychological well-being."], "note": "難字：notion、inhibiting、surroundings、productivity、psychological（題目可抄，拼字盯緊）"},
{"num": 68, "title": "Online teaching (在線教育)", "code": "#060068", "full": "What makes teaching online unique is that it uses the Internet, especially the World Wide Web, as the primary means of communication. Thus, when you teach online, you don’t have to be someplace to teach. You don’t have to lug your briefcase full of paper or your laptop to a classroom, stand at a lectern, scribble on a chalkboard (or even use your high-tech, interactive classroom \"smart\" whiteboard), or grade papers in a stuffy room while your students take a test. You don’t even have to sit in your office waiting for students to show up for conferences. You can hold \"office hours\" on weekends or at night after dinner. You can do all this while living in a small town in Wyoming or a big city like Bangkok, even if you are working for a college whose administrative office is located in Florida or Dubai. You can attend an important conference in Hawaii on the same day you teach your class in New Jersey, logging on from your laptop via the local café’s wireless hotspot or your hotel room’s high-speed network. Or you may simply pull out your smartphone to quickly check on the latest postings, email, or text messages from students. Online learning offers more freedom for students as well. They can search for courses using the Web, scouring their institution or even the world for programs, classes, and instructors that fit their needs. Having found an appropriate course, they can enroll and register, shop for their books, read articles, listen to lectures, submit their homework assignments, confer with their instructors, and receive their final grades-all online. They can assemble virtual classrooms, joining other students from diverse geographical locales, foraging bonds and friendships not possible in conventional classrooms, which are usually limited to students from a specific geographical area.", "ans": "What makes teaching online [special|unique] is that it uses the Internet as the [main|primary] means of communication, {and} when you teach online, you don’t have to be someplace to teach, {and} online learning [gives|offers] more freedom for students as well, {and} they can assemble virtual classrooms, joining other students from diverse geographical [places|locales].", "zh": "線上教學的獨特之處在於它以網際網路作為主要溝通方式，線上教學時你不必在某個地方才能教，線上學習也給學生更多自由，他們可以組成虛擬教室，和來自不同地方的學生一起上課。", "src": ["What makes teaching online unique is that it uses the Internet~~, especially the World Wide Web,~~ as the primary means of communication.", "~~Thus,~~ when you teach online, you don’t have to be someplace to teach.", "Online learning offers more freedom for students as well.", "They can assemble virtual classrooms, joining other students from diverse geographical locales~~, foraging bonds and friendships not possible in conventional classrooms, which are usually limited to students from a specific geographical area~~."], "note": "難字：unique、primary、assemble、virtual、geographical（題目可抄）"},
{"num": 69, "title": "Primary carer (初級護工)", "code": "#060069", "full": "Slightly less than one in five carers (19%) were primary carers (475,000 people). That is, they were the main carer of a person who was limited in carrying out the core everyday activities of mobility, communication or self-care. Both primary carers and the larger group of other carers (close to 2 million) contribute to the wellbeing of older people and people with disabilities. However, because they care for people who otherwise would have difficulty carrying out basic everyday activities, there is particular interest in primary carers: in the contribution they make, their wellbeing, labor force experiences, motivations and the support they receive in caring. Primary carers were more likely than other carers to be assisting someone who lived in the same household (81% compared with 76%). As with caring as a whole, the likelihood of being a primary carer increased with age to peak at age 55-64 years, where one in twenty people were primary carers. However, rather than then declining, the likelihood of being a primary carer remained at around this level among the older age groups. Consequently, primary carers had a somewhat older age profile than other carers.The median age of primary carers was 52 years, compared with 47 years for other carers. Primary carers were more likely than other carers to be female (71% compared with 50%) and less likely to be in the labor force (39% compared with 60%). Women not in the labor force were by far the largest single group among primary carers (44%). In contrast, men employed full-time were the largest single group among other carers (25%). Consistent with their lower labor force participation, primary carers had lower personal incomes than other carers (a median gross income of $237 per week compared with $327 per week) and were more likely to have a government pension or allowance as their main source of income (55% compared with 35%).", "ans": "Less than one in five carers were primary carers, {and} they were the main carer of a person who was limited in carrying out the [basic|core] [daily|everyday] activities, {and} primary carers were more likely to be [women|female] and less likely to be in the labor force, {and} primary carers had lower personal incomes than other carers.", "zh": "不到五分之一的照顧者是主要照顧者，他們是核心日常活動受限者的主要照顧者，主要照顧者較可能是女性、較不可能在勞動市場，而主要照顧者的個人收入比其他照顧者低。", "src": ["~~Slightly~~ less than one in five carers ~~(19%)~~ were primary carers ~~(475,000 people)~~.", "~~That is,~~ they were the main carer of a person who was limited in carrying out the core everyday activities ~~of mobility, communication or self-care~~.", "Primary carers were more likely ~~than other carers~~ to be female ~~(71% compared with 50%)~~ and less likely to be in the labor force ~~(39% compared with 60%)~~.", "~~Consistent with their lower labor force participation,~~ primary carers had lower personal incomes than other carers"], "note": "難字：primary carers、labor force、incomes（題目可抄）"},
{"num": 70, "title": "South Africa (南非)", "code": "#060070", "full": "The area that is now South Africa has been inhabited by humans for millennia. The San, the original inhabitants of this land, were migratory people who lived in small groups of about 15 to 20 people. They survived by fishing and hunting and by gathering roots and other wild foods. They did not build permanent dwellings but used rock shelters as temporary dwellings. Around 2,000 years ago Khoikhoi pastoralists migrated to the coast. In the eastern part of present-day South Africa, iron-working societies date from about 300 AD. The Sotho-Tswana and Nguni peoples arrived in this region around 1,200 AD. They lived by agriculture and stock farming, mined gold, copper and tin and hunted for ivory and built stone-walled towns. Over the centuries, these societies had diverse contacts with the Khoisan. Strife between the San and the Khoikhoi developed over competition for game; eventually the Khoikhoi became dominant. These peoples lived in the western part of present-day South Africa and are known collectively as the Khoisan.", "ans": "The area that is now South Africa has been inhabited by humans for millennia, {and} the San, the [first|original] inhabitants of this land, were migratory people who lived in small groups, {and} around 2,000 years ago Khoikhoi pastoralists [moved|migrated] to the coast, {and} the Sotho-Tswana and Nguni peoples [came|arrived] in this [area|region] around 1,200 AD.", "zh": "現在的南非地區已有人類居住數千年，這片土地最早的居民桑人是遷徙民族，住在小群體中，約兩千年前科伊科伊牧民遷到海岸，而索托—茨瓦納和恩古尼人約在西元 1200 年來到這個地區。", "src": ["The area that is now South Africa has been inhabited by humans for millennia.", "The San, the original inhabitants of this land, were migratory people who lived in small groups ~~of about 15 to 20 people~~.", "Around 2,000 years ago Khoikhoi pastoralists migrated to the coast.", "The Sotho-Tswana and Nguni peoples arrived in this region around 1,200 AD."], "note": "arrived 換 came 後介系詞要改成 came <b>to</b> this area。難字：inhabited、millennia、migratory、pastoralists（題目可抄）"},
{"num": 71, "title": "IBM (IBM)", "code": "#060071", "full": "As far as prediction is concerned, remember that the chairman of IBM predicted in the fifties that the world would need a maximum of around half a dozen computers, that the British Department for Education seemed to think in the eighties that we would all need to be able to code in BASIC and that in the nineties Microsoft failed to foresee the rapid growth of the Internet. Who could have predicted that one major effect of the automobile would be to bankrupt small shops across the nation? Could the early developers of the telephone have foreseen its development as a medium for person to person communication, rather than as a form of broadcasting medium? We all, including the 'experts', seem to be peculiarly inept at predicting the likely development of our technologies, even as far as the next year. We can, of course, try to extrapolate from experience of previous technologies, as I do below by comparing the technology of the Internet with the development of other information and communication technologies and by examining the earlier development of radio and print. But how justified I might be in doing so remains an open question. You might conceivably find the history of the British and French videotext systems, Prestel and Minitel, instructive. However, I am not entirely convinced that they are very relevant, nor do I know where you can find information about them online, so, rather than take up space here, I've briefly described them in a separate article.", "ans": "The [boss|chairman] of IBM predicted in the fifties that the world would need half a dozen computers, {and} we all, including the 'experts', seem to be [bad|inept] at predicting the likely development of our technologies, {and} we can try to extrapolate from experience of [past|previous] technologies, {but} how justified I might be in doing so [stays|remains] an open question.", "zh": "IBM 董事長在五○年代預測全世界只需要六台左右的電腦，我們所有人，包括「專家」，似乎都不擅長預測科技可能的發展，我們可以試著從過去科技的經驗推斷，但這樣做有多站得住腳仍是個未解的問題。", "src": ["~~As far as prediction is concerned, remember that~~ the chairman of IBM predicted in the fifties that the world would need ~~a maximum of around~~ half a dozen computers", "We all, including the 'experts', seem to be ~~peculiarly~~ inept at predicting the likely development of our technologies~~, even as far as the next year~~.", "We can~~, of course,~~ try to extrapolate from experience of previous technologies", "But how justified I might be in doing so remains an open question."], "note": "難字：chairman、inept、extrapolate、justified（題目可抄）"},
{"num": 72, "title": "Australian voting (澳洲投票)", "code": "#060072", "full": "A democratic country should have the right to decide whether to vote or not. It is strange that after decades of crawling up the political backside of the US, Australians don't have that right. Being fined for not voting reminds me of the old saying \"you can lead a horse to water but you cannot make him drink\". The fine is not for failing to vote but for failing to have your name marked off a list! Forcing people to make a decision just means they'll make the easiest, quickest decision they can, not the best one. You need an informed electorate for compulsory voting to work. However, the reality is that nobody knows anything about the candidates and promotional material is not readily available. I'd rather 80% of people didn't vote than have them all just pick the first recognizable name on the ballot sheet. Then at least the government is elected by the 20% who care and make informed decisions. Otherwise it is largely pot chance who gets elected. Furthermore, compulsory voting doesn't ensure that the entire electorate is engaged in the democratic process. Those who don't want to vote can simply turn up and get their name marked off, without even putting pencil to paper. But you're seriously deluding yourself if you think that this is what all those who don't care about government do when they turn up to the polling booth. Voluntary voting at least ensures those who vote are the ones that care enough to do so. Perhaps somebody could enlighten me as to the reason why, to the best of my knowledge, Australia is the only 'democracy' that has compulsory voting. It is certainly not compulsory in the USA, England, Canada, New Zealand, Philippines or any other European or Asian democracy that I am aware of. Compulsory voting is, however, mandatory in most communist regimes.", "ans": "A democratic country should have the right to [choose|decide] whether to vote, {and} forcing people to make a decision just means they'll make the easiest, [fastest|quickest] decision they can, {and} you need an informed electorate for [forced|compulsory] voting to work, {but} [free|voluntary] voting at least ensures those who vote are the ones that care enough to do so.", "zh": "民主國家應該有權決定要不要投票，強迫人們做決定只會讓他們做出最簡單、最快的決定，強制投票要有效需要一群知情的選民，但自願投票至少確保投票的人是夠在乎的人。", "src": ["A democratic country should have the right to decide whether to vote ~~or not~~.", "Forcing people to make a decision just means they'll make the easiest, quickest decision they can~~, not the best one~~.", "You need an informed electorate for compulsory voting to work.", "Voluntary voting at least ensures those who vote are the ones that care enough to do so."], "note": "難字：democratic、electorate、compulsory、voluntary（題目可抄）"},
{"num": 73, "title": "Guinness (吉尼斯紀錄)", "code": "#060073", "full": "One of Guinness World Records’ more unusual awards was presented at the National Maritime Museum yesterday. After a 100-day trial, the timepiece known as Clock B – which had been sealed in a clear plastic box to prevent tampering – was officially declared, by Guinness, to be the world’s \"most accurate mechanical clock with a pendulum swinging in free air\". It was an intriguing enough award. But what is really astonishing is that the clock was designed more than 250 years ago by a man who was derided at the time for \"an incoherence and absurdity that was little short of the symptoms of insanity\", and whose plans for the clock lay ignored for two centuries. The derision was poured on John Harrison, the British clockmaker whose marine chronometers had revolutionized seafaring in the 18th century (and who was the subject of Longitude by Dava Sobel). His subsequent claim – that he would go on to make a pendulum timepiece that was accurate to within a second over a 100-day period – triggered widespread ridicule. The task was simply impossible, it was declared. But now the last laugh lies with Harrison. At a conference, Harrison Decoded: Towards a Perfect Pendulum Clock, held at Greenwich yesterday, observatory scientists revealed that a clock that had been built to the clockmaker’s exact specifications had run for 100 days during official tests and had lost only five-eighths of a second in that period.", "ans": "After a 100-day trial, the timepiece known as Clock B was officially [named|declared] to be the world’s \"most accurate mechanical clock with a pendulum swinging in free air\", {but} what is really [surprising|astonishing] is that the clock was designed more than 250 years ago by a man who was [mocked|derided], {and} now the last laugh lies with Harrison.", "zh": "經過 100 天的測試，這座名為 B 鐘的計時器被金氏正式宣布為世界上「最準確的自由空氣擺鐘」，但真正驚人的是，這座鐘是 250 多年前由一位當時被嘲笑的人設計的，而現在笑到最後的是哈里森。", "src": ["After a 100-day trial, the timepiece known as Clock B ~~– which had been sealed in a clear plastic box to prevent tampering –~~ was officially declared~~, by Guinness,~~ to be the world’s \"most accurate mechanical clock with a pendulum swinging in free air\".", "~~But~~ what is really astonishing is that the clock was designed more than 250 years ago by a man who was derided ~~at the time for \"an incoherence and absurdity that was little short of the symptoms of insanity\", and whose plans for the clock lay ignored for two centuries~~.", "~~But~~ now the last laugh lies with Harrison."], "note": "難字：timepiece、declared、accurate、pendulum、astonishing、derided（題目可抄，拼字盯緊）"},
{"num": 74, "title": "Eat of Animals (肉食者)", "code": "#060074", "full": "A day would come, Percy Shelley predicted in 1813, when \"the monopolizing eater of animal flesh would no longer destroy his constitution by eating an acre at a meal\". He explained: \"The quantity of nutritious vegetable matter consumed in fattening the carcass of an ox would afford 10 times the sustenance if gathered immediately from the bosom of the earth.\" Two hundred years later, mainstream agronomists and dietitians have caught up with the poet. A growing scientific consensus agrees that feeding cereals and beans to animals is an inefficient and extravagant way to produce human food, that there is a limited amount of grazing land, that the world will be hard-pressed to supply a predicted population of 9 billion people with a diet as rich in meat as the industrialized world currently enjoys, and that it's not a very healthy diet anyway. On top of this, livestock contribute significantly towards global warming, generating 14·5% of all manmade greenhouse gas emissions, according to one much-quoted estimate from the United Nations. Now that the problem has been identified, the challenge is to persuade people in wealthy countries to eat less meat. That might seem a tall order, but governments have successfully persuaded people to quit smoking through a combination of public information, regulation and taxation.", "ans": "A growing scientific consensus agrees that feeding cereals and beans to animals is an inefficient and [wasteful|extravagant] way to produce human food, {and} livestock contribute [greatly|significantly] towards global warming, {and} the [task|challenge] is to persuade people to eat less meat, {but} governments have [already|successfully] persuaded people to quit smoking through a combination of public information, regulation and taxation.", "zh": "愈來愈多科學共識認為用穀物和豆類餵牲畜是生產人類食物既低效又浪費的方式，牲畜對全球暖化貢獻很大，挑戰在於說服富裕國家的人少吃肉，但政府已經成功透過公共宣導、管制和課稅的組合說服人們戒菸。", "src": ["A growing scientific consensus agrees that feeding cereals and beans to animals is an inefficient and extravagant way to produce human food~~, that there is a limited amount of grazing land, that the world will be hard-pressed to supply a predicted population of 9 billion people with a diet as rich in meat as the industrialized world currently enjoys, and that it's not a very healthy diet anyway~~.", "~~On top of this,~~ livestock contribute significantly towards global warming~~, generating 14·5% of all manmade greenhouse gas emissions, according to one much-quoted estimate from the United Nations~~.", "~~Now that the problem has been identified,~~ the challenge is to persuade people ~~in wealthy countries~~ to eat less meat.", "~~That might seem a tall order, but~~ governments have successfully persuaded people to quit smoking through a combination of public information, regulation and taxation."], "note": "難字：consensus、inefficient、extravagant、livestock、persuade（題目可抄）"},
{"num": 75, "title": "Hookham Bookstore (書店)", "code": "#060075", "full": "THE BOOKSELLERS OF HOOKHAM AND CARPENTER (hereafter referred to only as ‘Hookham’) were located on New Bond Street in London, and their records span the most politically turbulent decade of the eighteenth-century – the 1790s. Clients who frequented Hookham were primarily from the aristocratic or gentry classes. In fact, of Hookham’s total buyers, 22% were aristocracy and 35% (214 customers) of the aristocracy purchased novels. We can also confidently assume that untitled female customers were of gentry income, because their addresses were primarily in London’s fashionable ‘West End’. Hookham’s ledgers not only reveal a dramatic increase in the proportion of female purchasers of novels by comparison to earlier studies of provincial women, but they also reveal a remarkable increase in the proportion of female purchases of novels authored by females. Such a marked increase illustrates that Hookham’s leisured female customers were able to buy more novels. Furthermore, the fact that these female aristocrats and gentry have accounts under their own name, not their husbands’, demonstrates the greater degree of agency and independence that these urban, moneyed women had relative to provincial women. However, because our study does not include an examination of male customers, we are very limited in what claims we can make about whether or not these women behaved according to the cliché that women were the predominant consumers of novels in the eighteenth-century. Moreover, while more disposable income and leisure time certainly accounts for the significant increase in female purchases of novels authored by women in the 1790s, this increase also strongly suggests a desire on the part of women readers to engage in this politically charged decade. Thus, novel-reading provided women readers with the means through which they were able to participate in the male-dominated world of politics.", "ans": "Clients who [visited|frequented] Hookham were [mainly|primarily] from the aristocratic or gentry classes, {and} Hookham’s ledgers reveal a [big|dramatic] increase in the proportion of female purchasers of novels, {and} such a marked increase [shows|illustrates] that Hookham’s leisured female customers were able to buy more novels, {and} novel-reading provided women readers with the means to participate in the male-dominated world of politics.", "zh": "光顧霍克姆書店的客人主要來自貴族或士紳階級，霍克姆的帳簿顯示女性購買小說的比例大幅增加，這種明顯的增加說明霍克姆有閒的女性顧客有能力買更多小說，而讀小說讓女性讀者得以參與男性主導的政治世界。", "src": ["Clients who frequented Hookham were primarily from the aristocratic or gentry classes.", "Hookham’s ledgers ~~not only~~ reveal a dramatic increase in the proportion of female purchasers of novels ~~by comparison to earlier studies of provincial women, but they also reveal a remarkable increase in the proportion of female purchases of novels authored by females~~.", "Such a marked increase illustrates that Hookham’s leisured female customers were able to buy more novels.", "~~Thus,~~ novel-reading provided women readers with the means ~~through which they were able~~ to participate in the male-dominated world of politics."], "note": "難字：frequented、aristocratic、gentry、ledgers、purchasers、leisured（題目可抄，拼字盯緊）"},
{"num": 76, "title": "Autism (自閉症)", "code": "#060076", "full": "Autism is a disorder characterized by impairments in communication, social interaction, and repetitive behaviors. Over the past 40 years, the measured prevalence of autism has multiplied roughly 10-fold. While progress has been made in understanding some of the factors associated with increased risk and rising prevalence, no one knows with certainty what causes autism or what caused autism prevalence to rise so precipitously. There is, however, a growing awareness among scholars that focusing solely on individual risk factors such as exposure toxicants, prenatal complications, or parental education is insufficient to explain why autism prevalence rates have increased so stunningly. Social and institutional processes likely play an important role. For example, changes in diagnostic criteria and an influx of resources dedicated to autism diagnosis may be critical to understanding why prevalence rates have risen. Increased awareness and social influence have been implicated in the rise of autism and a variety of comparable disorders, where social processes mimic the effects of contagion. Studies have examined the contribution of changes in diagnostic criteria and diagnostic substitution to rising autism prevalence rates, but the importance of institutional factors, resources for diagnosis, and greater awareness have not been systematically assessed. The sociological literature on health and inequality, however, provides substantial motivation for exploring how individual- and community- level effects operate to shape the likelihood of an autism diagnosis.", "ans": "Autism is a disorder characterized by impairments in communication, social interaction, and repetitive behaviors, {and} over the past 40 years, the prevalence of autism has [grown|multiplied] 10-fold, {but} no one knows what causes autism, {and} social and institutional processes [probably|likely] play an important role, {and} changes in diagnostic criteria may be [key|critical] to understanding why prevalence rates have risen.", "zh": "自閉症是一種以溝通、社交互動障礙和重複行為為特徵的疾病，過去 40 年來，自閉症的測得盛行率增加了約十倍，但沒有人確切知道自閉症的成因，社會和制度過程可能扮演重要角色，而診斷標準的改變可能是理解盛行率上升的關鍵。", "src": ["Autism is a disorder characterized by impairments in communication, social interaction, and repetitive behaviors.", "Over the past 40 years, the ~~measured~~ prevalence of autism has multiplied ~~roughly~~ 10-fold.", "~~While progress has been made in understanding some of the factors associated with increased risk and rising prevalence,~~ no one knows ~~with certainty~~ what causes autism ~~or what caused autism prevalence to rise so precipitously~~.", "Social and institutional processes likely play an important role. ~~For example,~~ changes in diagnostic criteria ~~and an influx of resources dedicated to autism diagnosis~~ may be critical to understanding why prevalence rates have risen."], "note": "難字：characterized、impairments、repetitive、prevalence、diagnostic criteria（題目可抄，拼字盯緊）"},
{"num": 77, "title": "Africa (非洲發展潛力)", "code": "#060077", "full": "The negative impression of Africa held internationally is very unfair to those African countries that are actually doing well in their development, because this continent has more than 50 countries rich in natural resources which have not been completely exploited and cultural diversity, and hardworking Africans are struggling to address issues of poverty, disease and war, so Africa can be an attractive place for business development and cultural tourism if concerted international support and assistance are provided. This skewed perception overlooks the vibrant reality and immense potential of the continent. Africa has a lot of potential, and years ago it brought benefits to some companies. Historical engagements have proven that forward-thinking businesses can find success. In fact, Africa is the region with the best investment returns. It is a paradise for investors and adventurers, but it still needs international aid. It is good to do business with Africans because of the mutual money and long-term growth prospects. Furthermore, beyond business, Africa is also beautiful, boasting landscapes and cultural heritage that make it a premier destination for cultural tourism, offering profound experiences for visitors. However, to discuss Africa honestly, one must also acknowledge its struggles. Africa suffers from frequent wars and the causes are complex, rooted in historical legacies and competition over resources, not in any inherent trait of its people. Africans know what is needed in their development but need assistance in areas like technology transfer, infrastructure financing, and capacity building.", "ans": "The negative impression of Africa held internationally is very unfair to those African countries that are actually doing well in their development, {and} Africa has a lot of potential, {and} in fact, Africa is the region with the best investment returns, {but} to discuss Africa honestly, one must also [admit|acknowledge] its [problems|struggles], {and} Africa [has|suffers from] frequent wars.", "zh": "國際上對非洲的負面印象，對那些發展得很好的非洲國家非常不公平，非洲有很大的潛力，事實上非洲是投資回報最好的地區，但要誠實地談非洲，也必須承認它的困境，而非洲經常發生戰爭。", "src": ["The negative impression of Africa held internationally is very unfair to those African countries that are actually doing well in their development", "Africa has a lot of potential~~, and years ago it brought benefits to some companies~~.", "In fact, Africa is the region with the best investment returns.", "~~However,~~ to discuss Africa honestly, one must also acknowledge its struggles. Africa suffers from frequent wars ~~and the causes are complex, rooted in historical legacies and competition over resources, not in any inherent trait of its people~~."], "note": "suffers from 換成 has 一個字。難字：impression、internationally、potential、investment、acknowledge（題目可抄）"},
{"num": 78, "title": "Honey (蜜蜂的好處)", "code": "#060078", "full": "According to Dr· Ron Fessenden, MD, MPH, the average American consumes more than 150 pounds of refined sugar, plus an additional 62 pounds of high fructose corn syrup every year. In comparison, we consume only around 1·3 pounds of honey per year on average in the U·S. According to new research, if you can switch out your intake of refined sugar and use pure raw honey instead, the health benefits can be enormous. What is raw honey? It’s a pure, unfiltered and unpasteurized sweetener made by bees from the nectar of flowers. Most of the honey consumed today is processed honey that’s been heated and filtered since it was gathered from the hive. Unlike processed honey, raw honey does not get robbed of its incredible nutritional value and health powers. What are some of the benefits of raw honey ? It can help with everything from low energy to sleep problems to seasonal allergies. Switching to raw honey may even help weight-loss efforts when compared to diets containing sugar or high fructose corn syrup. I’m excited to tell you more about one of my all-time favorite natural sweeteners today, which I hope will convince you to eat honey more and sugar less.", "ans": "The average American [eats|consumes] more than 150 pounds of refined sugar, {but} we consume only around 1·3 pounds of honey per year, {and} if you can switch out your intake of refined sugar and use raw honey instead, the health benefits can be [huge|enormous], {and} it can help with everything from low energy to sleep [issues|problems] to seasonal allergies.", "zh": "美國人平均每年吃超過 150 磅的精製糖，但我們在美國平均每年只吃約 1.3 磅蜂蜜，如果你能把精製糖換成純生蜂蜜，健康益處會非常大，而它對從精力不足到睡眠問題到季節性過敏都有幫助。", "src": ["~~According to Dr· Ron Fessenden, MD, MPH,~~ the average American consumes more than 150 pounds of refined sugar~~, plus an additional 62 pounds of high fructose corn syrup every year~~.", "~~In comparison,~~ we consume only around 1·3 pounds of honey per year ~~on average in the U·S~~.", "~~According to new research,~~ if you can switch out your intake of refined sugar and use ~~pure~~ raw honey instead, the health benefits can be enormous.", "It can help with everything from low energy to sleep problems to seasonal allergies."], "note": "難字：consumes、refined、intake、enormous、allergies（題目可抄）"},
{"num": 79, "title": "Plunging oil price (油價下降)", "code": "#060079", "full": "A plunging oil price has dragged UK inflation to zero over recent months. But analysts say the fall in retail prices cannot solely be attributed to oil. Discount retailers continue to steal market share from established industry giants, taking an increased chunk of both food and non-food markets. And, as retail analyst Nick Bubb notes, \"the big supermarkets have had to respond to this by bringing down their own ‘rip off’ prices\". The result is a sector-wide fall in prices paid at the till. The growth of online retailers has also brought prices down, in part due to the ease with which customers can compare prices and purchase goods elsewhere if they find an item cheaper on a competitor’s site. Retailers are also reluctant to offer different prices in their physical and online stores, according to retail analyst Richard Hyman, which means shops are forced to cut prices on the high street. An ever-expanding range of shops is also to blame, according to Mr· Hyman. \"Overcapacity is the biggest of the issues affecting prices,\" he says. \"In the last 10 years, online alone has added the equivalent of 110m square feet of trading space — that’s roughly equal to 65 additional Westfield London shopping malls. An increase in supply of retailers, with no increase in demand, has left the industry massively oversupplied.\"", "ans": "A [falling|plunging] oil price has dragged UK inflation to zero over recent months, {but} analysts say the fall in retail prices cannot [only|solely] be attributed to oil, {and} discount retailers continue to [take|steal] market share from established industry giants, {and} the growth of online retailers has also brought prices down, {and} an ever-expanding range of shops is also to blame.", "zh": "油價暴跌讓英國近幾個月的通膨降到零，但分析師說零售價格下跌不能只歸因於油價，折扣零售商持續從老牌業界巨頭手中搶走市占率，線上零售商的成長也壓低了價格，而不斷擴張的店家數量也是原因之一。", "src": ["A plunging oil price has dragged UK inflation to zero over recent months.", "~~But~~ analysts say the fall in retail prices cannot solely be attributed to oil.", "Discount retailers continue to steal market share from established industry giants~~, taking an increased chunk of both food and non-food markets~~.", "The growth of online retailers has also brought prices down~~, in part due to the ease with which customers can compare prices and purchase goods elsewhere if they find an item cheaper on a competitor’s site~~.", "An ever-expanding range of shops is also to blame~~, according to Mr· Hyman~~."], "note": "這題原文一句一個原因，抄了五句（比平常多一句），每句都很短。難字：plunging、inflation、attributed、established（題目可抄）"},
{"num": 80, "title": "Songbirds (唱歌的小鳥)", "code": "#060080", "full": "Much study has been conducted regarding male songbirds, the researchers note, but little research has been done to better understand singing in female birds. Traditionally, the thinking has been that males sing to attract the females; thus females have little to no reason to sing. But, as the group also note, a prior study by an international team of researchers back in 2013 showed that approximately 71 percent of female songbirds sing—they just don't do it in the same ways or for the same reasons. In this new effort, the researchers sought to learn more about why female superb fairy wrens sing and when, and if it causes problems for them, such as attracting predators. They set up monitoring stations near 72 nesting sites in the wilds of Australia, home to the birds, and recorded their activities over a two-year period. In studying the behaviour of both the males and females, the researchers found that the females generally only sang in response to singing from their mate—the birds are monogamous. Males announced their presence when returning to the nest from foraging, the females replied with the same song, though it was muted. The back and forth sing-song between mated pairs was more prominent, the researchers noted, during nest building. To find out if the female returning the call put her eggs or chicks at risk, the team set up some artificial nests with quail eggs in them and played female songs from them, varying the number of calls per hour. Predators ate the eggs 40 percent of the time when the song rate was set at 20 songs per hour, but only did so 20 percent of the time when it was set at 6 calls per hour, showing that such calling did indeed put the offspring at risk. These findings, the researchers propose, suggest that it might be possible that evolution, rather than selecting for male songbird singing, has actually been selecting against female singing.", "ans": "Much study has been [done|conducted] regarding male songbirds, {but} little research has been done to understand singing in female birds, {and} a study back in 2013 showed that [about|approximately] 71 percent of female songbirds sing, {and} the researchers found that the females [usually|generally] only sang in response to singing from their mate, {and} such calling put the [young|offspring] at risk.", "zh": "關於雄性鳴禽已有很多研究，但很少有研究去了解雌鳥的鳴唱，2013 年一項先前研究顯示約 71% 的雌性鳴禽會唱歌，研究人員發現雌鳥通常只在回應配偶的歌聲時才唱，而這樣的鳴叫確實讓後代面臨風險。", "src": ["Much study has been conducted regarding male songbirds~~, the researchers note,~~ but little research has been done to ~~better~~ understand singing in female birds.", "~~But, as the group also note,~~ a ~~prior~~ study ~~by an international team of researchers~~ back in 2013 showed that approximately 71 percent of female songbirds sing", "~~In studying the behaviour of both the males and females,~~ the researchers found that the females generally only sang in response to singing from their mate", "such calling ~~did indeed~~ put the offspring at risk."], "note": "難字：conducted、regarding、approximately、offspring（題目可抄）"},
{"num": 81, "title": "Geothermal energy (地熱能)", "code": "#060081", "full": "What is the solution for nations with increasing energy demands, hindered by frequent power cuts and an inability to compete in the international oil market? For East Africa at least, experts think geothermal energy is the answer. More promising still, the Kenyan government and international investors seem to be listening. This is just in time according to many, as claims of an acute energy crisis are afoot due to high oil prices, population spikes and droughts. Geothermal energy works by pumping water into bedrock, where it is heated and returns to the surface as steam which is used directly as a heat source or to drive electricity production. Source: Energy Information Administration, Geothermal Energy in the Western United States and Hawaii. Currently over 60% of Kenya’s power comes from hydroelectric sources but these are proving increasingly unreliable as the issue of seasonal variation is intensified by erratic rain patterns. Alternative energy sources are needed; and the leading energy supplier in Kenya, Kenya Electricity Generating Company (KenGen), hopes to expand its geothermal energy supply from 13% to 25 % of its total usage by 2020. The potential of geothermal energy in the region was first realized internationally by the United Nations Development Program, when geologists observed thermal anomalies below the East African Rift system. Locals have been utilizing this resource for centuries; using steam vents to create the perfect humidity for greenhouses, or simply to enjoy a swim in the many natural hot lakes. Along the 6000 km of the rift from the Red Sea to Mozambique, geochemical, geophysical and heat flow measurements were made to identify areas suitable for geothermal wells. One area lies next to the extinct Olkaria volcano, within the Hell’s Gate National Park, and sits over some of the thinnest continental crust on Earth. This is a result of the thinning of the crust by tectonic stretching, causing hotter material below the Earth’s surface to rise, resulting in higher temperatures. This thin crust was ideal for the drilling of geothermal wells, reaching depths of around 3000 m, where temperatures get up to 342°C, far higher than the usual temperature of 90°C at this depth. Water in the surrounding rocks is converted to steam by the heat. The steam can be used to drive turbines and produce electricity.", "ans": "For East Africa at least, experts think geothermal energy is the answer, {and} geothermal energy works by pumping water into bedrock, {and} [now|currently] over 60% of Kenya’s power comes from hydroelectric sources but these are proving [more|increasingly] unreliable, {and} KenGen hopes to [grow|expand] its geothermal energy supply from 13% to 25 % of its total [use|usage] by 2020.", "zh": "至少對東非來說，專家認為地熱能是答案，地熱能的原理是把水打進基岩，加熱後以蒸汽形式回到地表，目前肯亞超過 60% 的電力來自水力，但這些愈來愈不可靠，而肯亞發電公司希望在 2020 年前把地熱能供應從總用量的 13% 提高到 25%。", "src": ["For East Africa at least, experts think geothermal energy is the answer.", "Geothermal energy works by pumping water into bedrock~~, where it is heated and returns to the surface as steam which is used directly as a heat source or to drive electricity production~~.", "Currently over 60% of Kenya’s power comes from hydroelectric sources but these are proving increasingly unreliable ~~as the issue of seasonal variation is intensified by erratic rain patterns~~.", "~~Alternative energy sources are needed; and the leading energy supplier in Kenya, Kenya Electricity Generating Company (~~KenGen~~)~~, hopes to expand its geothermal energy supply from 13% to 25 % of its total usage by 2020."], "note": "難字：geothermal、bedrock、hydroelectric、unreliable（題目可抄）"},
{"num": 82, "title": "Assessment (評估)", "code": "#060082", "full": "Assessment is a central process in education. If students learned what they were taught, we would never need to assess; we could instead just keep records of what we had taught. But as every teacher knows, many students do not learn what they are taught. Indeed, when we look at their work, it is sometimes hard to believe that they were in the classroom. In fact, it is impossible to predict with any certainty what students will learn as the result of a particular sequence of classroom activities. And because we cannot teach well without finding out where our students are starting from, we have to assess. Even if all our students started out at the same point (a highly unlikely situation), each of them will have reached different understandings of the material being studied within a very short period of time. That is why assessment is the bridge between teaching and learning —it is only through assessment that we can find out whether what has happened in the classroom has produced the learning we intended. Of course, assessment is also used for other purposes in education, which makes the picture much more complicated. In all countries, assessments of the performance of individual students are used to determine which students are, and which students are not, qualified for subsequent phases of education, and also to decide which kinds of education students should receive.", "ans": "Assessment is a [key|central] process in education, {and} if students learned what they were taught, we would [not|never] need to assess, {but} many students do not learn what they are taught, {and} because we cannot teach well without finding out where our students are starting from, we have to assess, {and} assessment is the [link|bridge] between teaching and learning.", "zh": "評量是教育的核心過程，如果學生學會了教的東西，我們就永遠不需要評量，但每個老師都知道，很多學生沒學會教的東西，因為不了解學生的起點就無法教好，所以我們必須評量，而評量是教與學之間的橋樑。", "src": ["Assessment is a central process in education.", "If students learned what they were taught, we would never need to assess~~; we could instead just keep records of what we had taught~~.", "~~But as every teacher knows,~~ many students do not learn what they are taught.", "~~And~~ because we cannot teach well without finding out where our students are starting from, we have to assess.", "~~That is why~~ assessment is the bridge between teaching and learning"], "note": "這題抄了五句短句。難字：assessment／assess、central（題目可抄）"},
{"num": 83, "title": "Muggy weather (悶熱的天氣)", "code": "#060083", "full": "What Makes It Muggy? Like the heat index, muggy is a \"feels-like\" condition, except it has to do more with how \"breathable\" the air feels than how hot it feels. The muggier the weather, the less chance you'll feel cool because of decreased evaporation rates, which is why the following weather conditions are notoriously linked to the muggiest of days and nights: Warm air temperatures, generally of 70°F or above (the warmer the air, the more moisture it's able to hold); High moisture (the more moisture there is in the air, the \"heavier\" it feels); and Low winds (the less wind there is, the fewer air molecules there are passing over your skin evaporating and cooling you off). Since mugginess expresses how moist the air feels, you might think that relative humidity would be a good indicator of how muggy it feels outside. However, dewpoint temperature is actually a better measure of mugginess. Why? Dewpoint not only gives you an indication of how moist air is, but how warm it is as well (since dew point temperature can go as high as, but never higher than the actual air temperature). So if the dew point is high, it means both air moisture and temperature probably are, too.", "ans": "The muggier the weather, the less chance you'll feel cool because of [lower|decreased] evaporation rates, {and} you might think that relative humidity would be a good [sign|indicator] of how muggy it feels, {but} dewpoint temperature is [really|actually] a better measure of mugginess, {and} if the dew point is high, it means both air moisture and temperature [likely|probably] are, too.", "zh": "天氣愈悶熱，你愈不容易因蒸發率下降而感到涼爽，你可能以為相對濕度是衡量悶熱程度的好指標，但露點溫度其實是更好的悶熱指標，而如果露點高，就表示空氣濕度和溫度可能都高。", "src": ["The muggier the weather, the less chance you'll feel cool because of decreased evaporation rates", "~~Since mugginess expresses how moist the air feels,~~ you might think that relative humidity would be a good indicator of how muggy it feels ~~outside~~.", "~~However,~~ dewpoint temperature is actually a better measure of mugginess.", "~~So~~ if the dew point is high, it means both air moisture and temperature probably are, too."], "note": "難字：muggy／muggier／mugginess、evaporation、humidity、dewpoint、indicator（題目可抄）"},
{"num": 84, "title": "Eating history (飲食曆史)", "code": "#060084", "full": "In the past two centuries there has been a dramatic change in the role of food and eating in Australian public consciousness. Public discussion of food was largely confined to matters of supply, distribution and price. Towards the end of the nineteenth century some newspapers were offering regular columns of advice on housekeeping topics, including menu planning and recipes. However, eating remained essentially a private activity, even when undertaken in company. By the late twentieth century, food and eating had become prominent public preoccupations. Evidence of this dramatic cultural revaluation abounds. In bookstores, for example, cookery and all things related to it are often among the larger displays. There are specialty stores selling all manner of cookware, tableware and other paraphernalia associated with food, eating and drinking. Perhaps most telling is the extension of the phenomenon of mass media celebrity to include culinary personalities. Scholars, too, have jumped on the commodification bandwagon. Now degrees in gastronomy seem set to emulate the MBA phenomenon of the 1980s and food has become a respectable subject for investigation with philosophers, sociologists, historians, cultural theorists, ecologists and many others all having a go at it. However, surprisingly, the question seems to have held little fascination for most historians. For the best part of two centuries they have managed to write their accounts of colonization and nationhood with only scant reference to how the settlers and their descendants fed themselves.", "ans": "In the past two centuries there has been a [big|dramatic] change in the role of food and eating in Australian public consciousness, {and} eating remained [mostly|essentially] a private activity, {but} by the late twentieth century, food and eating had become [major|prominent] public preoccupations, {but} the question seems to have held little [interest|fascination] for most historians.", "zh": "過去兩百年來，食物和飲食在澳洲公眾意識中的角色有了巨大變化，飲食本來基本上是私人活動，但到了二十世紀末，食物和飲食已成為顯著的公眾關注焦點，但這個問題似乎沒有引起大多數歷史學家的興趣。", "src": ["In the past two centuries there has been a dramatic change in the role of food and eating in Australian public consciousness.", "~~However,~~ eating remained essentially a private activity~~, even when undertaken in company~~.", "By the late twentieth century, food and eating had become prominent public preoccupations.", "~~However, surprisingly,~~ the question seems to have held little fascination for most historians."], "note": "難字：consciousness、essentially、prominent、preoccupations、fascination（題目可抄，拼字盯緊）"},
{"num": 85, "title": "Wright brothers (懷特兄弟)", "code": "#060085", "full": "Orville and Wilbur Wright were brothers living in Dayton, Ohio. The two had started making bicycles during the 1890s and had a successful small business selling their Wright Specials for $18 each ($475 in today’s green). This experience with building light, strong machines would prove valuable in the coming years after the brothers’ interest turned to flight. Others in the United States were also developing aircraft at the time the Wright brothers started turning their curiosity skyward. Samuel Langley had flown an unmanned steam-powered aircraft in 1896. Octave Chanute and others were flying gliders near Chicago late in the decade as well. But it wasn’t until the Wright brothers started working on the matter that the \"flying problem\" would finally be solved. Beginning in 1899, the brothers designed and built a series of gliders to test their various ideas on a flying machine. They constructed a wind tunnel that allowed them to test designs without having to build a full-size model. They even built their own gasoline-powered motor for their aircraft.", "ans": "Orville and Wilbur Wright were brothers living in Dayton, Ohio, {and} the two had [begun|started] making bicycles during the 1890s, {and} this experience with building light, strong machines would [be|prove] [useful|valuable] after the brothers’ interest turned to flight, {and} it wasn’t until the Wright brothers started working on the [issue|matter] that the \"flying problem\" would finally be solved.", "zh": "奧維爾和威爾伯·萊特是住在俄亥俄州代頓的兄弟，兩人在 1890 年代開始製造腳踏車，這種製造輕巧堅固機器的經驗，在兄弟倆的興趣轉向飛行後證明很有價值，而直到萊特兄弟開始研究這個問題，「飛行問題」才終於被解決。", "src": ["Orville and Wilbur Wright were brothers living in Dayton, Ohio.", "The two had started making bicycles during the 1890s ~~and had a successful small business selling their Wright Specials for $18 each ($475 in today’s green)~~.", "This experience with building light, strong machines would prove valuable ~~in the coming years~~ after the brothers’ interest turned to flight.", "~~But~~ it wasn’t until the Wright brothers started working on the matter that the \"flying problem\" would finally be solved."], "note": "started 換 begun（had + 過去分詞，不是 began）。難字：bicycles、valuable、machines（題目可抄）"},
{"num": 86, "title": "Compulsory voting (強制投票)", "code": "#060086", "full": "Compulsory voting is often suggested as a solution to the problem of declining turnout. But how are individuals and countries affected by compulsory voting beyond boosting electoral participation? Shane Singh investigates the social, economic, and political consequences of compelling citizens to vote. There has been a lot of discussion about compulsory voting these days. In the United Kingdom, in particular, as voter turnout rates have declined, many commentators and politicians have begun advocating for mandatory electoral participation. Those in favor of compulsory voting often adduce the importance of participation among all segments of society. Citizens of democracies are forced to do many things in the interest of the public good, they maintain, including serving on juries and educating their children, and full participation serves the country as whole. Those opposed to compulsory voting often argue that, from a democratic theory perspective, the right to vote implicitly includes a right not to vote. Such a right of abstention, they argue, is more important than any societal good that might accompany high turnout. In fact, opponents of compulsory voting often contend that the country may be better off if those who are disinclined to vote are not pushed to participate in public affairs. Regardless of whether one of these sets of arguments is more persuasive than the other, compulsory voting is commonly used around the world. Several European democracies mandate voting, as do Australia and most of the countries in Latin America. By evaluating results from these countries, it is possible to assess the mechanics and effects of compulsory voting.", "ans": "Compulsory voting is suggested as a solution to the problem of [falling|declining] turnout, {and} those in favor of compulsory voting often [stress|adduce] the importance of participation among all [parts|segments] of society, {but} those opposed to compulsory voting often argue that the right to vote includes a right not to vote, {and} compulsory voting is [widely|commonly] used around the world.", "zh": "強制投票常被提出作為投票率下降問題的解決方案，支持強制投票的人常強調社會各階層參與的重要性，但反對者常主張投票權包含不投票的權利，而強制投票在世界各地普遍使用。", "src": ["Compulsory voting is ~~often~~ suggested as a solution to the problem of declining turnout.", "Those in favor of compulsory voting often adduce the importance of participation among all segments of society.", "Those opposed to compulsory voting often argue that~~, from a democratic theory perspective,~~ the right to vote ~~implicitly~~ includes a right not to vote.", "~~Regardless of whether one of these sets of arguments is more persuasive than the other,~~ compulsory voting is commonly used around the world."], "note": "難字：compulsory、declining turnout、adduce、participation、segments（題目可抄）"},
{"num": 87, "title": "Social network (社交網絡)", "code": "#060087", "full": "Ten years ago, Barsky and Purdon (2006) discovered that social networks that are expanding communication through social media are becoming popular and the costs involved are getting further reduced. Yet, library executives did not see how such a phenomenon could become a part of library and information services. They felt that the users should be left to their social media while the library carried on with its traditional roles (De Rosa et al·, 2007). This was also the case when Charnigo and Barnett-Ellis (2007) conducted a survey of 126 academic librarians and concluded that 54% of the librarians surveyed did not believe that there was an academic purpose for Facebook. The rationale behind these librarians’ belief was that social media was a space where students interact with each other. Hence, the librarian was not welcome as their coming in might be viewed as an invasion of space. But time has proved that as the technology of social media became more popular, users and librarians acquired digital literacy, and libraries, seeing an explosion of social media around it, were forced to reconsider their stance. In a survey involving 497 international librarians, Taylor & Francis (2014) discovered that over 70% of librarians now feel that the use of social media is important. Though the wave began with public libraries (Mon, 2015), today, libraries of every type either have a social media presence or they are seriously considering it. Hence, the use of social media by libraries has become mainstream.", "ans": "Barsky and Purdon [found|discovered] that social networks are becoming popular, {but} library [managers|executives] did not see how such a phenomenon could become a part of library services, {but} time has [shown|proved] that as social media became more popular, libraries were forced to reconsider their [position|stance], {and} the use of social media by libraries has become mainstream.", "zh": "巴斯基和珀登發現社群網路正變得流行，但圖書館主管不認為這種現象能成為圖書館服務的一部分，但時間證明隨著社群媒體愈來愈流行，圖書館被迫重新考慮立場，而圖書館使用社群媒體已成為主流。", "src": ["~~Ten years ago,~~ Barsky and Purdon ~~(2006)~~ discovered that social networks ~~that are expanding communication through social media~~ are becoming popular ~~and the costs involved are getting further reduced~~.", "~~Yet,~~ library executives did not see how such a phenomenon could become a part of library ~~and information~~ services.", "~~But~~ time has proved that as ~~the technology of~~ social media became more popular, ~~users and librarians acquired digital literacy, and~~ libraries~~, seeing an explosion of social media around it,~~ were forced to reconsider their stance.", "~~Hence,~~ the use of social media by libraries has become mainstream."], "note": "難字：executives、phenomenon、reconsider、stance、mainstream（題目可抄）"},
{"num": 88, "title": "Parents’ birth order (家長出生順序)", "code": "#060088", "full": "Parents' own born order can become an issue when dynamics in the family they are raising replicate the family in which they were raised. Agati notes common examples, such as a firstborn parent getting into \"raging battles\" with a firstborn child. \"Both are used to getting the last word. Each has to be right. But the parent has to be the grown up and step out of that battle,\" he advises. When youngest children become parents, Agati cautions that because they \"may not have had high expectations placed on them, they in turn may not see their kids for their abilities\". But he also notes that since youngest children tend to be more social, \"youngest parents can be helpful to their firstborn, who may have a harder time with social situations. These parents can help their eldest kids loosen up and not be so hard on themselves. Mom Susan Ritz says her own birth order didn't seem to affect her parenting until the youngest of her three children, Julie, was born. Julie was nine years younger than Ritz's oldest, Joshua, mirroring the age difference between Susan and her own older brother. \"I would see Joshua do to Julie what my brother did to me,\" she says of the taunting and teasing by a much older sibling.\" I had to try not to always take Julie's side.\" Biases can surface no matter what your own birth position was, as Lori Silverstone points out. \"As a middle myself, I can be harder on my older daughter, I recall my older sister hitting me,\" she says of her reactions to her daughters' tussles.", "ans": "Parents' own born order can become [a problem|an issue] when dynamics in the family they are raising [copy|replicate] the family in which they were raised, {and} Agati [gives|notes] common examples, such as a firstborn parent getting into \"raging battles\" with a firstborn child, {and} biases can [appear|surface] no matter what your own birth position was.", "zh": "父母自己的出生順序可能成為問題，當他們養育的家庭重現他們成長的家庭模式時，阿加蒂舉了常見例子，例如長子父母和長子孩子陷入「激烈爭吵」，而不管你自己的出生順位是什麼，偏見都可能浮現。", "src": ["Parents' own born order can become an issue when dynamics in the family they are raising replicate the family in which they were raised.", "Agati notes common examples, such as a firstborn parent getting into \"raging battles\" with a firstborn child.", "Biases can surface no matter what your own birth position was~~, as Lori Silverstone points out~~."], "note": "issue 換 problem 時冠詞一起改（an→a）。機經「born order」應為 birth order。難字：dynamics、replicate、biases（題目可抄）"},
{"num": 89, "title": "Online safety (網上安全)", "code": "#060089", "full": "When Tim Berners-Lee invented the world wide web, he surely didn’t anticipate that children would end up becoming some of its main users. Most start using the internet at the average age of three – and as recent research shows, children now spend more time playing and socializing online than watching television programs. Given this change in habits, it is not surprising that a recent House of Lords report has raised online safety and behavior as an important issue. The report said that for children, learning to survive in a world dominated by the internet should be as important as reading and writing. The House of Lords Communications Committee also warned that children should not be leaving school without \"a well-rounded understanding of the digital world\". It also suggested that the government should think about implementing new legal requirements and a code of conduct companies would have to adhere to, which would help to bring the internet up to \"child- friendly standards\". Of course, trying to rectify this lack of child-centered design is not an easy task, but one that requires the cooperation and goodwill of many sectors. It will need to involve consultation with technology, education, legal and policy experts. And it would also be a good idea to make children and young people part of the process.", "ans": "When Tim Berners-Lee [created|invented] the world wide web, he didn’t [expect|anticipate] that children would end up becoming some of its main users, {and} most [begin|start] using the internet at the average age of three, {and} for children, learning to survive in a world [ruled|dominated] by the internet should be as important as reading and writing.", "zh": "提姆·柏內茲-李發明全球資訊網時，沒有預料到孩子會成為主要使用者之一，大多數孩子平均三歲就開始上網，而對孩子來說，學會在網路主導的世界生存應該和讀寫一樣重要。", "src": ["When Tim Berners-Lee invented the world wide web, he ~~surely~~ didn’t anticipate that children would end up becoming some of its main users.", "Most start using the internet at the average age of three ~~– and as recent research shows, children now spend more time playing and socializing online than watching television programs~~.", "~~The report said that~~ for children, learning to survive in a world dominated by the internet should be as important as reading and writing."], "note": "難字：invented、anticipate、average、dominated（題目可抄）"},
{"num": 90, "title": "Nap (小憩)", "code": "#060090", "full": "Could midday nap save your life? If the experience of Greek men is any guide, the answer just may be yes. In a study released yesterday, researchers at the Harvard School of Public Health and in Athens reported that Greeks who took regular 30-minute napping were 37% less likely to die of heart disease over a six-year period than those who never napped. The scientists tracked more than 23,000 adults, finding that the benefits of napping were most pronounced for working men. Researchers have long recognized that Mediterranean adults die of heart disease at a rate lower than Americans and Northern Europeans. Diets rich in olive oil and other heart-healthy foods have received some of the credit, but scientists have been intrigued by the potential role of napping. The study concluded that napping was more likely than diet or physical activity to lower the incidence of heart attacks and other life-ending heart ailments. Specialists not involved with the study said there are sound biochemical reasons to believe that a nap may help protect against heart disease. Essentially, they said, sleep at any time of day acts like a value to release the stress of everyday life.", "ans": "Researchers [found|reported] that Greeks who took regular 30-minute napping were 37% less likely to die of heart disease than those who never napped, {and} the benefits of napping were most [clear|pronounced] for working men, {and} the study [showed|concluded] that napping was more likely than diet or physical activity to lower the [rate|incidence] of heart attacks.", "zh": "研究人員報告，固定午睡 30 分鐘的希臘人死於心臟病的機率比從不午睡的人低 37%，午睡的好處在工作中的男性身上最明顯，而研究結論是午睡比飲食或運動更可能降低心臟病發的發生率。", "src": ["~~In a study released yesterday,~~ researchers ~~at the Harvard School of Public Health and in Athens~~ reported that Greeks who took regular 30-minute napping were 37% less likely to die of heart disease ~~over a six-year period~~ than those who never napped.", "~~The scientists tracked more than 23,000 adults, finding that~~ the benefits of napping were most pronounced for working men.", "The study concluded that napping was more likely than diet or physical activity to lower the incidence of heart attacks ~~and other life-ending heart ailments~~."], "note": "難字：napping／napped、pronounced、concluded、incidence（題目可抄）"},
{"num": 91, "title": "Brand loyalty (品牌忠誠度)", "code": "#060091", "full": "Brand loyalty exists when consumers repeat-purchase your brand rather than swapping and switching between brands. It is widely agreed that it is far more expensive to have to find a new customer than to keep existing ones happy, so brand loyalty is crucial for achieving high-profit margins. For charities, it is important to set a marketing objective of improving brand loyalty. If existing donors can be persuaded to set up a direct debit to the charity, its cash flow will improve significantly. To enhance, or reposition a brand's image Although some brands stay fresh for generations (Marmite is over 100 years old) others become jaded due to changes in consumer tastes and lifestyles. At this point, the firms need to refresh the brand image to keep the products relevant to the target market. A clear objective must be set. For instance: what brand attributes do we want to create? What do we want the brand to stand for? Repositioning This occurs when a firm aims to change a brand's image, so that the brand appeals to a new target market. Twelve years into its life cycle, McVitie’s decided to reposition its Hobnobs biscuit brand. Hobnobs had been positioned as a homely, quite healthy biscuit for middle-aged consumers. Research pointed McVitie’s in a new direction: younger, more male, and less dull. So new packaging was designed and then launched in conjunction with a new, brighter advertising campaign. In 2013 Hobnobs sales were worth 36 million pounds, 9 percent up on the previous year.", "ans": "Brand loyalty exists when [buyers|consumers] repeat-purchase your brand rather than swapping and switching between brands, {and} it is more expensive to find a new customer than to keep [current|existing] ones happy, so brand loyalty is [important|crucial], {and} repositioning occurs when a [company|firm] aims to change a brand's image, so that the brand appeals to a new target market.", "zh": "品牌忠誠度是指消費者重複購買你的品牌而不是在品牌之間換來換去，找新客戶比讓現有客戶滿意貴得多，所以品牌忠誠度很關鍵，而重新定位是指公司想改變品牌形象，讓品牌吸引新的目標市場。", "src": ["Brand loyalty exists when consumers repeat-purchase your brand rather than swapping and switching between brands.", "~~It is widely agreed that~~ it is ~~far~~ more expensive ~~to have~~ to find a new customer than to keep existing ones happy, so brand loyalty is crucial ~~for achieving high-profit margins~~.", "Repositioning ~~This~~ occurs when a firm aims to change a brand's image, so that the brand appeals to a new target market."], "note": "難字：loyalty、consumers、crucial、repositioning、appeals（題目可抄）"},
{"num": 92, "title": "Books and television (書本與電視)", "code": "#060092", "full": "To understand the final reason why the news marketplace of ideas dominated by television is so different from the one that emerged in the world dominated by the printing press, it is important to distinguish the quality of vividness experienced by television viewers from the \"vividness\" experienced by readers. I believe that the vividness experienced in the reading of words is automatically modulated by the constant activation of the reasoning centers of the brain that are used in the process of concreating the representation of reality the author has intended. By contrast, the visceral vividness portrayed on television has the capacity to trigger instinctual responses similar to those triggered by reality itself—and without being modulated by logic, reason, and reflective thought. The simulation of reality accomplished in the television medium is so astonishingly vivid and compelling compared with the representations of reality conveyed by printed words that it signifies much more than an incremental change in the way people consume information. Books also convey compelling and vivid representations of reality, of course. But the reader actively participates in the conjuring of the reality the book’s author Is attempting to depict. Moreover, the parts of the human brain that are central to the reasoning process are continually activated by the very act of reading printed words: Words are composed of abstract symbols—letters— that have no intrinsic meaning themselves until they are strung together into recognizable sequences. Television, by contrast, presents to its viewers a much more fully formed representation of reality—without requiring the creative collaboration that words have always demanded.", "ans": "It is important to [separate|distinguish] the quality of vividness experienced by television viewers from the \"vividness\" experienced by readers, {and} the visceral vividness portrayed on television has the [ability|capacity] to [cause|trigger] instinctual responses, {and} books also [offer|convey] compelling and vivid representations of reality, {but} the reader actively participates in the conjuring of the reality.", "zh": "重要的是要區分電視觀眾感受到的生動和讀者感受到的「生動」，電視呈現的本能式生動有能力引發本能反應，書也傳達了引人入勝的生動現實描繪，但讀者是主動參與建構那個現實的。", "src": ["~~To understand the final reason why the news marketplace of ideas dominated by television is so different from the one that emerged in the world dominated by the printing press,~~ it is important to distinguish the quality of vividness experienced by television viewers from the \"vividness\" experienced by readers.", "~~By contrast,~~ the visceral vividness portrayed on television has the capacity to trigger instinctual responses ~~similar to those triggered by reality itself—and without being modulated by logic, reason, and reflective thought~~.", "Books also convey compelling and vivid representations of reality~~, of course~~.", "~~But~~ the reader actively participates in the conjuring of the reality ~~the book’s author Is attempting to depict~~."], "note": "難字：distinguish、vividness、visceral、instinctual、compelling、conjuring（題目可抄，拼字盯緊）"},
{"num": 93, "title": "Phoenician (腓尼基語)", "code": "#060093", "full": "Their trade networks made the Phoenicians rich but also enabled cultural exchange and transfer between East and West in an unprecedented way: the most significant was the spread of the alphabetic script which was adopted all over the Mediterranean. The Phoenician alphabet is a writing system consisting of only 22 signs representing exactly one sound (phoneme) each. The term \"alphabet\" derives from the names of the first two signs in the sequence, aleph (\"cattle\") and beit(\"house\"): these names also reflect the letters' shapes, each derived from the picture of an object whose name starts with the relevant sound. The alphabetic script is simple enough to learn quickly, without the years of dedicated training required to master writing systems such as cuneiform or Egyptian hieroglyphs. Specialized schooling was unnecessary, and literacy was therefore disengaged from the institutional context of palaces and temples where the traditional scripts continued to be used. The alphabet suited the needs of long- distance merchants who needed to be able to record their business affairs on the go and who, for reasons of confidentiality and money, often preferred to write themselves rather than employ a specialist scribe. As the script could easily be used to record any language, it was, in the course of the first millennium BC, adapted for Aramaic, Hebrew, Greek, Phrygian, Lydian, Etruscan and Latin, to name but a few.", "ans": "Their trade networks made the Phoenicians rich but also [allowed|enabled] cultural exchange and transfer between East and West, {and} the Phoenician alphabet is a writing system [made up|consisting] of only 22 signs representing exactly one sound each, {and} as the script could easily be used to record any language, it was [changed|adapted] for Aramaic, Hebrew, Greek and Latin.", "zh": "貿易網絡讓腓尼基人致富，也促成了東西方前所未有的文化交流，腓尼基字母是只有 22 個符號、每個符號代表一個音的書寫系統，而由於它能輕易記錄任何語言，它被改編用於亞拉姆語、希伯來語、希臘語和拉丁語。", "src": ["Their trade networks made the Phoenicians rich but also enabled cultural exchange and transfer between East and West ~~in an unprecedented way: the most significant was the spread of the alphabetic script which was adopted all over the Mediterranean~~.", "The Phoenician alphabet is a writing system consisting of only 22 signs representing exactly one sound ~~(phoneme)~~ each.", "As the script could easily be used to record any language, it was~~, in the course of the first millennium BC,~~ adapted for Aramaic, Hebrew, Greek~~, Phrygian, Lydian, Etruscan~~ and Latin~~, to name but a few~~."], "note": "難字：Phoenicians、alphabet／alphabetic、consisting、adapted（題目可抄）"},

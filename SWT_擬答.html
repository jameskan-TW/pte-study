{"num": 33, "title": "Infants’ imitation (嬰兒模仿行爲)", "code": "#060033", "full": "Contrary to popular belief, babies under a few months don't grin at you because they're copying your own smile, according to new research. Many studies have indicated that from birth, infants imitate the behaviors and facial expressions of the adults around them. However, a team of Australian, South African and British researchers have released a study this week that refutes this widespread belief. \"Numerous studies from the 1980s and 90s indicated no imitation by newborns, while others claimed it was there,\" says Virginia Slaughter, a biologist at the University of Queensland and co-author of the study. \"We wanted to clear up the confusion because the 'fact' that newborns imitate is widely cited, not just in the fields of psychology, neuroscience and pediatrics, but also in popular sources for parents.\" The international research team, led by Janine Ostenbroek, a psychologist at the University of York in the UK, exposed more than 100 infants to a broad range of gestures and recorded their responses at one, two, six and nine weeks of age. The gestures included social cues like adults poking their tongues out, frowning or grinning, as well as non-social cues such as pointing or opening a box. The findings showed no link between behaviors exhibited by babies in their first few months and the gestures they were exposed to. The babies were just as likely to exhibit gestures they had never seen before as repeat ones they had. For instance, babies stuck their tongues out just as frequently if they were being exposed to pointing or opening a box, rather than anything to do with mouths or tongues.", "ans": "Many studies have [shown|indicated] that from birth, [babies|infants] imitate the behaviors and facial expressions of the adults around them, {but} a team of researchers have [done|released] a study that refutes this [common|widespread] belief, {and} the findings showed no link between behaviors exhibited by babies in their first few months and the gestures they were exposed to.", "zh": "許多研究指出嬰兒從出生起就會模仿周圍大人的行為和表情，但一組研究人員發表了一項研究反駁這個普遍看法，研究結果顯示嬰兒頭幾個月的行為和他們看到的手勢之間沒有關聯。", "src": ["Many studies have indicated that from birth, infants imitate the behaviors and facial expressions of the adults around them.", "~~However,~~ a team of ~~Australian, South African and British~~ researchers have released a study ~~this week~~ that refutes this widespread belief.", "The findings showed no link between behaviors exhibited by babies in their first few months and the gestures they were exposed to."], "note": "難字：imitate、facial expressions、refutes、gestures（題目可抄）"},
{"num": 34, "title": "International trade (國際貿易)", "code": "#060034", "full": "The world is shrinking rapidly with the advent of faster communication, transportation, and financial flows. Products developed in one country—Gucci purses, Sony electronics, McDonald’s hamburgers, Japanese sushi, German BMWs—have found enthusiastic acceptance in other countries. It would not be surprising to hear about a German businessman wearing an Italian suit meeting an English friend at a Japanese restaurant who later returns home to drink Russian vodka and watch Dancing with the Stars on TV. International trade has boomed over the past three decades. Since 1990, the number of multinational corporations in the world has grown from 30,000 to more than 63,000. Some of these multinationals are true giants. In fact, of the largest 150 \"economies\" in the world, only 81 are countries. The remaining 69 are multinational corporations. Walmart, the world’s largest company, has annual revenues greater than the GDP of all but the world’s 21 largest countries. Between 2000 and 2008, total world trade grew more than 7 percent per year, easily out- stripping GDP output, which was about 3 percent. Despite a dip in world trade caused by the recent worldwide recession, the world trade of products and services last year was valued at more than $12 trillion, about 17 percent of GDP worldwide. Many U·S· companies have long been successful at international marketing: McDonald’s, Coca-Cola, Starbucks, GE, IBM, Colgate, Caterpillar, Boeing, and dozens of other American firms have made the world their market. In the United States, names such as Sony, Toyota, Nestlé, IKEA, Canon, and Nokia have become household words. Other products and services that appear to be American are, in fact, produced or owned by foreign companies.", "ans": "The world is shrinking [quickly|rapidly] with the [arrival|advent] of faster communication, transportation, and financial flows, {and} international trade has [increased|boomed] over the past three decades, {and} since 1990, the number of multinational [companies|corporations] in the world has grown from 30,000 to more than 63,000, {and} of the largest 150 \"economies\" in the world, only 81 are countries.", "zh": "隨著更快的通訊、運輸和金流出現，世界正迅速縮小，國際貿易在過去三十年蓬勃發展，自 1990 年以來，全球跨國企業數量從 3 萬家增加到超過 6 萬 3 千家，而全球最大的 150 個「經濟體」中，只有 81 個是國家。", "src": ["The world is shrinking rapidly with the advent of faster communication, transportation, and financial flows.", "International trade has boomed over the past three decades.", "Since 1990, the number of multinational corporations in the world has grown from 30,000 to more than 63,000.", "~~In fact,~~ of the largest 150 \"economies\" in the world, only 81 are countries."], "note": "難字：advent、multinational corporations、decades（題目可抄）"},
{"num": 35, "title": "Learning a Language (學語言)", "code": "#060035", "full": "Over the years, language teachers have alternated between favoring teaching approaches that focus primarily on language use and those that focus on language forms or analysis. The alternation has been due to a fundamental disagreement concerning whether one learns to communicate in a second language by communicating in that language (such as in an immersion experience) or whether one learns to communicate in a second language by learning the lexicogrammar – the words and grammatical structures – of the target language. In other words, the argument has been about two different means of achieving the same end. As with any enduring controversy, the matter is not easily resolved. For one thing, there is evidence to support both points of view.It is not uncommon to find learners who, for whatever reason, find themselves in a new country or a new region of their own country, who need to learn a new language, and who do so without the benefit of formal instruction. If they are postpubescent, they may well retain an accent of some kind, but they can pick up enough language to satisfy their communicative needs. In fact, some are natural acquirers who become highly proficient in this manner. In contrast, there are learners whose entire exposure to the new language comes in the form of classroom instruction in lexicogrammar. Yet they too achieve a measure of communicative proficiency, and certain of these learners become highly proficient as well. What we can infer from this is that humans are amazingly versatile learners and that some people have a natural aptitude for acquiring languages and will succeed no matter what the circumstances.", "ans": "Language teachers have alternated between favoring teaching [methods|approaches] that focus [mainly|primarily] on language use and those that focus on language forms or analysis, {but} the [question|matter] is not easily resolved, {and} there is evidence to support both points of view, {and} humans are amazingly versatile learners and some people have a natural aptitude for [learning|acquiring] languages.", "zh": "語言老師一直在偏好著重語言使用的教學法和著重語言形式或分析的教學法之間擺盪，但這個問題不容易解決，兩種觀點都有證據支持，而人類是極為多才的學習者，有些人天生就有學語言的才能。", "src": ["~~Over the years,~~ language teachers have alternated between favoring teaching approaches that focus primarily on language use and those that focus on language forms or analysis.", "~~As with any enduring controversy,~~ the matter is not easily resolved.", "~~For one thing,~~ there is evidence to support both points of view.", "~~What we can infer from this is that~~ humans are amazingly versatile learners and ~~that~~ some people have a natural aptitude for acquiring languages ~~and will succeed no matter what the circumstances~~."], "note": "難字：alternated、versatile、aptitude（題目可抄）"},
{"num": 36, "title": "Small war (小型戰爭)", "code": "#060036", "full": "In such an environment, warfare is no longer purely directed against the military potential of adversarial states. It is rather directed at infiltrating all areas of their societies and to threaten their existences. The comparatively easy access to weapons of mass destruction, in particular relatively and low-cost biological agents, is of key concern. Both governmental and non- governmental actors prefer to use force in a war that can be characterized as \"unconventional\" or also as \"small wars.\" War waged according to conventions is an interstate phenomenon. The \"small war\" is the archetype of war, in which the protagonists acknowledge no rules and permanently try to violate what conventions do exist. The protagonists of the \"small war\" observe neither international standards nor arms control agreements. They make use of territories where they do not have to fear any sanctions because there is no functioning state to assume charge of such sanctions or because the state in question is too weak to impose such sanctions. This type of war does not provide for any warning time. It challenges not only the external security of the nation states and international community, but also their internal safety.", "ans": "Warfare is no longer [only|purely] directed against the military potential of [enemy|adversarial] states, {and} it is rather directed at infiltrating all areas of their societies, {and} the \"small war\" is the archetype of war, in which the protagonists [accept|acknowledge] no rules, {and} it [threatens|challenges] not only the external security of the nation states, but also their internal safety.", "zh": "戰爭不再只針對敵國的軍事力量，而是滲透其社會的各個領域，「小型戰爭」是戰爭的原型，其中的主角不承認任何規則，而它挑戰的不只是民族國家的外部安全，也包括內部安全。", "src": ["~~In such an environment,~~ warfare is no longer purely directed against the military potential of adversarial states.", "It is rather directed at infiltrating all areas of their societies ~~and to threaten their existences~~.", "The \"small war\" is the archetype of war, in which the protagonists acknowledge no rules ~~and permanently try to violate what conventions do exist~~.", "It challenges not only the external security of the nation states ~~and international community~~, but also their internal safety."], "note": "難字：warfare、adversarial、infiltrating、archetype、protagonists（題目可抄，拼字盯緊）"},
{"num": 37, "title": "Short sleep time (人類缺乏睡眠)", "code": "#060037", "full": "If it seems like you’re not getting enough sleep, you’re not alone. People have evolved to sleep much less than chimps, baboons or any other primates studied so far, a new study finds. Charles Nunn and David Samson are evolutionary anthropologists. They study how humans have evolved to behave the way we do. Nunn works at Duke University in Durham, N·C· Samson works at the University of Toronto Mississauga in Canada. In their new study, the two compared sleep patterns in 30 different species of primates, including humans. Most species slept between nine and 15 hours daily. Humans averaged just seven hours of shut-eye. Based on lifestyle and biological factors, however, people should get 9·55 hours, Nunn and Samson calculate. Most other primates in the study typically sleep as much as the scientists predicted they should. Nunn and Samson shared their findings online February 14 in the American Journal of Physical Anthropology. The researchers argue that two long-standing features of human life may play into our short sleep times. The first stems from when humans’ ancestors descended from the trees to sleep on the ground. At that point, people probably had to spend more time awake to guard against predators. The second may reflect the intense pressure humans face to learn and teach new skills and to make social connections. That has left less time for sleep. As sleep declined, rapid-eye movement — or REM — sleep took on an outsize role in humans, Nunn and Samson propose. REM sleep is when we dream. And it has been linked to learning and memory. \"It’s pretty surprising that non-REM sleep time is so low in humans,\" Nunn says. \"But something had to give as we slept less.\"", "ans": "People have evolved to sleep much less than any other primates studied so far, {and} most species slept between nine and 15 hours daily, humans averaged just seven hours of [sleep|shut-eye], {and} two [parts|features] of human life may play into our short sleep times, {and} people [likely|probably] had to spend more time awake to [protect|guard] against predators.", "zh": "人類演化成比目前研究過的任何靈長類都睡得少，大多數物種每天睡九到十五小時，人類平均只睡七小時，人類生活的兩個特徵可能造成我們睡眠時間短，而人們可能必須花更多時間醒著防範掠食者。", "src": ["People have evolved to sleep much less than ~~chimps, baboons or~~ any other primates studied so far~~, a new study finds~~.", "Most species slept between nine and 15 hours daily. Humans averaged just seven hours of shut-eye.", "~~The researchers argue that~~ two ~~long-standing~~ features of human life may play into our short sleep times.", "~~At that point,~~ people probably had to spend more time awake to guard against predators."], "note": "難字：evolved、primates、averaged、predators（題目可抄）"},
{"num": 38, "title": "Farming technique (耕種技術)", "code": "#060038", "full": "A farming technique practiced for centuries by villagers in West Africa, which converts nutrient-poor rainforest soil into fertile farmland, could be the answer to mitigating climate change and revolutionizing farming across Africa. A global study by researchers has for the first-time identified and analyzed rich fertile soils found in Liberia and Ghana. They discovered that the ancient West African method of adding charcoal and kitchen waste to highly weathered, nutrient poor tropical soils can transform the land into enduringly fertile, carbon-rich black soils which the researchers dub ‘African Dark Earths’. Similar soils created by Amazonian people in pre-Columbian eras have recently been discovered in South America — but the techniques people used to create these soils are unknown. Moreover, the activities which led to the creation of these anthropogenic soils were largely disrupted after the European conquest. Encouragingly researchers in the West Africa study were able to live within communities as they created their fertile soils. This enabled them to learn the techniques used by the women from the indigenous communities who disposed of ash, bones and other organic waste to create the African Dark Earths.", "ans": "A farming technique [used|practiced] by villagers in West Africa could be the answer to [reducing|mitigating] climate change, {and} a global study by researchers has identified fertile soils found in Liberia and Ghana, {and} they discovered that the [old|ancient] West African method of adding charcoal and kitchen waste to nutrient poor soils can [change|transform] the land into fertile, black soils.", "zh": "西非村民使用的一種耕作技術可能是減緩氣候變遷的答案，研究人員的全球研究已在賴比瑞亞和迦納找到肥沃土壤，他們發現古老的西非方法，在貧瘠土壤中加入木炭和廚餘，能把土地變成肥沃的黑土。", "src": ["A farming technique practiced ~~for centuries~~ by villagers in West Africa~~, which converts nutrient-poor rainforest soil into fertile farmland,~~ could be the answer to mitigating climate change ~~and revolutionizing farming across Africa~~.", "A global study by researchers has ~~for the first-time~~ identified ~~and analyzed rich~~ fertile soils found in Liberia and Ghana.", "They discovered that the ancient West African method of adding charcoal and kitchen waste to ~~highly weathered,~~ nutrient poor ~~tropical~~ soils can transform the land into ~~enduringly~~ fertile, ~~carbon-rich~~ black soils ~~which the researchers dub ‘African Dark Earths’~~."], "note": "難字：mitigating、fertile、charcoal、nutrient（題目可抄）"},
{"num": 39, "title": "Rosling (羅斯林)", "code": "#060039", "full": "A medical doctor and professor for international health at Stockholm’s Karolinska Institute, Rosling became famous as the public educator who used statistics to show how the world is changing. He chose this public role after making two significant discoveries. Rosling’s first discovery was that many people are not aware of even the most basic facts about global health and global development. Through surveys he conducted, Rosling found that at a time when poverty is falling faster than ever before, the majority of people think that the proportion of the world population living in extreme poverty is rising. Similarly, he found that many underestimate global life expectancy widely, and are not aware of the success of delivering healthcare services—for example, vaccines—globally. He found that people’s worldviews often do not have much grounding in facts, even long before the \"post-fact\" era. Rosling was convinced that this unawareness of global progress matters. He made it his mission to fight this \"devastating ignorance\" that turns us into cynics, as we falsely believe that global development must be a mirage. Rosling’s second discovery was that this lack of factual knowledge was not because people are not interested in global development, but because it is too hard for those that want to know about global development to access this knowledge. Neither the experts nor the media were presenting how global development changes the world. Based on these two insights, Hans Rosling made it his mission to bridge this gap and present the evidence that global development is a reality. His approach to communicating research on global development was through public talks and the use of data visualisation.", "ans": "Rosling became famous as the public [teacher|educator] who used [data|statistics] to show how the world is changing, {and} Rosling’s first [finding|discovery] was that many people are not aware of even the most basic facts about global health, {and} Rosling’s second [finding|discovery] was that it is too hard for those that want to know to access this knowledge.", "zh": "羅斯林以用統計數據展示世界如何變化的公共教育者身分成名，他的第一個發現是許多人連全球健康最基本的事實都不知道，第二個發現是想了解的人太難取得這些知識。", "src": ["~~A medical doctor and professor for international health at Stockholm’s Karolinska Institute,~~ Rosling became famous as the public educator who used statistics to show how the world is changing.", "Rosling’s first discovery was that many people are not aware of even the most basic facts about global health ~~and global development~~.", "Rosling’s second discovery was that ~~this lack of factual knowledge was not because people are not interested in global development, but because~~ it is too hard for those that want to know ~~about global development~~ to access this knowledge."], "note": "難字：educator、statistics、access（題目可抄）"},
{"num": 40, "title": "Planning for teaching (教室備課)", "code": "#060040", "full": "- Planning is the key aspects of effective teaching, even though some experienced teachers may appear to deliver flawless classes without detailed preparation, it is in fact the result of planning from previous years… - There are two major reasons for planning: confidence developed in teachers help them deal with difficult or unexpected situation… - Another reason is that the desirable teaching approach actually occurs …", "ans": "Planning is the [main|key] aspects of effective teaching, even though some experienced teachers may appear to deliver [perfect|flawless] classes without preparation, it is the result of planning, {and} there are two [big|major] reasons for planning: confidence developed in teachers help them deal with difficult or unexpected situation, {and} another reason is that the desirable teaching [method|approach] actually occurs.", "zh": "備課是有效教學的關鍵，即使有些資深老師看起來不用準備就能上出完美的課，那其實是備課的結果，備課有兩大理由：老師建立的信心幫助他們應付困難或突發狀況，另一個理由是理想的教學法真的會發生。", "src": ["Planning is the key aspects of effective teaching, even though some experienced teachers may appear to deliver flawless classes without ~~detailed~~ preparation, it is ~~in fact~~ the result of planning ~~from previous years~~", "There are two major reasons for planning: confidence developed in teachers help them deal with difficult or unexpected situation", "Another reason is that the desirable teaching approach actually occurs"], "note": "大意題，機經原句本身有單複數問題（key aspects、confidence…help），照抄不扣分。難字：flawless、desirable（題目可抄）"},
{"num": 41, "title": "American English (美式英語)", "code": "#060041", "full": "American English is, without doubt, the most influential and powerful variety of English in the world today. There are many reasons for this. First, the United States is, at present, the most powerful nation on earth and such power always brings with it influence. Indeed, the distinction between a dialect and a language has frequently been made by reference to power. As has been said, a language is a dialect with an army. Second, America’s political influence is extended through American popular culture, in particular through the international reach of American films (movies, of course) and music. As Kahuna has pointed out, the internationally dominant position of a culture results in a forceful expansion of its language… the expansion of language contributes… to the prestige of the culture behind it. Third, the international prominence of American English is closely associated with the extraordinarily quick development of communications technology. Microsoft is owned by an American, Bill Gates. This means a computer’s default setting for language is American English, although of course this can be changed to suit one’s own circumstances. In short, the increased influence of American English is caused by political power and the resultant diffusion of American culture and media, technological advance, and the rapid development of communications technology.", "ans": "American English is the most influential and powerful [form|variety] of English, {and} first, the United States is the most powerful [country|nation] on earth and such power always brings with it influence, {and} second, America’s political influence is [spread|extended] through American popular culture, {and} third, the international prominence of American English is [linked|associated] with the quick development of communications technology.", "zh": "美式英語是最有影響力、最強勢的英語變體，第一，美國是地球上最強大的國家，這種強權必然帶來影響力，第二，美國的政治影響力透過美國流行文化擴展，第三，美式英語的國際地位與通訊科技的快速發展有關。", "src": ["American English is~~, without doubt,~~ the most influential and powerful variety of English ~~in the world today~~.", "First, the United States is~~, at present,~~ the most powerful nation on earth and such power always brings with it influence.", "Second, America’s political influence is extended through American popular culture~~, in particular through the international reach of American films (movies, of course) and music~~.", "Third, the international prominence of American English is ~~closely~~ associated with the ~~extraordinarily~~ quick development of communications technology."], "note": "難字：influential、variety、prominence（題目可抄）"},
{"num": 42, "title": "Carbon dioxide (二氧化碳)", "code": "#060042", "full": "- Carbon dioxide is the most significant of greenhouse gases, and is mostly produced by human activities. - Carbon dioxide has caused the rise of the global temperature and the sea level. - Business should take responsibilities to tackle the problems inherited in the business model. - World Wildlife Fund partners with companies to ensure the entire market move towards a more sustainable future.", "ans": "Carbon dioxide is the most [important|significant] of greenhouse gases, and is mostly [made|produced] by human activities, {and} carbon dioxide has caused the rise of the global temperature and the sea level, {and} business should take responsibilities to [solve|tackle] the problems, {and} World Wildlife Fund [works|partners] with companies to ensure the market move towards a more sustainable future.", "zh": "二氧化碳是最重要的溫室氣體，主要由人類活動產生，二氧化碳造成了全球氣溫和海平面上升，企業應負起責任解決這些問題，而世界自然基金會與企業合作，確保市場走向更永續的未來。", "src": ["Carbon dioxide is the most significant of greenhouse gases, and is mostly produced by human activities.", "Carbon dioxide has caused the rise of the global temperature and the sea level.", "Business should take responsibilities to tackle the problems ~~inherited in the business model~~.", "World Wildlife Fund partners with companies to ensure the ~~entire~~ market move towards a more sustainable future."], "note": "大意題，四點全抄。難字：significant、responsibilities、sustainable（題目可抄）"},
{"num": 43, "title": "Complain (抱怨)", "code": "#060043", "full": "Humans love to complain to each other. It helps us feel less alone. Think about what happens when a family member or friend is going through a tough time; they call up someone who will listen to their tale of woe. Unfortunately, negative bonding is the default for many groups. In some families complaining is the only way to get attention. When one person says, I had a bad day; the other person has to top it. \"You think you had a tough day, I had to do three TPS reports!\" The same thing happens at work and social settings. \"Your child didn't sleep through the night until 6 months? Mine was a full year old before she went over six hours.\" It's a race to the bottom, the worst situation wins. In Bitching is Bonding, A Guide To Mutual Complaint, Irene S· Levine, Ph·D·, a professor of psychiatry at the NYU Langone School of Medicine says, \"the reason these conversations feel good is because we feel understood\". People raised in negative environments learn early on, being positive gets you thrown out of the club. When family dinner is a complaint fest, you’re not going to risk alienation saying, \"Wow, I had an awesome day, don't you just love life?\"Translate this into a work setting, people, often unconsciously, believe being positive keeps you out of the cool club. When negativity provides bonding, humans are reluctant to abandon the behavior that brings them comfort.", "ans": "[People|Humans] love to complain to each other, it helps us feel less alone, {and} unfortunately, negative bonding is the default for many groups, {and} the reason these conversations feel good is because we feel understood, {and} when negativity [gives|provides] bonding, humans are [unwilling|reluctant] to [leave|abandon] the behavior that brings them comfort.", "zh": "人們喜歡互相抱怨，這讓我們覺得不那麼孤單，不幸的是，負面連結是許多群體的預設模式，這些對話讓人感覺好是因為我們覺得被理解，而當負面情緒帶來連結時，人們不願放棄讓他們感到安慰的行為。", "src": ["Humans love to complain to each other. It helps us feel less alone.", "Unfortunately, negative bonding is the default for many groups.", "~~In Bitching is Bonding, A Guide To Mutual Complaint, Irene S· Levine, Ph·D·, a professor of psychiatry at the NYU Langone School of Medicine says, \"~~the reason these conversations feel good is because we feel understood", "When negativity provides bonding, humans are reluctant to abandon the behavior that brings them comfort."], "note": "難字：bonding、default、negativity、reluctant（題目可抄）"},
{"num": 44, "title": "Exercise (鍛煉的好處)", "code": "#060044", "full": "Promoting active lifestyles can help us address some of the important challenges facing the UK today. Increasing physical activity has the potential to improve the physical and mental health of the nation, reduce all-cause mortality and improve life expectancy. It can also save money by significantly easing the burden of chronic disease on the health and social care services. Increasing cycling and walking will reduce transport costs, save money and help the environment. Fewer car journeys can reduce traffic, congestion and pollution, improving the health of communities. Other potential benefits linked to physical activity in children and young people include the acquisition of social skills through active play (leadership, teamwork and co-operation), better concentration in school and displacement of anti-social and criminal behavior. The importance of physical activity for health was identified over 50 years ago. During the 1950s, comparisons of bus drivers with more physically active bus conductors and office-based telephonists with more physically active postmen demonstrated lower rates of coronary heart disease and smaller uniform sizes in the more physically active occupations. This research led the way for further investigation, and evidence now clearly shows the importance of physical activity in preventing ill health. It is important for us to be active throughout our lives. Physical activity is central to a baby’s normal growth and development. This continues through school, and into adulthood and older years. Being physically active can bring substantial benefits and there is consistent evidence of a dose–response relationship, i·e· the greater the volume of physical activity undertaken, the greater the health benefits that are obtained.", "ans": "Promoting active lifestyles can help us [solve|address] the important [problems|challenges] facing the UK, {and} increasing physical activity has the potential to improve the physical and mental health of the [country|nation], {and} it can also save money by [cutting|easing] the burden of chronic disease, {and} increasing cycling and walking will reduce transport costs, save money and help the environment.", "zh": "推廣活躍的生活方式能幫助我們處理英國面臨的重要挑戰，增加身體活動有潛力改善國民的身心健康，也能透過減輕慢性病負擔來省錢，而增加騎車和走路能降低交通成本、省錢並幫助環境。", "src": ["Promoting active lifestyles can help us address ~~some of~~ the important challenges facing the UK ~~today~~.", "Increasing physical activity has the potential to improve the physical and mental health of the nation~~, reduce all-cause mortality and improve life expectancy~~.", "It can also save money by ~~significantly~~ easing the burden of chronic disease ~~on the health and social care services~~.", "Increasing cycling and walking will reduce transport costs, save money and help the environment."], "note": "難字：promoting、potential、chronic disease、burden（題目可抄）"},
{"num": 45, "title": "Writing system (書寫系統)", "code": "#060045", "full": "The origins of writing are largely unclear. Writing systems were created independently all over the world. The earliest we know of were developed in the Middle East around 5,000 years ago. But other scripts were invented in India, Egypt, China and Central America. It has been suggested that some of these systems may have influenced others, but this has not been proved. These forms of writing look completely different, follow different rules and are often read in completely different ways. But they all perform the same basic function. They are all a visual means of recording language. Knowledge of some early scripts invented in certain regions was picked up by peoples living in surrounding areas. They would then adopt and adapt them to their own needs and language. Chinese, for example, was adopted in Japan and Korea, though it had to be altered to apply to the languages spoken there. Methods of recording information have varied over time and place. Not all sophisticated societies have developed writing systems and not all methods of recording information require writing. The Inca empire of South America was at its height in the sixteenth century AD and held power over a huge area that stretched from modern Equador and Peru, to areas of Bolivia and Chile. It was a complex civilisation, but did not develop a writing system.", "ans": "The [beginnings|origins] of writing are [mostly|largely] unclear, {and} writing systems were [made|created] independently all over the world, {and} the earliest we know of were developed in the Middle East around 5,000 years ago, {and} these forms of writing look different, follow different rules and are read in completely different ways, {but} they all perform the same basic [job|function].", "zh": "文字的起源大多不清楚，書寫系統在世界各地獨立產生，已知最早的是約五千年前在中東發展出來的，這些文字看起來不同、規則不同、讀法也完全不同，但它們都有同樣的基本功能。", "src": ["The origins of writing are largely unclear.", "Writing systems were created independently all over the world.", "The earliest we know of were developed in the Middle East around 5,000 years ago.", "These forms of writing look ~~completely~~ different, follow different rules and are ~~often~~ read in completely different ways. But they all perform the same basic function."], "note": "難字：origins、independently、function（題目可抄）"},
{"num": 46, "title": "Khoi (科伊科伊人)", "code": "#060046", "full": "The first modern humans are believed to have inhabited South Africa more than 100,000 years ago. South Africa's prehistory has been divided into two phases based on broad patterns of technology namely the Stone Age and Iron Age. After the discovery of hominins at Taung and australopithecine fossils in limestone caves at Sterkfontein, Swartkrans, and Kromdraai these areas were collectively designated a World Heritage site. The first inhabitants of South Africa are collectively referred to as the Khoisan, the Khoi and the San separately. These groups were displaced or sometimes absorbed by migrating Africans (Bantus) during the Bantu expansion from Western and Central Africa. While some maintained separateness, others were grouped into a category known as Coloureds, a multiracial ethnic group which includes people with shared ancestry from two or more of these groups: Khoisan, Bantu, English, Afrikaners, Austronesians, East Asians and South Asians. European exploration of the African coast began in the 13th century when Portugal committed itself to discover an alternative route to the silk road that would lead to China. In the 14th and 15th century, Portuguese explorers traveled down the west African Coast, detailing and mapping the coastline and in 1488 they rounded the Cape of Good Hope. The Dutch East India Company established a trading post in Cape Town under the command of Jan van Riebeeck in 1652, European workers who settled at the Cape became known as the Free Burghers and gradually established farms in the Dutch Cape Colony.", "ans": "The first modern humans are [thought|believed] to have inhabited South Africa more than 100,000 years ago, {and} the first [people|inhabitants] of South Africa are collectively referred to as the Khoisan, {and} these groups were displaced or sometimes absorbed by migrating Africans during the Bantu expansion, {and} European exploration of the African coast [started|began] in the 13th century.", "zh": "最早的現代人類據信在十萬多年前就居住在南非，南非最早的居民統稱為科伊桑人，這些族群在班圖擴張期間被遷徙的非洲人取代或有時被同化，而歐洲人對非洲海岸的探索始於十三世紀。", "src": ["The first modern humans are believed to have inhabited South Africa more than 100,000 years ago.", "The first inhabitants of South Africa are collectively referred to as the Khoisan~~, the Khoi and the San separately~~.", "These groups were displaced or sometimes absorbed by migrating Africans ~~(Bantus)~~ during the Bantu expansion ~~from Western and Central Africa~~.", "European exploration of the African coast began in the 13th century ~~when Portugal committed itself to discover an alternative route to the silk road that would lead to China~~."], "note": "難字：inhabited／inhabitants、collectively、displaced、absorbed、migrating（題目可抄）"},
{"num": 47, "title": "Beauty Pageants (選美比賽)", "code": "#060047", "full": "Since Australians Jennifer Hawkins and Lauryn Eagle were crowned Miss Universe and Miss Teen International respectively, there has been a dramatic increase in interest in beauty pageants in this country. These wins have also sparked a debate as to whether beauty pageants are just harmless reminders of old-fashioned values or a throwback to the days when women were respected for how good they looked. Opponents argue that beauty pageants, whether it’s Miss Universe or Miss Teen International, are demeaning to women and out of sync with the times. They say they are nothing more than symbols of decline. In the past few decades Australia has taken more than a few faltering steps toward treating women with dignity and respect. Young women are being brought up knowing that they can do anything, as shown by inspiring role models in medicine such as 2003 Australian of the Year Professor Fiona Stanley. In the 1960s and 70s, one of the first acts of the feminist movement was to picket beauty pageants on the premise that the industry promoted the view that it was acceptable to judge women on their appearance. Today many young Australian women are still profoundly uncomfortable with their body image, feeling under all kinds of pressures because they are judged by how they look. Almost all of the pageant victors are wafer thin, reinforcing the message that thin equals beautiful. This ignores the fact that men and women come in all sizes and shapes. In a country where up to 60% of young Australians are on a diet at any time and 70% of school girls say they want to lose weight, despite the fact that most have a normal BMI, such messages are profoundly hazardous to the mental health of young Australians.", "ans": "Since Australians Jennifer Hawkins and Lauryn Eagle were crowned Miss Universe and Miss Teen International, there has been a [big|dramatic] increase in interest in beauty pageants, {but} [critics|opponents] [say|argue] that beauty pageants are demeaning to women and out of sync with the times, {and} today many young Australian women are still [deeply|profoundly] uncomfortable with their body image.", "zh": "自從澳洲人珍妮佛·霍金斯和蘿琳·伊格爾當選環球小姐和國際青少年小姐後，大家對選美的興趣大增，但反對者認為選美貶低女性、與時代脫節，而今天許多澳洲年輕女性仍對自己的身體形象深感不安。", "src": ["Since Australians Jennifer Hawkins and Lauryn Eagle were crowned Miss Universe and Miss Teen International ~~respectively~~, there has been a dramatic increase in interest in beauty pageants ~~in this country~~.", "Opponents argue that beauty pageants~~, whether it’s Miss Universe or Miss Teen International,~~ are demeaning to women and out of sync with the times.", "Today many young Australian women are still profoundly uncomfortable with their body image~~, feeling under all kinds of pressures because they are judged by how they look~~."], "note": "難字：crowned、pageants、demeaning、profoundly（題目可抄）"},
{"num": 48, "title": "Nurse sharks (護士鲨)", "code": "#060048", "full": "Nurse sharks are nocturnal animals, spending the day in large inactive groups of up to 40 individuals. Hidden under submerged ledges or in crevices within the reef, the Nurse sharks seem to prefer specific resting sites and will return to them each day after the nights hunting. By night, the sharks are largely solitary. Nurse sharks spend most of their time foraging through the bottom sediments in search of food. Their diet consists primarily of crustaceans, mollusks, tunicates and other fish such as spiny lobsters, crabs, shrimps, sea urchins, octopuses, squid, marine snails and bivalves and in particularly, stingrays. Nurse sharks are thought to take advantage of dormant fish which would otherwise be too fast for the sharks to catch, although their small mouths limit the size of prey items, the sharks have large throat cavities which are used as a sort of bellows valve. In this way, nurse sharks are able to suck in their prey. Nurse sharks are also known to graze algae and coral. Generally slow and sluggish, Nurse sharks spend much of their time resting on the bottom of the ocean. Nurse sharks have been observed resting on the bottom with their bodies supported on their fins, possibly providing a false shelter for crustaceans which they then ambush and eat. If it must move, the Nurse shark may even use its large front (or pectoral) fins to ‘walk’ along the ocean floor.", "ans": "Nurse sharks are nocturnal animals, spending the day in large [resting|inactive] groups of up to 40 [animals|individuals], {but} by night, the sharks are [mostly|largely] [alone|solitary], {and} nurse sharks spend most of their time foraging through the bottom sediments in search of food, {and} the Nurse shark may even use its large front fins to ‘walk’ along the ocean floor.", "zh": "護士鯊是夜行動物，白天成群休息，一群多達 40 隻，但到了晚上牠們大多獨自行動，護士鯊大部分時間在海底沉積物中覓食，而護士鯊甚至會用大前鰭在海底「走路」。", "src": ["Nurse sharks are nocturnal animals, spending the day in large inactive groups of up to 40 individuals.", "By night, the sharks are largely solitary.", "Nurse sharks spend most of their time foraging through the bottom sediments in search of food.", "~~If it must move,~~ the Nurse shark may even use its large front ~~(or pectoral)~~ fins to ‘walk’ along the ocean floor."], "note": "難字：nocturnal、solitary、foraging、sediments（題目可抄）"},
{"num": 49, "title": "Indonesian volcano (印尼火山)", "code": "#060049", "full": "In 1815 on the island of Sumbawa in Indonesia, a handsome and long-quiescent mountain named Tambora exploded spectacularly, killing a hundred thousand people with its blast and associated tsunamis. It was the biggest volcanic explosion in ten thousand years—150 times the size of Mount St· Helens, equivalent to sixty thousand Hiroshima-sized atom bombs. News didn’t travel terribly fast in those days. In London, The Times ran a small story— actually a letter from a merchant—seven months after the event. But by this time Tambora’s effects were already being felt. Thirty-six cubic miles of smoky ash, dust, and grit had diffused through the atmosphere, obscuring the Sun’s rays and causing the Earth to cool. Sunsets were unusually but blearily colorful, an effect memorably captured by the artist J· M· W· Turner, who could not have been happier, but mostly the world existed under an oppressive, dusky pall. It was this deathly dimness that inspired the Byron lines above. Spring never came and summer never warmed: 1816 became known as the year without summer. Crops everywhere failed to grow. In Ireland a famine and associated typhoid epidemic killed sixty-five thousand people. In New England, the year became popularly known as Eighteen Hundred and Froze to Death. Morning frosts continued until June and almost no planted seed would grow. Short of fodder, livestock died or had to be prematurely slaughtered. In every way, it was a dreadful year —almost certainly the worst for farmers in modern times. Yet globally the temperature fell by only about one point five degrees Fahrenheit. Earth’s natural thermostat, as scientists would learn, is an exceedingly delicate instrument.", "ans": "In 1815 in Indonesia, a mountain [called|named] Tambora exploded, killing a hundred thousand people, {and} it was the [largest|biggest] volcanic explosion in ten thousand years, {and} thirty-six cubic miles of ash had [spread|diffused] through the atmosphere, [blocking|obscuring] the Sun’s rays and causing the Earth to cool, {and} 1816 became known as the year without summer.", "zh": "1815 年在印尼，一座名叫坦博拉的山爆發，造成十萬人死亡，這是一萬年來最大的火山爆發，三十六立方英里的火山灰擴散到大氣中，遮住陽光使地球降溫，而 1816 年被稱為沒有夏天的一年。", "src": ["In 1815 ~~on the island of Sumbawa~~ in Indonesia, a ~~handsome and long-quiescent~~ mountain named Tambora exploded ~~spectacularly~~, killing a hundred thousand people ~~with its blast and associated tsunamis~~.", "It was the biggest volcanic explosion in ten thousand years", "Thirty-six cubic miles of ~~smoky~~ ash~~, dust, and grit~~ had diffused through the atmosphere, obscuring the Sun’s rays and causing the Earth to cool.", "~~Spring never came and summer never warmed:~~ 1816 became known as the year without summer."], "note": "難字：volcanic、cubic、diffused、atmosphere、obscuring（題目可抄）"},
{"num": 50, "title": "Greenland shark (格陵蘭鲨魚)", "code": "#060050", "full": "An international team of scientists, including a physiologist from The University of Manchester, will head to the largest island in the world later this month to investigate the Greenland shark – believed to be the longest-lived vertebrate animal. Dr Holly Shiels, who is also a trustee of the Physiological Society, will be the only UK-based scientist on the expedition aboard the research vessel Sanna commissioned by the Greenland government. The purpose of the mission is to understand more about the Greenland shark, a top predator in the Arctic, which lives for more than 272 years - possibly more than 400. This extreme age was only revealed by scientists from Copenhagen last year and published in the journal Science. Little else is known about how the shark survives in the deep seas around the Arctic Circle. It is both a hunter and a scavenger and has been seen to feed on seals and been found with the remains of polar bears and whales in its stomach. It is also one of the largest species of shark – growing to about five- and-a-half metres, just a bit smaller than the great white. However, more information is required to ensure the species is adequately protected, as Dr Shiels explained: \"Greenland sharks are classified as data deficient,\" she said. \"This means that we don't know enough to put measures in place to protect them from over-fishing, pollution or climate change. This expedition has a broad range of expertise which means that we'll be able to take full advantage of any sharks that we discover.", "ans": "An international team of scientists will [go|head] to the largest island in the world to [study|investigate] the Greenland shark, {and} the Greenland shark, a top predator in the Arctic, lives for more than 272 years, {and} it is both a hunter and a scavenger, {but} more information is [needed|required] to ensure the species is [properly|adequately] protected.", "zh": "一組國際科學家將前往世界最大的島研究格陵蘭鯊，格陵蘭鯊是北極的頂級掠食者，壽命超過 272 年，牠既是獵食者也是食腐者，但需要更多資訊才能確保這個物種受到充分保護。", "src": ["An international team of scientists~~, including a physiologist from The University of Manchester,~~ will head to the largest island in the world ~~later this month~~ to investigate the Greenland shark", "~~The purpose of the mission is to understand more about~~ the Greenland shark, a top predator in the Arctic, ~~which~~ lives for more than 272 years", "It is both a hunter and a scavenger ~~and has been seen to feed on seals and been found with the remains of polar bears and whales in its stomach~~.", "~~However,~~ more information is required to ensure the species is adequately protected~~, as Dr Shiels explained~~"], "note": "難字：predator、scavenger、adequately（題目可抄）"},
{"num": 51, "title": "Living in the countryside (住在農村)", "code": "#060051", "full": "I knew it was a good idea because I had been there before. Born and reared on a farm I had been seduced for a few years by the idea of being a big shot that lived and worked in a city rather than only going for the day to wave at the buses. True, I was familiar with some of the minor disadvantages of country living such as an iffy private water supply sometimes infiltrated by a range of flora and fauna (including, on one memorable occasion, a dead lamb), the absence of central heating in farm houses and cottages, and a single track farm road easily blocked by snow, broken down machinery or escaped livestock. But there were many advantages as I told my young wife back in the mid Seventies. Town born and bred, eight months pregnant and exchanging a warm, substantial Corstorphine terrace for a windswept farm cottage on a much lower income, persuading her that country had it over town might have been difficult.", "ans": "I knew it was a good idea because I had been there before, {and} I had been [attracted|seduced] by the idea of being a big shot that lived and worked in a city, {and} true, I was familiar with some of the [small|minor] disadvantages of country living, {but} there were many [benefits|advantages] as I told my young wife.", "zh": "我知道這是個好主意，因為我以前就住過那裡，我曾被當個住在城市裡工作的大人物的想法吸引，的確，我熟悉鄉村生活的一些小缺點，但正如我告訴年輕妻子的，好處也很多。", "src": ["I knew it was a good idea because I had been there before.", "~~Born and reared on a farm~~ I had been seduced ~~for a few years~~ by the idea of being a big shot that lived and worked in a city ~~rather than only going for the day to wave at the buses~~.", "True, I was familiar with some of the minor disadvantages of country living ~~such as an iffy private water supply sometimes infiltrated by a range of flora and fauna (including, on one memorable occasion, a dead lamb), the absence of central heating in farm houses and cottages, and a single track farm road easily blocked by snow, broken down machinery or escaped livestock~~.", "But there were many advantages as I told my young wife ~~back in the mid Seventies~~."], "note": "難字：seduced、familiar、disadvantages（題目可抄）"},
{"num": 52, "title": "Namibia (納米比亞)", "code": "#060052", "full": "When Namibia gained independence in 1990, teenager Pascolena Florry was herding goats in the country dry, desolate northern savannah. Her job, unpaid and dangerous, was to protect her parents' livestock from preying jackals and leopards. She saw wildlife as the enemy, and many of the other indigenous inhabitants of Namibia's rural communal lands shared her view. Wildlife poaching was commonplace. Fifteen years later, 31-year-old Pascolena's life and outlook are very different. She has built a previously undreamed of career in tourism and is the first black Namibian to be appointed manager of a guest lodge. Her village, and hundreds of others, have directly benefited from government efforts to devolve management and tourism development on communal lands to conservancies run by indigenous peoples. \"Now we see the wildlife as our way of creating jobs and opportunities as the tourism industry grows,\" she says. \"The future is better with wildlife around, not only for jobs, but also for the environment\".", "ans": "When Namibia [won|gained] independence in 1990, teenager Pascolena Florry was [keeping|herding] goats, {and} she saw wildlife as the enemy, {but} fifteen years later, Pascolena's life and outlook are very different, {and} she has built a previously undreamed of career in tourism and is the first black Namibian to be [made|appointed] manager of a guest lodge.", "zh": "1990 年納米比亞獨立時，少女帕斯柯蕾娜·弗洛里在放羊，她把野生動物視為敵人，但十五年後，她的生活和想法大不相同，她建立了以前想都想不到的旅遊業職涯，成為第一位被任命為旅館經理的黑人納米比亞人。", "src": ["When Namibia gained independence in 1990, teenager Pascolena Florry was herding goats ~~in the country dry, desolate northern savannah~~.", "She saw wildlife as the enemy~~, and many of the other indigenous inhabitants of Namibia's rural communal lands shared her view~~.", "Fifteen years later, ~~31-year-old~~ Pascolena's life and outlook are very different.", "She has built a previously undreamed of career in tourism and is the first black Namibian to be appointed manager of a guest lodge."], "note": "難字：independence、herding、outlook、appointed（題目可抄）"},
{"num": 53, "title": "Demand for energy (能源需求)", "code": "#060053", "full": "- With the population growth, the demand for resources has been growing as well. - The increase of demand also happened in non-renewable resources, such as metal. - he demand for petrol, diesel and crude oil is also huge to cope with the demand for manufacturing plastics.", "ans": "With the population growth, the demand for resources has been [rising|growing] as well, {and} the [rise|increase] of demand also happened in non-renewable resources, such as metal, {and} the demand for petrol, diesel and crude oil is also [large|huge] to cope with the demand for [making|manufacturing] plastics.", "zh": "隨著人口成長，對資源的需求也在增加，需求的增加也發生在金屬等不可再生資源上，而為了應付製造塑膠的需求，對汽油、柴油和原油的需求也很龐大。", "src": ["With the population growth, the demand for resources has been growing as well.", "The increase of demand also happened in non-renewable resources, such as metal.", "he demand for petrol, diesel and crude oil is also huge to cope with the demand for manufacturing plastics."], "note": "大意題，原文只有三句共 46 字，全抄也不到 50，這題就 46 字（PTE 下限 5 字，不扣分）。機經第三句「he demand」是漏字，作答寫 <b>The</b> demand。難字：non-renewable、petrol、crude oil、manufacturing（題目可抄）"},
{"num": 54, "title": "Life expectancy (人均壽命)", "code": "#060054", "full": "- Our life expectancy has expanded at a steady rate of over two years every decade which means that if you are 20 years old today, you have a 50% chance of reaching 100. - With the expanding life span, it is becoming impossible for people’s savings to fund years of decent retirement. - Gratton and Scott bring up some new ideas. People should keep updating their knowledge after retirement or develop a new social circle. - We should make recreation into \"re-creation\".", "ans": "Our life expectancy has [grown|expanded] at a steady rate of over two years every decade, {but} with the expanding life span, it is becoming impossible for people’s savings to [support|fund] years of [good|decent] retirement, {and} people should keep updating their knowledge after retirement or [build|develop] a new social circle, {and} we should make recreation into \"re-creation\".", "zh": "我們的預期壽命以每十年多兩年的穩定速度增加，但隨著壽命延長，人們的儲蓄愈來愈不可能支撐多年體面的退休生活，人們應在退休後持續更新知識或建立新的社交圈，而我們應該把休閒變成「再創造」。", "src": ["Our life expectancy has expanded at a steady rate of over two years every decade ~~which means that if you are 20 years old today, you have a 50% chance of reaching 100~~.", "With the expanding life span, it is becoming impossible for people’s savings to fund years of decent retirement.", "~~Gratton and Scott bring up some new ideas.~~ People should keep updating their knowledge after retirement or develop a new social circle.", "We should make recreation into \"re-creation\"."], "note": "大意題。難字：life expectancy、decade、decent、recreation（題目可抄）"},
{"num": 55, "title": "Language Decay (語言衰敗 )", "code": "#060055", "full": "Let us begin by asking why the conviction that our language is decaying is so much more widespread than the belief that it is progressing, in an intellectual climate where the notion of the survival of the fittest is at least as strong as the belief in inevitable decay, it is strange that so many people are convinced of the decline in the quality of English, a language which is now spoken by an estimated half billion people – a possible hundredfold increase in the number of speakers during the past millennium. One’s first reaction is to wonder whether the members of the anti-slovenliness brigade, as we may call them, are subconsciously reacting to the fast-moving world we live in, and consequently resenting change in any area of life. To some extent this is likely to be true. A feeling that ‘fings ain’t wot they used to be’ and an attempt to preserve life unchanged seem to be natural reactions to insecurity, symptoms of growing old. Every generation inevitably believes that the clothes, manners and speech of the following one have deteriorated. We would therefore expect to find a respect for conservative language in every century and every culture and, in literate societies, a reverence for the language of the ‘best authors’ of the past.", "ans": "It is [odd|strange] that so many people are [sure|convinced] of the [fall|decline] in the quality of English, {and} the members of the anti-slovenliness brigade are subconsciously reacting to the fast-moving world, {and} every generation believes that the manners and speech of the [next|following] one have deteriorated, {and} we would expect to find a respect for conservative language in every century.", "zh": "奇怪的是這麼多人深信英語品質在衰退，反邋遢大隊的成員其實是在潛意識裡對快速變化的世界做出反應，每一代人都認為下一代的舉止和言語變差了，而我們可以預期在每個世紀都能找到對保守語言的尊重。", "src": ["it is strange that so many people are convinced of the decline in the quality of English~~, a language which is now spoken by an estimated half billion people – a possible hundredfold increase in the number of speakers during the past millennium~~.", "~~One’s first reaction is to wonder whether~~ the members of the anti-slovenliness brigade~~, as we may call them,~~ are subconsciously reacting to the fast-moving world ~~we live in, and consequently resenting change in any area of life~~.", "Every generation ~~inevitably~~ believes that the ~~clothes,~~ manners and speech of the following one have deteriorated.", "We would ~~therefore~~ expect to find a respect for conservative language in every century ~~and every culture and, in literate societies, a reverence for the language of the ‘best authors’ of the past~~."], "note": "難字：convinced、decline、subconsciously、deteriorated、conservative（題目可抄，拼字盯緊）"},
{"num": 56, "title": "RAS (皇家農業協會)", "code": "#060056", "full": "The evolution of the RAS (Royal Agricultural Society) fits into the wider Western trend of promoting nationalism, progress and technology through exhibitory venues, which first became popular in the 1850s. Various types of fairs, from local agricultural shows to Worlds Fairs, were used as instruments of hegemony to support imperialism, to promote burgeoning capitalist endeavors, and to shape class identities, social spaces and public spaces. Visual culture and the art of display became essential in defining aspects of national distinction. Colonial nations in particular, such as Canada and Australia, were attempting to develop distinct national identities to differentiate themselves from British imperial power. Agricultural fairs in North America originated at the beginning of the nineteenth century and were devoted to educating practicing farmers in ways of improving their cultivation of livestock and crops through the use of various technologies. In 1822, the RAS was created on the premise that was a dire need in Australia for the development of improved farming skills to better support growing urban populations and export markets. Organizations based on agricultural improvement, which were popular in Britain, provided camaraderie as well as political and financial support for their members. Once transferred to the colonies, in this case Australia, they played an integral part in converting and organizing land for colonial purposes.", "ans": "The [growth|evolution] of the RAS fits into the wider Western trend of promoting nationalism, progress and technology through exhibitory venues, {and} [different|various] types of fairs were used as [tools|instruments] of hegemony to support imperialism, {and} in 1822, the RAS was created on the premise that was a [strong|dire] need in Australia for the development of improved farming skills.", "zh": "皇家農業協會的演變符合西方透過展覽場所推廣民族主義、進步和科技的大趨勢，各種博覽會被用作支持帝國主義的霸權工具，而 1822 年皇家農業協會成立，前提是澳洲迫切需要發展更好的農業技術。", "src": ["The evolution of the RAS ~~(Royal Agricultural Society)~~ fits into the wider Western trend of promoting nationalism, progress and technology through exhibitory venues~~, which first became popular in the 1850s~~.", "Various types of fairs~~, from local agricultural shows to Worlds Fairs,~~ were used as instruments of hegemony to support imperialism~~, to promote burgeoning capitalist endeavors, and to shape class identities, social spaces and public spaces~~.", "In 1822, the RAS was created on the premise that was a dire need in Australia for the development of improved farming skills ~~to better support growing urban populations and export markets~~."], "note": "機經「premise that was a dire need」漏了 there，作答可寫 that <b>there</b> was。難字：nationalism、exhibitory venues、hegemony、imperialism（題目可抄）"},
{"num": 57, "title": "Great Managers (管理者)", "code": "#060057", "full": "They discover what is unique about each person and then capitalize on it. The job of a manager, meanwhile, is to turn one person’s particular talent into performance. Average managers play checkers, while great managers play chess. Managers will succeed only when they can identify and deploy the differences among people, challenging each employee to excel in his or her own way. This doesn’t mean a leader can’t be a manager or vice versa. But to excel at one or both, you must be aware of the very different skills each role requires. First, identifying and capitalizing on each person’s uniqueness saves time. No employee, however talented, is perfectly well-rounded. Michelle could have spent untold hours coaching Jeffrey and cajoling him into smiling at, making friends with, and remembering the names of customers, but she probably would have seen little result for her efforts. Her time was much better spent carving out a role that took advantage of Jeffrey’s natural abilities. Second, capitalizing on uniqueness makes each person more accountable. Michelle didn’t just praise Jeffrey for his ability to execute specific assignments. She challenged him to make this ability the cornerstone of his contribution to the store, to take ownership for this ability, to practice it, and to refine it. Third, capitalizing on what is unique about each person builds a stronger sense of team, because it creates interdependency. It helps people appreciate one anothers’ particular skills and learn that their coworkers can fill in where they are lacking. In short, it makes people need one another. The old cliché is that there’s no \"I\" in \"team.\" But as Michael Jordan once said, \"There may be no ‘I’ in ‘team,’ but there is in 'win'.\"", "ans": "[Normal|Average] managers play checkers, while great managers play chess, {and} first, identifying and capitalizing on each person’s uniqueness saves time, {and} second, capitalizing on uniqueness makes each person more [responsible|accountable], {and} third, capitalizing on what is unique about each person builds a [better|stronger] sense of team, because it [makes|creates] interdependency.", "zh": "普通的經理下跳棋，優秀的經理下西洋棋，第一，找出並善用每個人的獨特性可以節省時間，第二，善用獨特性讓每個人更負責，第三，善用每個人的獨特之處能建立更強的團隊感，因為它創造了相互依賴。", "src": ["Average managers play checkers, while great managers play chess.", "First, identifying and capitalizing on each person’s uniqueness saves time.", "Second, capitalizing on uniqueness makes each person more accountable.", "Third, capitalizing on what is unique about each person builds a stronger sense of team, because it creates interdependency."], "note": "難字：capitalizing、uniqueness、accountable、interdependency（題目可抄，拼字盯緊）"},
{"num": 58, "title": "Columbus (哥倫布)", "code": "#060058", "full": "When Christopher Columbus arrived at Hispaniola during his first transatlantic voyage in the year 1492, the island had already been settled by Native Americans for about 5,000 years. The occupants in Columbus’s time were a group of Arawak Indians called Tainos who lived by farming, were organized into five chiefdoms, and numbered around half a million (the estimates range from 100,000 to 2,000,000). Columbus initially found them peaceful and friendly, until he and his Spaniards began mistreating them. Unfortunately for the Tainos, they had gold, which the Spanish coveted but didn’t want to go to the work of mining themselves. Hence the conquerors divided up the island and its Indian population among individual Spaniards, who put the Indians to work as virtual slaves, accidentally infected them with Eurasian diseases, and murdered them. By the year 1519, 27 years after Columbus’s arrival, that original population of half a million had been reduced to about 11,000, most of whom died that year of smallpox to bring the population down to 3,000.", "ans": "When Columbus arrived at Hispaniola in the year 1492, the island had been settled by Native Americans, {and} Columbus [first|initially] found them peaceful and friendly, until he and his Spaniards [started|began] mistreating them, {and} they had gold, which the Spanish [wanted|coveted], {and} by 1519, that original population of half a million had been [cut|reduced] to about 11,000.", "zh": "哥倫布 1492 年抵達伊斯帕尼奧拉島時，島上早已有美洲原住民定居，哥倫布起初覺得他們和平友善，直到他和西班牙人開始虐待他們，他們有西班牙人覬覦的黃金，而到了 1519 年，原本五十萬的人口已減少到約一萬一千人。", "src": ["When ~~Christopher~~ Columbus arrived at Hispaniola ~~during his first transatlantic voyage~~ in the year 1492, the island had ~~already~~ been settled by Native Americans ~~for about 5,000 years~~.", "Columbus initially found them peaceful and friendly, until he and his Spaniards began mistreating them.", "~~Unfortunately for the Tainos,~~ they had gold, which the Spanish coveted ~~but didn’t want to go to the work of mining themselves~~.", "By ~~the year~~ 1519, ~~27 years after Columbus’s arrival,~~ that original population of half a million had been reduced to about 11,000~~, most of whom died that year of smallpox to bring the population down to 3,000~~."], "note": "難字：Hispaniola、settled、mistreating、coveted（題目可抄）"},
{"num": 59, "title": "Skipping breakfast (不吃早飯)", "code": "#060059", "full": "Skipping breakfast has drawbacks. However, studies conducted both in the United States and internationally have shown that skipping breakfast can affect learning, memory and physical well-being. Students who skip breakfast are not as efficient at selecting critical information for problem- solving as their peers who have had breakfast. For schoolchildren, skipping breakfast diminishes the ability to recall and use newly acquired information, verbal fluency, and control of attention, according to Ernesto Pollitt, a UC Davis professor of pediatrics whose research focuses on the influence of breakfast on mental and physical performance. Skipping breakfast can impair thinking in adults, also. For both children and adults, a simple bowl of cereal with milk goes a long way toward providing a sufficiently nutritious start to the day. Green-Burgeson recommends choosing a cereal that’s low in sugar — less than five grams per serving — and using nonfat or one percent milk. Frederick Hirshburg, a pediatrician at UC Davis Medical Group, Carmichael, says that babies and other preschoolers rarely skip breakfast because \"they’re usually the hungriest at the beginning of the day. Breakfast then becomes more of a \"learned experience\" than a response to a biological need, Hirshburg says.", "ans": "Studies have shown that skipping breakfast can [hurt|affect] learning, memory and physical well-being, {and} students who skip breakfast are not as efficient at [choosing|selecting] information as their [classmates|peers], {and} skipping breakfast can [harm|impair] thinking in adults, also, {and} a simple bowl of cereal with milk goes a long way toward providing a nutritious start to the day.", "zh": "研究顯示不吃早餐會影響學習、記憶和身體健康，不吃早餐的學生在篩選資訊上不如同儕有效率，不吃早餐也會損害成人的思考，而一碗簡單的牛奶麥片就能提供營養的一天開始。", "src": ["~~However,~~ studies ~~conducted both in the United States and internationally~~ have shown that skipping breakfast can affect learning, memory and physical well-being.", "Students who skip breakfast are not as efficient at selecting ~~critical~~ information ~~for problem- solving~~ as their peers ~~who have had breakfast~~.", "Skipping breakfast can impair thinking in adults, also.", "~~For both children and adults,~~ a simple bowl of cereal with milk goes a long way toward providing a ~~sufficiently~~ nutritious start to the day."], "note": "難字：efficient、impair、cereal、nutritious（題目可抄）"},
{"num": 60, "title": "Cows and grass (牛吃草)", "code": "#060060", "full": "The co-evolutionary relationship between cows and grass is one of nature’s underappreciated wonders; it also happens to be the key to understanding just about everything about modern meat. For the grasses, which have evolved to withstand the grazing of ruminants, the cow maintains and expands their habitat by preventing trees and shrubs from gaining a foothold and hogging the sunlight; the animal also spreads grass seed, plants it with his hooves, and then fertilizes it with his manure. In exchange for these services the grasses offer ruminants a plentiful and exclusive supply of lunch. For cows (like sheep, bison, and other ruminants) have evolved the special ability to convert grass – which single-stomached creatures like us can’t digest – into high-quality protein. They can do this because they possess what is surely the most highly evolved digestive organ in nature: the rumen. About the size of a medicine ball, the organ is essentially a forty-five-gallon fermentation tank in which a resident population of bacteria dines on grass.", "ans": "The co-evolutionary relationship between cows and grass is one of nature’s underappreciated wonders, {and} the [cow|animal] also spreads grass seed, plants it with his hooves, and then fertilizes it with his manure, {and} in exchange for these services the grasses [give|offer] ruminants a [large|plentiful] supply of lunch, {and} cows have evolved the ability to [turn|convert] grass into high-quality protein.", "zh": "牛和草的共同演化關係是大自然被低估的奇蹟之一，牛還會散播草籽、用蹄子種下、再用糞便施肥，作為回報，草提供反芻動物豐富的午餐，而牛演化出把草轉換成優質蛋白質的能力。", "src": ["The co-evolutionary relationship between cows and grass is one of nature’s underappreciated wonders", "the animal also spreads grass seed, plants it with his hooves, and then fertilizes it with his manure.", "In exchange for these services the grasses offer ruminants a plentiful ~~and exclusive~~ supply of lunch.", "~~For~~ cows ~~(like sheep, bison, and other ruminants)~~ have evolved the ~~special~~ ability to convert grass ~~– which single-stomached creatures like us can’t digest –~~ into high-quality protein."], "note": "難字：co-evolutionary、underappreciated、hooves、manure、ruminants（題目可抄，拼字盯緊）"},
{"num": 61, "title": "Solar energy (太陽能)", "code": "#060061", "full": "The advantages and disadvantages of solar power compared to other forms of renewable energy have been greatly debated. While obviously superior to some forms of energy, solar power's high cost and efficiency dependent on geography have limited its appeal. However, a large number of advantages also merit further development and even possible adaptation for residences. Solar energy remains popular because it is both a renewable and clean source of energy. These advantages along with the hope that eventually nations can use solar power to decrease global warming ensure its popularity. Renewable solar energy is a true renewable resource. All areas of the world have the ability to collect some amount of solar power and solar power is available for collection each day. Clean solar energy is non-polluting. It does not create greenhouse gases, such as oil based energy does, nor does it create waste that must be stored, such as nuclear energy. It is also far more quiet to create and harness, drastically reducing the noise pollution required to convert energy to a useful form. Residential size solar energy systems also have very little impact on the surrounding environment, in contrast with other renewable energy sources such as wind and hydro electric power. Low Maintenance Solar panels have no moving parts and require very little maintenance beyond regular cleaning. Without moving parts to break and replace, after the initial costs of installing the panels, maintenance and repair costs are very reasonable.", "ans": "The advantages and disadvantages of solar power have been [discussed|debated], {and} solar power's high cost and efficiency dependent on geography have [reduced|limited] its appeal, {but} solar energy [stays|remains] popular because it is both a renewable and clean source of energy, {and} solar panels have no moving parts and [need|require] very little maintenance beyond regular cleaning.", "zh": "太陽能的優缺點一直有爭論，太陽能的高成本和效率取決於地理位置限制了它的吸引力，但太陽能仍然受歡迎，因為它既可再生又乾淨，而太陽能板沒有活動零件，除了定期清潔外幾乎不需要維護。", "src": ["The advantages and disadvantages of solar power ~~compared to other forms of renewable energy~~ have been ~~greatly~~ debated.", "~~While obviously superior to some forms of energy,~~ solar power's high cost and efficiency dependent on geography have limited its appeal.", "Solar energy remains popular because it is both a renewable and clean source of energy.", "Solar panels have no moving parts and require very little maintenance beyond regular cleaning."], "note": "難字：efficiency、geography、appeal、maintenance（題目可抄）"},
{"num": 62, "title": "Sphinx (獅身人面像)", "code": "#060062", "full": "The face, though better preserved than most of the statue, has been battered by centuries of weathering and vandalism. In 1402, an Arab historian reported that a Sufi zealot had disfigured it \"to remedy some religious errors.\" Yet there are clues to what the surface looked like in its prime. Archaeological excavations in the early 19th century found pieces of its carved stone beard and a royal cobra emblem form its headdress. Residues of red pigment are still visible on the face, leading researchers to conclude that at some point, the Sphinx’s entire visage was painted red. Traces of blue and yellow paint elsewhere suggest to Lehner that the Sphinx was once decked out in gaudy comic book colors. For thousands of years, sand buried the colossus up to its shoulders, creating a vast disembodied head atop the eastern edge of the Sahara. Then, in 1817, a Genoese adventurer, Capt· Giovanni Battista Caviglia, led 160 men in the first modern attempt to dig out the Sphinx. They could not hold back the sand, which poured into their excavation pits nearly as fast as they could dig it out. The Egyptian archaeologist Selim Hassan finally freed the statue from the sand in the late 1930s. \"The Sphinx has thus emerged into the landscape out of shadows of what seemed to be an impenetrable oblivion,\" the New York Times declared.", "ans": "The face has been [damaged|battered] by centuries of weathering and vandalism, {but} residues of red pigment are still [seen|visible] on the face, {and} for thousands of years, sand buried the [statue|colossus] up to its shoulders, {and} the Egyptian archaeologist Selim Hassan finally [cleared|freed] the statue from the sand in the late 1930s.", "zh": "獅身人面像的臉經過幾世紀的風化和破壞已經殘破，但臉上仍可見紅色顏料的殘跡，幾千年來沙子把這座巨像埋到肩膀，而埃及考古學家塞利姆·哈桑終於在 1930 年代末把雕像從沙中解放出來。", "src": ["The face~~, though better preserved than most of the statue,~~ has been battered by centuries of weathering and vandalism.", "Residues of red pigment are still visible on the face", "For thousands of years, sand buried the colossus up to its shoulders~~, creating a vast disembodied head atop the eastern edge of the Sahara~~.", "The Egyptian archaeologist Selim Hassan finally freed the statue from the sand in the late 1930s."], "note": "難字：weathering、vandalism、residues、pigment、archaeologist（題目可抄，拼字盯緊）"},
{"num": 63, "title": "Infra-Red Wave (紅外波)", "code": "#060063", "full": "The colours that we see are a result of the light reflected within a narrow range of wavelengths – what we call the visible spectrum. But sunlight also spans wavelengths that we cannot see. Humans can’t see ultraviolet wavelengths, which many other animals can see. But there’s one set of wavelengths that elude all of us – these are near infra-red (NIR) wavelengths. And understanding how bird feathers interact with these wavelengths is important, not just for birds, but also for humans through the potential for improvements in thermal efficiency. Our research in the School of BioSciences at the University of Melbourne suggests that some Australian birds can control their temperature and avoid overheating by reflecting near-infrared wavelengths of sunlight. We collected information on 90 species of Australian birds and found a very strong link between living in hot, arid regions and reflecting a higher proportion of near-infrared light. Researchers in the field of animal colouration have largely ignored near-infrared light, because it isn’t easy to measure and there’s no evidence that animals can see these wavelengths. Because these wavelengths are invisible, they don’t affect camouflage or sexual attractiveness, which are very important in the animal world. This means that many animals can control their temperature by altering reflection of near-infrared light without compromising their ability to hide or attract a mate.", "ans": "Our research [shows|suggests] that some Australian birds can control their temperature by reflecting near-infrared wavelengths of sunlight, {and} we found a strong link between living in hot, [dry|arid] regions and reflecting near-infrared light, {and} many animals can control their temperature by [changing|altering] reflection of near-infrared light without [hurting|compromising] their ability to hide or attract a mate.", "zh": "我們的研究顯示有些澳洲鳥類能藉由反射陽光中的近紅外線來控制體溫，我們發現住在炎熱乾燥地區和反射近紅外光之間有很強的關聯，而許多動物能藉由改變近紅外光的反射來控制體溫，同時不損及躲藏或吸引配偶的能力。", "src": ["Our research ~~in the School of BioSciences at the University of Melbourne~~ suggests that some Australian birds can control their temperature ~~and avoid overheating~~ by reflecting near-infrared wavelengths of sunlight.", "We ~~collected information on 90 species of Australian birds and~~ found a ~~very~~ strong link between living in hot, arid regions and reflecting ~~a higher proportion of~~ near-infrared light.", "~~This means that~~ many animals can control their temperature by altering reflection of near-infrared light without compromising their ability to hide or attract a mate."], "note": "難字：near-infrared、wavelengths、reflecting／reflection、arid、compromising（題目可抄）"},
{"num": 64, "title": "Negotiation (協商)", "code": "#060064", "full": "Negotiation is a common process in business to mainly solve business conflicts between both parties. Compromise is a basic negotiation state in which both parties give up something that they want in order to get something else they want more. Compromise usually occurs in unfair parties when there is a fixed pie to be divided up, and whatever on one side gets, the other side loses. In compromise situations, neither side gets all of what they really want, but they each make concessions in order to reach an agreement that is acceptable to both. Both parties usually can reach a win-win concept through compromise. However, negotiation cannot resolve all the conflict if one party is unwilling to resolve the problem.", "ans": "Negotiation is a [normal|common] process in business to solve conflicts between both parties, {and} compromise is a negotiation [stage|state] in which both parties give up something to get something else they want more, {and} both parties can reach a win-win [result|concept] through compromise, {but} negotiation cannot [solve|resolve] all the conflict if one party is unwilling to resolve the problem.", "zh": "談判是商業上解決雙方衝突的常見過程，妥協是一種談判狀態，雙方各放棄一些東西以換取更想要的東西，雙方可以透過妥協達成雙贏，但如果一方不願解決問題，談判就無法化解所有衝突。", "src": ["Negotiation is a common process in business to ~~mainly~~ solve ~~business~~ conflicts between both parties.", "Compromise is a ~~basic~~ negotiation state in which both parties give up something ~~that they want in order~~ to get something else they want more.", "Both parties ~~usually~~ can reach a win-win concept through compromise.", "~~However,~~ negotiation cannot resolve all the conflict if one party is unwilling to resolve the problem."], "note": "難字：negotiation、compromise、conflicts、unwilling（題目可抄）"},

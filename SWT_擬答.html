{num:1, title:'Electric eels (電鰻)', code:'#060001',
 full:"On a field trip to the Amazon in 1807, 19th-century explorer Alexander von Humboldt witnessed a group of horses lead through a muddy pool filled with electric eels, which he described as dramatically leaping up to attack the intruders. But scientists have doubted the story. An illustration of Alexander von Humboldt's story of the battle between the horses and electric eels. \"The first time I read von Humboldt's tale, I thought it was completely bizarre,\" Catania says. \"Why would the eels attack the horses instead of swimming away?\" But then he observed the same behavior by accident as he transferred the eels in his lab from one tank to another using a metal-rimmed net. Instead of swimming away, larger eels attacked the net by leaping out of the water. Catania tracked the strength of the eels’ electric shock by attaching a voltmeter to an aluminum plate, or conductive metal strips to \"predator\" objects such as a crocodile head replica. The zap a submerged eel distributes through the water is relatively weak when it reaches the target. But when an eel touches it with its electricity-generating chin, the current travels directly to the target and has to travel through its body before it gets back to the water, Catania reported in Proceedings of the National Academy of Sciences. \"This allows the eels to deliver shocks with a maximum amount of power to partially submerged land animals that invade their territory,\" Catania explains. \"It also allows them to electrify a much larger portion of the invader's body.\" Catania found the eels leapt to attack, rather than receded, more often when the water in the aquarium was lower. He argues the attack lets electric eels better defend themselves during the Amazonian dry season, when they’re cornered in small pools and make easy prey.",
 ans:'In 1807, explorer Alexander von Humboldt [saw|witnessed] a group of horses led through a muddy pool filled with electric eels, which he described as [jumping|leaping] up to attack the intruders, {but} scientists have doubted the story, {and} Catania found the eels leapt to attack more often when the water in the aquarium was [low|lower].',
 src:['~~On a field trip to the Amazon~~ in 1807, ~~19th-century~~ explorer Alexander von Humboldt witnessed a group of horses lead through a muddy pool filled with electric eels, which he described as ~~dramatically~~ leaping up to attack the intruders.',
      'But scientists have doubted the story.',
      'Catania found the eels leapt to attack, ~~rather than receded,~~ more often when the water in the aquarium was lower.'],
 zh:'1807 年，探險家亞歷山大·馮·洪堡看到一群馬被牽過一個滿是電鰻的泥水池，他描述電鰻跳起來攻擊入侵者，但科學家們懷疑這個故事，而卡塔尼亞發現當水族箱水位較低時，電鰻更常躍起攻擊。',

{num:2, title:'Double blind (雙盲測試法)', code:'#060002',
 full:"The feature of being \"double blind\", where neither patients nor physicians are aware of who receives the experimental treatment, is almost universally trumpeted as being a virtue of clinical trials. Hence, trials that fail to remain successfully double blind are regarded as providing inferior evidential support. The rationale for this view is unobjectionable: double blinding rules out the potential confounding influences of patient and physician beliefs. Nonetheless, viewing double blind trial as necessarily superior is problematic. For one, it leads to the paradox that very effective experimental treatments will not be supportable by best evidence. If a new drug were to make even the most severe symptoms of the common cold disappear within seconds, most participants and investigators would correctly identify it as the latest wonder drug and not the control (i·e· placebo) treatment. Any trial testing the effectiveness of this wonder drug will therefore fail to remain double blind. Similar problems arise for treatments, such as exercise and most surgical techniques, whose nature makes them resistant to being tested in double blind conditions. It seems strange that an account of evidence should make priori judgments that certain claims can never be supported by ‘best evidence’. It would be different if the claims at issue were pseudoscientific – untestable. But so far as treatments with large effects go, the claim that they are effective is highly testable and intuitively they should receive greater support from the evidence than do claims about treatments with moderate effects.",
 ans:'The feature of being double blind, where neither patients nor [doctors|physicians] are aware of who [gets|receives] the experimental treatment, is almost universally trumpeted as a [strength|virtue] of clinical trials, {but} viewing double blind trial as necessarily [better|superior] is problematic, {and} it leads to the paradox that very effective experimental treatments will not be supportable by best evidence.',
 src:['The feature of being "double blind", where neither patients nor physicians are aware of who receives the experimental treatment, is almost universally trumpeted as ~~being~~ a virtue of clinical trials.',
      '~~Nonetheless,~~ viewing double blind trial as necessarily superior is problematic.',
      '~~For one,~~ it leads to the paradox that very effective experimental treatments will not be supportable by best evidence.'],
 zh:'雙盲的特點是病人和醫生都不知道誰接受實驗性治療，這幾乎被普遍吹捧為臨床試驗的優點，但把雙盲試驗視為必然較優是有問題的，而且這會導致一個矛盾：非常有效的實驗性治療反而無法得到最佳證據的支持。',
 note:'難字：universally、trumpeted、paradox、supportable（題目可抄，拼字盯緊）'},
{num:3, title:'Australian Education (澳洲教育)', code:'#060003',
 full:"When Australians engage in debate about educational quality or equity, they often seem to accept that a country cannot achieve both at the same time. Curriculum reforms intended to improve equity often fail to do so because they increase breadth or differentiation in offerings in a way that increases differences in quality. Further, these differences in quality often reflect differences in students’ social backgrounds because the ‘new’ offerings are typically taken up by relatively disadvantaged students who are not served well them. Evidence from New South Wales will be used to illustrate this point. The need to improve the quality of education is well accepted across OECD and other countries as they seek to strengthen their human capital to underpin their modern, knowledge economies. Improved equity is also important for this purpose, since the demand for high level skills is widespread and the opportunities for the low skilled are diminishing. Improved equity in education is also important for social cohesion. There are countries in which the education system seems primarily to reproduce existing social arrangements, conferring privilege where it already exists and denying it where it does not. Even in countries where the diagnosis might be less extreme, the capacity of schooling to build social cohesion is often diminished by the way in which schools separate individuals and groups.",
 ans:'When Australians engage in debate about educational quality or equity, they often seem to [believe|accept] that a country cannot [have|achieve] both, {and} curriculum reforms [meant|intended] to improve equity often fail because they increase differences in quality, {but} the need to improve the quality of education is [widely|well] accepted, {and} improved equity is also important for social cohesion.',
 src:['When Australians engage in debate about educational quality or equity, they often seem to accept that a country cannot achieve both ~~at the same time~~.',
      'Curriculum reforms intended to improve equity often fail ~~to do so~~ because they increase ~~breadth or differentiation in offerings in a way that increases~~ differences in quality.',
      'The need to improve the quality of education is well accepted ~~across OECD and other countries as they seek to strengthen their human capital to underpin their modern, knowledge economies~~.',
      'Improved equity ~~in education~~ is also important for social cohesion.'],
 zh:'澳洲人在討論教育品質或公平時，常認為一個國家無法兩者兼得，而旨在改善公平的課程改革常常失敗，因為它們拉大了品質差異，但提升教育品質的必要性已被廣泛接受，而且改善公平對社會凝聚也很重要。',
 note:'難字：equity、curriculum、cohesion（題目可抄）'},
{"num": 4, "title": "Travel (旅遊業)", "code": "#060004", "full": "Jobs generated by Travel & Tourism are spread across the economy in retail, construction, manufacturing and telecommunications, as well as directly in Travel & Tourism companies. These jobs employ a large proportion of women, minorities and young people; are predominantly in small and medium sized companies; and offer good training and transferability. Tourism can also be one of the most effective drivers for the development of regional economies. These patterns apply to both developed and emerging economies. There are numerous good examples of where Travel & Tourism is acting as a catalyst for conservation and improvement of the environment and maintenance of local diversity and culture. Travel & Tourism creates jobs and wealth and has tremendous potential to contribute to economically, environmentally and socially sustainable development in both developed countries and emerging nations. It has a comparative advantage in that its start up and running costs can be low compared to many other forms of industry development. It is also often one of the few realistic options for development in many areas. Therefore, there is a strong likelihood that the Travel & Tourism industry will continue to grow globally over the short to medium term.", "ans": "Jobs [created|generated] by Travel & Tourism are spread across the economy, {and} Tourism can be one of the most [important|effective] drivers for the development of regional economies, {and} it is one of the few [practical|realistic] options for development in many areas, {and} there is a strong [chance|likelihood] that the Travel & Tourism industry will continue to grow globally.", "zh": "旅遊業創造的工作分布在整個經濟體，而旅遊業可以是區域經濟發展最有效的推手之一，而且它是許多地區少數可行的發展選項之一，而旅遊業很有可能會在全球持續成長。", "src": ["Jobs generated by Travel & Tourism are spread across the economy ~~in retail, construction, manufacturing and telecommunications, as well as directly in Travel & Tourism companies~~.", "Tourism can ~~also~~ be one of the most effective drivers for the development of regional economies.", "It is ~~also often~~ one of the few realistic options for development in many areas.", "~~Therefore,~~ there is a strong likelihood that the Travel & Tourism industry will continue to grow globally ~~over the short to medium term~~."], "note": "難字：regional economies、globally（題目可抄）。& 照抄即可，也可寫 and。"},
{"num": 5, "title": "Twins (雙胞胎)", "code": "#060005", "full": "UCLA neurology professor Paul Thompson and his colleagues scanned the brains of 23 sets of identical twins and 23 sets of fraternal twins. Since identical twins share the same genes while fraternal twins share about half their genes, the researchers were able to compare each group to show that myelin integrity was determined genetically in many parts of the brain that are key for intelligence. These include the parietal lobes, which are responsible for spatial reasoning, visual processing and logic, and the corpus callosum, which pulls together information from both sides of the body. The researchers used a faster version of a type of scanner called a HARDI (high-angular resolution diffusion imaging) — think of an MRI machine on steroids — that takes scans of the brain at a much higher resolution than a standard MRI. While an MRI scan shows the volume of different tissues in the brain by measuring the amount of water present, HARDI tracks how water diffuses through the brain's white matter — a way to measure the quality of its myelin. \"HARDI measures water diffusion,\" said Thompson, who is also a member of the UCLA Laboratory of Neuro-Imaging. \"If the water diffuses rapidly in a specific direction, it tells us that the brain has very fast connections. If it diffuses more broadly, that's an indication of slower signaling, and lower intelligence.\"", "ans": "Paul Thompson and his [team|colleagues] scanned the brains of 23 sets of identical twins and 23 sets of fraternal twins, {and} the researchers used a scanner called a HARDI, {and} the researchers were able to show that myelin integrity was [controlled|determined] genetically in many parts of the brain that are [important|key] for intelligence.", "zh": "保羅·湯普森和他的團隊掃描了 23 對同卵雙胞胎和 23 對異卵雙胞胎的大腦，研究人員使用一種叫 HARDI 的掃描儀，而研究人員得以證明，在大腦許多對智力關鍵的部位，髓鞘完整性是由基因決定的。", "src": ["~~UCLA neurology professor~~ Paul Thompson and his colleagues scanned the brains of 23 sets of identical twins and 23 sets of fraternal twins.", "The researchers used a ~~faster version of a type of~~ scanner called a HARDI", "~~Since identical twins share the same genes while fraternal twins share about half their genes,~~ the researchers were able to ~~compare each group to~~ show that myelin integrity was determined genetically in many parts of the brain that are key for intelligence."], "note": "難字：identical／fraternal twins、myelin integrity、genetically（題目可抄，拼字盯緊）"},
{"num": 6, "title": "Technology course (科技課程)", "code": "#060006", "full": "- Each course has a specific syllabus that highlights specific technologies required. - Some teachers know how to integrate technologies while some others don’t. - There will be instructors helping pre-service teachers learn how to integrate technology and experiences in class, and to encourage pre-service teachers to think about the integration, which always allows them to learn online anytime.", "ans": "Each course has a specific syllabus that [lists|highlights] specific technologies required, {but} some teachers know how to integrate technologies while some others don't, {and} there will be instructors helping pre-service teachers learn how to [use|integrate] technology and experiences in class, and to encourage pre-service teachers to think about the integration, which always [lets|allows] them to learn online anytime.", "zh": "每門課程都有特定的課綱列出所需的特定科技，但有些老師懂得如何融入科技，有些則不然，而且會有講師協助職前教師學習如何在課堂中結合科技與經驗，並鼓勵職前教師思考如何融入，這讓他們隨時都能線上學習。", "src": ["Each course has a specific syllabus that highlights specific technologies required.", "Some teachers know how to integrate technologies while some others don’t.", "There will be instructors helping pre-service teachers learn how to integrate technology and experiences in class, and to encourage pre-service teachers to think about the integration, which always allows them to learn online anytime."], "note": "大意題，三點全抄。難字：syllabus、integrate／integration、pre-service（題目可抄）"},
{"num": 7, "title": "Mammal (哺乳動物)", "code": "#060007", "full": "Mammals can be one of the hardest-hit groups by habitat loss, and a lot of research has been carried out to find the best ways to conserve mammal diversity. Much of this research has focused on very large-scale changes in land use and the impacts this will have on overall mammal diversity. However, many important decisions about land use are made at much more local scales, for example at the level of individual landowners. Now, in a detailed study led by Imperial College London that looked at mammal diversity across different small-scale landscapes in Borneo, researchers have identified previously logged forests as an overlooked source of refuge for mammals. These ‘selectively logged’ forests, where only certain tree species are removed, are often considered to be degraded and are frequently cleared to make way for plantations. The new results, published in the journal Ecological Applications, suggest they should be better protected. The team recorded mammals using trap-and-release techniques and motion-sensing cameras over three years, creating an unprecedented 20,000 records of species in three land-use types: old-growth forest, logged forest and oil palm plantation. This is one of the most intensive studies of rainforest mammal diversity ever undertaken. To their surprise, they found that mammal diversity for large mammals, like the clouded leopard and civets, was similar for both old-growth forests and logged forests. For small mammals, such as squirrels and rodents, the diversity was actually higher in logged forests.", "ans": "Mammals can be one of the hardest-hit groups by habitat loss, {but} researchers have [found|identified] previously logged forests as an [ignored|overlooked] source of [shelter|refuge] for mammals, {and} they found that mammal diversity for large mammals was similar for both old-growth forests and logged forests, {and} for small mammals the diversity was [really|actually] higher in logged forests.", "zh": "哺乳動物可能是受棲地喪失衝擊最大的族群之一，但研究人員發現先前被砍伐過的森林是被忽略的哺乳動物庇護所，而他們發現大型哺乳動物的多樣性在原始林和砍伐過的林相似，而小型哺乳動物的多樣性在砍伐過的林反而更高。", "src": ["Mammals can be one of the hardest-hit groups by habitat loss~~, and a lot of research has been carried out to find the best ways to conserve mammal diversity~~.", "~~Now, in a detailed study led by Imperial College London that looked at mammal diversity across different small-scale landscapes in Borneo,~~ researchers have identified previously logged forests as an overlooked source of refuge for mammals.", "~~To their surprise,~~ they found that mammal diversity for large mammals~~, like the clouded leopard and civets,~~ was similar for both old-growth forests and logged forests.", "For small mammals~~, such as squirrels and rodents,~~ the diversity was actually higher in logged forests."], "note": "難字：habitat、diversity、logged、old-growth（題目可抄）"},
{"num": 8, "title": "Women’s Institutes (婦女研究會)", "code": "#060008", "full": "- Women’s Institutes were established more than 100 years ago, but gender equality has not yet achieved. Even with the equality law, the gender pay gap is still there and women are still earning much less than men. - Women need to improve themselves, in areas such as …… - So we can see that there are still a lot more that we need to do, such as STEM. And governments should take actions.", "ans": "Women’s Institutes were [started|established] more than 100 years ago, but gender equality has not yet achieved, {and} even with the equality law, the gender pay gap is still there and women are still [making|earning] much less than men, {and} there are still a lot more that we need to do, such as STEM, {and} governments should take [steps|actions].", "zh": "婦女協會成立已超過一百年，但性別平等尚未實現，即使有平等法，性別薪資差距仍然存在，女性收入仍遠低於男性，而我們還有很多事要做，例如 STEM 領域，而政府應該採取行動。", "src": ["Women’s Institutes were established more than 100 years ago, but gender equality has not yet achieved.", "Even with the equality law, the gender pay gap is still there and women are still earning much less than men.", "~~So we can see that~~ there are still a lot more that we need to do, such as STEM.", "~~And~~ governments should take actions."], "note": "大意題。機經「has not yet achieved」文法有誤，作答建議寫 has not yet <b>been</b> achieved。難字：equality、gender（題目可抄）"},
{"num": 9, "title": "Plug-in vehicle (電動汽車)", "code": "#060009", "full": "Here's a term you're going to hear much more often: plug-in vehicle, and the acronym PEV. It's what you and many other people will drive to work in ten years and more from now. At that time, before you drive off in the morning you will first unplug your car - your plug-in vehicle. Its big on board batteries will have been fully charged overnight, with enough power for you to drive 50-100 kilometers through city traffic. When you arrive at work you'll plug in your car once again, this time into a socket that allows power to flow from your car's batteries to the electricity grid. One of the things you did when you bought your car was to sign a contract with your favorite electricity supplier, allowing them to draw a limited amount of power from your car's batteries should they need to, perhaps because of a blackout, or very high wholesale spot power prices. The price you get for the power the distributor buys from your car would not only be most attractive to you, it would be a good deal for them too, their alternative being very expensive power form peaking stations. If, driving home or for some other reason your batteries looked like running flat, a relatively small, but quiet and efficient engine running on petrol, diesel or compressed natural gas, even bio-fuel, would automatically cut in, driving a generator that supplied the batteries so you could complete your journey. Concerns over 'peak oil', increasing greenhouse gas emissions, and the likelihood that by the middle of this century there could be five times as many motor vehicles registered world-wide as there are now, mean that the world's almost total dependence on petroleum-based fuels for transport is, in every sense of the word, unsustainable.", "ans": "The world's almost total dependence on petroleum-based fuels for transport is unsustainable, {but} here's a [word|term] you're going to hear much more often: plug-in vehicle, {and} it's what you and many other people will drive to work in ten years from now, {and} its [large|big] on board batteries will have been [completely|fully] charged overnight.", "zh": "世界對石油燃料運輸幾乎完全的依賴是無法持續的，但有個詞你會愈來愈常聽到：插電式車輛，它是你和許多人十年後開去上班的車，而它的大電池會在夜間充飽電。", "src": ["~~Concerns over 'peak oil', increasing greenhouse gas emissions, and the likelihood that by the middle of this century there could be five times as many motor vehicles registered world-wide as there are now, mean that~~ the world's almost total dependence on petroleum-based fuels for transport is~~, in every sense of the word,~~ unsustainable.", "Here's a term you're going to hear much more often: plug-in vehicle~~, and the acronym PEV~~.", "It's what you and many other people will drive to work in ten years ~~and more~~ from now.", "~~At that time, before you drive off in the morning you will first unplug your car - your plug-in vehicle.~~ Its big on board batteries will have been fully charged overnight~~, with enough power for you to drive 50-100 kilometers through city traffic~~."], "note": "難字：dependence、petroleum-based、unsustainable（題目可抄）。結尾句拿到開頭當 but 的對照。"},
{"num": 10, "title": "Dogs and humans (狗與人類)", "code": "#060010", "full": "By living in close contact with humans, dogs have developed specific skills that enable them to interact and communicate effectively with people. Recent studies have shown that the canine brain can pick up on emotional cues contained in a person's voice, body odor and posture, and read their faces. In this study, the authors observed what happened when they presented photographs of the same two adults' faces, a man and a woman, to 26 feeding dogs. The images were placed strategically to the sides of the animals' line of sight and the photos showed a human face expressing one of the six basic human emotions: anger, fear, happiness, sadness, surprise, disgust or being neutral. The dogs showed greater response and cardiac activity when shown photographs that expressed arousing emotional states such as anger, fear and happiness. They also took longer to resume feeding after seeing these images. The dogs' increased heart rate indicated that in these cases they experienced higher levels of stress. In addition, dogs turned their heads to the left when they saw human faces expressing anger, fear or happiness. The reverse happened when the faces looked surprised, possibly because dogs view it as a non-threatening, relaxed expression. These findings, therefore, support the existence of an asymmetrical emotional modulation of dogs' brains to process basic human emotions.", "ans": "By living in close contact with humans, dogs have developed specific skills that [allow|enable] them to interact and communicate [well|effectively] with people, {and} the [dog|canine] brain can pick up on emotional cues contained in a person's voice, and read their faces, {and} the dogs showed greater response and cardiac activity when shown [photos|photographs] that expressed anger, fear and happiness.", "zh": "透過與人類密切接觸，狗發展出特定技能，讓牠們能與人有效互動溝通，而狗的大腦能捕捉人聲中的情緒線索並解讀表情，而狗看到表達憤怒、恐懼和快樂的照片時，反應和心跳活動較大。", "src": ["By living in close contact with humans, dogs have developed specific skills that enable them to interact and communicate effectively with people.", "~~Recent studies have shown that~~ the canine brain can pick up on emotional cues contained in a person's voice, ~~body odor and posture,~~ and read their faces.", "The dogs showed greater response and cardiac activity when shown photographs that expressed ~~arousing emotional states such as~~ anger, fear and happiness."], "note": "難字：cues、cardiac、interact（題目可抄）"},
{"num": 11, "title": "Orbit debris (軌道碎片)", "code": "#060011", "full": "For decades, space experts have worried that a speeding bit of orbital debris might one day smash a large spacecraft into hundreds of pieces and start a chain reaction, a slow cascade of collisions that would expand for centuries, spreading chaos through the heavens. In the last decade or so, as scientists came to agree that the number of objects in orbit had surpassed a critical mass — or, in their terms, the critical spatial density, the point at which a chain reaction becomes inevitable — they grew more anxious. Early this year, after a half-century of growth, the federal list of detectable objects (four inches wide or larger) reached 10,000, including dead satellites, spent rocket stages, a camera, a hand tool and junkyards of whirling debris left over from chance explosions and destructive tests. So our billion dollar of satellites are at risk.", "ans": "Space experts have [feared|worried] that a speeding bit of orbital debris might one day [break|smash] a large spacecraft into hundreds of pieces and start a chain reaction, {and} as scientists came to agree that the number of objects in orbit had [passed|surpassed] a critical mass they grew more [worried|anxious], {and} our billion dollar of satellites are at risk.", "zh": "太空專家擔心一小塊高速軌道碎片有天會把大型太空船撞成數百塊碎片並引發連鎖反應，而當科學家一致認為軌道上的物體數量已超過臨界質量時，他們更加焦慮，而我們價值數十億美元的衛星正面臨風險。", "src": ["~~For decades,~~ space experts have worried that a speeding bit of orbital debris might one day smash a large spacecraft into hundreds of pieces and start a chain reaction~~, a slow cascade of collisions that would expand for centuries, spreading chaos through the heavens~~.", "~~In the last decade or so,~~ as scientists came to agree that the number of objects in orbit had surpassed a critical mass ~~— or, in their terms, the critical spatial density, the point at which a chain reaction becomes inevitable —~~ they grew more anxious.", "~~So~~ our billion dollar of satellites are at risk."], "note": "難字：orbital debris、spacecraft、critical mass（題目可抄）。「billion dollar of satellites」是機經原句，文法本來就怪，照抄不扣分。"},
{"num": 12, "title": "Brundtland Report (布朗特蘭報告)", "code": "#060012", "full": "The Brundtland Report, Our Common Future (1987), defines sustainable development as development which meets the needs of the present without compromising the ability of future generations to meet their own needs. Implicit in this definition is the idea that the old pattern of development could not be sustained. Is this true? Development in the past was driven by growth and innovation. It led to new technologies and huge improvements in living standards. To assume that we know what the circumstances or needs of future generations will be is mistaken and inevitably leads to the debilitating sense that we are living on borrowed time. Only if we assume that society will remain static can we understand the needs of the future. The way we live today could not have been predicted twenty years ago. The sustainability paradigm fails to recognize this. It is a static view and thus places limits on human ingenuity. Similarly, a whole host of false assumptions dominate environmental thought; the scale of problems is exaggerated, the amount of resources is underestimated and spurious links are made between areas such as green policies and profit, poverty and environmental degradation. Those of us who want a better future need to question these assumptions.", "ans": "The Brundtland Report defines sustainable development as development which meets the needs of the present without [harming|compromising] the ability of future generations, {and} development in the past was [led|driven] by growth and innovation, {but} the way we live today could not have been predicted twenty years ago, {and} the sustainability paradigm fails to [see|recognize] this.", "zh": "布倫特蘭報告把永續發展定義為滿足當代需求而不損害後代能力的發展，而過去的發展是由成長和創新推動的，但我們今天的生活方式在二十年前無法預測，而永續典範沒有認清這一點。", "src": ["The Brundtland Report~~, Our Common Future (1987),~~ defines sustainable development as development which meets the needs of the present without compromising the ability of future generations ~~to meet their own needs~~.", "Development in the past was driven by growth and innovation.", "The way we live today could not have been predicted twenty years ago.", "The sustainability paradigm fails to recognize this."], "note": "難字：sustainable／sustainability、paradigm、generations、innovation（題目可抄）"},
{"num": 13, "title": "Diasporas (背井離鄉的人)", "code": "#060013", "full": "Diasporas – communities which live outside, but maintain links with, their homelands – are getting larger, thicker and stronger. They are the human face of globalization. Diaspora consciousness is on the rise: diasporas are becoming more interested in their origins, and organizing themselves more effectively; homelands are revising their opinions of their diasporas as the stigma attached to emigration declines, and stepping up their engagement efforts; meanwhile, host countries are witnessing more assertive diasporic groups within their own national communities, worrying about fifth columns and foreign lobbies, and suffering outbreaks of ‘diaspora phobia’. This trend is the result of five factors, all of them connected with globalization: the growth in international migration; the revolution in transport and communications technology, which is quickening the pace of diasporas’ interactions with their homelands; a reaction against global homogenized culture, which is leading people to rethink their identities; the end of the Cold War, which increased the salience of ethnicity and nationalism and created new space in which diasporas can operate; and policy changes by national governments on issues such as dual citizenship and multiculturalism, which are enabling people to lead transnational lives. Diasporas such as those attaching to China, India, Russia and Mexico are already big, but they will continue to grow; the migration flow which feed them are likely to widen and quicken in the future.", "ans": "Diasporas are getting [bigger|larger], thicker and stronger, {and} they are the human face of globalization, {and} this [change|trend] is the result of five factors, all of them [linked|connected] with globalization, {and} diasporas such as those attaching to China, India, Russia and Mexico are already big, but they will continue to grow.", "zh": "離散族群正變得更大、更厚實、更強，他們是全球化的人性面貌，這個趨勢是五個因素造成的，全都與全球化有關，而中國、印度、俄羅斯和墨西哥等的離散族群已經很大，但還會持續成長。", "src": ["Diasporas ~~– communities which live outside, but maintain links with, their homelands –~~ are getting larger, thicker and stronger.", "They are the human face of globalization.", "This trend is the result of five factors, all of them connected with globalization~~: the growth in international migration; the revolution in transport and communications technology, which is quickening the pace of diasporas’ interactions with their homelands; a reaction against global homogenized culture, which is leading people to rethink their identities; the end of the Cold War, which increased the salience of ethnicity and nationalism and created new space in which diasporas can operate; and policy changes by national governments on issues such as dual citizenship and multiculturalism, which are enabling people to lead transnational lives~~.", "Diasporas such as those attaching to China, India, Russia and Mexico are already big, but they will continue to grow~~; the migration flow which feed them are likely to widen and quicken in the future~~."], "note": "難字：Diasporas、globalization（題目可抄）。五個因素的長清單整段刪掉。"},
{"num": 14, "title": "Human brain activity (人類大腦活動)", "code": "#060014", "full": "In a study in the current issue of the journal PLoS One, a team of scientists in Germany showed experts and novices simple geometric objects and simple chess positions and asked the subjects to identify them. Reaction times were measured and brain activity was monitored using functional M·R·I· scans. On the identification of the geometric objects, the subjects performed the same, showing that the chess experts had no special visualization skills. When the subjects were shown the chess positions, the experts identified them faster. Focusing on an element of an earlier study on pattern and object recognition by chess experts, the researchers had expected to see parts of the left hemispheres of the experts’ brains — which are involved in object recognition — react more quickly than those of the novices when they performed the chess tasks. But the reaction times were the same. What set the experts apart was that parts of their right brain hemispheres — which are more involved in pattern recognition — also lit up with activity. The experts were processing the information in two places at once. The researchers also found that when the subjects were shown the chess diagrams, the novices looked directly at the pieces to recognize them, while the experts looked on the middle of the boards and took everything in with their peripheral vision.", "ans": "A team of scientists showed experts and novices simple geometric objects and chess positions, {and} on the identification of the geometric objects, the subjects [did|performed] the same, {but} when the subjects were shown the chess positions, the experts identified them [quicker|faster], {and} the novices looked [straight|directly] at the pieces, while the experts looked on the [center|middle] of the boards.", "zh": "一組科學家給專家和新手看簡單的幾何圖形和西洋棋局面，在辨認幾何圖形時，受試者表現相同，但看到棋局時，專家辨認得更快，而新手直接看棋子，專家則看棋盤中央。", "src": ["~~In a study in the current issue of the journal PLoS One,~~ a team of scientists ~~in Germany~~ showed experts and novices simple geometric objects and ~~simple~~ chess positions ~~and asked the subjects to identify them~~.", "On the identification of the geometric objects, the subjects performed the same~~, showing that the chess experts had no special visualization skills~~.", "When the subjects were shown the chess positions, the experts identified them faster.", "~~The researchers also found that when the subjects were shown the chess diagrams,~~ the novices looked directly at the pieces ~~to recognize them~~, while the experts looked on the middle of the boards ~~and took everything in with their peripheral vision~~."], "note": "難字：novices、geometric、identification（題目可抄）"},
{"num": 15, "title": "Microplastics (微塑料)", "code": "#060015", "full": "Fish are being killed, and prevented from reaching maturity, by the litter of plastic particles finding their way into the world’s oceans, new research has proved. Some young fish have been found to prefer tiny particles of plastic to their natural food sources, effectively starving them before they can reproduce. The growing problem of microplastics – tiny particles of polymer-type materials from modern industry – has been thought for several years to be a peril for fish, but the study published on Thursday is the first to prove the damage in trials. Micro-plastics are near-indestructible in natural environments. They enter the oceans through litter, when waste such as plastic bags, packaging and other convenience materials are discarded. Vast amounts of these end up in the sea, through inadequate waste disposal systems and sewage outfall. Another growing source is micro-beads, tiny particles of hard plastics that are used in cosmetics, for instance as an abrasive in modern skin cleaners. These easily enter waterways as they are washed off as they are used, flushed down drains and forgotten, but can last for decades in our oceans. The impact of these materials has been hard to measure, despite being a growing source of concern. Small particles of plastics have been found in seabirds, fish and whales, which swallow the materials but cannot digest them, leading to a build up in their digestive tracts. For the first time, scientists have demonstrated that fish exposed to such materials during their development show stunted growth and increased mortality rates, as well as changed behavior that could endanger their survival.", "ans": "Fish are being killed by the [waste|litter] of plastic particles finding their way into the world’s oceans, {and} some young fish have been found to prefer [small|tiny] particles of plastic to their natural food sources, {and} scientists have [shown|demonstrated] that fish exposed to such materials during their development show stunted growth and [higher|increased] mortality rates.", "zh": "魚正被流入世界海洋的塑膠微粒垃圾殺死，有些幼魚被發現偏好塑膠微粒勝過天然食物，而科學家已證明在發育期接觸這些物質的魚會發育遲緩、死亡率升高。", "src": ["Fish are being killed~~, and prevented from reaching maturity,~~ by the litter of plastic particles finding their way into the world’s oceans~~, new research has proved~~.", "Some young fish have been found to prefer tiny particles of plastic to their natural food sources~~, effectively starving them before they can reproduce~~.", "~~For the first time,~~ scientists have demonstrated that fish exposed to such materials during their development show stunted growth and increased mortality rates~~, as well as changed behavior that could endanger their survival~~."], "note": "難字：particles、stunted、mortality（題目可抄）"},
{"num": 16, "title": "Rosetta stone (羅塞塔石頭)", "code": "#060016", "full": "An opportunity for investigation and cleaning the Rosetta Stone arose when this famous object was made the centerpiece of the Cracking Codes exhibition at The British Museum in 1999. When work commenced to remove all but the original, ancient material the stone was black with white lettering. As treatment progressed, the different substances uncovered were analyzed. Grease from human handling, a coating of carnauba wax from the early 1800s and printer's ink from 1799 were cleaned away using cotton wool swabs and liniment of soap, white spirit, acetone and purified water. Finally, white paint in the text, applied in 1981, which had been left in place until now as a protective coating, was removed with cotton swabs and purified water. A small square at the bottom left corner of the face of the Stone was left untouched to show the darkened wax and the white infill. The Stone has a dark grey-pinkish tone with a pink streak running through it. Today you see traces of a reddish brown in the text. This material was analyzed and found to be a clear mineral known as hydroxyapatite; the color may be due to iron traces. The mineral may have been applied deliberately, but there is no proof of this. This substance is not known by experts to have been used as a pigment, nor to have been used as a base for painting (a ground) in ancient Egypt.", "ans": "[A chance|An opportunity] for cleaning the Rosetta Stone [came|arose] in 1999, {and} when work [started|commenced] the stone was black with white lettering, {and} as treatment progressed, the different [materials|substances] uncovered were analyzed, {and} grease from human handling, a coating of carnauba wax from the early 1800s and printer's ink from 1799 were cleaned away.", "zh": "1999 年出現了清理羅塞塔石碑的機會，工作開始時石碑是黑底白字，隨著處理進行，發現的不同物質都被分析，而人手觸摸的油脂、1800 年代初的棕櫚蠟塗層和 1799 年的印刷油墨都被清除了。", "src": ["An opportunity for ~~investigation and~~ cleaning the Rosetta Stone arose ~~when this famous object was made the centerpiece of the Cracking Codes exhibition at The British Museum~~ in 1999.", "When work commenced ~~to remove all but the original, ancient material~~ the stone was black with white lettering.", "As treatment progressed, the different substances uncovered were analyzed.", "Grease from human handling, a coating of carnauba wax from the early 1800s and printer's ink from 1799 were cleaned away ~~using cotton wool swabs and liniment of soap, white spirit, acetone and purified water~~."], "note": "opportunity 換 chance 時冠詞一起改（An→A）。難字：grease、carnauba wax、lettering（題目可抄）"},
{"num": 17, "title": "Aging Population (人口老齡化)", "code": "#060017", "full": "In 2005 Japan had the highest median age of all countries in the world, while Australia's population was only moderately aged. Some 50 years ago the demographic situation was quite different, with the median age of Australia's population being seven years older than Japan's. The ageing of the population is a major issue for Australian policy makers, particularly in regard to the long-term implications for reduced economic growth and the increasing demand for Age Pensions, and health and aged care services. As the population ages, growth in the number of people of working age will slow, while the proportion of people of retirement age will increase. Sustained population ageing also leads to slowing or negative population growth. While declining population growth in developed countries is welcomed by some environmentalist and social scientists, (EndNote 3) economists tend to agree that population decline brings gloomy economic prospects. In addition to the decrease in the labor supply, the demand side of the economy may be affected through shrinking markets for goods and services. How quickly this occurs depends on the dynamics of fertility, mortality and overseas migration. While a moderate pace of demographic change allows for gradual adjustment of the economy and policies to the changing population demographics, rapid changes are more difficult to manage. As a result, governments and society as a whole may need to take actions to address these issues.", "ans": "The ageing of the population is a [big|major] [problem|issue] for Australian policy makers, {and} as the population ages, growth in the number of people of working age will slow, while the proportion of people of retirement age will [rise|increase], {and} governments and society as a whole may need to take actions to [solve|address] these issues.", "zh": "人口老化是澳洲政策制定者的重大議題，隨著人口老化，工作年齡人口的成長會放緩，而退休年齡人口的比例會增加，因此政府和整個社會可能需要採取行動來處理這些問題。", "src": ["The ageing of the population is a major issue for Australian policy makers~~, particularly in regard to the long-term implications for reduced economic growth and the increasing demand for Age Pensions, and health and aged care services~~.", "As the population ages, growth in the number of people of working age will slow, while the proportion of people of retirement age will increase.", "~~As a result,~~ governments and society as a whole may need to take actions to address these issues."], "note": "難字：ageing（英式拼法，照題目）、proportion、retirement（題目可抄）"},
{"num": 18, "title": "Cross curriculum (跨學科)", "code": "#060018", "full": "- There are successful cases of cross curriculum, but it also failed in some other places. - Take geography as a positive example. A school in remote areas in North Europe has succeeded. Geography was taught together with another subject. When the principal traveled to New Zealand, … … - Take history as a negative example. There are some problems when it comes to practice. It sometimes combined with art or ···.", "ans": "There are [good|successful] cases of cross curriculum, but it also failed in some other places, {and} take geography as a positive example: a school in remote areas in North Europe has [worked|succeeded], {and} Geography was taught together with another subject, {but} take history as a negative example: there are some [issues|problems] when it comes to practice.", "zh": "跨學科課程有成功的案例，但在其他地方也失敗過，以地理為正面例子：北歐偏遠地區的一所學校成功了，地理和另一科一起教，但以歷史為負面例子：實際操作時有一些問題。", "src": ["There are successful cases of cross curriculum, but it also failed in some other places.", "Take geography as a positive example. A school in remote areas in North Europe has succeeded. Geography was taught together with another subject.", "Take history as a negative example. There are some problems when it comes to practice."], "note": "大意題，正反例各抄一組。難字：curriculum、geography、remote（題目可抄）"},
{"num": 19, "title": "IPCC vs Gore (IPCC vs 戈爾)", "code": "#060019", "full": "This year’s Nobel Peace Prize justly rewards the thousands of scientists of the United Nations Climate Change Panel (the IPCC). These scientists are engaged in excellent, painstaking work that establishes exactly what the world should expect from climate change. The other award winner, former US Vice President Al Gore, has spent much more time telling us what to fear. While the IPCC’s estimates and conclusions are grounded in careful study, Gore doesn’t seem to be similarly restrained. Gore told the world in his Academy Award winning movie (recently labelled \"one sided\" and containing \"scientific errors\" by a British judge) to expect 20-foot sea level rises over this century. He ignores the findings of his Nobel co-winners, the IPCC, who conclude that sea levels will rise between only a half foot and two feet over this century, with their best expectation being about one foot. That’s similar to what the world experienced over the past 150 years. Likewise, Gore agonizes over the accelerated melting of ice in Greenland and what it means for the planet, but overlooks the IPCC’s conclusion that, if sustained, the current rate of melting would add just three inches to the sea level rise by the end of the century. Gore also takes no notice of research showing that Greenland’s temperatures were higher in 1941 than they are today. The politician turned movie maker loses sleep over a predicted rise in heat related deaths. There’s another side of the story that’s inconvenient to mention: rising temperatures will reduce the number of cold spells, which are a much bigger killer than heat. The best study shows that by 2050, heat will claim 400,000 more lives, but 1·8 million fewer will die because of cold. Indeed, according to the first complete survey of the economic effects of climate change for the world, global warming will actually save lives.", "ans": "This year’s Nobel Peace Prize rewards scientists of the United Nations Climate Change Panel, {but} the other award winner, Al Gore, has [used|spent] much more time telling us what to fear, {and} while the IPCC’s estimates and conclusions are grounded in careful study, Gore doesn’t seem to be [equally|similarly] restrained, {and} global warming will [really|actually] save lives.", "zh": "今年的諾貝爾和平獎表彰聯合國氣候變遷小組的科學家，但另一位得主高爾花更多時間告訴我們該害怕什麼，而 IPCC 的估計和結論建立在謹慎研究上，高爾似乎沒有同樣克制，而全球暖化其實會拯救生命。", "src": ["This year’s Nobel Peace Prize ~~justly~~ rewards ~~the thousands of~~ scientists of the United Nations Climate Change Panel ~~(the IPCC)~~.", "The other award winner, ~~former US Vice President~~ Al Gore, has spent much more time telling us what to fear.", "While the IPCC’s estimates and conclusions are grounded in careful study, Gore doesn’t seem to be similarly restrained.", "~~Indeed, according to the first complete survey of the economic effects of climate change for the world,~~ global warming will actually save lives."], "note": "難字：estimates、conclusions、restrained（題目可抄）"},
{"num": 20, "title": "Nutritional science (營養科學)", "code": "#060020", "full": "Most of the time when I embark on such an investigation, it quickly becomes clear that matters are much more complicated and ambiguous — several shades grayer — than I thought going in. Not this time. The deeper I delved into the confused and confusing thicket of nutritional science, sorting through the long-running fats versus carb wars, the fiber skirmishes and the raging dietary supplement debates, the simpler the picture gradually became. I learned that in fact science knows a lot less about nutrition than you would expect – that in fact nutrition science is, to put it charitably, a very young science. It’s still trying to figure out exactly what happens in your body when you sip a soda, or what is going on deep in the soul of a carrot to make it so good for you, or why in the world you have so many neurons – brain cells! – in your stomach, of all places. It’s a fascinating subject, and someday the field may produce definitive answers to the nutritional questions that concern us, but — as nutritionists themselves will tell you — they’re not there yet. Not even close. Nutrition science, which after all only got started less than two hundred years ago, is today approximately where surgery was in the year 1650 – very promising, and very interesting to watch, but are you ready to let them operate on you? I think I’ll wait awhile.", "ans": "I [found|learned] that in fact science knows a lot less about nutrition than you would [think|expect], {and} it’s still trying to figure out exactly what happens in your body when you [drink|sip] a soda, {and} someday the field may [give|produce] definitive answers to the nutritional questions that concern us, {but} they’re not there yet.", "zh": "我發現科學對營養的了解其實比你想的少很多，它還在試圖弄清楚你喝一口汽水時身體到底發生什麼事，而有一天這個領域也許能對我們關心的營養問題給出明確答案，但現在還沒到那一步。", "src": ["I learned that in fact science knows a lot less about nutrition than you would expect ~~– that in fact nutrition {"num": 21, "title": "Water resources (水資源)", "code": "#060021", "full": "Water is at the core of sustainable development. Water resources, and the range of services they provide, underpin poverty reduction, economic growth and environmental sustainability. From food and energy security to human and environmental health, water contributes to improvements in social well- being and inclusive growth, affecting the livelihoods of billions. In a sustainable world that is achievable in the near future, water and related resources are managed in support of human well-being and ecosystem integrity in a robust economy. Sufficient and safe water is made available to meet every person’s basic needs, with healthy lifestyles and behaviors easily upheld through reliable and affordable water supply and sanitation services, in turn supported by equitably extended and efficiently managed infrastructure. Water resources management, infrastructure and service delivery are sustainably financed. Water is duly valued in all its forms, with wastewater treated as a resource that avails energy, nutrients and freshwater for reuse. Human settlements develop in harmony with the natural water cycle and the ecosystems that support it, with measures in place that reduce vulnerability and improve resilience to water-related disasters. Integrated approaches to water resources development, management and use, and to human rights, are the norm. Water is governed in a participatory way that draws on the full potential of women and men as professionals and citizens, guided by a number of able and knowledgeable organizations, within a just and transparent institutional framework.", "ans": "Water is at the [heart|core] of sustainable development, {and} water resources, and the range of services they provide, [support|underpin] poverty reduction, economic growth and environmental sustainability, {and} [enough|sufficient] and safe water is made available to meet every person’s basic needs, {and} integrated {"num": 22, "title": "Presidential election (總統選舉)", "code": "#060022", "full": "According to the United States Constitution, a presidential election is to be held once every fourth year. The process of electing a President and Vice-President begins long before Election Day. Candidates from both major and minor political parties and independent candidates begin to raise money and campaign at least one year in advance of the general presidential election. In order to officially represent a political party, a candidate must be nominated by that party. This primary nomination process is a contest that often produces factions within political parties. These divisions impact the policy stances and agendas of the candidates running for nomination as they attempt to garner the support of party leaders and activists. The nominating process officially begins with the first state primaries and caucuses, which usually occur in the month of February of the election year. It is at these local events that voters are given their first chance to participate in electing the nation’s next President. There are many factors that influence who will ultimately become the candidate for a party. The public’s perception of the candidates is influenced by such things as media reports, public opinion polls, candidate preference surveys, and advertising. These factors will help determine the perceived strengths and weaknesses of the candidates in the months leading up to the caucuses and primaries.", "ans": "According to the United States Constitution, a presidential election is to be held once every fourth year, {and} candidates [start|begin] to [collect|raise] money and campaign at least one year in advance of the general presidential election, {and} in order to officially represent a political party, a candidate must be [chosen|nominated] by that party.", "zh": "根據美國憲法，總統選舉每四年舉行一次，候選人至少在大選前一年就開始募款和競選，而為了正式代表一個政黨，候選人必須獲得該黨提名。", "src": ["According to the United States Constitution, a presiden function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function plain(a){return a.replace(/\[([^|\]]+)\|[^\]]+\]/g,'$1').replace(/\{(and|but)\}/g,'$1');}
function wc(a){return plain(a).trim().split(/\s+/).length;}
function renderAns(a){
  return esc(a)
    .replace(/\[([^|\]]+)\|([^\]]+)\]/g,'<span class="sw">$1</span><span class="og">($2)</span>')
    .replace(/\{(and|but)\}/g,'<span class="cj">$1</span>');
}
function renderSrc(s){return esc(s).replace(/~~(.+?)~~/g,'<s>$1</s>');}
function renderFull(d){
  let f=esc(d.full);
  d.src.forEach(x=>{
    const plain=esc(x.replace(/~~/g,''));
    if(!f.includes(plain)) console.warn('來源句對不上 #'+d.num, x);
    f=f.replace(plain,'<mark>'+renderSrc(x)+'</mark>');
  });
  return f;
}

document.querySelectorAll('.art-hdr').forEach(h=>h.addEventListener('click',()=>h.closest('.article').classList.toggle('open')));

document.getElementById('search').addEventListener('input',function(){
  const q=this.value.toLowerCase();
  document.querySelectorAll('.article').forEach(a=>{a.style.display=a.textContent.toLowerCase().includes(q)?'':'none';});
});
document.getElementById('togOg').addEventListener('click',function(){
  document.body.classList.toggle('hideog');
  this.classList.toggle('on');
  this.textContent=document.body.classList.contains('hideog')?'顯示（原字）':'隱藏（原字）';
});
document.getElementById('togAll').addEventListener('click',function(){
  const all=[...document.querySelectorAll('.article')];
  const open=all.every(a=>a.classList.contains('open'));
  all.forEach(a=>a.classList.toggle('open',!open));
  this.textContent=open?'全部展開':'全部收合';
});
</script>

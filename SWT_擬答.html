{"num": 94, "title": "Legumes (豆科植物)", "code": "#060094", "full": "Gardeners can feed their families and enrich the soil by growing legumes, such as green beans, soybeans, lentils and peas. Legume roots produce their own nitrogen, which is a major fertilizer nutrient needed by all plants for growth. Nitrogen is produced in nodules that form on the roots of legumes, which contain Rhizobium bacteria. The bacteria take nitrogen from the air and convert it into a form the plants can use. When legumes are pulled up in the fall, excess nitrogen from the nodules is left in the soil. The excess organic nitrogen can be used by other plants the following growing season. It's considered organic nitrogen because it was produced naturally, making green beans or peas great rotational crops in an organic crop production system. Organic growers prefer organic nitrogen because of its natural origins and because it breaks down slowly in the soil, thus slowly feeding plants throughout the growing season. Synthetic nitrogen fertilizers tend to release nitrogen quickly and are harsher on the environment. Synthetic nitrogen fertilizers are generally applied in split applications during the season to mimic the slow release of organic nitrogen sources. Each specific legume generally requires a specific type of Rhizobium bacteria to produce nodules on their roots. Gardeners who have never grown green beans before can purchase small bags of inoculum or bacteria from most popular vegetable seed catalogs. Before planting beans, open the package and pour in the dust-like bacteria among the seed. Shake the package and then plant. Nodules will form on the roots as they develop. The bacteria will remain in the soil, making it unnecessary to inoculate the seed next year. Do not apply extra nitrogen fertilizer to bean crops. Doing so makes bacteria in the nodules lazy, encouraging them to stop producing their own nitrogen. Legumes that are particularly popular in the home vegetable garden include lima beans, peas, edible soybeans, lentils and fava beans. In a recent survey, 44 percent of gardeners trained through New Mexico State University's Master Gardener Program said they grew green beans and other legumes in their home gardens. When planting, be sure to purchase appropriate strains of Rhizobium bacteria for each type of legume.", "ans": "Gardeners can feed their families and [improve|enrich] the soil by growing legumes, such as green beans, soybeans, lentils and peas, {and} legume roots [make|produce] their own nitrogen, which is a [big|major] fertilizer nutrient needed by all plants for growth, {and} when legumes are pulled up in the fall, [extra|excess] nitrogen from the nodules is left in the soil.", "zh": "園丁種豆科植物（如四季豆、大豆、扁豆和豌豆）既能養家又能改良土壤，豆科植物的根會自己製造氮，那是所有植物生長都需要的主要肥料養分，而秋天拔起豆科植物時，根瘤裡多餘的氮會留在土裡。", "src": ["Gardeners can feed their families and enrich the soil by growing legumes, such as green beans, soybeans, lentils and peas.", "Legume roots produce their own nitrogen, which is a major fertilizer nutrient needed by all plants for growth.", "When legumes are pulled up in the fall, excess nitrogen from the nodules is left in the soil."], "note": "難字：legumes、nitrogen、fertilizer、nutrient、nodules（題目可抄）"},
{"num": 95, "title": "House mice (家鼠)", "code": "#060095", "full": "According to new research, house mice (Mus musculus) are ideal biomarkers of human settlement as they tend to stow away in crates or on ships that end up going where people go. Using mice as a proxy for human movement can add to what is already known through archaeological data and answer important questions in areas where there is a lack of artifacts, Searle said. Where people go, so do mice, often stowing away in carts of hay or on ships. Despite a natural range of just 100 meters (109 yards) and an evolutionary base near Pakistan, the house mouse has managed to colonize every continent, which makes it a useful tool for researchers like Searle. Previous research conducted by Searle at the University of York supported the theory that Australian mice originated in the British Isles and probably came over with convicts shipped there to colonize the continent in the late 18th and 19th centuries. In the Viking study, he and his fellow researchers in Iceland, Denmark and Sweden took it a step further, using ancient mouse DNA collected from archaeological sites dating from the 10th to 12th centuries, as well as modern mice. He is hoping to do just that in his next project, which involves tracking the migration of mice and other species, including plants, across the Indian Ocean, from South Asia to East Africa.", "ans": "House mice are [perfect|ideal] biomarkers of human settlement as they tend to stow away in crates or on ships, {and} using mice as a [stand-in|proxy] for human movement can add to what is already known through archaeological data, {and} the house mouse has [succeeded|managed] to colonize every continent, which makes it a useful [thing|tool] for researchers.", "zh": "家鼠是人類定居的理想生物標記，因為牠們常躲在板條箱或船上，用老鼠作為人類移動的代理指標，可以補充考古資料已知的東西，而家鼠已成功殖民每一個大陸，這讓牠成為研究人員有用的工具。", "src": ["~~According to new research,~~ house mice ~~(Mus musculus)~~ are ideal biomarkers of human settlement as they tend to stow away in crates or on ships ~~that end up going where people go~~.", "Using mice as a proxy for human movement can add to what is already known through archaeological data ~~and answer important questions in areas where there is a lack of artifacts, Searle said~~.", "~~Despite a natural range of just 100 meters (109 yards) and an evolutionary base near Pakistan,~~ the house mouse has managed to colonize every continent, which makes it a useful tool for researchers ~~like Searle~~."], "note": "難字：biomarkers、settlement、stow away、proxy、archaeological、colonize（題目可抄）"},
{"num": 96, "title": "Shifting birds (候鳥遷徙)", "code": "#060096", "full": "As warmer winter temperatures become more common, one way for some animals to adjust is to shift their ranges northward. But a new study of 59 North American bird species indicates that doing so is not easy or quick -- it took about 35 years for many birds to move far enough north for winter temperatures to match where they historically lived. The researchers used 35 years of data from the North American Christmas Bird Count to match winter temperatures to where birds were seen. They tested 59 bird species individually and found that they responded differently to climate change. When summarized across bird species, there was evidence for a strong delay lasting about 35 years. For example, black vultures have spread northward in the last 35 years and now winter as far north as Massachusetts, where the minimum winter temperature is similar to what it was in Maryland in 1975. On the other hand, the endangered red-cockaded woodpecker did not alter its range at all despite the warming trend, possibly because its very specific habitat requirements precluded a range shift. Both of these scenarios could represent problems for birds, La Sorte said. Species that do not track changes in climate may wind up at the limits of their physiological tolerance, or they may lose important habitat qualities, such as favored food types, as those species pass them by. But they also can't move their ranges too fast if the habitat conditions they depend on also tend to lag behind climate. If warming trends weaken, as they did over the past few years, birds may be able to catch up. But accelerated warming, which is likely as global carbon emissions continue to increase, may put additional strain on birds. The study highlights these challenges and the high potential climate change has for disrupting natural systems. It also underscores the challenges ecologists face ipredicting the long-term consequences of climate change for many species simultaneously.", "ans": "One way for some animals to [adapt|adjust] is to shift their ranges northward, {but} a new study [shows|indicates] that doing so is not easy or quick, {and} it took about 35 years for many birds to move far enough north, {and} species that do not [follow|track] changes in climate may wind up at the limits of their physiological tolerance.", "zh": "有些動物調整的方法之一是把活動範圍北移，但一項新研究顯示這並不容易也不快，許多鳥花了約 35 年才移到夠北的地方，而跟不上氣候變化的物種可能會到達生理耐受的極限。", "src": ["~~As warmer winter temperatures become more common,~~ one way for some animals to adjust is to shift their ranges northward.", "~~But~~ a new study ~~of 59 North American bird species~~ indicates that doing so is not easy or quick ~~--~~ it took about 35 years for many birds to move far enough north ~~for winter temperatures to match where they historically lived~~.", "Species that do not track changes in climate may wind up at the limits of their physiological tolerance~~, or they may lose important habitat qualities, such as favored food types, as those species pass them by~~."], "note": "難字：northward、indicates、physiological tolerance（題目可抄）"},
{"num": 97, "title": "ethics (倫理學)", "code": "#060097", "full": "Ethics is a set of moral obligations that define right and wrong in our practices and decisions. Many professions have a formalized system of ethical practices that help guide professionals in the field. For example, doctors commonly take the Hippocratic Oath, which, among other things, states that doctors do no harm \"to their patients. Engineers follow an ethical guide that states that they \"hold paramount the safety, health, and welfare of the public.\" Within these professions as well as within science, the principles become so ingrained that practitioners rarely have to think about adhering to the ethic - it's part of the way they practice. And a breach of ethics is considered very serious, punishable at least within the profession (by revocation of a license, for example, and sometimes by the law as well). Scientific ethics calls for honesty and integrity in all stages of scientific practice, from reporting results regardless to properly attributing collaborators. This system of ethics guides the practice of science, from data collection to publication and beyond. As in other professions, the scientific ethic is deeply integrated into the way scientists work, and they are aware that the reliability of their work and scientific knowledge in general depends upon adhering to that ethic. Many of the ethical principles in science relate to the production of unbiased scientific knowledge which is critical when others try to build upon or extend research findings. The open publication of data, peer review, replication, and collaboration required by the scientific ethic all help to keep science moving forward by validating research findings and confirming or raising questions about results.", "ans": "Ethics is a set of moral [duties|obligations] that define right and wrong, {and} many professions have a formalized system of ethical practices that help guide professionals in the field, {and} scientific ethics [asks|calls] for honesty and integrity in all stages of scientific practice, {and} many of the ethical [rules|principles] in science relate to the production of [fair|unbiased] scientific knowledge.", "zh": "倫理是一套界定對錯的道德義務，許多專業有正式的倫理規範體系來引導從業人員，科學倫理要求科學實踐的每個階段都誠實正直，而科學中許多倫理原則都與產出不偏頗的科學知識有關。", "src": ["Ethics is a set of moral obligations that define right and wrong ~~in our practices and decisions~~.", "Many professions have a formalized system of ethical practices that help guide professionals in the field.", "Scientific ethics calls for honesty and integrity in all stages of scientific practice~~, from reporting results regardless to properly attributing collaborators~~.", "Many of the ethical principles in science relate to the production of unbiased scientific knowledge ~~which is critical when others try to build upon or extend research findings~~."], "note": "難字：obligations、formalized、integrity、principles、unbiased（題目可抄）"},
{"num": 98, "title": "Soil (土壤的重要性)", "code": "#060098", "full": "It’s very easy to forget about what’s in the ground beneath our feet and why it’s so important to protect it. One tablespoon of soil contains more organisms than there are people on Earth; billions of bacteria, fungi and other microorganisms combine with minerals, water, air and organic matter to create a living system that supports plants and, in turn, all life. Healthy soil can store as much as 3,750 tons of water per hectare, reducing the risk of flooding, and the International Panel on Climate Change (IPCC) has said that 89% of all agricultural emissions could be mitigated if we improved the health of our soil. Good soil management also increases disease resistance in livestock and ultimately drives profits for farmers – yet soil and its impact on the health of our animals has, over recent decades, been one of the most neglected links in UK agriculture. Over the last 50 years’ agriculture has become increasingly dependent on chemical fertilizers, with applications today around 10 times higher than in the 1950s. Farmers often think the chemical fertilizer NPK (nitrogen, phosphorous and potassium) provides all the nutrition a plant requires, but it also has a detrimental effect on the long-term health of the land: research suggests there are fewer than 100 harvests left in many of the world’s soils.", "ans": "It’s easy to forget about what’s in the ground beneath our feet, {and} one tablespoon of soil [holds|contains] more organisms than there are people on Earth, {and} healthy soil can [hold|store] as much as 3,750 tons of water per hectare, [lowering|reducing] the risk of flooding, {but} over the last 50 years’ agriculture has become [more|increasingly] dependent on chemical fertilizers.", "zh": "我們很容易忘記腳下土壤裡有什麼，一湯匙土壤含有的生物比地球上的人還多，健康的土壤每公頃能儲存多達 3,750 噸水，降低淹水風險，但過去 50 年來農業愈來愈依賴化學肥料。", "src": ["It’s ~~very~~ easy to forget about what’s in the ground beneath our feet ~~and why it’s so important to protect it~~.", "One tablespoon of soil contains more organisms than there are people on Earth", "Healthy soil can store as much as 3,750 tons of water per hectare, reducing the risk of flooding", "Over the last 50 years’ agriculture has become increasingly dependent on chemical fertilizers~~, with applications today around 10 times higher than in the 1950s~~."], "note": "機經「50 years’ agriculture」的撇號是原文錯字，作答可寫 50 years agriculture。難字：tablespoon、organisms、hectare、dependent（題目可抄）"},
{"num": 99, "title": "British Crime (英國犯罪問題)", "code": "#060099", "full": "The Home Office’ s periodic British Crime Survey estimates that the true level of crime (the sorts, anyway, which inform the official figures) is about four times that which is registered in the annual statistics. Quite often, especially in the financial services sector, businesses do not report crimes against themselves for fear of lowering their public image. Many citizens today are not insured against car theft or property loss (because they cannot afford the premiums) so they have no incentive to tell the police if they become victims. A steep statistical rise in crime can sometimes arise not from a real growth in a particular type of conduct but from a new policing policy - offences of \"lewd dancing\" rose by about 300 per cent during 12 months in the 1980s in Manchester, but only because the zealous Chief Constable James Anderton had deployed a great many officers in gay night clubs. Sometimes the enactment of a new range of offences or the possibility of committing old offences in a new way (like computer offences involving fraud and deception) can cause an upward jolt in crime levels. The figures just released show a startling jump in street robbery but much of this seems to be a very particular crime: the theft of the now ubiquitous mobile phones. Conversely, if crimes like joyriding and some assaults are kept out of the categories measured in the annual statistics, as is the case, the official figures do not reflect even what is reported to the police as criminal. The way that criminal statistics are compiled by the Home Office is also relevant. From April 1998, police forces started to count crime in a way which, according to the government, will give \"a more robust statistical measure\". Under the new rules, crime is recorded as one crime per victim. Some crimes, like assaults, have always been recorded in this way, so the main impact of the change will be in the area of property offences. Shop thefts, for example, were the old rules counted offenders, will now count victims. Multiple thefts from cars in a car park with a barrier were previously counted as one offence but are now counted as separate offences.", "ans": "The British Crime Survey [thinks|estimates] that the true level of crime is about four times that which is registered in the annual statistics, {and} businesses do not report crimes for fear of [hurting|lowering] their public image, {and} many citizens are not insured against car theft or property loss so they have no [reason|incentive] to tell the police.", "zh": "英國犯罪調查估計真實犯罪數量約是年度統計登記數的四倍，企業因為怕損害公眾形象而不通報犯罪，而許多市民沒有投保汽車竊盜或財產損失險，所以沒有動機報警。", "src": ["The ~~Home Office’ s periodic~~ British Crime Survey estimates that the true level of crime ~~(the sorts, anyway, which inform the official figures)~~ is about four times that which is registered in the annual statistics.", "~~Quite often, especially in the financial services sector,~~ businesses do not report crimes ~~against themselves~~ for fear of lowering their public image.", "Many citizens ~~today~~ are not insured against car theft or property loss ~~(because they cannot afford the premiums)~~ so they have no incentive to tell the police ~~if they become victims~~."], "note": "難字：estimates、registered、statistics、insured、incentive、policing（題目可抄）"},
{"num": 100, "title": "Take-all disease (通吃的疾病)", "code": "#060100", "full": "The soil dwelling fungus ‘take-all’ inflicts devastating stress to the roots of cereals crops worldwide and is a major disease problem in UK wheat crops. However, recent field trial data from Rothamsted Research, an institute of the BBSRC, has demonstrated that farmers could control this devastating disease by selecting wheat cultivars that reduce take-all build up in the soil when grown as a first wheat. Wheat is an important staple crop worth 1·6 Billion a year to the UK economy alone. This work funded by the Biotechnology and Biological Sciences Research Council (BBSRC), the Department for the Environment, Food and Rural Affairs (Defra) and the HGCA will help farmers to increase yields, combating global food security and contributing to UK economic growth. Take-all disease, caused by the fungus, Gaeumannomyces graminis var· tritici, reduces grain yield and quality and results in an increased amount of residual applied nitrogen fertilizer left in the soil post- harvest. Despite the use of chemical, biological and cultural control methods the take-all fungus is still one of the most difficult pathogens of wheat to control. The risk of take-all infection in second and third wheat crops is directly linked to the amount of fungus remaining in the soil after the first wheat is harvested. The Rothamsted Research study, published in Plant Pathology, has demonstrated that wheat cultivars differ in their ability to build-up the take-all fungus. Growing a low building cultivar, such as Cadenza, as a first wheat crop can be used to manipulate take- all inoculum levels in the soil resulting in better yields from the second and third wheat crops. Yield increases of up to 2 tons per hectare in 2nd wheats have been observed.", "ans": "The soil dwelling fungus ‘take-all’ inflicts [serious|devastating] stress to the roots of cereals crops, {but} recent field trial data has [shown|demonstrated] that farmers could control this devastating disease by [choosing|selecting] wheat cultivars that reduce take-all build up in the soil, {and} yield increases of up to 2 tons per hectare in 2nd wheats have been observed.", "zh": "土壤中的真菌「全蝕病」對穀類作物的根造成毀滅性壓力，但最近的田間試驗數據顯示，農民可以透過選擇能減少土壤中全蝕病菌累積的小麥品種來控制這種病害，而第二季小麥每公頃增產達 2 噸已被觀察到。", "src": ["The soil dwelling fungus ‘take-all’ inflicts devastating stress to the roots of cereals crops ~~worldwide and is a major disease problem in UK wheat crops~~.", "~~However,~~ recent field trial data ~~from Rothamsted Research, an institute of the BBSRC,~~ has demonstrated that farmers could control this devastating disease by selecting wheat cultivars that reduce take-all build up in the soil ~~when grown as a first wheat~~.", "Yield increases of up to 2 tons per hectare in 2nd wheats have been observed."], "note": "難字：fungus、inflicts、devastating、cultivars、yield、hectare（題目可抄，拼字盯緊）"},
{"num": 101, "title": "Dendrochronology (年輪學)", "code": "#060101", "full": "Here’s how tree ring dating, known to scientists as dendrochronology, works. If you cut a tree down today, it’s straightforward to count the rings inwards, starting from the tree’s outside. Hence the sequence of the rings in a tree cross-section is like a message in Morse code formerly used for sending telegraph messages; dot-dot-dash-dot-dash in the Morse code, wide-wide- narrow-wide-narrow in the tree ring sequence. Tree ring specialists (known as dendrochronologists) proceed by noting the sequence of wider and narrower rings in a tree cut down in a known recent year, and also noting the sequences in beams from trees cut down at various times in the past. In that way, dendrochronologists have constructed tree ring records extending back for thousands of years in some parts of the world. A bonus of dendrochronology is that the width and substructure of each ring reflect the amount of rain and the season at which the rain fell during that particular year. Thus, tree ring studies also allow one to reconstruct the past climate.", "ans": "If you cut a tree down today, it’s [easy|straightforward] to count the rings inwards, {and} dendrochronologists have [built|constructed] tree ring records extending back for thousands of years, {and} the width and substructure of each ring [show|reflect] the amount of rain and the season at which the rain fell during that particular year.", "zh": "如果你今天砍下一棵樹，往內數年輪很簡單，年輪學家已建立了回溯數千年的年輪紀錄，而每圈年輪的寬度和結構反映當年的雨量和下雨的季節。", "src": ["If you cut a tree down today, it’s straightforward to count the rings inwards~~, starting from the tree’s outside~~.", "~~In that way,~~ dendrochronologists have constructed tree ring records extending back for thousands of years ~~in some parts of the world~~.", "~~A bonus of dendrochronology is that~~ the width and substructure of each ring reflect the amount of rain and the season at which the rain fell during that particular year."], "note": "難字：dendrochronologists、constructed、substructure、reconstruct（題目可抄）"},
{"num": 102, "title": "World Wide Web (萬維網)", "code": "#060102", "full": "He is the man who has changed the world more than anyone else in the past hundred years. Sir Tim Berners-Lee may be a mild-mannered academic who lives modestly in Boston, but as the inventor of the world wide web he is also a revolutionary. He is a scientist who has altered the way people think as well as the way they live. Since the web went global 20 years ago, the way we shop, listen to music and communicate has been transformed. There are implications for politics, literature, economics — even terrorism — because an individual can now have the same access to information as the elite. Society will never be the same. The computer scientist from Oxford, who built his own computer from a television screen and spare parts after he was banned from one of the university computers, is a cultural guru as much as a technological one. \"It is amazing how far we’ve come,\" he says. \"But you’re always wondering what’s the next crazy idea, and working to make sure the web stays one web and that the internet stays open. There isn’t much time to sit back and reflect.\" He invented the web, he says, because he was frustrated that he couldn’t find all the information he wanted in one place. It was an imaginary concept that he realized.", "ans": "Sir Tim Berners-Lee may be a mild-mannered academic, but as the [creator|inventor] of the world wide web he is a revolutionary, {and} since the web went global 20 years ago, the way we shop and communicate has been [changed|transformed], {and} he invented the web because he was [annoyed|frustrated] that he couldn’t find all the information in one place.", "zh": "提姆·柏內茲-李爵士也許是個溫和的學者，但作為全球資訊網的發明者，他是個革命者，自從網路 20 年前走向全球，我們購物和溝通的方式已經被改變，而他發明網路是因為他很挫折找不到所有資訊集中在一個地方。", "src": ["Sir Tim Berners-Lee may be a mild-mannered academic ~~who lives modestly in Boston~~, but as the inventor of the world wide web he is ~~also~~ a revolutionary.", "Since the web went global 20 years ago, the way we shop~~, listen to music~~ and communicate has been transformed.", "He invented the web~~, he says,~~ because he was frustrated that he couldn’t find all the information ~~he wanted~~ in one place."], "note": "難字：mild-mannered、academic、modestly、revolutionary、transformed（題目可抄）"},
{"num": 103, "title": "Hunter-Gatherers (遊牧民族)", "code": "#060103", "full": "In around 2300 BP (Before Present), hunter gatherers called the San acquired domestic stock in what is now modern day Botswana. Their population grew, and spread throughout the Western half of South Africa. They were the first pastoralists in southern Africa, and called themselves Khoikhoi (or Khoe), which means 'men of men' or 'the real people'. This name was chosen to show pride in their past and culture. The Khoikhoi brought a new way of life to South Africa and to the San, who were hunter gatherers as opposed to herders. This led to misunderstandings and subsequent conflict between the two groups. The Khoikhoi were the first native people to come into contact with the Dutch settlers in the mid-17th century. As the Dutch took over land for farms, the Khoikhoi were dispossessed, exterminated, or enslaved and therefore their numbers dwindled. The Khoikhoi were called the ‘Hottentots’ by European settlers because the sound of their language was so different from any European language, and they could not pronounce many of the words and sounds.", "ans": "In around 2300 BP, hunter gatherers called the San [got|acquired] [farm|domestic] stock in what is now Botswana, {and} they were the first pastoralists in southern Africa, and called themselves Khoikhoi, which means 'men of men' or 'the real people', {and} the Khoikhoi were the first [local|native] people to come into contact with the Dutch settlers in the mid-17th century.", "zh": "大約在 2300 年前，被稱為桑人的狩獵採集者在今天的波札那取得了家畜，他們是南部非洲最早的牧民，自稱科伊科伊人，意思是「人中之人」或「真正的人」，而科伊科伊人是 17 世紀中最早接觸荷蘭殖民者的原住民。", "src": ["In around 2300 BP ~~(Before Present)~~, hunter gatherers called the San acquired domestic stock in what is now ~~modern day~~ Botswana.", "They were the first pastoralists in southern Africa, and called themselves Khoikhoi ~~(or Khoe)~~, which means 'men of men' or 'the real people'.", "The Khoikhoi were the first native people to come into contact with the Dutch settlers in the mid-17th century."], "note": "難字：acquired、domestic stock、pastoralists、settlers（題目可抄）"},
{"num": 104, "title": "3D Printing (3D打印)", "code": "#060104", "full": "Madeline Gannon is a researcher, teacher at the Carnegie Mellon University School of Architecture and Ph·D· candidate in Computational Design — but that’s not all. She is on a mission to open up the infinite design possibilities of 3D printing to the world. \"Currently you have to have a lot of technical background in order to participate in creating things for 3D printers,\" Gannon says. \"There is still a huge knowledge barrier for how we create digital models.\" As the technology has advanced, prices have plummeted, and now anyone can buy a 3D printer for a few hundred dollars, Gannon notes. However, not just anyone can create original designs for 3D- printed artifacts. To put true creative power into the hands of any ordinary 3D printer owner, Gannon has developed an innovative new system called \"Tactum\". Tactum is a new type of software that lets users create their own unique designs for 3D printers by simply touching a projected image. Using their innate hand gestures, someone using Tactum can poke, rub and otherwise manipulate the projected image that will become their 3D printed object, and see it instantly change shape in response. In keeping with the goal of democratizing the process, Gannon designed her first series of Tactum artifacts on a surface that everyone can access freely and manipulate instinctively, that being the human body. \"My goal was to bring the digital out to the physical world and out onto your body,\" says Gannon. Along with a companion project called Reverb — which translates these user-created designs into rintable meshes — that impulse has resulted in a spectacular diversity of bracelet and necklace designs, ranging from smooth landscapes, intricate textures and chaotic free forms to delicate geometries derived from the 19th century art of chronograph.", "ans": "She is on a mission to open up the [endless|infinite] design possibilities of 3D printing to the world, {and} prices have [dropped|plummeted], and now anyone can buy a 3D printer for a few hundred dollars, {and} Tactum is a new type of software that lets users create their own [special|unique] designs for 3D printers by touching a projected image.", "zh": "她的使命是把 3D 列印無限的設計可能性開放給全世界，價格已大幅下跌，現在任何人花幾百美元就能買到 3D 印表機，而 Tactum 是一種新軟體，讓使用者只要觸碰投影影像就能為 3D 印表機創造自己獨特的設計。", "src": ["She is on a mission to open up the infinite design possibilities of 3D printing to the world.", "~~As the technology has advanced,~~ prices have plummeted, and now anyone can buy a 3D printer for a few hundred dollars~~, Gannon notes~~.", "Tactum is a new type of software that lets users create their own unique designs for 3D printers by ~~simply~~ touching a projected image."], "note": "開頭的 She 指 Madeline Gannon，考場可直接寫 Gannon。難字：infinite、possibilities、plummeted、projected（題目可抄）"},
{"num": 105, "title": "Modern Art (現代藝術)", "code": "#060105", "full": "Broadly speaking, there are two different ways of thinking about modern art, or two different versions of the story. One way is to view art as something that can be practiced (And though of) as an activity radically separate from everyday life or worldly concerns. From this point of view, art is said to be \"autonomous\" from society – that is, it is believed to be self- sustaining and self-referring. One particularly influential versions of this story suggest that modern art should be viewed as process by which features extraneous to a particular branch of art would be progressively eliminated, and painters or sculptors would come to concentrate on problems specific to their domain. Another way of thinking about modern art is to view it as responding to the modern world, and to see modern artists immersing themselves in the conflicts and challenges of society. That is to say, some modern artists sought ways of conveying the changing experiences generated in European by the twin processes of commercialization (the commodification of everyday life) and urbanization. From this point of view, modern art is a way of reflecting on the transformation that created what we call, in a sort of shorthand, \"modernity\".", "ans": "There are two different ways of thinking about modern art, {and} one way is to [see|view] art as an activity separate from [daily|everyday] life or worldly concerns, {and} another way of thinking about modern art is to view it as [reacting|responding] to the modern world, {and} modern art is a way of reflecting on the [change|transformation] that created \"modernity\".", "zh": "思考現代藝術有兩種不同方式，一種是把藝術視為與日常生活或世俗關懷分離的活動，另一種是把現代藝術視為對現代世界的回應，而現代藝術是一種反思創造了「現代性」的轉變的方式。", "src": ["~~Broadly speaking,~~ there are two different ways of thinking about modern art~~, or two different versions of the story~~.", "One way is to view art as ~~something that can be practiced (And though of) as~~ an activity ~~radically~~ separate from everyday life or worldly concerns.", "Another way of thinking about modern art is to view it as responding to the modern world~~, and to see modern artists immersing themselves in the conflicts and challenges of society~~.", "~~From this point of view,~~ modern art is a way of reflecting on the transformation that created ~~what we call, in a sort of shorthand,~~ \"modernity\"."], "note": "難字：worldly concerns、responding、transformation、modernity（題目可抄）"},
{"num": 106, "title": "Upper Paleolithic (石器時代)", "code": "#060106", "full": "The ways of life Upper Paleolithic people are known through the remains of meals scattered around their hearths, together with many tools and weapons and the debris left over from their making. The people were hunter-gathers who lived exclusively from what they could find in nature without practicing either agriculture or herding. They hunted the bigger herbivores, while berries, leaves, roots, wild fruit and mushrooms probably played a major role in their diet. Their hunting was indiscriminate; perhaps because so many animals were about they did not need to spare pregnant females or the young. In the cave of Enlene, for example, many bones of reindeer and bison fetuses were found. Apparently, upper Paleolithic people hunted like other predators and killed the weakest prey first. They did, however, sometimes concentrate on salmon suns and migrating herds of reindeer. Contrary to popular beliefs about cave man, upper Paleolithic people did not live deep inside caves. They rather chose the foot of cliffs, especially when an overhang provided good shelter. On the plains and in the valleys, they used tents made from hides of the animals they killed. At time, on the great Russian plains, they built huts with huge boned and tusks collected from skeletons of mammals. Men hunted mostly with spears, the bow and arrow were probably not invented until the Magdalenian period that came at the end of the Upper Paleolithic. Tools and weapons, made out of wood or reindeer antlers, often had flint cutting edges. Flint nappers were skillful and traditions in flint napping were purchased for thousands of years. This continuity means that they must have been carefully thought about how to find good flint modules and how to nap them in order to make knives, bruins (chisel-like tools) or scrapers, which could be used for various purposes.", "ans": "The people were hunter-gathers who lived [only|exclusively] from what they could find in nature without practicing either agriculture or herding, {and} they hunted the [larger|bigger] herbivores, while berries, wild fruit and mushrooms [likely|probably] played a [big|major] role in their diet, {and} upper Paleolithic people did not live deep inside caves, {but} they rather chose the foot of cliffs.", "zh": "這些人是狩獵採集者，完全靠大自然中能找到的東西生活，不務農也不放牧，他們獵捕較大的草食動物，而莓果、野果和蘑菇可能在飲食中占重要地位，舊石器時代晚期的人不住在洞穴深處，而是選擇懸崖腳下。", "src": ["The people were hunter-gathers who lived exclusively from what they could find in nature without practicing either agriculture or herding.", "They hunted the bigger herbivores, while berries, ~~leaves, roots,~~ wild fruit and mushrooms probably played a major role in their diet.", "~~Contrary to popular beliefs about cave man,~~ upper Paleolithic people did not live deep inside caves.", "They rather chose the foot of cliffs~~, especially when an overhang provided good shelter~~."], "note": "難字：exclusively、agriculture、herbivores、Paleolithic、cliffs（題目可抄）"},
{"num": 107, "title": "Volunteer program (志願者項目)", "code": "#060107", "full": "If you are inspired to take concrete action for global peace and development, take a look at the United Nations Volunteers (UNV) program. Every year, up to 8,000 qualified and experienced women and men of some 160 different nationalities volunteer at least six months of their lives to help others. These UN Volunteers work in some 130 countries promoting peace, responding to disasters, empowering communities and helping to build sustainable livelihoods and lasting development. UN Volunteers come from dozens of professional backgrounds but all of them are catalysts of positive change. They are encouraged to be creative and entrepreneurial, and foster volunteerism for peace and development both within and beyond their assignments. They work at the heart of communities in partnership with governments, United Nations entities and civil society. Being a UN Volunteer is not a career (you are currently limited to four years of service), but it is rich with opportunities and experience and offers huge personal rewards. As a UN Volunteer you receive a Volunteer Living Allowance (VLA) which covers basic needs, housing and utilities. Additionally, UNV will provide a settling-in-grant, life, health, and permanent disability insurance, return airfares and a nominal resettlement allowance.", "ans": "Every year, up to 8,000 women and men volunteer at least six months of their lives to help others, {and} these UN Volunteers work in some 130 countries [supporting|promoting] peace, responding to disasters, [helping|empowering] communities, {and} being a UN Volunteer is not a career, but it is rich with opportunities and experience and [gives|offers] [big|huge] personal rewards.", "zh": "每年多達 8,000 名女性和男性志願奉獻至少六個月的人生幫助他人，這些聯合國志工在約 130 個國家促進和平、回應災難、賦權社區，而當聯合國志工不是一份職業，但充滿機會和經驗，並帶來巨大的個人回報。", "src": ["Every year, up to 8,000 ~~qualified and experienced~~ women and men ~~of some 160 different nationalities~~ volunteer at least six months of their lives to help others.", "These UN Volunteers work in some 130 countries promoting peace, responding to disasters, empowering communities ~~and helping to build sustainable livelihoods and lasting development~~.", "Being a UN Volunteer is not a career ~~(you are currently limited to four years of service)~~, but it is rich with opportunities and experience and offers huge personal rewards."], "note": "難字：volunteer、promoting、disasters、empowering、opportunities（題目可抄）"},
{"num": 108, "title": "Overqualified (資曆過高)", "code": "#060108", "full": "If your recruiting efforts attract job applicants with too much experience—a near certainty in this weak labor market—you should consider a response that runs counter to most hiring managers’ MO: Don’t reject those applicants out of hand. Instead, take a closer look. New research shows that overqualified workers tend to perform better than other employees, and they don’t quit any sooner. Furthermore, a simple managerial tactic—empowerment—can mitigate any dissatisfaction they may feel. The prejudice against too-good employees is pervasive. Companies tend to prefer an applicant who is a \"perfect fit\" over someone who brings more intelligence, education, or experience than needed. On the surface, this bias makes sense: Studies have consistently shown that employees who consider themselves overqualified exhibit higher levels of discontent. For example, over- qualification correlated well with job dissatisfaction in a 2008 study of 156 call-center reps by Israeli researchers Saul Fine and Baruch Nevo. And unlike discrimination based on age or gender, declining to hire overqualified workers is perfectly legal. But even before the economic downturn, a surplus of overqualified candidates was a global problem, particularly in developing economies, where rising education levels are giving workers more skills than are needed to supply the growing service sectors. If managers can get beyond the conventional wisdom, the growing pool of too-good applicants is a great opportunity. Berrin Erdogan and Talya N· Bauer of Portland State University in Oregon found that overqualified workers’ feelings of dissatisfaction can be dissipated by giving them autonomy in decision making. At stores where employees didn’t feel empowered, \"overeducated\" workers expressed greater dissatisfaction than their colleagues did and were more likely to state an intention to quit. But that difference vanished where self-reported autonomy was high.", "ans": "The [bias|prejudice] against too-good employees is [common|pervasive], {and} companies tend to prefer an applicant who is a \"perfect fit\" over someone who brings more intelligence or experience, {but} new research shows that overqualified workers tend to [do|perform] better than other employees, and they don’t quit any sooner, {and} a simple managerial tactic can [reduce|mitigate] any dissatisfaction they may feel.", "zh": "對太優秀員工的偏見很普遍，公司傾向偏好「完全符合」的應徵者，而不是帶來更多智慧或經驗的人，但新研究顯示資歷過高的員工表現比其他員工好，也不會更快離職，而一個簡單的管理手段就能減輕他們可能的不滿。", "src": ["The prejudice against too-good employees is pervasive.", "Companies tend to prefer an applicant who is a \"perfect fit\" over someone who brings more intelligence~~, education,~~ or experience ~~than needed~~.", "New research shows that overqualified workers tend to perform better than other employees, and they don’t quit any sooner.", "~~Furthermore,~~ a simple managerial tactic~~—empowerment—~~can mitigate any dissatisfaction they may feel."], "note": "難字：prejudice、pervasive、overqualified、managerial、mitigate、dissatisfaction（題目可抄，拼字盯緊）"},
{"num": 109, "title": "Asda (阿斯達)", "code": "#060109", "full": "Asda has become the first food retailer in the country to measure how much customers can save by cutting back on food waste, thanks to a Knowledge Transfer Partnership (KTP) with the University of Leeds. The idea behind the KTP was for the University, using Asda’s customer insight data, to apply its research to identify, investigate and implement ways of helping customers to reduce their food waste. This was one of the first times that a major retailer had tried to deliver large-scale sustainability changes, with the two-year project seen as a way for Asda to position themselves as true innovators in this area. The campaign focused on providing customers with advice on everything from food storage and labelling, to creative recipes for leftovers. Meanwhile, in-store events encouraged customers to make changes in their own homes. In fact, two million customers have said they will make changes to how they deal with food waste in their own homes, leading to an average saving of 57 pounds per customer, as well as a reduction in waste. A key aspect of a KTP is that an associate is employed by the University to work in the firm and help deliver the desired outcomes of the KTP. As a part of the collaboration with Asda, Laura Babbs was given the task of driving forward the sustainability changes in the retailer. As a result of the success of her work, Laura eventually became a permanent member of the team at Asda.", "ans": "Asda has become the first food retailer to [check|measure] how much customers can save by cutting back on food waste, {and} the campaign focused on [giving|providing] customers with [tips|advice] on everything from food storage to recipes for leftovers, {and} two million customers have said they will make changes, leading to an average saving of 57 pounds per customer.", "zh": "Asda 成為第一家衡量顧客減少食物浪費能省多少錢的食品零售商，這項活動著重提供顧客從食物保存到剩菜食譜的各種建議，而兩百萬顧客表示會做出改變，平均每位顧客省下 57 英鎊。", "src": ["Asda has become the first food retailer ~~in the country~~ to measure how much customers can save by cutting back on food waste~~, thanks to a Knowledge Transfer Partnership (KTP) with the University of Leeds~~.", "The campaign focused on providing customers with advice on everything from food storage ~~and labelling~~, to ~~creative~~ recipes for leftovers.", "~~In fact,~~ two million customers have said they will make changes ~~to how they deal with food waste in their own homes~~, leading to an average saving of 57 pounds per customer~~, as well as a reduction in waste~~."], "note": "難字：retailer、measure、campaign、leftovers、average（題目可抄）"},
{"num": 110, "title": "Blindness (白內障手術)", "code": "#060110", "full": "Scientists believe they may have found a way to prevent complications that can arise following cataract surgery, the world’s leading cause of blindness. Detailing why complications can occur after surgery, researchers from the University of East Anglia (UEA) explained that while cataract surgery works well to restore vision, a few natural lens cells always remain after the procedure. Over time, the eye’s wound-healing response leads these cells to spread across the underside of the artificial lens, which interferes with vision, causing what’s known as ‘posterior capsule opacification’ or secondary cataract. UEA’s School of Biological Sciences academic, Dr· Michael Wormstone, who led the study, said: \"Secondary visual loss responds well to treatment with laser surgery. But as life expectancy increases, the problems of cataract and posterior capsule opacification will become even greater in terms of both patient well being and economic burden. It’s essential that we find better ways to manage the condition in future.\" As a result, researchers are designing new artificial lenses that can be placed into a capsular bag that stays open, instead of shrink-wrapping closed, which currently occurs. It is believed that, through the new approach, fluid in the eye can flow around the artificial lens, therefore diluting and washing away the cell-signaling molecules that encourage cell re-growth.", "ans": "Scientists [think|believe] they may have found a way to prevent complications that can [happen|arise] following cataract surgery, the world’s leading cause of blindness, {and} while cataract surgery works well to restore vision, a few natural lens cells always [stay|remain], {and} researchers are [making|designing] new artificial lenses that can be placed into a capsular bag that stays open.", "zh": "科學家相信他們可能找到了預防白內障手術（全球最主要的致盲原因）後併發症的方法，雖然白內障手術能有效恢復視力，但總會殘留少數天然水晶體細胞，而研究人員正在設計可放入保持開放的囊袋中的新人工水晶體。", "src": ["Scientists believe they may have found a way to prevent complications that can arise following cataract surgery, the world’s leading cause of blindness.", "~~Detailing why complications can occur after surgery, researchers from the University of East Anglia (UEA) explained that~~ while cataract surgery works well to restore vision, a few natural lens cells always remain ~~after the procedure~~.", "~~As a result,~~ researchers are designing new artificial lenses that can be placed into a capsular bag that stays open~~, instead of shrink-wrapping closed, which currently occurs~~."], "note": "難字：complications、cataract、restore、artificial、capsular（題目可抄，拼字盯緊）"},
{"num": 111, "title": "Comparative advantage (相對優勢)", "code": "#060111", "full": "With an abundance of low priced labor relative to the United States, it is no surprise that China, India and other developing countries specialize in the production of labor intensive products. For similar reasons, the United States will specialize in the production of goods that are human and physical capital intensive because of the relative abundance of a highly educated labor force and technically sophisticated equipment in the United States. This division of global production should yield higher global output of both types of goods than would be the case if each country attempted to produce both of these goods itself. For example, the United States would produce more expensive labor intensive goods because of its more expensive labor and the developing countries would produce more expensive human and physical capital intensive goods because of their relative scarcity of these inputs. This logic implies that the United States is unlikely to be a significant global competitor in the production green technologies that are not relatively intensive in human and physical capital. Nevertheless, during the early stages of the development of a new technology, the United States has a comparative advantage in the production of the products enabled by this innovation. However, once these technologies become well understood and production processes are designed that can make use of less skilled labor; production will migrate to countries with less expensive labor.", "ans": "With an abundance of low priced labor, it is no [wonder|surprise] that China, India specialize in the production of labor intensive products, {and} the United States will specialize in the production of goods that are human and physical capital intensive, {but} once these technologies become well understood production will [move|migrate] to countries with less [costly|expensive] labor.", "zh": "由於擁有大量低價勞動力，中國、印度專門生產勞力密集產品並不意外，美國則專門生產人力和實體資本密集的商品，但一旦這些技術被充分理解，生產就會轉移到勞動力較便宜的國家。", "src": ["With an abundance of low priced labor ~~relative to the United States~~, it is no surprise that China, India ~~and other developing countries~~ specialize in the production of labor intensive products.", "~~For similar reasons,~~ the United States will specialize in the production of goods that are human and physical capital intensive ~~because of the relative abundance of a highly educated labor force and technically sophisticated equipment in the United States~~.", "~~However,~~ once these technologies become well understood ~~and production processes are designed that can make use of less skilled labor;~~ production will migrate to countries with less expensive labor."], "note": "難字：abundance、specialize、intensive、migrate（題目可抄）"},
{"num": 112, "title": "Plant Research (植物研究)", "code": "#060112", "full": "Plants serve as the conduit of energy into the biosphere, provide food and materials used by humans, and they shape our environment. According to Ehrhardt and Frommer, the three major challenges facing humanity in our time are food, energy, and environmental degradation. All three are plant related. All of our food is produced by plants, either directly or indirectly via animals that eat them. Plants are a source of energy production. And they are intimately involved in climate change and a major factor in a variety of environmental concerns, including agricultural expansion and its impact on habitat destruction and waterway pollution. What’s more, none of these issues are independent of each other. Climate change places additional stresses on the food supply and on various habitats. So, plant research is instrumental in addressing all of these problems and moving into the future. For plant research to move significantly forward, Ehrhardt and Former say technological development is critical, both to test existing hypotheses and to gain new information and generate fresh hypotheses. If we are to make headway in understanding how these essential organisms function and build the foundation for a sustainable future, then we need to apply the most advanced technologies available to the study of plant life, they say.", "ans": "Plants serve as the [channel|conduit] of energy into the biosphere, provide food and materials used by humans, and they shape our environment, {and} the three [big|major] challenges facing humanity in our time are food, energy, and environmental degradation, all three are plant related, {and} plant research is [important|instrumental] in [solving|addressing] all of these problems and moving into the future.", "zh": "植物是能量進入生物圈的管道，提供人類使用的食物和材料，也塑造我們的環境，我們這個時代人類面臨的三大挑戰是糧食、能源和環境退化，三者都與植物有關，而植物研究對解決這些問題和走向未來至關重要。", "src": ["Plants serve as the conduit of energy into the biosphere, provide food and materials used by humans, and they shape our environment.", "~~According to Ehrhardt and Frommer,~~ the three major challenges facing humanity in our time are food, energy, and environmental degradation. All three are plant related.", "~~So,~~ plant research is instrumental in addressing all of these problems and moving into the future."], "note": "難字：conduit、biosphere、humanity、degradation、instrumental（題目可抄）"},
{"num": 113, "title": "Human Remains (人類遺體)", "code": "#060113", "full": "Human remains are a fundamental part of the archaeological record, offering unique insights into the lives of individuals and populations in the past. Like many archaeological materials human remains require distinctive and specialized methods of recovery, analysis and interpretation, while technological innovations and the accumulation of expertise have enabled archaeologists to extract ever greater amounts of information from assemblages of skeletal material. Alongside analyses of new finds, these advances have consistently thrown new light on existing collections of human remains in museums, universities and other institutions. Given the powerful emotional, social and religious meanings attached to the dead body, it is perhaps unsurprising that human remains pose a distinctive set of ethical questions for archaeologists. With the rise of indigenous rights movements and the emergence of post-colonial nations, the acquisition and ownership of human remains became a divisive and politically loaded issue. It became increasingly clear that many human remains in museum collections around the world represented the traces of colonial exploitation and discredited pseudo-scientific theories of race. In the light of these debates and changing attitudes, some human remains were returned or repatriated to their communities of origin, a process which continues to this day. Recently a new set of challenges to the study of human remains has emerged from a rather unexpected direction: the British government revised its interpretation of nineteenth-century burial legislation in a way that would drastically curtail the ability of archaeologists to study human remains of any age excavated in England and Wales. This paper examines these extraordinary events and the legal, political and ethical questions that they raise.", "ans": "Human remains are a [basic|fundamental] part of the archaeological record, {and} it is [maybe|perhaps] unsurprising that human remains pose a [special|distinctive] set of ethical questions for archaeologists, {and} the acquisition and ownership of human remains became a divisive and politically loaded [problem|issue], {and} some human remains were returned or repatriated to their communities of origin.", "zh": "人類遺骸是考古紀錄的基本部分，人類遺骸對考古學家提出一組特殊的倫理問題並不令人意外，人類遺骸的取得和所有權成為一個分歧且政治敏感的議題，而有些人類遺骸被歸還或送回原本的社群。", "src": ["Human remains are a fundamental part of the archaeological record~~, offering unique insights into the lives of individuals and populations in the past~~.", "~~Given the powerful emotional, social and religious meanings attached to the dead body,~~ it is perhaps unsurprising that human remains pose a distinctive set of ethical questions for archaeologists.", "~~With the rise of indigenous rights movements and the emergence of post-colonial nations,~~ the acquisition and ownership of human remains became a divisive and politically loaded issue.", "~~In the light of these debates and changing attitudes,~~ some human remains were returned or repatriated to their communities of origin~~, a process which continues to this day~~."], "note": "難字：archaeological、unsurprising、ethical、acquisition、divisive、repatriated（題目可抄，拼字盯緊）"},
{"num": 114, "title": "Giant panda (大熊貓)", "code": "#060114", "full": "The worldwide population of wild giant pandas increased by 268 over the last decade according to a new survey conducted by the government of China. The increase in population brings the total number of wild giant pandas to 1,864. The population increase represents 16·8% rise compared to the last panda survey in 2003. Wild giant pandas, a global symbol of wildlife conservation, are found only in China's Sichuan, Shaanxi and Gansu provinces. According to the report, formally known as the Fourth National Giant Panda Survey, the geographic range of pandas throughout China also increased. The total area inhabited by wild giant pandas in China now equals 2,577,000 hectares, an expansion of 11·8% since 2003. \"These results are a testament to the conservation achievements of the Chinese government,\" said Xiaohai Liu, executive director of programs, WWF-China. \"A lot of good work is being done around wild giant panda conservation, and the government has done well to integrate these efforts and partner with conservation organizations including WWF\". The report, the fourth in a series of decadal (10 year) surveys conducted by the State Forestry Administration of China, began in 2011 with financial and technical support from WWF. Much of the success in increasing the panda population comes as a result of conservation policies implemented by the Chinese government, including the Natural Forest Protection Project and Grain for Green.", "ans": "The [global|worldwide] population of wild giant pandas increased by 268 over the last decade, {and} the increase in population [takes|brings] the total number of wild giant pandas to 1,864, {and} the geographic [area|range] of pandas throughout China also increased, {and} the success in increasing the panda population comes as a result of conservation policies [made|implemented] by the Chinese government.", "zh": "全球野生大貓熊數量在過去十年增加了 268 隻，這次增加使野生大貓熊總數達到 1,864 隻，貓熊在中國的分布範圍也擴大了，而貓熊數量增加的成功是中國政府實施保育政策的結果。", "src": ["The worldwide population of wild giant pandas increased by 268 over the last decade ~~according to a new survey conducted by the government of China~~.", "The increase in population brings the total number of wild giant pandas to 1,864.", "~~According to the report, formally known as the Fourth National Giant Panda Survey,~~ the geographic range of pandas throughout China also increased.", "~~Much of~~ the success in increasing the panda population comes as a result of conservation policies implemented by the Chinese government~~, including the Natural Forest Protection Project and Grain for Green~~."], "note": "難字：decade、geographic range、conservation、implemented（題目可抄）"},
{"num": 115, "title": "National Prohibition Act (禁酒令)", "code": "#060115", "full": "In 1920, the eighteenth Amendment to the United States Constitution created yet another setback for the American wine industry. The National Prohibition Act, also known as the Volstead Act, prohibited the manufacture, sale, transportation, importation, delivery, or possession of intoxicating liquors for beverage purposes. Perhaps more important, prohibition allowed anyone to produce up to two hundred gallons yearly of fruit juice or cider. The fruit juice, which was sometimes made into concentrate, was ideal for making wine. People would buy grape concentrate from California and have it shipped to the East Coast. The top of the container was stamped in big bold letters: caution: do not add sugar or yeast or else fermentation will take place! Some of this yield found its way to bootleggers throughout America who did just that. But not for long, because the government stepped in and banned the sale of grape juice, preventing illegal wine production. Vineyards stopped being planted, and the American wine industry came to a halt.", "ans": "In 1920, the eighteenth Amendment to the United States Constitution [caused|created] yet another [blow|setback] for the American wine industry, {and} prohibition allowed anyone to produce up to two hundred gallons yearly of fruit juice or cider, {and} the fruit juice was [perfect|ideal] for making wine, {but} the government stepped in and [stopped|banned] the sale of grape juice.", "zh": "1920 年，美國憲法第十八修正案給美國葡萄酒業帶來又一次打擊，禁酒令允許任何人每年生產最多兩百加侖果汁或蘋果酒，果汁很適合用來釀酒，但政府介入禁止了葡萄汁的販售。", "src": ["In 1920, the eighteenth Amendment to the United States Constitution created yet another setback for the American wine industry.", "~~Perhaps more important,~~ prohibition allowed anyone to produce up to two hundred gallons yearly of fruit juice or cider.", "The fruit juice~~, which was sometimes made into concentrate,~~ was ideal for making wine.", "~~But not for long, because~~ the government stepped in and banned the sale of grape juice~~, preventing illegal wine production~~."], "note": "難字：Amendment、Constitution、setback、prohibition、gallons（題目可抄）"},
{"num": 116, "title": "Language (語言)", "code": "#060116", "full": "When people start thinking about language, the first question which often occurs to them is this: is language natural to humans ? - in the same way that grunting is natural to pigs, and barking comes naturally to dogs. Or is it just something we happen to have learned? - in the same way that dogs may learn to beg, or elephants may learn to waltz, or humans may learn to play the guitar. Clearly, in one sense, children 'learn' whatever language they are exposed to, be it Chinese, Nootka or English. So no one would deny that 'learning' is very important. But the crucial question is whether children are born with 'blank sheets' in their head as far as language is concerned - or whether humans are 'programmed' with an outline knowledge of the structure of languages in general. This question of whether language is partly due to nature or wholly due to learning or nurture is often referred to as the nature-nurture controversy, and has been discussed for centuries. For example, it was the topic of one of Plato's dialogues, the Cratylus. Controversies which have been going on for literally ages tend to behave in a characteristic fashion. They lie dormant for a while, then break out fiercely. This particular issue resurfaced in linguistics in 1959 when the linguist Noam Chomsky wrote a devastating and witty review of Verbal Behavior, a book by the Harvard psychologist B·F· Skinner (Skinner 1957; Chomsky 1959). This book claimed to 'explain' language as a set of habits gradually built up over the years. According to Skinner, no complicated innate or mental mechanisms are needed. All that is necessary is the systematic observation of the events in the external world which prompt the speaker to utter sounds.", "ans": "Children 'learn' whatever language they are exposed to, {but} the [key|crucial] question is whether children are born with 'blank sheets' in their head, {and} this question is often [known|referred] to as the nature-nurture [debate|controversy], and has been discussed for centuries, {and} this issue resurfaced in linguistics in 1959 when the linguist Noam Chomsky wrote a review of Verbal Behavior.", "zh": "孩子會「學會」他們接觸到的任何語言，但關鍵問題是孩子出生時腦中是否是一張「白紙」，這個問題常被稱為先天後天之爭，已經討論了幾個世紀，而這個議題在 1959 年語言學家喬姆斯基寫了《語言行為》的書評後再度浮現。", "src": ["~~Clearly, in one sense,~~ children 'learn' whatever language they are exposed to~~, be it Chinese, Nootka or English~~.", "~~But~~ the crucial question is whether children are born with 'blank sheets' in their head ~~as far as language is concerned - or whether humans are 'programmed' with an outline knowledge of the structure of languages in general~~.", "This question ~~of whether language is partly due to nature or wholly due to learning or nurture~~ is often referred to as the nature-nurture controversy, and has been discussed for centuries.", "This ~~particular~~ issue resurfaced in linguistics in 1959 when the linguist Noam Chomsky wrote a ~~devastating and witty~~ review of Verbal Behavior~~, a book by the Harvard psychologist B·F· Skinner (Skinner 1957; Chomsky 1959)~~."], "note": "難字：exposed、crucial、nature-nurture controversy、resurfaced、linguistics（題目可抄）"},
{"num": 117, "title": "Academics (學術)", "code": "#060117", "full": "Getting to know fellow academics, especially more senior ones, can be very daunting. Lecturers and researchers are used to spending a lot of time in isolation working independently. The thought of going public and ‘selling yourself' does not seem enticing. However, it is easier than you think to begin to develop your own career-enhancing networks. Your PhD supervisor and examiners or if you are already in post, your mentor, are a great place to start. They will have been chosen to guide you because they are more experienced and in most cases they will work close to your field of interest. Ask their advice for ways of building up your own network of contacts. Also it is easier to approach someone unknown to you if you can mention the name of a mutual acquaintance. If you are a postgraduate who is serious about a career in academia, or a more senior scholar wanting to develop one, you will surely be attending conferences on a fairly regular basis. There is no right or wrong number of these, some scholars stick to one or two a year, others seem to attend one a month! Conferences are the main way that academics network with each other, so do not miss out on these opportunities. If you are presenting a paper it gives others a chance to see what you are working on, and the informal sections of the programmed (such as food and drink breaks) encourage mingling and further discussion.", "ans": "Getting to know [other|fellow] academics, especially more senior ones, can be [scary|daunting], {but} it is easier than you think to begin to develop your own career-enhancing networks, {and} your PhD supervisor and examiners are a [good|great] place to start, {and} conferences are the main way that academics network with each other, so do not miss out on these [chances|opportunities].", "zh": "認識其他學者，尤其是更資深的，可能令人生畏，但開始建立自己有助職涯的人脈比你想的容易，你的博士指導教授和口試委員是很好的起點，而研討會是學者彼此交流的主要方式，所以不要錯過這些機會。", "src": ["Getting to know fellow academics, especially more senior ones, can be ~~very~~ daunting.", "~~However,~~ it is easier than you think to begin to develop your own career-enhancing networks.", "Your PhD supervisor and examiners ~~or if you are already in post, your mentor,~~ are a great place to start.", "Conferences are the main way that academics network with each other, so do not miss out on these opportunities."], "note": "難字：academics、daunting、career-enhancing、supervisor、conferences（題目可抄）"},
{"num": 118, "title": "Frog (青蛙)", "code": "#060118", "full": "A miner in the state of Chiapas found a tiny tree frog that has been preserved in amber for 25 million years, a researcher said.If authenticated, the preserved frog would be the first of its kind found in Mexico, according to David Grimaldi, a biologist and curator at the American Museum of Natural History, who was not involved in the find. The chunk of amber containing the frog, less than half an inch long, was uncovered by a miner in Mexico’s southern Chiapas state in 2005 and was bought by a private collector, who loaned it to scientists for study. A few other preserved frogs have been found in chunks of amber — a stone formed by ancient tree sap — mostly in the Dominican Republic. Like those, the frog found in Chiapas appears to be of the genus Craugastor, whose descendants still inhabit the region, said biologist Gerardo Carbot of the Chiapas Natural History and Ecology Institute. Carbot announced the discovery this week. The scientist said the frog lived about 25 million years ago, based on the geological strata where the amber was found. Carbot would like to extract a sample from the frog’s remains in hopes of finding DNA that could identify the particular species but doubts the owner would let him drill into the stone.", "ans": "A miner found a [small|tiny] tree frog that has been preserved in amber for 25 million years, {and} if [confirmed|authenticated], the preserved frog would be the first of its kind found in Mexico, {and} Carbot would like to [take|extract] a sample in hopes of finding DNA but doubts the owner would let him [cut|drill] into the stone.", "zh": "一名礦工發現一隻在琥珀中保存了 2500 萬年的小樹蛙，如果經過鑑定，這隻保存下來的蛙將是墨西哥發現的第一隻，而卡博特想取樣希望找到 DNA，但懷疑擁有者會讓他鑽開這塊石頭。", "src": ["A miner ~~in the state of Chiapas~~ found a tiny tree frog that has been preserved in amber for 25 million years~~, a researcher said~~.", "If authenticated, the preserved frog would be the first of its kind found in Mexico~~, according to David Grimaldi, a biologist and curator at the American Museum of Natural History, who was not involved in the find~~.", "Carbot would like to extract a sample ~~from the frog’s remains~~ in hopes of finding DNA ~~that could identify the particular species~~ but doubts the owner would let him drill into the stone."], "note": "難字：preserved、amber、authenticated、extract（題目可抄）"},
{"num": 119, "title": "Family dinner (家庭晚餐)", "code": "#060119", "full": "As a family therapist, I often have the impulse to tell families to go home and have dinner together rather than spending an hour with me. And 20 years of research in North America, Europe, and Australia back up my enthusiasm for family dinners. It turns out that sitting down for a nightly meal is great for the brain, the body, and the spirit. And that nightly dinner doesn’t have to be a gourmet meal that took three hours to cook, nor does it need to be made with organic arugula and heirloom parsnips. For starters, researchers found that for young children, dinnertime conversation boosts vocabulary even more than being read aloud to. The researchers counted the number of rare words – those not found on a list of 3,000 most common words – that the families used during dinner conversations. Young kids learned 1,000 rare words at the dinner table, compared to only 143 from parents reading storybooks aloud. Kids who have a large vocabulary read earlier and more easily. Older children also reap intellectual benefits from family dinners. For school-age youngsters, regular mealtime is an even more powerful predictor of high achievement scores than time spent in school, doing homework, playing sports or doing art. Other researchers reported a consistent association between family dinner frequency and teen academic performance. Adolescents who ate family meals 5 to 7 times a week were twice as likely to get an A in school as those who ate dinner with their families fewer than two times a week.", "ans": "Sitting down for [an evening|a nightly] meal is [good|great] for the brain, the body, and the spirit, {and} researchers found that for young children, dinnertime conversation [improves|boosts] vocabulary even more than being read aloud to, {and} [teenagers|adolescents] who ate family meals 5 to 7 times a week were twice as likely to get an A in school.", "zh": "每晚坐下來一起吃飯對大腦、身體和心靈都很好，研究人員發現對幼童來說，晚餐時的對話比聽人朗讀更能增加字彙，而每週和家人吃 5 到 7 次飯的青少年在學校拿 A 的機率是兩倍。", "src": ["~~It turns out that~~ sitting down for a nightly meal is great for the brain, the body, and the spirit.", "~~For starters,~~ researchers found that for young children, dinnertime conversation boosts vocabulary even more than being read aloud to.", "Adolescents who ate family meals 5 to 7 times a week were twice as likely to get an A in school ~~as those who ate dinner with their families fewer than two times a week~~."], "note": "nightly 換 evening 時冠詞一起改（a→an）。難字：nightly、boosts、vocabulary、adolescents（題目可抄）"},
{"num": 120, "title": "Museology (博物學)", "code": "#060120", "full": "What is museology? A simple definition might be that it is the study of museums, their history and underlying philosophy, the various ways in which they have, in the course of time, been established and developed, their avowed or unspoken aims and policies, their educative or political or social role. More broadly conceived, such a study might also embrace the bewildering variety of audiences — visitors, scholars, art lovers, children- at whom the efforts of museum staff are supposedly directed, as well as related topics such as the legal duties and responsibilities placed upon (or incurred by) museums, perhaps even some thought as to their future. Seen in this light, museology might appear at first sight a subject so specialized as to concern only museum professionals, who by virtue of their occupation are more or less obliged to take an interest in it. In reality, since museums are almost, if not quite as old as civilization itself, and since the plethora of present-day museums embraces virtually every field of human endeavor - not just art, or craft, or science, but entertainment, agriculture, rural life, childhood, fisheries, antiquities, automobiles: the list is endless- it is a field of enquiry so broad as to be a matter of concern to almost everybody.", "ans": "Museology might [seem|appear] a subject so [narrow|specialized] as to concern only museum professionals, {and} a simple definition might be that it is the study of museums, their history, {but} in reality, since museums are as old as civilization itself, it is a field of enquiry so [wide|broad] as to be a matter of concern to almost everybody.", "zh": "博物館學可能看起來是個專門到只有博物館專業人士才會關心的學科，一個簡單的定義可能是它研究博物館及其歷史，但實際上，由於博物館幾乎和文明本身一樣古老，它是一個廣泛到幾乎人人都關心的研究領域。", "src": ["~~Seen in this light,~~ museology might appear ~~at first sight~~ a subject so specialized as to concern only museum professionals~~, who by virtue of their occupation are more or less obliged to take an interest in it~~.", "~~What is museology?~~ A simple definition might be that it is the study of museums, their history ~~and underlying philosophy, the various ways in which they have, in the course of time, been established and developed, their avowed or unspoken aims and policies, their educative or political or social role~~.", "In reality, since museums are ~~almost, if not quite~~ as old as civilization itself, ~~and since the plethora of present-day museums embraces virtually every field of human endeavor - not just art, or craft, or science, but entertainment, agriculture, rural life, childhood, fisheries, antiquities, automobiles: the list is endless-~~ it is a field of enquiry so broad as to be a matter of concern to almost everybody."], "note": "難字：museology、specialized、professionals、definition、civilization、enquiry（題目可抄）"},
{"num": 121, "title": "Read aloud (大聲朗讀)", "code": "#060121", "full": "It might seem a little eccentric but reviewing your work by reading it aloud can help to identify the woolliest areas. This works best if you perform your reading in a theatrical way, pausing at the commas and ends of sentences. If you run out of breath during a sentence, it is probably too long. You ought to be able to convert your writing into a speech in this way if it sounds too stilted and convoluted, perhaps you could rework these parts until they sound fluid. It is unlikely that your reader will be fooled by the idea that long words make you sound clever. Cluttering a sentence with too many complicated words can prevent its meaning from being understood at all. A short word is always preferable to a long one. Why should anyone choose the word erroneous over the word wrong in an essay? Usually, writers who employ more obscure words are trying to sound impressive but can appear pretentious. Direct words enable you to control what you are saying, and are not necessarily babyish, but the most appropriate ones for the job. When you read your writing aloud, you will notice that the key stress comes at the end of your sentence. It is, therefore, most effective to end with a short and emphatic word to secure our point. Try to resist the impulse to waffle at the end of your sentence by trailing off into qualifying clauses. It might be worth relocating the clause to the beginning of the sentence or losing it altogether if you feel that it adds little to its meaning. Your sentences might be the most grammatically perfect in the world, but still, cause your writing to sound wrong if you have misjudged its tone. A colloquial style, which uses slang and exclamations, is an inappropriately chatty tone for an essay. However, style can be equally jarring if your vocabulary is too formal or ambitious for its context. It is much more impressive to make complicated points using simple language and grammar.", "ans": "[Checking|Reviewing] your work by reading it aloud can help to [find|identify] the woolliest areas, {and} if you run out of breath during a sentence, it is [likely|probably] too long, {and} a short word is always preferable to a long one, {and} it is much more impressive to make [difficult|complicated] points using simple language and grammar.", "zh": "大聲朗讀來檢查你的作品能幫你找出最含糊的地方，如果一句話讀到一半就沒氣了，它可能太長了，短的字永遠比長的字好，而用簡單的語言和文法表達複雜的論點更令人印象深刻。", "src": ["~~It might seem a little eccentric but~~ reviewing your work by reading it aloud can help to identify the woolliest areas.", "If you run out of breath during a sentence, it is probably too long.", "A short word is always preferable to a long one.", "It is much more impressive to make complicated points using simple language and grammar."], "note": "難字：reviewing、identify、woolliest、preferable、impressive（題目可抄）"},
{"num": 122, "title": "Armed police in NSW (新州警察)", "code": "#060122", "full": "Armed police have been brought into NSW schools to reduce crime rates and educate students. The 40 School Liaison Police (SLP) officers have been allocated to public and private high schools across the state. Organizers say the officers, who began work last week, will build positive relationships between police and students. But parent groups warned of potential dangers of armed police working at schools in communities where police relations were already under strain. Among their duties, the SLPs will conduct crime prevention workshops, talking to students about issues including shoplifting, offensive behavior, graffiti and drugs and alcohol. They can also advise school principals. One SLP, Constable Ben Purvis, began work in the inner Sydney region last week, including at Alexandria Park Community School's senior campus. Previously stationed as a crime prevention officer at The Rocks, he now has 27 schools under his jurisdiction in areas including The Rocks, Redfern and Kings Cross. Constable Purvis said the full time position would see him working on the broader issues of crime prevention. \"I am not a security guard,\" he said. \"I am not there to patrol the school. We want to improve relationships between police and schoolchildren, to have positive interaction. We are coming to the school and giving them knowledge to improve their own safety.\" Parents' groups responded to the program positively, but said it may spark a range of community reactions. \"It is a good thing and an innovative idea and there could be some positive benefits,\" Council of Catholic School Parents executive officer.", "ans": "Armed police have been brought into NSW schools to [cut|reduce] crime rates and [teach|educate] students, {and} the officers will build [good|positive] relationships between police and students, {and} the SLPs will conduct crime prevention workshops, {but} parent groups warned of [possible|potential] dangers of armed police working at schools in communities where police relations were already under strain.", "zh": "武裝警察被派進新南威爾斯的學校以降低犯罪率並教育學生，這些警員會建立警察和學生之間的正面關係，校園聯絡警察會舉辦犯罪預防工作坊，但家長團體警告，在警民關係已經緊張的社區，武裝警察進駐學校可能有危險。", "src": ["Armed police have been brought into NSW schools to reduce crime rates and educate students.", "~~Organizers say~~ the officers~~, who began work last week,~~ will build positive relationships between police and students.", "~~Among their duties,~~ the SLPs will conduct crime prevention workshops~~, talking to students about issues including shoplifting, offensive behavior, graffiti and drugs and alcohol~~.", "~~But~~ parent groups warned of potential dangers of armed police working at schools in communities where police relations were already under strain."], "note": "難字：armed、educate、relationships、prevention、potential、strain（題目可抄）"},
